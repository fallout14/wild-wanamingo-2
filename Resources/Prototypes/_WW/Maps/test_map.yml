# WW (2026-11-14): the private test map, a cut of Yuma (Resources/Maps/_WW/test_map.yml). A planet with Yuma's day/night
# cycle. Five factions: NCR, Legion, Town, Brotherhood of Steel and Tribe, with Yuma's slot counts.
# Run it with the server cvar `game.map WWTestMap` (or `forcemap WWTestMap` in game), or the WWTestMapPool pool.

- type: gameMapPool
  id: WWTestMapPool
  maps:
  - WWTestMap

- type: gameMap
  id: WWTestMap
  mapName: WW test map
  mapPath: /Maps/_WW/test_map.yml
  minPlayers: 0
  stations:
    WWTestMap:
      stationProto: F14WastelandStation
      components:
      - type: StationNameSetup
        mapNameTemplate: WW test map
      - type: StationJobs
        availableJobs:
          F14NCRCommander: [ 1, 1 ]
          F14NCRPlatoonLeader: [ 1, 1 ]
          F14NCRDoctor: [ 1, 1 ]
