# Mojave Sun 13 sprites on copies of Misfits/N14 prototypes (Wizden ones where N14 has none).
# Sprites: Resources/Textures/MojaveSun (CC-BY-NC-SA-3.0, Mojave Sun 13).

- type: entity
  parent: F14ClosetFridgeDirty
  id: F14Fridge
  name: fridge
  components:
  - type: Sprite
    sprite: MojaveSun/Structures/Storage/storage.rsi
    layers:
    - state: fridge2
      map: ["enum.StorageVisualLayers.Base"]
    - state: fridge2_door
      map: ["enum.StorageVisualLayers.Door"]
    - sprite: Nuclear14/Structures/Storage/Closets/closet.rsi
      state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
  - type: Icon
    sprite: MojaveSun/Structures/Storage/storage.rsi
    state: fridge2
  - type: EntityStorageVisuals
    stateBaseClosed: fridge2
    stateDoorOpen: fridge2_open
    stateDoorClosed: fridge2_door

