# Mojave Sun 13 sprites on copies of Misfits/N14 prototypes (Wizden ones where N14 has none).
# Sprites: Resources/Textures/MojaveSun (CC-BY-NC-SA-3.0, Mojave Sun 13).

- type: entity
  parent: N14FilingCabinet
  id: F14FilingCabinet
  name: filing cabinet
  components:
  - type: Sprite
    sprite: MojaveSun/Structures/Storage/cabinets.rsi
    state: filing_cabinet
    layers:
    - state: filing_cabinet
    - state: filing_cabinet-open
      map: ["openLayer"]
    noRot: false
    snapCardinals: false
  - type: Icon
    sprite: MojaveSun/Structures/Storage/cabinets.rsi
    state: filing_cabinet
  - type: Transform
    noRot: false

