# Torches on copies of Misfits/N14 prototypes. WW Change (2026-11-22): back to Wild Wanamingo's old wooden torch
# sprites (Resources/Textures/Corvax/Structures/Decoration/torches.rsi, CC-BY-NC-SA-3.0, ported from Nukapop-13).

- type: entity
  parent: F14TorchWallBase
  id: F14TorchWall
  name: wall torch
  components:
  - type: Sprite
    sprite: Corvax/Structures/Decoration/torches.rsi
    state: wall_torch_lite
  - type: Icon
    sprite: Corvax/Structures/Decoration/torches.rsi
    state: wall_torch_lite
  - type: FireVisuals
    sprite: Corvax/Structures/Decoration/torches.rsi
    normalState: wall_torch_lite

- type: entity
  parent: F14TorchBase
  id: F14Torch
  name: torch
  components:
  - type: Sprite
    sprite: Corvax/Structures/Decoration/torches.rsi
    state: torch_lit
  - type: Icon
    sprite: Corvax/Structures/Decoration/torches.rsi
    state: torch_lit
  - type: FireVisuals
    sprite: Corvax/Structures/Decoration/torches.rsi
    normalState: torch_lit
