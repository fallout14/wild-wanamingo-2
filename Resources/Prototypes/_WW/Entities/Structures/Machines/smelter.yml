# Smelter: refines raw materials only (ore, scrap, sand, wood -> ingots, sheets, charcoal).
# The forge keeps metal armor and melee weapons. Sprite from Mojave Sun 13.

- type: entity
  parent: N14WorkbenchBase
  id: F14Smelter
  name: smelter
  description: A crude stone furnace for melting ore and scrap down into usable metal.
  components:
  - type: Sprite
    sprite: MojaveSun/Structures/Machines/smelter.rsi
    state: smelter
    offset: 0, 0.25
  - type: Icon
    sprite: MojaveSun/Structures/Machines/smelter.rsi
    state: smelter
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 3000
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: PointLight
    color: "#f05e1b"
    radius: 2.5
    energy: 2.5
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
      - Ore
      - N14Scrap
  - type: Construction
    graph: F14Smelter
    node: smelter
  - type: Lathe
    idleState: smelter
    runningState: smelter
    staticPacks:
    - F14SmelterStatic
