# WW (2026-11-16): RobCo power monitor. Misfits has no power monitoring terminal; this is a RobCo terminal
# (N14 terminal sprite) with its own green-screen window (Content.Client/_WW/Power/RobcoPowerTerminalWindow.cs)
# that lists the generators, storage, substations and breakers within range. Wizden's power monitoring console
# scans the whole grid, which on Yuma is the whole map.

- type: entity
  parent: BaseStructure
  id: WWComputerTerminalPowerMonitor
  name: RobCo power monitor
  description: A RobCo terminal wired into the local power grid. Shows every generator, storage unit and breaker nearby.
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 500
        mask:
        - TabletopMachineMask
  - type: Rotatable
  - type: Anchorable
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          F14ComputerTerminalNewBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Sprite
    drawdepth: SmallObjects
    sprite: Nuclear14/Structures/Machines/Terminals/terminal_new.rsi
    layers:
    - state: computer
    - state: screens
      map: [ "screen" ]
      shader: unshaded
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        screen:
          True: { visible: true }
          False: { visible: false }
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: ExtensionCableReceiver
  - type: LitOnPowered
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#39ff5c"
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    offset: "0, 0.4"
    castShadows: false
  - type: RobcoPowerTerminal
    range: 32
  - type: ActivatableUI
    key: enum.RobcoPowerTerminalUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.RobcoPowerTerminalUiKey.Key:
        type: RobcoPowerTerminalBoundUserInterface
  - type: EmitSoundOnUIOpen
    sound:
      collection: F14TerminalKeyboard
