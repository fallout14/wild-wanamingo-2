# WW (2026-11-23): the lobby offers one Protectron. In game it picks a module once (police, builder, fire or tribal)
# and becomes that model for good, from a chassis-selection window (like the cyborg type picker) that opens when the
# player takes over the body; the select-module action reopens it.
# See Content.Server/_WW/Species/ProtectronModuleSystem.cs.

- type: entity
  parent: F14PlayerSyntheticProtectron
  id: F14PlayerSyntheticProtectronUnassigned
  suffix: player, synthetic, module not picked
  components:
  - type: ProtectronModule
    modules:
    - name: protectron-module-police-name
      description: protectron-module-police-desc
      dummy: F14PlayerSyntheticProtectronPolice
      polymorph: F14ProtectronModulePolice
    - name: protectron-module-builder-name
      description: protectron-module-builder-desc
      dummy: F14PlayerSyntheticProtectronBuilder
      polymorph: F14ProtectronModuleBuilder
    - name: protectron-module-fire-name
      description: protectron-module-fire-desc
      dummy: F14PlayerSyntheticProtectronFire
      polymorph: F14ProtectronModuleFire
    - name: protectron-module-tribal-name
      description: protectron-module-tribal-desc
      dummy: F14PlayerSyntheticProtectronTribal
      polymorph: F14ProtectronModuleTribal
  # The module picker (the base chassis' interfaces are repeated because this list replaces the parent's).
  - type: UserInterface
    interfaces:
      enum.SiliconLawsUiKey.Key:
        type: SiliconLawBoundUserInterface
      enum.BorgUiKey.Key:
        type: BorgBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      enum.ProtectronModuleUiKey.Key:
        type: ProtectronModuleBoundUserInterface

- type: entity
  parent: BaseAction
  id: ActionF14ProtectronSelectModule
  name: Select Protectron module
  description: Pick the module this Protectron is built around. The choice is permanent.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.5
    checkCanInteract: false
    checkConsciousness: true
    priority: -20
  - type: Sprite
    sprite: Interface/Actions/actions_borg.rsi
    layers:
    - state: select-type
  - type: InstantAction
    event: !type:ProtectronSelectModuleEvent

# Permanent polymorphs: forced (no way back), keep name, damage and everything carried.

- type: polymorph
  id: F14ProtectronModulePolice
  configuration:
    entity: F14PlayerSyntheticProtectronPolice
    forced: true
    transferName: true
    transferDamage: true
    inventory: Transfer
    revertOnCrit: false
    revertOnDeath: false
    revertOnDelete: false

- type: polymorph
  id: F14ProtectronModuleBuilder
  configuration:
    entity: F14PlayerSyntheticProtectronBuilder
    forced: true
    transferName: true
    transferDamage: true
    inventory: Transfer
    revertOnCrit: false
    revertOnDeath: false
    revertOnDelete: false

- type: polymorph
  id: F14ProtectronModuleFire
  configuration:
    entity: F14PlayerSyntheticProtectronFire
    forced: true
    transferName: true
    transferDamage: true
    inventory: Transfer
    revertOnCrit: false
    revertOnDeath: false
    revertOnDelete: false

- type: polymorph
  id: F14ProtectronModuleTribal
  configuration:
    entity: F14PlayerSyntheticProtectronTribal
    forced: true
    transferName: true
    transferDamage: true
    inventory: Transfer
    revertOnCrit: false
    revertOnDeath: false
    revertOnDelete: false
