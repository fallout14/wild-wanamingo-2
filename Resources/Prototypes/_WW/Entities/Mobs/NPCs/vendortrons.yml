# Mapper marker: spawns one random vendortron (MS13: "shouldn't be more than three of these on the map").
- type: entity
  parent: MarkerBase
  id: F14SpawnerVendortronRandom
  name: random vendortron spawner
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: MojaveSun/Mobs/Robots/vendortron.rsi
      state: blue
  - type: ConditionalSpawner
    prototypes:
    - F14MobVendortronGunRunners
    - F14MobVendortronMedTek
    - F14MobVendortronCrimsonCaravan
    - F14MobVendortronTools
    - F14MobVendortronRobCo
