# Vendortrons: MS13 robot shopkeepers (mojave/code/modules/mob/robots/vendortrons.dm). They stand in one spot,
# trade through the Caravan trade store UI, and shoot back if attacked.
# Stock is rolled per vendortron at round start (countMin..count) and does not restock.
# WW Change (2026-11-26): each one also buys (a sell tab made of the trade terminals' own sell lists), and they hit
# back hard enough to put people off robbing them: a laser rifle's worth of laser (Gun Runners: fast 5mm bursts).

- type: entity
  abstract: true
  parent: MobRobotic
  id: F14MobVendortronBase
  name: vendortron
  description: A robot shopkeeper. Click it to browse its wares.
  suffix: vendor
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: MojaveSun/Mobs/Robots/vendortron.rsi
    offset: 0,0.25
    layers:
    - state: blue
  - type: InteractionOutline
  - type: MovementSpeedModifier
    baseWalkSpeed: 0
    baseSprintSpeed: 0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.4
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      500: Dead # WW Change - was 350
    stateAlertDict:
      Alive: BorgHealth
      Dead: BorgDead
    showOverlays: false
  - type: Damageable
    damageModifierSet: F14WastelandAnimal
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500 # WW Change - was 350
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          F14Scrap1:
            min: 2
            max: 2
          F14ScrapElectronic1:
            min: 1
            max: 2
          F14ScrapGlass1:
            min: 1
            max: 1
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Misfits/Legacy/Machines/AI/borg_death.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  # Leaves people alone until they attack it, then shoots them (MS13: retaliate trader, 15 melee, protectron laser;
  # WW: 25 melee and a laser that fires like a laser rifle).
  - type: NpcFactionMember
    factions:
    - Passive
  - type: NPCRetaliation
    attackMemoryLength: 30
  - type: FactionException
  - type: HTN
    rootTask:
      task: F14TurretCompound
  - type: CombatMode
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Effects/metal_thud1.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 25
  - type: Gun
    minAngle: 1
    maxAngle: 8
    angleIncrease: 1
    angleDecay: 6
    fireRate: 3.5
    useKey: false
    soundGunshot:
      collection: F14LaserAutoRifleGunshot
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: BasicEntityAmmoProvider
    proto: F14MFLaserRed
    capacity: 20
    count: 20
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1
    rechargeSound: null
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: NcStoreStructuredBoundUi
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: WWVendortron

- type: entity
  parent: F14MobVendortronBase
  id: F14MobVendortronGunRunners
  name: Gun Runners vendortron
  description: A vendortron used by the Gun Runners for sale of firearms far and wide.
  components:
  - type: Sprite
    layers:
    - state: green
  - type: NcStore
    buyPresets:
    - F14VendortronGunRunners
    sellPresets:
    - F14VendortronGunRunnersSell
  - type: Gun # fast three-round 5mm bursts
    minAngle: 2
    maxAngle: 10
    angleIncrease: 1
    angleDecay: 6
    fireRate: 2
    burstFireRate: 12
    shotsPerBurst: 3
    burstCooldown: 0.25
    useKey: false
    soundGunshot:
      collection: F14MinigunGunshot
    selectedMode: Burst
    availableModes:
    - Burst
  - type: BasicEntityAmmoProvider
    proto: F14Bullet5mm
    capacity: 30
    count: 30
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.5
    rechargeSound: null
  - type: WWVendortron
    lines:
    - ww-vendortron-gunrunner-1
    - ww-vendortron-gunrunner-2
    - ww-vendortron-gunrunner-3

- type: entity
  parent: F14MobVendortronBase
  id: F14MobVendortronMedTek
  name: Med-Tek vendortron
  description: A pre-war vendortron that provides medical supplies. Probably outlived everyone it was supposed to help treat.
  components:
