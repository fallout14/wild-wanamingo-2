      types:
        Blunt: 26
  - type: StaticPrice
    price: 120

- type: entity
  parent: F14LeadPipe
  id: F14TireIron
  name: tire iron
  description: A pre-war lug wrench with a prying end. Good for wheels, doors and heads.
  components:
