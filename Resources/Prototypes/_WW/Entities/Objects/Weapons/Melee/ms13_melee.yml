# New melee weapons for the Mojave Sun 13 melee sprites that had no item (Resources/Textures/MojaveSun, CC-BY-NC-SA-3.0).
# Names and descriptions follow MS13 (mojave/items/melee). Damage comes from the parent unless set here, and is a
# first pass for tuning. Not in loot or recipes yet.

- type: Tag
  id: F14KatanaBlack

- type: Tag
  id: F14KatanaRed

# MARK: Powered

- type: entity
  parent: F14Ripper
  id: F14RipperAdvanced
  name: advanced ripper
  description: A ripper with a reinforced housing and a meaner chain. Still a chainsaw you hold in one hand.
  components:
  - type: Sprite
    sprite: MojaveSun/Objects/Weapons/Melee/ripper_legend.rsi
    state: on-icon
  - type: Item
    sprite: MojaveSun/Objects/Weapons/Melee/ripper_legend.rsi
    heldPrefix: on
  - type: MeleeWeapon
    autoAttack: true
    angle: 0
    wideAnimationRotation: -135
    attackRate: 0.25
    damage:
      types:
        Slash: 8
        Piercing: 4
        Structural: 22
    soundHit:
      path: /Audio/Nuclear14/Weapons/Melee/Swing/ripper.ogg
  - type: StaticPrice
    price: 150

- type: entity
  parent: F14MacheteBase
  id: F14Shishkebab
  name: shishkebab
  description: A sword with a fuel line and a pilot light. Light it to set the blade on fire.
  components:
  - type: Sprite
    sprite: MojaveSun/Objects/Weapons/Melee/shishkebab.rsi
    layers:
    - state: off-icon
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Item
    sprite: MojaveSun/Objects/Weapons/Melee/shishkebab.rsi
    size: Large
    heldPrefix: off
  - type: Clothing
    sprite: MojaveSun/Objects/Weapons/Melee/shishkebab.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: ItemToggle
    soundActivate:
      collection: WelderOn
      params:
        volume: -5
    soundDeactivate:
      collection: WelderOff
      params:
        volume: -5
  - type: ItemTogglePrefix
    prefixOn: on
    prefixOff: off
  - type: ItemToggleHot
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Slash: 20
        Heat: 14
  - type: ItemToggleExaminableStatus
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: on-icon, shader: unshaded }
          False: { state: off-icon, shader: shaded }
  - type: StaticPrice
    price: 250

- type: entity
  parent: F14FireAxe
  id: F14AutoAxe
  name: auto axe
  description: A motorised axe head with spinning blades. Start it up and it chews through flesh, wood and doors alike.
  components:
  - type: Sprite
    sprite: MojaveSun/Objects/Weapons/Melee/auto_axe.rsi
    layers:
    - state: off-icon
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Item
    sprite: MojaveSun/Objects/Weapons/Melee/auto_axe.rsi
    storedSprite: null
    heldPrefix: off
  - type: Clothing
    sprite: MojaveSun/Objects/Weapons/Melee/auto_axe.rsi
    slots:
    - back
    - suitStorage
  - type: Wieldable
    wieldedInhandPrefix: null # MS13 has no wielded sprites; keep the on/off ones
  - type: ItemToggle
    soundActivate:
      path: /Audio/Nuclear14/Weapons/Melee/Swing/ripper.ogg
    soundDeactivate:
      path: /Audio/Machines/button.ogg
  - type: ItemTogglePrefix
    prefixOn: on
    prefixOff: off
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Slash: 24
        Piercing: 6
        Structural: 30
  - type: ItemToggleExaminableStatus
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: on-icon }
          False: { state: off-icon }
  - type: StaticPrice
    price: 300

# MARK: Spears

- type: entity
  parent: F14WastelandSpear
  id: F14SpearKnife
  name: knife spear
  description: A kitchen knife lashed to a pole. Better than nothing, and easier to make than a real spear.
  components:
  - type: Sprite
    sprite: MojaveSun/Objects/Weapons/Melee/spear_knife.rsi
    layers:
    - state: icon
  - type: Item
    sprite: MojaveSun/Objects/Weapons/Melee/spear_knife.rsi
  - type: Clothing
    sprite: MojaveSun/Objects/Weapons/Melee/spear_knife.rsi
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Piercing: 16
        Slash: 6
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: StaticPrice
    price: 15

- type: entity
  parent: F14WastelandSpear
  id: F14ThunderStick
  name: thunder stick
  description: A spear with an explosive charge for a tip. It goes off on the first thing it hits, and the spear goes with it.
  components:
  - type: Sprite
    sprite: MojaveSun/Objects/Weapons/Melee/spear_thunder.rsi
    layers:
    - state: icon
  - type: Item
    sprite: MojaveSun/Objects/Weapons/Melee/spear_thunder.rsi
  - type: Clothing
    slots: NONE # MS13: no back sprite, so it can't be stowed
  - type: TriggerOnMeleeHit
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 8
    intensitySlope: 4
    totalIntensity: 30 # a small blast around the target
    canCreateVacuum: false
  - type: StaticPrice
    price: 60

