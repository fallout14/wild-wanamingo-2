    sprite: MojaveSun/Objects/Weapons/Melee/tire_iron.rsi
    state: icon
  - type: Item
    sprite: MojaveSun/Objects/Weapons/Melee/tire_iron.rsi
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 16
  - type: Tool
