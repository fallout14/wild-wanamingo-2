- type: entity
  parent: F14StraightRazor
  id: F14Switchblade
  name: switchblade
  description: A spring-loaded folding knife. Flick it open and stab.
  components:
  - type: Sprite
    sprite: MojaveSun/Objects/Weapons/Melee/knife_switch.rsi
    layers:
    - state: closed-icon
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Item
    sprite: MojaveSun/Objects/Weapons/Melee/knife_switch.rsi
  - type: ItemToggleMeleeWeapon
