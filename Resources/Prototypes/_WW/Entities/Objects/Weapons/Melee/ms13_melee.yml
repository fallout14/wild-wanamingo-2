# MARK: Sheath

- type: entity
  parent: BaseItem
  id: F14KatanaSheath
  name: katana sheath
  description: A lacquered sheath for a katana.
  components:
  - type: Sprite
    sprite: MojaveSun/Objects/Weapons/Melee/katana_sheath.rsi
    layers:
    - state: sheath
    - state: sheath-katana
      map: [ "sheath-katana" ]
      visible: false
    - state: sheath-katana-red
      map: [ "sheath-katana-red" ]
      visible: false
  - type: Item
    size: Large
  - type: Clothing
    quickEquip: false
    slots:
    - Belt # MS13 has no worn sprite for it, so it doesn't show on the belt
  - type: ItemSlots
    slots:
      item:
        name: Katana
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        ejectOnBreak: true
        whitelist:
          tags:
          - F14KatanaBlack
          - F14KatanaRed
  - type: ItemMapper
    mapLayers:
      sheath-katana:
        whitelist:
          tags:
          - F14KatanaBlack
      sheath-katana-red:
        whitelist:
          tags:
          - F14KatanaRed
  - type: Appearance
  - type: StaticPrice
    price: 20
