# Mojave Sun 13 sprites on copies of Wizden items (behaviour comes from the parent).
# Sprites: Resources/Textures/MojaveSun (CC-BY-NC-SA-3.0, Mojave Sun 13).

- type: entity
  parent: F14FireAxeBase # WW: MS13 sprite on the merged N14 item
  id: F14FireAxe
  name: fire axe
  components:
  - type: Sprite
    sprite: MojaveSun/Objects/Weapons/Melee/fireaxe.rsi
    state: icon
  - type: Item
    sprite: MojaveSun/Objects/Weapons/Melee/fireaxe.rsi
    storedSprite:
      sprite: MojaveSun/Objects/Weapons/Melee/fireaxe.rsi
      state: icon
  - type: Clothing
    sprite: MojaveSun/Objects/Weapons/Melee/fireaxe.rsi
    slots:
    - back

