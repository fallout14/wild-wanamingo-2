# The Neostead 2000: ported from Misfits (N14WeaponShotgunNeostead), deferred in the rebase until the twin-tube code
# came across. Pump action; two six-shell tubes plus one in the chamber (6+6+1). Alt-click switches tubes; when the
# selected tube runs dry, firing moves to the other one by itself. Loading fills the selected tube, then the chamber.
- type: entity
  name: Neostead 2000
  parent: F14WeaponShotgunBase
  id: F14WeaponShotgunNeostead
  description: A two-handed pump-action shotgun with two independently selectable six-shell magazine tubes above the barrel, plus one in the chamber. Alt-click to switch tubes; it changes over by itself when one runs dry.
  components:
  - type: ManualAction
    cycleSound:
      path: /Audio/Weapons/Guns/Cock/shotgun_close.ogg
  - type: GunRequiresWield
  - type: TwinTubeAmmoProvider
  - type: ContainerContainer
    containers:
      left_tube: !type:ContainerSlot
      right_tube: !type:ContainerSlot
      chamber_tube: !type:ContainerSlot
  - type: ContainerFill
    containers:
      left_tube: [ F14NeosteadMagazineTube ]
      right_tube: [ F14NeosteadMagazineTube ]
      chamber_tube: [ F14NeosteadChamber ]
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/Shotguns/neostead.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Shotguns/neostead.rsi
  - type: Item
    size: Large
    sprite: Nuclear14/Objects/Weapons/Guns/Shotguns/neostead.rsi
