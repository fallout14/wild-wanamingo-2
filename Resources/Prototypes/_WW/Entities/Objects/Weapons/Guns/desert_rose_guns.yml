# Guns built on the 2026-11-14 sprite port (Desert Rose projectile.dmi, plus the AUG/L85/M249 drawn for WW).
# Sprites: Resources/Textures/WildWanamingo/Objects/Weapons/Guns/<name>.rsi. Stats are a first pass.
# Muzzle overlay offsets follow the rule worked out in the attachment pass: x = (muzzle pixel - 4) / 32,
# y = (29 - top barrel row) / 32 for horizontal guns; diagonal guns use the top-right barrel pixel the same way.

- type: Tag
  id: F14MagazinePistol9mmDoublestack

- type: Tag
  id: F14MagazineP90

# ---------------------------------------------------------------------------------------------------------
# Magazines

- type: entity
  id: F14MagazinePistol9mmDoublestack
  name: doublestack magazine (9mm)
  parent: F14BaseMagazine9mmPistol
  description: A 15-round double-stack 9mm pistol magazine, made for the Beretta M92 and M93R.
  components:
  - type: Tag
    tags:
    - F14MagazinePistol9mmDoublestack
  - type: BallisticAmmoProvider
    proto: F14CartridgePistol9
    capacity: 15

- type: entity
  id: F14MagazineP90
  name: P90 magazine (10mm)
  parent: F14BaseMagazine10mmSubMachineGun
  description: A 50-round translucent top-loading magazine for the P90, rebored for 10mm.
  components:
  - type: Tag
    tags:
    - F14MagazineP90
  - type: BallisticAmmoProvider
    proto: F14CartridgePistol10
    capacity: 50

