# Rifles

- type: entity
  name: commando carbine
  parent: F14WeaponRifleBase
  id: F14WeaponRifle45Commando
  description: A bolt-action carbine with an enormous integral suppressor, built around .45 ACP pistol magazines. Nearly silent, and every round hits harder than it would from a pistol. Takes a scope. Uses .45 pistol magazines only.
  components:
  - type: ContainerContainer  # spawn state
    containers:
      gun_magazine: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      gun_chamber: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      weapon_muzzle: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      weapon_optic: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: Sprite
    sprite: WildWanamingo/Objects/Weapons/Guns/commando.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Large
    sprite: WildWanamingo/Objects/Weapons/Guns/commando.rsi
  - type: Clothing
    sprite: WildWanamingo/Objects/Weapons/Guns/commando.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  # Integral suppressor: a locked suppressor in the muzzle slot, part of the sprite, so no overlay. Takes a scope.
  - type: FirearmAttachmentHost
    showMuzzleVisual: false
    suppressedSoundGunshot: # Desert Rose's suppressed rifle shot, as on its commando carbine
      path: /Audio/WildWanamingo/DesertRose/Weapons/silenced_large.ogg
    enableOpticSlot: true
    opticVisualState: leveraction_scope
    opticVisualOffset: 0.25, 0.46875
    opticSlot:
      name: Optic
      priority: 4
      insertOnInteract: true
      ejectOnInteract: false
      ejectOnUse: false
      disableEject: true
      whitelist:
        tags:
        - F14RifleScope
    muzzleSlot:
      name: Integral suppressor
      startingItem: F14FirearmSuppressor
      locked: true
      insertOnInteract: false
      ejectOnInteract: false
      ejectOnUse: false
      disableEject: true
  # Bolt action, as the AMR: firing leaves the round's casing chambered; cycling ejects it and chambers the next.
  - type: ManualAction
  - type: ChamberMagazineAmmoProvider
    autoCycle: false
    soundRack:
      path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg
  - type: GunDamageModifier
    damage: # .45 ACP 17 + 8 = 25 a shot
      types:
        Piercing: 8
  - type: Gun
    minAngle: 10
    maxAngle: 30
    angleIncrease: 6
    angleDecay: 16
    fireRate: 1.5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: # WW Change - Desert Rose sound
      collection: WWDRGunshotCombatRifle
  - type: GunWieldBonus
    minAngle: -9
    maxAngle: -27
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: F14MagazinePistol45
        insertSound: /Audio/Nuclear14/Weapons/Effects/Reload/Pistols/pistol_magin.ogg
        ejectSound: /Audio/Nuclear14/Weapons/Effects/Reload/Pistols/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - F14MagazinePistol45
      gun_chamber:
        name: Chamber
        startingItem: F14CartridgePistol45
        priority: 1
        whitelist:
          tags:
          - F14CartridgePistol45
  - type: StaticPrice
    price: 250

