- type: entity
  name: Beretta M92
  parent: F14BaseWeaponPistol
  id: F14WeaponPistol9mmBerettaM92
  description: An Italian service pistol with a 15-round double-stack magazine. Reliable, accurate and easy to find ammunition for. Takes doublestack and standard 9mm pistol magazines.
  components:
  - type: ContainerContainer  # spawn state
    containers:
      gun_magazine: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      gun_chamber: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      weapon_muzzle: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: FirearmAttachmentHost
    muzzleSlot:
      name: Suppressor
      priority: 3
      insertOnInteract: true
      ejectOnInteract: false
      ejectOnUse: false
      disableEject: true
      whitelist:
        components:
        - SuppressorAttachment
    visualOrientation: Horizontal
    muzzleVisualOffset: 0.8125, 0.625
  - type: Tag
    tags:
    - Sidearm
  - type: Sprite
    sprite: WildWanamingo/Objects/Weapons/Guns/beretta_m92.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: WildWanamingo/Objects/Weapons/Guns/beretta_m92.rsi
  - type: Gun
    minAngle: 1
    maxAngle: 6
    fireRate: 5.5
    soundGunshot: # WW Change - Desert Rose sound
      collection: WWDRGunshot9mm
  - type: ItemSlots
    slots:
