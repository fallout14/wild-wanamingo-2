# The infiltrator, rebuilt after the Fallout 3 (The Pitt) weapon: a cut-down R91 with an integral suppressor and a
# fixed 4x scope. Full auto (8 rounds a second, the Pitt's rate) or semi, 5.56mm from the standard rifle magazine.
# Neither attachment can be removed; both are drawn as overlays from the Misfits attachment RSI.
# Sprite: Resources/Textures/WildWanamingo/Objects/Weapons/Guns/infiltrator.rsi (Fortune13, CC-BY-NC-SA-3.0).

- type: entity
  name: infiltrator
  parent: F14WeaponRifleBase
  id: F14WeaponRifle556Infiltrator
  description: A pre-war R91 assault rifle cut down for close work, with an integral suppressor and a fixed 4x scope. It keeps the R91's full-auto sear, and every 5.56mm round hits harder and quieter than the rifle it came from.
  components:
  - type: ContainerContainer  # spawn state
    containers:
      gun_magazine: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      gun_chamber: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      weapon_muzzle: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: Sprite
    sprite: WildWanamingo/Objects/Weapons/Guns/infiltrator.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
    # Fixed 4x scope, part of the gun: a plain layer rather than an optic slot.
    - sprite: Misfits/Objects/Weapons/Guns/Attachments/firearm_attachments.rsi
      state: rangemaster_scope
      offset: 0.09375, 0.3125 # over the receiver, like Fallout 3's infiltrator
  - type: Item
    size: Large
    sprite: WildWanamingo/Objects/Weapons/Guns/infiltrator.rsi
  - type: Clothing
    sprite: WildWanamingo/Objects/Weapons/Guns/infiltrator.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  # Integral suppressor: a locked suppressor in the muzzle slot, drawn by the attachment visualizer.
  - type: FirearmAttachmentHost
    suppressorVisualOffset: 0.6875, 0.75
    suppressedSoundGunshot: # Desert Rose's suppressed rifle shot, as on its Infiltrator
      path: /Audio/WildWanamingo/DesertRose/Weapons/silenced_large.ogg
    enableOpticSlot: false # the scope is built in (WWScope below)
    muzzleSlot:
      name: Integral suppressor
      startingItem: F14FirearmSuppressor
      locked: true
      insertOnInteract: false
      ejectOnInteract: false
      ejectOnUse: false
      disableEject: true
  - type: WWScope
    magnifications: [ 4 ]
  - type: GunDamageModifier
    damage: # 5.56mm 20 + 8 = 28 a shot, between the service rifle (20) and .308 (38)
      types:
        Piercing: 8
  - type: CriticalHitBonus
    chance: 0.05 # the Pitt infiltrator's doubled crit chance, as a flat +5%
  - type: Gun
    minAngle: 20
    maxAngle: 40
    angleIncrease: 3
    angleDecay: 16
    fireRate: 8 # Fallout 3 (The Pitt): 8 shots a second
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    - SemiAuto
    soundGunshot: # WW Change - Desert Rose sound
      collection: F14DRGunshotAssaultRifle
  - type: GunWieldBonus
    minAngle: -19
    maxAngle: -37
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: F14Magazine556Rifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - F14Magazine556Rifle
      gun_chamber:
        name: Chamber
        startingItem: F14Cartridge556Rifle
        priority: 1
        whitelist:
          tags:
          - F14Cartridge556Rifle
  - type: StaticPrice
    price: 400
