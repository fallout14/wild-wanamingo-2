# WW: ammo grades (2026-11-14). Generated from the plan in D:\GitHub\Reports\AMMO_REPORT.md: hollow point, AP, +P,
# surplus and incendiary rounds on the ammo bench, the shotgun shells, and the hand loads behind the hand loader's notebook.
# Every variant uses its caliber's standard cartridge as the parent, so it fits the same magazines and guns.
# Box labels: red hollow point, green AP, yellow +P, grey surplus, orange incendiary, blue hand load.

- type: entity
  id: F14Bullet22JHP
  parent: F14Bullet22
  name: bullet (.22 LR JHP)
  categories: [HideSpawnMenu]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 12
    armorPenetration: -0.3
  - type: BallisticDamageFalloff
    falloffStartTiles: 4
    maxFalloffTiles: 8
    minDamageMultiplier: 0.35

- type: entity
  id: F14Cartridge22JHP
  parent: F14CartridgePistol22
  name: cartridge (.22 LR JHP)
  description: "Hollow-point rounds: about 20% more damage against unarmoured targets, but armour stops more of each hit and they lose power sooner at range."
  components:
  - type: CartridgeAmmo
    proto: F14Bullet22JHP

- type: entity
  id: F14MagazineBox22JHP
  parent: F14MagazineBox22
  name: ammunition box (.22 LR JHP)
  description: "Hollow-point rounds: about 20% more damage against unarmoured targets, but armour stops more of each hit and they lose power sooner at range."
  components:
  - type: BallisticAmmoProvider
    proto: F14Cartridge22JHP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - sprite: WildWanamingo/Objects/Weapons/Guns/Ammunition/grade_labels.rsi
