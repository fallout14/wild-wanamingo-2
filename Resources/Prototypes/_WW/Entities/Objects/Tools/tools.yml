# Mojave Sun 13 sprites on copies of Wizden items (behaviour comes from the parent).
# Sprites: Resources/Textures/MojaveSun (CC-BY-NC-SA-3.0, Mojave Sun 13).

- type: entity
  parent: F14CrowbarBase # WW: MS13 sprite on the merged N14 item
  id: F14Crowbar
  name: crowbar
  components:
  - type: Sprite
    sprite: MojaveSun/Objects/Tools/crowbar.rsi
    state: icon
  - type: Item
    sprite: MojaveSun/Objects/Tools/crowbar.rsi
    storedSprite:
      sprite: MojaveSun/Objects/Tools/crowbar.rsi
      state: icon

- type: entity
  parent: F14ScrewdriverBase # WW: MS13 sprite on the merged N14 item
  id: F14Screwdriver
  name: screwdriver
  components:
  - type: Sprite
    sprite: MojaveSun/Objects/Tools/screwdriver.rsi
    layers:
    - state: icon
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: Item
    sprite: MojaveSun/Objects/Tools/screwdriver.rsi
    storedSprite:
      sprite: MojaveSun/Objects/Tools/screwdriver.rsi
      state: icon
  - type: RandomSprite
    available: [] # MS13 tools have one fixed colour

