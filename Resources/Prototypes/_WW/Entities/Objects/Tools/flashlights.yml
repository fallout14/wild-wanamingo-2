# Mojave Sun 13 sprites on copies of Wizden items (behaviour comes from the parent).
# Sprites: Resources/Textures/MojaveSun (CC-BY-NC-SA-3.0, Mojave Sun 13).

- type: entity
  parent: F14FlashlightBase # WW: MS13 sprite on the merged N14 item
  id: F14Flashlight
  name: flashlight
  components:
  - type: Sprite
    sprite: MojaveSun/Objects/Tools/flashlight.rsi
    layers:
    - state: icon
    - state: on-icon
      visible: false
      map: [ "light" ]
  - type: Item
    sprite: MojaveSun/Objects/Tools/flashlight.rsi
    storedSprite:
      sprite: MojaveSun/Objects/Tools/flashlight.rsi
      state: icon
  - type: ToggleableVisuals
    spriteLayer: light
    inhandVisuals:
      left:
      - state: on-inhand-left
      right:
      - state: on-inhand-right

