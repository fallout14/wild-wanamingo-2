# MARK: Laser eye beam
# One pulse of the Assaultron's beam. The beam fires 10 a second for 2.5 seconds: up to 150 heat if it all lands.
- type: entity
  parent: F14AssaultronHeadLaser
  id: F14AssaultronEyeBeam
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 6
        Structural: 2
