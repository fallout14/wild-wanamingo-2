# The builder's material hands. They come stocked with Fallout building materials (a stack each of scrap metal,
# planks, concrete, metal floor tiles and wood floor tiles) and take any construction material or tiles to refill.
- type: entity
  parent: BorgModuleConstruction
  id: F14BorgModuleConstruction
  name: wasteland construction module
  description: Holds building materials and floor tiles for a builder Protectron. Comes stocked with scrap, planks, concrete and floor tiles.
  components:
  - type: ItemBorgModule
    hands:
    - item: F14Scrap
      hand:
        emptyRepresentative: F14Scrap
        emptyLabel: borg-slot-construction-empty
        whitelist:
          tags:
          - ConstructionMaterial
          - F14Scrap
          - Concrete
    - item: MaterialWoodPlank
      hand:
        emptyRepresentative: MaterialWoodPlank
        emptyLabel: borg-slot-construction-empty
        whitelist:
          tags:
          - ConstructionMaterial
          - F14Scrap
          - Concrete
    - item: F14MaterialConcrete
      hand:
        emptyRepresentative: F14MaterialConcrete
        emptyLabel: borg-slot-construction-empty
        whitelist:
          tags:
          - ConstructionMaterial
          - F14Scrap
          - Concrete
    - item: F14FloorTileItemMetalGrey
      hand:
        emptyRepresentative: F14FloorTileItemMetalGrey
        emptyLabel: borg-slot-tiles-empty
        whitelist:
          components:
          - FloorTile
    - item: F14FloorTilesItemMS13WoodCommon
      hand:
        emptyRepresentative: F14FloorTilesItemMS13WoodCommon
        emptyLabel: borg-slot-tiles-empty
        whitelist:
          components:
          - FloorTile

