# Timed spawners for wasteland critters that had none. Tier parents (interval, chance, caps) are in timed_tiers.yml.
# Mappers place these; nothing spawns until a living player is within 60 tiles, and never within 15.

# Vermin

- type: entity
  parent: WWTimedSpawnerVermin
  id: WWTimedSpawnerIguana
  name: Iguana Timed Spawner
  components:
  - type: Sprite
    layers:
    - state: blue
    - sprite: Nuclear14/Mobs/Animals/iguana.rsi
      state: iguana
    - state: timed
  - type: WastelandSpawner
    prototypes:
    - F14MobIguana

