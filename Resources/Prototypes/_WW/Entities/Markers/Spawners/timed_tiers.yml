    prototypes: []
    intervalSeconds: 1500
    chance: 0.65
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 2
    maxAlivePerPrototype: 8
    maxAliveFromSpawner: 3

# Armed hostiles: raiders, fiends, enforcers, hostile robots, super mutants.
- type: entity
  abstract: true
  parent: WWTimedSpawnerBase
  id: WWTimedSpawnerHostile
  components:
  - type: WastelandSpawner
    prototypes: []
    intervalSeconds: 1800
    chance: 0.65
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 3
    maxAlivePerPrototype: 6
    maxAliveFromSpawner: 3

# Bosses and apex predators: deathclaws, yao guai, raider boss, assaultron, sentry bot, behemoth...
- type: entity
  abstract: true
  parent: WWTimedSpawnerBase
  id: WWTimedSpawnerApex
