    prototypes: []
    intervalSeconds: 1800
    chance: 0.75
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 3
    maxAlivePerPrototype: 8
    maxAliveFromSpawner: 3

# Dangerous wildlife and ferals: nightstalkers, radscorpions, cazadores, mirelurks, feral ghouls...
- type: entity
  abstract: true
  parent: WWTimedSpawnerBase
  id: WWTimedSpawnerPredator
  components:
