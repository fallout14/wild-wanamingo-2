# The smelter: a brick furnace with a steel crucible. Taking it apart with a crowbar gives back about half.

- type: constructionGraph
  id: F14Smelter
  start: start
  graph:
  - node: start
    edges:
    - to: smelter
      completed:
      - !type:SnapToGrid
        southRotation: true
      steps:
      - material: MisfitsBrick
        amount: 10
        doAfter: 5
      - material: Steel
        amount: 4
        doAfter: 3

  - node: smelter
    entity: F14Smelter
    edges:
    - to: start
      steps:
      - tool: Prying
        doAfter: 5
      completed:
      - !type:SpawnPrototype
        prototype: MisfitsMaterialBrick1
        amount: 5
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 2
      - !type:DeleteEntity
