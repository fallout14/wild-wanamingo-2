# Desert sand using Mojave Sun 13's ground sprite; otherwise the same as FloorWasteland.

- type: tile
  id: F14FloorWastelandSand
  name: tiles-wasteland-sand
  sprite: /Textures/Nuclear14/Tiles/ms13/desert.png
  variants: 3
  placementVariants: [0, 1, 2]
  baseTurf: Space
  isSubfloor: true
  footstepSounds:
    collection: F14FootstepDirt
  friction: 0.30
  thermalConductivity: 0.04
  heatCapacity: 10000
  weather: true
  indestructible: true

# Maps saved before the F14 rename (e.g. Yuma) use the old ID.
- type: tileAlias
  id: FloorWastelandSand
  target: F14FloorWastelandSand
