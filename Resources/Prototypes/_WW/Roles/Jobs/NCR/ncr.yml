# ---- from _Misfits/Roles/Jobs/Yuma/ncr.yml
# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Roles/Jobs/, _Nuclear14/Roles/Jobs/
# Changed for Wild Wanamingo: Yuma's roster. Names, slots and whitelists from the server's roster; gear is
# Misfits' (minus the wallet slot and the skirt/satchel/duffel choices, which are loadouts in Wizden).
# Misfits' playtime and species requirements are left out for now.

- type: job
  id: F14NCRCommander
  name: job-name-ncr-commander
  description: job-description-ncr-commander
  playTimeTracker: F14NCRCommander
  startingGear: F14NCRCommanderGear
  icon: F14JobIconNcrLeader
  supervisors: job-supervisors-ncr-commander
  whitelisted: true
  access:
  - F14NCR
  - F14NCRSGT
  - F14NCRMedic
  - F14NCRLT
  - F14NCRCaptain
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - F14Wastelander
          - F14NCR

- type: startingGear
  id: F14NCRCommanderGear
  equipment:
    head: F14ClothingHeadHatNCRBeretOfficer
    back: F14ClothingBackpackNCR
    jumpsuit: F14ClothingOfficerUniformNCRDesert
    outerClothing: F14NCRCommandArmor
    shoes: F14ClothingBootsCombatFilled
    belt: F14ClothingBeltNCR
    eyes: ClothingEyesGlassesSunglasses
    ears: F14ClothingHeadsetNCR
    pocket1: F14KitNCRBaseCommander
    id: F14NCRCommanderPipboy
  storage:
    back:
    - F14IFAKMilitary
    - SyndicateWhistle
    - F14Binoculars

