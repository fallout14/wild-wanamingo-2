- type: ambientMusic
  id: F14Wasteland
  sound:
    params:
      volume: -10
    collection: F14AmbienceWasteland
  fadeIn: true
  interruptable: true
  priority: 3
  conditions:
  - !type:OnMapGridCondition
  - !type:IsGhostCondition
    inverted: true

