# Desert Rose 2 ambience (Reports/porter/desertrose/import_sounds.py). Ambient music is global, so these play
# by where the player is: anywhere on the planet, indoors (half the nearby floor is an indoor floor) and
# underground (cave dirt, basalt, tunnels). Priorities sit above Wizden's station rules (Maintenance 2,
# Mining 1) so those don't play on the wasteland.

