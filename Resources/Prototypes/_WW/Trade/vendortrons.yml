# Vendortron catalogues (buy tab only). Items, prices and stock ranges from MS13 vendortrons.dm
# (gunrunner, medtek, armor, tools, robco), matched to our items; MS13 prices are used as caps.
# MS13 items with no match here were left out (5.56 revolver, splints, Day Tripper, flight/eyebot helmets,
# claw hammer, Wattz pistol, Stealth Boy, vacuum tube, fishing rod...). The prewar-money exchange was left out too.
# Prices below what any trade terminal pays back were raised to ~25% over that buy-back (no buy-low-sell-high loop);
# VendortronTest checks this.
# countMin..count = starting stock, rolled per vendortron.

