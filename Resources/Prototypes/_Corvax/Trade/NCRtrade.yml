# Ported from Corvax content carried by Nuclear 14 / Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/Corvax/Trade/NCRtrade.yml

- type: entity
  id: F14TrademachineNCR
  parent: F14Trademachine
  abstract: true
  name: NCR Caravan Wagon
  description: A caravan operated by NCR traders, offering goods from the west.
  components:
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: NcStoreStructuredBoundUi
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        density: 300
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Misfits/Legacy/Structures/Machines/VendingMachines/caravanwagon.rsi
    layers:
    - state: caravanwagon
  - type: PointLight
    enabled: false

- type: entity
  id: F14TrademachineNCRCity
  parent: F14TrademachineNCR
  name: NCR Caravan Wagon
  description: A caravan operated by NCR traders, offering goods from the west.
  suffix: vendor, normal
  components:
  - type: NcStore
    contractTierProfile: F14NCR
    buyPresets:
    - F14NCRBuy2
    sellPresets:
    - F14NCRSell2
    contractPresets:
    - F14PresetNCR
  # #Misfits Change — restored TownieShopkeeper access restriction (players must be shopkeeper to use terminal)
  # #Misfits Add — track Hall of Fame roster for the tier contract system
  - type: AccessReader
    access:
    - [ "F14NCRTrader" ]
  - type: NcContractRoster

