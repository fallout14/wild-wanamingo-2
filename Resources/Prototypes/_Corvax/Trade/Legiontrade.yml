# Ported from Corvax content carried by Nuclear 14 / Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/Corvax/Trade/Legiontrade.yml

- type: entity
  id: F14TrademachineLegion
  parent: F14Trademachine
  abstract: true
  name: Legion Market Stall
  description: Market stall operated by Legion Plebeians, offering goods from the east.
  components:
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: NcStoreStructuredBoundUi
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        density: 300
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Misfits/Legacy/Structures/Machines/VendingMachines/legionmarket.rsi
    layers:
    - state: legionmarket
  - type: PointLight
    enabled: false

- type: entity
  id: F14TrademachineLegionCity
  parent: F14TrademachineLegion
  name: Legion Market Stall
  description: Market stall operated by Legion Plebeians, offering goods from the east.
  suffix: vendor, normal
  components:
  - type: NcStore
    contractTierProfile: F14Legion
    buyPresets:
    - F14LegionBuy2
    sellPresets:
    - F14LegionSell2
    contractPresets:
    - F14PresetLegion
  # #Misfits Change — restored TownieShopkeeper access restriction (players must be shopkeeper to use terminal)
  # #Misfits Add — track Hall of Fame roster for the tier contract system
  - type: AccessReader
    access:
    - [ "F14CaesarLegionTrader" ]
  - type: NcContractRoster

