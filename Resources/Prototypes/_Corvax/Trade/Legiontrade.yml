- type: storeCategoryStructured
  id: F14LegionBuy2Currency # IF YOU CHANGE ONE EXCHANGE RATE, YOU MUST CHANGE ALL OTHERS ACROSS ALL FOUR FILES TO MATCH, OR YOU WILL CREATE AN INFINITE MONEY GLITCH
  name: "Currency"
  entries:
  - proto: F14CurrencyLegionAureus
    price: 10
    amount: 1
  - proto: F14CurrencyCap4
    price: 1
    amount: 4 # N14CurrencyCap4's Stack count is 4; amount sets units-per-purchase so buying once actually gives 4 caps.
  #if you screw with the price of one currency, silver, or gold, you must change everything else to match.
  # legion wont buy ncr dollars AT ALL because they dont want that profligate fiat trash.

