- type: entity
  id: F14TrademachineWaster
  parent: F14Trademachine
  abstract: true
  name: Waster Caravan Wagon
  description: A caravan operated by Wastelanders, offering goods from all across the wastes.
  components:
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: NcStoreStructuredBoundUi
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        density: 300
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Misfits/Legacy/Structures/Machines/VendingMachines/caravanwagon.rsi
    layers:
    - state: caravanwagon
  - type: PointLight
    enabled: false

- type: entity
  id: F14TrademachineWasterCity
  parent: F14TrademachineWaster
  name: Waster Caravan Wagon
  description: A caravan operated by Wastelanders, offering goods from all across the wastes.
  suffix: vendor, normal
  components:
  - type: NcStore
    buyPresets:
    - F14WasterBuy2
    sellPresets:
    - F14WasterSell2
    contractPresets:
    - F14PresetBazar
  # #Misfits Change — restored TownieShopkeeper access restriction (players must be shopkeeper to use terminal)
  # #Misfits Add — track Hall of Fame roster for the tier contract system
  - type: AccessReader
    access:
    - [ "F14WasterTrader" ]
  - type: NcContractRoster

