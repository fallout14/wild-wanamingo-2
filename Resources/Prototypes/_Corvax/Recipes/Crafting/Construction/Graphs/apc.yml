# Ported from Corvax content carried by Nuclear 14 / Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/Corvax/Recipes/Crafting/Construction/Graphs/apc.yml

- type: constructionGraph
  id: F14APC
  start: start
  graph:
    - node: start
      edges:
        - to: apcFrame
          steps:
            - material: F14Iron
              amount: 2

    - node: apcFrame
      entity: F14APCBreakerFrame
      edges:
        - to: apcCable
          steps:
            - tag: F14Mainboard
              name: misfits-kit-mainboard
              icon: {sprite: Nuclear14/Objects/Misc/crafting_junk.rsi, state: frame}
            - tool: Screwing
              doAfter: 1
        - to: start
          completed:
            - !type:GivePrototype
              prototype: F14IngotIron1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 2

    - node: apcCable
      entity: F14APCBreakerFrame
      edges:
      - to: apc
        steps:
        - material: Cable
          amount: 2
        - tool: Welding
          doAfter: 2
      - to: apcFrame
        steps:
        - tool: Prying
          doAfter: 1
        completed:
        - !type:GivePrototype
          prototype: F14JunkComponentMainboard
          amount: 1

    - node: apc
      entity: F14APCBreakerConstructed
      edges:
        - to: apcCable
          completed:
            - !type:GivePrototype
              prototype: CableApcStack1
              amount: 2
          conditions:
            - !type:WirePanel
              open: true
          steps:
            - tool: Cutting
              doAfter: 1
