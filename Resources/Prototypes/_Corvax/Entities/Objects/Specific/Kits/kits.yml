- type: entity
  name: legate-praetorian kit
  parent: F14KitBase
  id: F14KitLegatePraetorian
  description: "A set of Legion equipment."
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Corvax/Objects/Misc/kits.rsi
    state: base
  - type: Item
    size: Huge
  - type: SpawnItemsOnUse
    items:
      - id: F14WeaponThermospear
      - id: F14LegionnaireShield
      - id: F14ClothingBeltRope
