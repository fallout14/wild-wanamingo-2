- type: entity
  name: legate-praetorian kit
  parent: N14KitBase
  id: CorvaxKitLegatePraetorian
  description: "A set of Legion equipment."
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Corvax/Objects/Misc/kits.rsi
    state: base
  - type: Item
    size: Huge
  - type: SpawnItemsOnUse
    items:
      - id: CorvaxWeaponThermospear
      - id: N14ClothingBeltRope
      - id: Bola
        amount: 2
      - id: N14HealingPowder #Misfits Change /Tweak/: Legion uses tribal medicine, not stimpaks
