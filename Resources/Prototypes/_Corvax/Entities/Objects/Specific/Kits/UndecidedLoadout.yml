# Ported from Corvax content carried by Nuclear 14 / Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/Corvax/Entities/Objects/Specific/Kits/UndecidedLoadout.yml

- type: entity
  id: CorvaxLegionLegateloadoutkits
  name: kit
  description: "please only take one."
  parent: CorvaxLegionCenturionloadoutkits
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Corvax/Objects/Misc/kits.rsi
    state: base
  - type: ThiefUndeterminedBackpack
    maxSelectedSets: 1
    toolName: n14-loadout-kit-window-title
    toolDesc: n14-loadout-kit-window-description
    possibleSets:
    - LegatePraetorianSet
    - LegateSagitariaSet
    - LegateImperatorSet

- type: entity
  id: CorvaxLegionCenturionloadoutkits
  name: kit
  description: "please only take one."
  parent: BaseItem
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Corvax/Objects/Misc/kits.rsi
    state: base
  - type: ThiefUndeterminedBackpack
    maxSelectedSets: 1
    toolName: n14-loadout-kit-window-title
    toolDesc: n14-loadout-kit-window-description
    possibleSets:
    - CenturionCommandSet
    - CenturionMarksmanSet
    - CenturionVanquisherSet
  - type: ActivatableUI
    key: enum.ThiefBackpackUIKey.Key
  - type: UserInterface
    interfaces:
      enum.ThiefBackpackUIKey.Key:
        type: ThiefBackpackBoundUserInterface

