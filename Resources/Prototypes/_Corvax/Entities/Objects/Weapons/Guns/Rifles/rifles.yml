# Ported from Corvax content carried by Nuclear 14 / Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/Corvax/Entities/Objects/Weapons/Guns/Rifles/rifles.yml

- type: entity
  name: Ak-112
  parent: N14WeaponRifleBase
  id: CorvaxWeaponRifleAk112
  description: AK-112 assault rifle. An old military model that has not been used since the war. It fires in single-shot and automatic modes. It has gained popularity among the Western Brotherhood of Steel. It uses 5mm cartridges and accepts standard and drum magazines.
  components:
  - type: GunDamageModifier
    damage:
      types:
        Piercing: 9
  - type: Clothing
    sprite: Misfits/Legacy/Corvax/Objects/Weapons/Guns/Rifles/ak112.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Sprite
    sprite: Misfits/Legacy/Corvax/Objects/Weapons/Guns/Rifles/ak112.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    minAngle: 24
    maxAngle: 45
    angleIncrease: 4
    angleDecay: 12
    fireRate: 4.5
    projectileSpeed: 40
    soundGunshot:
      collection: N14RifleR91Gunshot
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    - SemiAuto
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: CorvaxMagazine545Rifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - CorvaxMagazine545Rifle
            - CorvaxMagazineDrum545Rifle
      gun_chamber:
        name: Chamber
        startingItem: N14CartridgePistol5
        priority: 1
        whitelist:
          tags:
            - N14CartridgePistol5
  - type: StaticPrice
    price: 100

