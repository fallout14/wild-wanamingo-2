# Ported from Corvax content carried by Nuclear 14 / Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/Corvax/Entities/Objects/Weapons/Guns/laser/laserbos.yml

- type: entity
  name: Magneto-laser pistol
  parent: F14BaseWeaponPowerCellSmall
  id: F14WeaponLaserMagnetoPistol
  description: This 1000-watt laser gun has been upgraded with a magnetic calibration system that condenses the laser beam, increasing its penetrating power.
  components:
  - type: BatteryAmmoProvider
    proto: F14MFLaserRed
    fireCost: 50 # WW Change - 12 shots per small energy cell (600)
  - type: Sprite # WW Change - MS13 Wattz Magneto sprite (no charge overlay)
    sprite: MojaveSun/Objects/Weapons/Guns/Battery/wattz1000mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/taser.rsi # WW Change - the old sprite had no worn states; MS13 has none
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: F14PowerCellSmall # WW Change - small energy cells, was microfusion
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - F14PowerCellSmall
  - type: Item
    sprite: MojaveSun/Objects/Weapons/Guns/Battery/wattz1000mag.rsi # WW Change - MS13 in-hands
    size: Small
    shape:
    - 0,0,1,1
    - 0,0,1,1
  - type: Gun
    fireRate: 1.5
    soundGunshot:
      collection: F14LaserPistolGunshot
  - type: EyeCursorOffset
    maxOffset: 2
    pvsIncrease: 0.2
  - type: StaticPrice
    price: 80
