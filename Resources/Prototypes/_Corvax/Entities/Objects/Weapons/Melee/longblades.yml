# Ported from Corvax content carried by Nuclear 14 / Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/Corvax/Entities/Objects/Weapons/Melee/longblades.yml

- type: entity
  parent: F14MacheteBase
  id: F14GladiusBase
  name: gladius
  description: The old sword of the Roman Empire. It is now in use by the Legion...
  components:
  - type: Clothing
    sprite: Misfits/Legacy/Corvax/Objects/Weapons/Melee/gladius.rsi
    quickEquip: false
    slots:
    - Belt
    - Back
    - suitStorage
  - type: Sprite
    sprite: Misfits/Legacy/Corvax/Objects/Weapons/Melee/gladius.rsi
    state: icon
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 25
  - type: MeleeWeapon
    attackRate: 0.9
    damage:
      types:
        Slash: 48
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    sprite: Misfits/Legacy/Corvax/Objects/Weapons/Melee/gladius.rsi

- type: entity
  parent: BaseItem
  id: F14WeaponThermospear
  name: thermic lance
  description: "A long two-handed thermic lance. Fuel is needed for use."
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Corvax/Objects/Weapons/Melee/thermospear.rsi
    layers:
    - state: icon
    - state: welder_flame
      visible: false
      shader: unshaded
      map: ["enum.ToggleableVisuals.Layer"]
  - type: Item
    sprite: Misfits/Legacy/Corvax/Objects/Weapons/Melee/thermospear.rsi
    size: Huge
    # Misfits Fix - explicit inhand visuals so the weapon sprite shows correctly when held
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Clothing
    sprite: Misfits/Legacy/Corvax/Objects/Weapons/Melee/thermospear.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: ItemToggleSize
    activatedSize: Large
  - type: ItemToggleHot
  - type: UseDelay
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: WelderOn
      params:
        variation: 0.125
        volume: -5
    soundDeactivate:
      collection: WelderOff
      params:
        variation: 0.125
        volume: -5
  - type: MeleeWeapon
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
      params:
        volume: -3
    damage:
      types:
        Blunt: 1.66667
        Slash: 1.66667
        Piercing: 1.66667
  - type: MultiHandedItem
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
      params:
        variation: 0.250
        volume: -12
    deactivatedSoundOnHitNoDamage:
      collection: MetalThud
    activatedDamage:
        types:
            Heat: 60
            Shock: 20
            Structural: 150 # Can-opener. KILL THOSE FUCKING PA CHUDS RIP THEM OPEN AND GORE THEM!
  # Misfits Fix - WelderComponent restores fuel quantity display when held
  - type: Welder
    fuelConsumption: 1
    fuelLitCost: 0.5
  - type: RefillableSolution
    solution: Welder
  - type: Solution
    id: Welder
    solution:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 60
      maxVol: 60
  - type: PointLight
    enabled: false
    radius: 2
    color: orange
    netsync: false
  - type: Appearance
  - type: RequiresEyeProtection
  - type: IgnitionSource
    temperature: 700
