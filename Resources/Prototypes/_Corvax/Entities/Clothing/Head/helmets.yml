# Ported from Corvax content carried by Nuclear 14 / Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/Corvax/Entities/Clothing/Head/helmets.yml

- type: entity
  parent: ClothingHeadBase
  id: CorvaxClothingHeadHatCenturionHelmet
  name: centurion galea
  description: "A protective helmet with a transverse crest."
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Corvax/Clothing/Head/Helmets/centurionhelmet.rsi
  - type: Clothing
    sprite: Misfits/Legacy/Corvax/Clothing/Head/Helmets/centurionhelmet.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.8
  - type: ExplosionResistance
    damageCoefficient: 0.90
  - type: HideLayerClothing
    slots:
    - Hair
    - FacialHair

