# Ported from SimpleStation content carried by Nuclear 14 / Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/SimpleStation14/benches.yml

- type: entity
  name: bench
  id: SimpleStationBenchBaseMiddle
  suffix: Middle
  abstract: true
  parent: SeatBase
  description: Multiple seats spanning a single object. Truly a marvel of science.
  components:
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: Sprite
    state: middle

# Park benches

- type: entity
  name: sofa
  id: SimpleStationBenchSofaMiddle
  parent: SimpleStationBenchBaseMiddle
  components:
  - type: Sprite
    sprite: Misfits/Legacy/SimpleStation14/Structures/Furniture/Benches/sofa.rsi

- type: entity
  id: SimpleStationBenchSofaLeft
  suffix: Left
  parent: SimpleStationBenchSofaMiddle
  components:
  - type: Sprite
    state: left

- type: entity
  id: SimpleStationBenchSofaRight
  suffix: Right
  parent: SimpleStationBenchSofaMiddle
  components:
  - type: Sprite
    state: right

- type: entity
  name: sofa
  id: SimpleStationBenchSofaCorner
  suffix: Corner
#  parent: BenchSofaMiddle
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: Sprite
    sprite: Misfits/Legacy/SimpleStation14/Structures/Furniture/Benches/sofa.rsi
    state: corner
  - type: Clickable
  - type: InteractionOutline
  - type: Pullable
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

