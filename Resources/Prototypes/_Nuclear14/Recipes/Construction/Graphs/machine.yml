# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Recipes/Construction/Graphs/machine.yml

- type: constructionGraph
  id: F14TallMachineFrame
  start: start
  graph:
    - node: start
      actions:
        - !type:SpawnPrototype
          prototype: SheetSteel1
        - !type:DeleteEntity
      edges:
        - to: missingWires
          steps:
            - material: Steel
              amount: 5
              doAfter: 3
        - to: destroyedMachineFrame
          steps:
            - material: Steel
              amount: 5
              doAfter: 3

    - node: missingWires
      entity: F14MachineFrameTall
      edges:
        - to: machineFrame
          steps:
            - material: Cable
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 5
            - !type:DeleteEntity
          steps:
            - tool: Welding
              doAfter: 5

    - node: machineFrame
      entity: F14MachineFrameTallWired
      edges:
        - to: ElectronicsRack
          steps:
            - tool: Screwing
              doAfter: 1
            - material: Circuitry
        - to: ServerRack
          steps:
            - tool: Screwing
              doAfter: 1
            - material: Circuitry
        - to: RecorderRack
          steps:
            - tool: Screwing
              doAfter: 1
            - material: Circuitry

        - to: missingWires
          completed:
            - !type:SpawnPrototype
              prototype: CableApcStack1
          steps:
            - tool: Cutting
              doAfter: 1

    - node: ElectronicsRack
      entity: F14MachineRackElectronics
      edges:
        - to: machineFrame
          steps:
            - tool: Screwing
              doAfter: 2
          completed:
            - !type:SpawnPrototype
              prototype: F14MachineFrameTallWired
              amount: 1
            - !type:SpawnPrototype
              prototype: F14MaterialCircuitry1
              amount: 1
            - !type:DeleteEntity {}
            
    - node: ServerRack
      entity: F14MachineRackServer
      edges:
        - to: machineFrame
          steps:
            - tool: Screwing
              doAfter: 2
          completed:
            - !type:SpawnPrototype
              prototype: F14MachineFrameTallWired
              amount: 1
            - !type:SpawnPrototype
              prototype: F14MaterialCircuitry1
              amount: 1
            - !type:DeleteEntity {}
            
    - node: RecorderRack
      entity: F14MachineRackRecorder
      edges:
        - to: machineFrame
          steps:
            - tool: Screwing
              doAfter: 2
          completed:
            - !type:SpawnPrototype
              prototype: F14MachineFrameTallWired
              amount: 1
            - !type:SpawnPrototype
              prototype: F14MaterialCircuitry1
              amount: 1
            - !type:DeleteEntity {}

    - node: destroyedMachineFrame
      entity: F14MachineFrameTallDestroyed
      edges:
        - to: start
          steps:
            - tool: Welding
              doAfter: 5
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 3
            - !type:DeleteEntity {}
