# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Recipes/Construction/Graphs/Machines/workbenchchemistryset.yml

- type: constructionGraph
  id: N14WorkbenchChemistryset
  start: start
  graph:
    - node: start
      edges:
        - to: WorkbenchChemistrysetFrame
          completed:
            - !type:SnapToGrid
              southRotation: true
          steps:
            - material: WoodPlank
              amount: 3
              doAfter: 5

    - node: WorkbenchChemistrysetFrame
      actions:
      - !type:AppearanceChange
      entity: N14WorkbenchChemistrysetFrame
      edges:
        - to: WorkbenchChemistrysetSteel
          steps:
            - material: Glass
              amount: 6
              doAfter: 4

    - node: WorkbenchChemistrysetSteel
      actions:
      - !type:AppearanceChange
      entity: N14WorkbenchChemistrysetFrame
      edges:
        - to: WorkbenchChemistrysetGears
          steps:
            - material: Steel
              amount: 4
              doAfter: 4

    - node: WorkbenchChemistrysetGears
      actions:
      - !type:AppearanceChange
      entity: N14WorkbenchChemistrysetFrame
      edges:
        - to: WorkbenchChemistrysetScrews
          steps:
            - tag: N14Gear
              icon:
                sprite: Nuclear14/Objects/Misc/crafting_junk.rsi
                state: gear_large
              name: misfits-kit-gears
              doAfter: 1

    - node: WorkbenchChemistrysetScrews
      actions:
      - !type:AppearanceChange
      entity: N14WorkbenchChemistrysetFrame
      edges:
        - to: WorkbenchChemistrysetUnwelded
          steps:
            - tag: N14Screw
              icon:
                sprite: Nuclear14/Objects/Misc/crafting_junk.rsi
                state: screw
              name: misfits-kit-screws
              doAfter: 1
            - tag: N14Screw
              icon:
                sprite: Nuclear14/Objects/Misc/crafting_junk.rsi
                state: screw
              name: misfits-kit-screws
              doAfter: 1
            - tag: N14Screw
              icon:
                sprite: Nuclear14/Objects/Misc/crafting_junk.rsi
                state: screw
              name: misfits-kit-screws
              doAfter: 1

    - node: WorkbenchChemistrysetUnwelded
      actions:
      - !type:AppearanceChange
      entity: N14WorkbenchChemistrysetFrame
      edges:
        - to: WorkbenchChemistrysetUnwrenched
          steps:
            - tool: Welding
              doAfter: 4

    - node: WorkbenchChemistrysetUnwrenched
      actions:
      - !type:AppearanceChange
      entity: N14WorkbenchChemistrysetFrame
      edges:
        - to: WorkbenchChemistrysetUnscrewed
          steps:
            - tool: Anchoring
              doAfter: 2

    - node: WorkbenchChemistrysetUnscrewed
      actions:
      - !type:AppearanceChange
      entity: N14WorkbenchChemistrysetFrame
      edges:
        - to: WorkbenchChemistryset
          steps:
            - tool: Screwing
              doAfter: 2

    - node: WorkbenchChemistryset
      entity: N14WorkbenchChemistryset
