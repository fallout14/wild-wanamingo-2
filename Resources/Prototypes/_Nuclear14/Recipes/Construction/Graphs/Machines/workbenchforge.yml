# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Recipes/Construction/Graphs/Machines/workbenchforge.yml

- type: constructionGraph
  id: F14WorkbenchForge
  start: start
  graph:
    - node: start
      edges:
        - to: WorkbenchForgeFrame
          completed:
            - !type:SnapToGrid
              southRotation: true
          steps:
            - material: Steel
              amount: 12
              doAfter: 5

    - node: WorkbenchForgeFrame
      actions:
      - !type:AppearanceChange
      entity: F14WorkbenchForgeFrame
      edges:
        - to: WorkbenchForgeCookpot
          steps:
            - material: WoodPlank
              amount: 4
              doAfter: 4

    - node: WorkbenchForgeCookpot
      actions:
      - !type:AppearanceChange
      entity: F14WorkbenchForgeFrame
      edges:
        - to: WorkbenchForgeCookpotUnwelded
          steps:
            - tag: F14CookPot
              icon:
                sprite: Nuclear14/Objects/Misc/crafting_junk.rsi
                state: cookpot
              name: misfits-kit-cooking-pot
              doAfter: 2

    - node: WorkbenchForgeCookpotUnwelded
      actions:
      - !type:AppearanceChange
      entity: F14WorkbenchForgeFrame
      edges:
        - to: WorkbenchForgeCharcoal
          steps:
            - tool: Welding
              doAfter: 3

    - node: WorkbenchForgeCharcoal
      actions:
      - !type:AppearanceChange
      entity: F14WorkbenchForgeFrame
      edges:
        - to: WorkbenchForgeUnwrenched
          steps:
            - material: Charcoal
              amount: 30
              doAfter: 2

    - node: WorkbenchForgeUnwrenched
      actions:
      - !type:AppearanceChange
      entity: F14WorkbenchForgeFrame
      edges:
        - to: WorkbenchForgeUnwelded
          steps:
            - tool: Anchoring
              doAfter: 2

    - node: WorkbenchForgeUnwelded
      actions:
      - !type:AppearanceChange
      entity: F14WorkbenchForgeFrame
      edges:
        - to: WorkbenchForge
          steps:
            - tool: Welding
              doAfter: 6

    - node: WorkbenchForge
      entity: F14WorkbenchForge
