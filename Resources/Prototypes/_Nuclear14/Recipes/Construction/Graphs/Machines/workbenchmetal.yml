# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Recipes/Construction/Graphs/Machines/workbenchmetal.yml

- type: constructionGraph
  id: N14WorkbenchMetal
  start: start
  graph:
    - node: start
      edges:
        - to: WorkbenchMetalFrame
          completed:
            - !type:SnapToGrid
              southRotation: true
          steps:
            - material: WoodPlank
              amount: 3
              doAfter: 5

    - node: WorkbenchMetalFrame
      actions:
      - !type:AppearanceChange
      entity: N14WorkbenchMetalFrame
      edges:
        - to: WorkbenchMetalAluminum
          steps:
            - tag: N14Gear
              icon:
                sprite: Nuclear14/Objects/Misc/crafting_junk.rsi
                state: gear_large
              name: misfits-kit-gears
              doAfter: 1
            - tag: N14Gear
              icon:
                sprite: Nuclear14/Objects/Misc/crafting_junk.rsi
                state: gear_large
              name: misfits-kit-gears
              doAfter: 1

    - node: WorkbenchMetalAluminum
      actions:
      - !type:AppearanceChange
      entity: N14WorkbenchMetalFrame
      edges:
        - to: WorkbenchMetalScrews
          steps: 
            - material: N14Aluminum
              amount: 3
              doAfter: 4

    - node: WorkbenchMetalScrews
      actions:
      - !type:AppearanceChange
      entity: N14WorkbenchMetalFrame
      edges:
        - to: WorkbenchMetalUnwrenched
          steps:
            - tag: N14Screw
              icon:
                sprite: Nuclear14/Objects/Misc/crafting_junk.rsi
                state: screw
              name: misfits-kit-screws
              doAfter: 1
            - tag: N14Screw
              icon:
                sprite: Nuclear14/Objects/Misc/crafting_junk.rsi
                state: screw
              name: misfits-kit-screws
              doAfter: 1

    - node: WorkbenchMetalUnwrenched
      actions:
      - !type:AppearanceChange
      entity: N14WorkbenchMetalFrame
      edges:
        - to: WorkbenchMetalUnscrewed
          steps:
            - tool: Welding
              doAfter: 2

    - node: WorkbenchMetalUnscrewed
      actions:
      - !type:AppearanceChange
      entity: N14WorkbenchMetalFrame
      edges:
        - to: WorkbenchMetal
          steps:
            - tool: Screwing
              doAfter: 2

    - node: WorkbenchMetal
      entity: N14WorkbenchMetal
