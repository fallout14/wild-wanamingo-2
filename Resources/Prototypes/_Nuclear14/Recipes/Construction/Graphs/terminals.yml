# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Recipes/Construction/Graphs/terminals.yml

- type: constructionGraph
  id: F14TerminalNew
  start: start
  graph:
    - node: start
      actions:
        - !type:SpawnPrototype
          prototype: SheetSteel1
        - !type:DeleteEntity
      edges:
        - to: missingWires
          steps:
            - material: Steel
              amount: 2
              doAfter: 3
        - to: Broken
          steps:
            - material: Steel
              amount: 2
              doAfter: 3

    - node: missingWires
      entity: F14ComputerTerminalBase
      edges:
        - to: Frame
          steps:
            - material: Cable
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 2
            - !type:DeleteEntity
          steps:
            - tool: Welding
              doAfter: 2

    - node: Frame
      entity: F14ComputerTerminalNewWired
      edges:
        - to: Terminal
          steps:
            - tool: Screwing
              doAfter: 1
            - material: Circuitry

        - to: missingWires
          completed:
            - !type:SpawnPrototype
              prototype: CableApcStack1
          steps:
            - tool: Cutting
              doAfter: 1

    - node: Terminal
      entity: F14ComputerTerminalNew
      edges:
        - to: Frame
          steps:
            - tool: Screwing
              doAfter: 2
          completed:
            - !type:SpawnPrototype
              prototype: F14ComputerTerminalNewWired
              amount: 1
            - !type:SpawnPrototype
              prototype: F14MaterialCircuitry1
              amount: 1
            - !type:DeleteEntity {}

    - node: Broken
      entity: F14ComputerTerminalNewBroken
      edges:
        - to: start
          steps:
            - tool: Welding
              doAfter: 2
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 1
            - !type:DeleteEntity {}


# Normal Terminal

- type: constructionGraph
  id: F14Terminal
  start: start
  graph:
    - node: start
      actions:
        - !type:SpawnPrototype
          prototype: SheetSteel1
        - !type:DeleteEntity
      edges:
        - to: missingWires
          steps:
            - material: Steel
              amount: 2
              doAfter: 3
        - to: Broken
          steps:
            - material: Steel
              amount: 2
              doAfter: 3

    - node: missingWires
      entity: F14ComputerTerminalBase
      edges:
        - to: Frame
          steps:
            - material: Cable
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 2
            - !type:DeleteEntity
          steps:
            - tool: Welding
              doAfter: 2

    - node: Frame
      entity: F14ComputerTerminalWired
      edges:
        - to: Terminal
          steps:
            - tool: Screwing
              doAfter: 1
            - material: Circuitry

        - to: missingWires
          completed:
            - !type:SpawnPrototype
              prototype: CableApcStack1
          steps:
            - tool: Cutting
              doAfter: 1

    - node: Terminal
      entity: F14ComputerTerminal
      edges:
        - to: Frame
          steps:
            - tool: Screwing
              doAfter: 2
          completed:
            - !type:SpawnPrototype
              prototype: F14ComputerTerminalWired
              amount: 1
            - !type:SpawnPrototype
              prototype: F14MaterialCircuitry1
              amount: 1
            - !type:DeleteEntity {}

        - to: Rigged
          steps:
            - tool: Screwing
              doAfter: 1
            - tag: F14Bomb # Corvax-Change
              store: bomb
              name: misfits-kit-explosive
              icon:
                sprite: Objects/Weapons/Bombs/c4.rsi
                state: icon
          completed:
            - !type:SpawnPrototype
              prototype: F14ComputerTerminalRigged
              amount: 1
            - !type:DeleteEntity {}

    - node: Rigged
      entity: F14ComputerTerminalRigged
      edges:
        - to: Terminal
          steps:
            - tool: Screwing
              doAfter: 2
          completed:
            - !type:SpawnPrototype
              prototype: F14ComputerTerminal
              amount: 1
            - !type:SpawnPrototype
              prototype: C4
              amount: 1
            - !type:DeleteEntity {}

    - node: Broken
      entity: F14ComputerTerminalBroken
      edges:
        - to: start
          steps:
            - tool: Welding
              doAfter: 2
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 1
            - !type:DeleteEntity {}
