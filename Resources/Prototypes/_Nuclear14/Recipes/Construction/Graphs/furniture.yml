# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Recipes/Construction/Graphs/furniture.yml

- type: constructionGraph
  id: F14Bed
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: bed
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: Steel
              amount: 2
              doAfter: 1
            - material: Cloth
              amount: 6
              doAfter: 2
        - to: bedwood
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: WoodPlank
              amount: 2
              doAfter: 1
            - material: Cloth
              amount: 6
              doAfter: 2
              # start Misfits change
        - to: bedwoodbunk
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: WoodPlank
              amount: 2
              doAfter: 1
            - material: Cloth
              amount: 6
              doAfter: 2
              # end Misfits change
        - to: bedroll
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: Cloth
              amount: 3
              doAfter: 2
        - to: mattress
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: Cloth
              amount: 6
              doAfter: 2
    - node: bed
      entity: F14Bed
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 2
            - !type:SpawnPrototype
              prototype: MaterialCloth1
              amount: 6
          steps:
            - tool: Screwing
              doAfter: 1
    - node: bedwood
      entity: F14BedWood
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 2
            - !type:SpawnPrototype
              prototype: MaterialCloth1
              amount: 6
          steps:
            - tool: Screwing
              doAfter: 2
    #start Misfits change
    - node: bedwoodbunk
      entity: F14BedWoodBunk
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 2
            - !type:SpawnPrototype
              prototype: MaterialCloth1
              amount: 6
          steps:
            - tool: Screwing
              doAfter: 2
    #end Misfits change
    - node: medicalbed
      entity: MedicalBed
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetPlasteel1
              amount: 2
            - !type:SpawnPrototype
              prototype: MaterialDurathread1
              amount: 2
          steps:
            - tool: Screwing
              doAfter: 1
    - node: bedroll
      entity: F14Bedroll
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialCloth1
              amount: 3
          steps:
            - tool: Slicing
              doAfter: 1
    - node: mattress
      entity: F14BedMattress0
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialCloth1
              amount: 6
          steps:
            - tool: Cutting
