# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Recipes/Construction/Graphs/Structures/windows.yml

- type: constructionGraph
  id: F14WindowPane
  start: start
  graph:
    - node: start
      edges:
        - to: N14WindowSlanted
          completed:
            - !type:SnapToGrid
              southRotation: true
          conditions:
            - !type:EntityAnchored {}
          steps:
            - material: Glass
              amount: 2
              doAfter: 2

    - node: N14WindowSlanted
      entity: F14WindowSlanted
      edges:
        - to: start
          completed:
            - !type:GivePrototype
              prototype: SheetGlass1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 10

- type: constructionGraph
  id: F14WindowBars
  start: start
  graph:
    - node: start
      edges:
        - to: bars
          completed:
            - !type:SnapToGrid
              southRotation: true
          steps:
            - material: MetalRod
              amount: 2
              doAfter: 1

    - node: bars
      entity: F14WindowBars
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: PartRodMetal1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Cutting
              doAfter: 1
