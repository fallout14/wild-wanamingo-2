# Resources/Prototypes/_Nuclear14/Recipes/Crafting/Graphs/storage.yml

- type: constructionGraph
  id: N14CrateAluminium
  start: start
  graph:
    - node: start
      edges:
        - to: n14cratealuminium
          steps:
            - material: N14Aluminum
              amount: 5
              doAfter: 5

    - node: n14cratealuminium
      entity: N14CrateAluminium
      edges:
        - to: start
          steps:
            - tool: Screwing
              doAfter: 5
          conditions:
            - !type:StorageWelded
              welded: false
          completed:
            - !type:SpawnPrototype
              prototype: N14IngotAluminum1
              amount: 5
            - !type:EmptyAllContainers
            - !type:DeleteEntity

