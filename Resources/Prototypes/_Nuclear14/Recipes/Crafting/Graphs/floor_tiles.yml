# Concrete Floor Tiles

- type: constructionGraph
  id: F14TilesWood
  start: start
  graph:
    - node: start
      edges:
        - to: WoodCommon
          completed:
            - !type:SetStackCount
              amount: 2
          steps:
            - material: WoodPlank
              amount: 2
        - to: WoodFancy
          completed:
            - !type:SetStackCount
              amount: 2
          steps:
            - material: WoodPlank
              amount: 2
        - to: WoodMosaic
          completed:
            - !type:SetStackCount
              amount: 2
          steps:
            - material: WoodPlank
              amount: 2
        - to: WoodWide
          completed:
            - !type:SetStackCount
              amount: 2
          steps:
            - material: WoodPlank
              amount: 2

    - node: WoodCommon
      entity: F14FloorTilesItemMS13WoodCommon

    - node: WoodFancy
      entity: F14FloorTilesItemMS13WoodFancy

    - node: WoodMosaic
      entity: F14FloorTilesItemMS13WoodMosaic

    - node: WoodWide
      entity: F14FloorTilesItemMS13WoodWide
