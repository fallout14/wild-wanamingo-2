# Concrete Floor Tiles

- type: constructionGraph
  id: CorvaxTilesWood
  start: start
  graph:
    - node: start
      edges:
        - to: WoodCommon
          completed:
            - !type:SetStackCount
              amount: 2
          steps:
            - material: WoodPlank
              amount: 2
        - to: WoodFancy
          completed:
            - !type:SetStackCount
              amount: 2
          steps:
            - material: WoodPlank
              amount: 2
        - to: WoodMosaic
          completed:
            - !type:SetStackCount
              amount: 2
          steps:
            - material: WoodPlank
              amount: 2
        - to: WoodWide
          completed:
            - !type:SetStackCount
              amount: 2
          steps:
            - material: WoodPlank
              amount: 2

    - node: WoodCommon
      entity: CorvaxFloorTilesItemMS13WoodCommon

    - node: WoodFancy
      entity: CorvaxFloorTilesItemMS13WoodFancy

    - node: WoodMosaic
      entity: CorvaxFloorTilesItemMS13WoodMosaic

    - node: WoodWide
      entity: CorvaxFloorTilesItemMS13WoodWide
