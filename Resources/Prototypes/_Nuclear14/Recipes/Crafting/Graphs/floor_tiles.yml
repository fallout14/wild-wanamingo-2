# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Recipes/Crafting/Graphs/materials.yml
# Tile graphs split out of the materials graphs.

- type: constructionGraph
  id: F14FloorTileWoodOak
  start: start
  graph:
    - node: start
      edges:
        - to: woodtileoak
          steps:
            - material: WoodPlank
              amount: 2
              doAfter: 1
    - node: woodtileoak
      entity: F14FloorTileItemWoodOak

