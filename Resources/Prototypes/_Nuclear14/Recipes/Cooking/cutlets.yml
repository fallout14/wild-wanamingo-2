# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Recipes/Cooking/cutlets.yml

- type: constructionGraph
  id: N14MeatRadCutlet
  start: start
  graph:
  - node: start
    edges:
    - to: CutletCooked
      completed:
      - !type:PlaySound
        sound: /Audio/Effects/sizzle.ogg
      steps:
      - minTemperature: 335 # WW: was 305 K (32 C), Wizden red meat temperature
  - node: CutletCooked
    entity: N14FoodMeatRadCutletCooked

