# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Projectiles/energy.yml

- type: entity
  name: plasma
  id: N14BulletPlasma
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite #Misfits Fix — was using stretched ballistic bullet sprite (projectiles2.rsi 'bullet' scale 1.2,0.5). Now uses the proper plasma bolt from plasma.rsi.
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Projectiles/plasma.rsi
    layers:
    - state: plasma
      shader: unshaded
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.3,0.15,0.3"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Ammo
    muzzleFlash: MisfitsPlasmaMuzzleFlashEffect
  - type: Projectile
    impactEffect: MisfitsBulletPlasmaImpactEffect
    damage:
      types:
        Caustic: 18
        Radiation: 2
        Structural: 50
    soundHit:
      path: "/Audio/Weapons/Guns/Hits/energy_meat1.ogg"

- type: entity
  name: plasma
  id: N14BulletLightPlasma
  parent: N14BulletPlasma
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    scale: 0.5, 0.5
  - type: Projectile
    impactEffect: MisfitsBulletPlasmaImpactEffect
    damage:
      types:
        Caustic: 15
        Structural: 25
    soundHit:
      path: "/Audio/Weapons/Guns/Hits/energy_meat1.ogg"

- type: entity
  name: plasma
  id: N14BulletBigPlasma
  parent: N14BulletPlasma
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    scale: 1.0, 1.0
  - type: Projectile
    impactEffect: MisfitsBulletPlasmaImpactEffect
    damage:
      types:
        Caustic: 35
        Radiation: 5
        Structural: 100
    soundHit:
      path: "/Audio/Weapons/Guns/Hits/energy_meat1.ogg"

- type: entity
  name: recharger laser
  id: N14BulletRechargerLaser
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    layers:
    - state: omnilaser_greyscale
      shader: unshaded
      color: red
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        mask:
        - Opaque
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Heat: 12
    soundHit:
      collection: MeatLaserImpact
