# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Rifles/rifles.yml

- type: entity
  parent: BaseWeaponRifle
  id: N14WeaponRifleBase
  abstract: true
  components:
  - type: Item
    size: Large
  - type: Clothing
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Wieldable
  - type: SpeedModifiedOnWield
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: GunWieldBonus
    minAngle: -21
    maxAngle: -38
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: FirearmAttachmentHost
    muzzleSlot:
      name: Muzzle attachment
      priority: 3
      insertOnInteract: true
      ejectOnInteract: false
      ejectOnUse: false
      disableEject: true
      ejectVerbText: Remove muzzle attachment
      insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
      ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
      whitelist:
        tags:
        - MisfitsFirearmMuzzleAttachment
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: EyeCursorOffset
    maxOffset: 3
    pvsIncrease: 0.3
  - type: StaticPrice
    price: 100
  # - type: Craftable  # #Misfits Remove: Stalker14 crafting system

- type: entity
  name: R-91 Rifle
  parent: N14WeaponRifleBase
  id: N14WeaponRifle556R91
  description: An old-fashioned assault rifle chambered in 5.56 munitions.
  components:
  - type: ContainerContainer  # spawn state
    containers:
      gun_magazine: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      gun_chamber: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      weapon_muzzle: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/Rifles/r91.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Rifles/r91.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    minAngle: 24
    maxAngle: 45
    angleIncrease: 4
    angleDecay: 16
    soundGunshot:
      collection: N14RifleR91Gunshot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: N14Magazine556Rifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - N14Magazine556Rifle
      gun_chamber:
        name: Chamber
        startingItem: N14Cartridge556Rifle
        priority: 1
        whitelist:
          tags:
            - N14Cartridge556Rifle
  - type: StaticPrice
    price: 100

- type: entity
  name: service rifle
  parent: N14WeaponRifleBase
  id: N14WeaponRifle556Service
  description: A cheaply mass-produced post-war rifle made by the NCR, chambered in 5.56 ammo.
  components:
  - type: ContainerContainer  # spawn state
    containers:
      gun_magazine: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      gun_chamber: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      weapon_muzzle: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      weapon_optic: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: Item
    sprite: Nuclear14/Objects/Weapons/Guns/Rifles/servicerifle.rsi
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/Rifles/servicerifle.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Sprite
    scale: 0.8, 0.8
    sprite: Nuclear14/Objects/Weapons/Guns/Rifles/servicerifleicon.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: FirearmAttachmentHost
    visualOrientation: Horizontal
    enableOpticSlot: true
    # The attachment art uses its lower-left pixel as the mounting origin.
    muzzleVisualOffset: 0.96875, 0.46875
    opticSlot:
      name: Optic
      priority: 4
      insertOnInteract: true
      ejectOnInteract: false
      ejectOnUse: false
      disableEject: true
      whitelist:
        tags:
        - N14RifleScope
    muzzleSlot:
      name: Muzzle attachment
      locked: false
      priority: 3
      insertOnInteract: true
      ejectOnInteract: false
      ejectOnUse: false
      disableEject: true
      whitelist:
        tags: []
        requireAll: false
        components:
        - BayonetAttachment
  - type: FirearmSearCompatible
    allowBurst: true
    allowFullAuto: true
  - type: Gun
    minAngle: 21
    maxAngle: 45
    angleIncrease: 4
    angleDecay: 16
    fireRate: 5
    shotsPerBurst: 3 # Corvax-Add
    burstFireRate: 4 # Corvax-Add
    soundGunshot:
      collection: N14ServiceGunshot
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: N14Magazine556Rifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - N14Magazine556Rifle
      gun_chamber:
        name: Chamber
        startingItem: N14Cartridge556Rifle
        priority: 1
        whitelist:
          tags:
            - N14Cartridge556Rifle
  - type: StaticPrice
    price: 100

