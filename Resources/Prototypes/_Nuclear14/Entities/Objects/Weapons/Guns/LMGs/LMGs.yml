# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/LMGs/LMGs.yml

- type: entity
  name: automatic rifle
  parent: BaseWeaponRifle
  id: F14WeaponLMGAutoRifle
  description: An M1918A1 Browning Automatic Rifle. A heavy, low-capacity automatic rifle of the pre-war, chambered in the powerful .308 ammunition.
  components:
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/LMGs/autorifle.rsi
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/LMGs/autorifle.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Huge
    sprite: Nuclear14/Objects/Weapons/Guns/LMGs/autorifle.rsi
  - type: Wieldable
  - type: SpeedModifiedOnWield
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: GunRequiresWield
  - type: GunWieldBonus
    minAngle: -19 # Corvax-Change
    maxAngle: -50 # Corvax-Change
  - type: Gun
    minAngle: 24
    maxAngle: 60
    angleIncrease: 5
    angleDecay: 16
    fireRate: 3.5 # #Misfits Tweak - was 4; the M1918A2 and Colt Monitor are the upgrades
    soundGunshot:
      collection: F14AutoRifleGunshot
    selectedMode: FullAuto
    availableModes:
    - FullAuto
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: F14Magazine308Rifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - F14Magazine308Rifle
      gun_chamber:
        name: Chamber
        startingItem: F14Cartridge308Rifle
        priority: 1
        whitelist:
          tags:
            - F14Cartridge308Rifle
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: EyeCursorOffset
    maxOffset: 2
    pvsIncrease: 0.2
  - type: StaticPrice
    price: 300

