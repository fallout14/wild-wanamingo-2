# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Heavy/missile.yml

- type: entity
  name: missile launcher
  parent: BaseWeaponLauncher
  id: N14WeaponLauncherMissile
  description: "An advanced pre-war shoulder-mounted missile launcher, it's kinda obvious what kind of ammo it uses."
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Heavy/missilelauncher.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/Heavy/missilelauncher.rsi
  - type: Wieldable
  - type: SpeedModifiedOnWield
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: -104
  - type: Item
    size: Ginormous
  - type: Gun
    fireRate: 0.5
    minAngle: 24
    maxAngle: 105
    angleIncrease: 4
    angleDecay: 16
    soundGunshot:
      collection: N14LauncherMissileGunshot
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - N14Missile
    proto: N14CartridgeMissile
    capacity: 1
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: EyeCursorOffset
    maxOffset: 2
    pvsIncrease: 0.2
  - type: StaticPrice
    price: 500
