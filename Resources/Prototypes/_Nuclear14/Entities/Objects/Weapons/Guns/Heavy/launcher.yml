# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Heavy/launcher.yml

- type: entity
  name: grenade launcher
  parent: BaseWeaponLauncher
  id: F14WeaponLauncherGrenade
  description: A pump-action heavy grenade launcher with a 4-grenade capacity, 4-times more fun! It uses 40mm grenades.
  components:
  - type: Wieldable
  - type: SpeedModifiedOnWield
    walkModifier: 0.75
    sprintModifier: 0.75
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: -104
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Heavy/grenadelauncher.rsi
    layers:
      - state: icon
        map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/Heavy/grenadelauncher.rsi
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    minAngle: 24
    maxAngle: 105
    angleIncrease: 4
    angleDecay: 16
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      collection: F14LauncherGrenadeGunshot
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - F14Grenade
    capacity: 4
    proto: F1440mmGrenadeFrag
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: EyeCursorOffset
    maxOffset: 2
    pvsIncrease: 0.2
  - type: StaticPrice
    price: 200

- type: entity
  name: grenade rifle
  parent: BaseWeaponLauncher
  id: F14WeaponRifleGrenade
  description: A break-action, single-shot, light grenade launcher. The coolest thing ever, launches 40mm grenades.
  components:
  - type: Wieldable
  - type: SpeedModifiedOnWield
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: -104
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Heavy/grenaderifle.rsi
    layers:
      - state: icon
        map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/Heavy/grenaderifle.rsi
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Item
    size: Large
  - type: Gun
    minAngle: 24
    maxAngle: 105
    angleIncrease: 4
    angleDecay: 16
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      collection: F14LauncherGrenadeGunshot
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - F14Grenade
    capacity: 1
    proto: F1440mmGrenadeFrag
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: EyeCursorOffset
    maxOffset: 2
    pvsIncrease: 0.2
  - type: StaticPrice
    price: 175
