    soundInsert:
      path: /Audio/Nuclear14/Weapons/Effects/Reload/Shotguns/shotgun_insert.ogg
  - type: StaticPrice
    price: 60
  - type: MeleeWeapon
    attackRate: 1.5
    range: 1.75
    bluntStaminaDamageFactor: 1.25
