# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Shotguns/shotguns.yml

- type: entity
  name: F14WeaponShotgunBase
  parent: BaseItem
  id: F14WeaponShotgunBase
  description: A rooty tooty point and shooty.
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: icon
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Item
    size: Large
  - type: Clothing
    sprite: Misfits/Legacy/DeltaV/Objects/Weapons/Guns/Shotguns/db_shotgun.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/shotgun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
    fireOnDropChance: 0.2
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: StaticPrice
    price: 10
  - type: EyeCursorOffset
    maxOffset: 2.5
    pvsIncrease: 0.25
  - type: Wieldable
  - type: SpeedModifiedOnWield
    walkModifier: 0.82
    sprintModifier: 0.82

- type: entity
  name: shotgun
  parent: F14WeaponShotgunBase
  id: F14WeaponShotgun
  description: A pump action shotgun chambered in 12 gauge shells.
  components:
  - type: ManualAction
  - type: Gun
    fireRate: 1
    soundGunshot:
      collection: F14ShotgunGunshot
  - type: GunRequiresWield
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/Shotguns/pump.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Shotguns/pump.rsi
  - type: Item
    size: Large
    sprite: Nuclear14/Objects/Weapons/Guns/Shotguns/pump.rsi
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - F14ShellShotgun12
    capacity: 6
    proto: F14ShellShotgun12
    soundInsert:
      path: /Audio/Nuclear14/Weapons/Effects/Reload/Shotguns/shotgun_insert.ogg
  - type: StaticPrice
    price: 75

