# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/turrets.yml

- type: entity
  parent: BaseStructure
  id: F14WeaponTurretBroken
  name: ballistic turret
  suffix: broken
  description: A ballistic machine gun auto-turret.
  components:
    - type: Sprite
      sprite: Nuclear14/Structures/Machines/turrets.rsi
      drawdepth: Mobs
      state: turret_broken
    - type: Clickable
    - type: InteractionOutline
    - type: Damageable
    - type: Injurable
      damageContainer: Inorganic
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 450
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalGlassBreak
            - !type:SpawnEntitiesBehavior
              spawn:
                SheetSteel1:
                  min: 2
                  max: 4

- type: entity
  parent: F14WeaponTurretBroken
  id: F14WeaponTurretMobileBroken
  components:
    - type: Sprite
      sprite: Nuclear14/Structures/Machines/turrets.rsi
      state: turret_stand_broken

- type: entity
  parent: BaseStructure
  id: F14BaseWeaponTurret
  name: ballistic turret
  abstract: true
  components:
    - type: Sprite
      sprite: Nuclear14/Structures/Machines/turrets.rsi
      drawdepth: Mobs
      state: turret_lethal
    - type: Clickable
    - type: InteractionOutline
    - type: Actions
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.45,-0.45,0.45,0.45"
          density: 60
          mask:
            - MachineMask
          layer:
            - MachineLayer
    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
    - type: InteractionPopup
      interactDelay: 0.2
      successChance: 0.8
      interactSuccessString: petting-success-generic
      interactFailureString: petting-failure-generic
      interactSuccessSound:
        path: /Audio/Effects/double_beep.ogg
    - type: CombatMode
      toggleMouseRotator: false
    - type: Damageable
    - type: Injurable
      damageContainer: Inorganic
    - type: Explosive
      #Misfits Change - use the structural-capable N14 explosion profile.
      explosionType: F14DefaultStructural
      maxIntensity: 4
      intensitySlope: 1
      totalIntensity: 10
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 600
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:ExplodeBehavior
        - trigger:
            !type:DamageTrigger
            damage: 300
          # TODO: Construction graph
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalGlassBreak
            - !type:ExplodeBehavior
            - !type:SpawnEntitiesBehavior
              spawn:
                SheetSteel1:
                  min: 3
                  max: 5
    - type: Gun
      fireRate: 6
      selectedMode: FullAuto
      availableModes:
        - FullAuto
      soundGunshot: /Audio/Weapons/Guns/Gunshots/gun_sentry.ogg
      useKey: false
    # TODO: Power ammo provider?
    - type: BallisticAmmoProvider
      proto: F14CartridgePistol10 
      capacity: 500
    - type: ProximityNPC # Misfits Add — sleep distant NPCs to reduce tick load
    - type: MobState # Misfits Add — compatibility with proximity system checks
    - type: HTN
      rootTask:
        task: F14TurretCompound
      blackboard:
        RotateSpeed: !type:Single
          3.141
        SoundTargetInLOS: !type:SoundPathSpecifier
          path: /Audio/Effects/double_beep.ogg
    - type: MouseRotator
      angleTolerance: 5
      rotationSpeed: 90
      simple4DirMode: false
    - type: NoRotateOnInteract
    - type: NoRotateOnMove
    - type: Input
      context: "human"

- type: entity
  parent: F14BaseWeaponTurret
