# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Battery/battery_guns.yml

- type: entity
  id: N14BaseWeaponPowerCell
  parent: BaseItem
  abstract: true
  components:
  - type: BatteryAmmoProvider
    proto: N14MFLaserRed
    fireCost: 50
  - type: Sprite
  - type: Item
    size: Large
  - type: AmmoCounter
  - type: Gun
    minAngle: 25
    maxAngle: 60
    angleIncrease: 4
    angleDecay: 16
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: PowerCellSlot
    cellSlotId: gun_magazine
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MisfitsMicrofusionCellRed
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - MisfitsMicrofusionCell
  - type: Appearance
  - type: StaticPrice
    price: 25
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  # - type: Craftable  # #Misfits Remove: Stalker14 crafting system

- type: entity
  id: N14BaseWeaponPowerCellSmall
  parent: N14BaseWeaponPowerCell
  abstract: true
  components:
  - type: BatteryAmmoProvider
    proto: N14MFLaserRed
    fireCost: 50
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/taser.rsi
    quickEquip: false
    slots:
    - Belt
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Gun
    availableModes:
    - Semiauto
    minAngle: 1
    maxAngle: 9
    angleIncrease: 0.5
    angleDecay: 4

- type: entity
