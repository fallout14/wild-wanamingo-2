# MARK: Pistols

- type: entity
  name: AEP-7 laser pistol
  parent: N14BaseWeaponPowerCellSmall
  id: N14WeaponLaserPistol
  description: A basic energy-based laser gun that fires concentrated beams of light.
  components:
  - type: BatteryAmmoProvider
    proto: N14MFLaserRed
    fireCost: 50
  - type: Tag
    tags:
    - Sidearm
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Battery/laser_pistol.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/Battery/laser_pistol.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: N14PowerCellSmall
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - N14PowerCellSmall
  - type: Item
    size: Small
    shape:
    - 0,0,1,1
    - 0,0,1,1
  - type: Gun
    fireRate: 2
    soundGunshot:
      collection: N14LaserPistolGunshot
  - type: EyeCursorOffset
    maxOffset: 2
    pvsIncrease: 0.2
  - type: StaticPrice
    price: 80

