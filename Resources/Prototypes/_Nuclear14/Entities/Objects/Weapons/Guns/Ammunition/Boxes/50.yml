# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Boxes/50.yml

- type: entity
  abstract: true
  parent: BaseItem
  id: F14BaseMagazineBox50
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - F14Cartridge50
        - F14Cartridge50HEIAP
    proto: F14Cartridge50
    capacity: 30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Boxes/50anti-material.rsi
    netsync: false
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: FoldableAmmoBox #Misfits Change /Add/: Empty cardboard ammo boxes can fold back into one cardboard sheet.

- type: entity
  parent: F14BaseMagazineBox50
  id: F14MagazineBox50
  name: ammunition box (.50 anti materiel)
  components:
  - type: BallisticAmmoProvider
    proto: F14Cartridge50
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]

- type: entity
  parent: F14BaseMagazineBox50
  id: F14MagazineBox50HEIAP
  name: ammunition box (.50 anti materiel)
  suffix: HEIAP
  components:
  - type: BallisticAmmoProvider
    proto: F14Cartridge50HEIAP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
