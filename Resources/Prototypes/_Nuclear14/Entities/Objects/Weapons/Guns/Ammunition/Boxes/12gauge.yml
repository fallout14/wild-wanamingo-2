# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Boxes/12gauge.yml

- type: entity
  abstract: true
  parent: BaseItem
  id: F14BaseMagazineBox12gauge
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - F14ShellShotgun12
    proto: F14ShellShotgun12
    capacity: 30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Boxes/12-gauge.rsi
    netsync: false
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: FoldableAmmoBox #Misfits Change /Add/: Empty cardboard ammo boxes can fold back into one cardboard sheet.

- type: entity
  parent: F14BaseMagazineBox12gauge
  id: F14MagazineBox12gauge
  name: ammunition box (12 gauge)
  components:
  - type: BallisticAmmoProvider
    proto: F14ShellShotgun12
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
