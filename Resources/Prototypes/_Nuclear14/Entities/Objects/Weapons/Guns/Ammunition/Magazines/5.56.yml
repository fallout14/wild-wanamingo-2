- type: entity
  id: F14BaseMagazine556Rifle
  name: "magazine (5.56mm)"
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - F14Magazine556Rifle
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - F14Cartridge556Rifle
    proto: F14Cartridge556Rifle
    capacity: 25
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/5.56/mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  # - type: Craftable  # #Misfits Remove: Stalker14 crafting system

