# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Magazines/5mm.yml

- type: entity
  id: F14BaseMagazine5mmMinigun
  name: minigun magazine (5mm)
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - F14MagazineMinigun5mm
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - F14CartridgePistol5
    capacity: 500 # #Burger - prior proposed round increase (was 200)
  - type: Item # #Burger - larger profile in bag to make up for capacity increase
    size: Large
    shape:
    - 0,0,2,2
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/5mm/mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance

- type: entity
  id: F14MagazineMinigun5mm
  name: minigun box (5mm)
  parent: F14BaseMagazine5mmMinigun
  components:
  - type: BallisticAmmoProvider
    proto: F14CartridgePistol5
