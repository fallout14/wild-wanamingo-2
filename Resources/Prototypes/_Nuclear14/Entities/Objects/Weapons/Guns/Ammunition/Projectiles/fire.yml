# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Projectiles/fire.yml

- type: entity
  id: N14BaseFire
  name: BaseFire
  description: This is fine.
  abstract: true
  components:
  - type: Reflective
  - type: FlyBySound
  - type: Clickable
  - type: Sprite
    noRot: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Projectiles/Flames.rsi
    layers:
    - state: flames
      shader: unshaded
  - type: Physics
    bodyType: Dynamic
    linearDamping: 0
    angularDamping: 0
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
      fly-by: &flybyfixture
        shape: !type:PhysShapeCircle
          radius: 1.5
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: False
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Heat: 5
    soundHit:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
  - type: PointLight
    enabled: true
    color: "#ff4300"
    radius: 2.0
    energy: 7.0
  - type: IgniteOnCollide
    fireStacks: 0.30
  - type: TimedDespawn
    lifetime: 10

- type: entity
  id: N14FireProjectile
  name: fire
  parent: N14BaseFire
  categories: [ HideSpawnMenu ]
  components:
  - type: IgniteOnCollide
    fireStacks: 0.40
  - type: TimedDespawn
    lifetime: 0.1
    

- type: entity
  id: N14FireProjectileShort
  parent: N14FireProjectile
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.05

# Visual-only flamer spew projectile — no damage, no ignite, just sprite + light.

- type: entity
  id: N14BaseFireExplosiveProjectile
  name: fire
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Heat: 1
  - type: PointLight
    enabled: true
    color: "#ff4300"
    radius: 2.0
    energy: 7.0
  - type: IgniteOnCollide
    fireStacks: 1
  - type: ExplodeOnTrigger
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: MisfitsDefaultStructural
    maxIntensity: 2 # max 30 per tile
    intensitySlope: 1
    totalIntensity: 1 # 60 total damage to distribute over tiles
    maxTileBreak: 1

- type: entity
  id: N14FireExplosive
  name: fire
  parent: N14BaseFireExplosiveProjectile
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Heat: 1
  - type: PointLight
    enabled: true
    color: "#ff4300"
    radius: 2.0
    energy: 7.0
  - type: IgniteOnCollide
    fireStacks: 0.15
