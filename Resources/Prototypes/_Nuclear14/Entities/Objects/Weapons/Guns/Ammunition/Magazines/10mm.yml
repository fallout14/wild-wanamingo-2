# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Magazines/10mm.yml

- type: entity
  id: F14BaseMagazine10mmPistol
  name: pistol magazine (10mm)
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - F14MagazinePistol10mm
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - F14CartridgePistol10
    capacity: 12
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/10mm/pistolmag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance

- type: entity
  id: F14MagazinePistol10mm
  name: pistol magazine (10mm)
  parent: F14BaseMagazine10mmPistol
  components:
  - type: BallisticAmmoProvider
    proto: F14CartridgePistol10

- type: entity
  id: F14BaseMagazine10mmSubMachineGun
  name: SMG magazine (10mm)
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - F14MagazineSMG10mm
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - F14CartridgePistol10
    capacity: 35
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/10mm/smgmag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  id: F14MagazineSMG10mm
  name: SMG magazine (10mm)
  parent: F14BaseMagazine10mmSubMachineGun
  components:
  - type: Sprite # Forge-Change
    scale: 0.70, 0.70
  - type: BallisticAmmoProvider
    proto: F14CartridgePistol10
