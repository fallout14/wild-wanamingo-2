# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Magazines/50.yml

- type: entity
  id: F14BaseMagazine50AMR
  name: "magazine (.50 BMG)"
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - F14Magazine50AMR
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - F14Cartridge50
        - F14Cartridge50HEIAP
    proto: F14Cartridge50
    capacity: 5
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Item
    storedRotation: -90
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/50/amrmag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  id: F14Magazine50AMR
  name: "magazine (.50 BMG)"
  parent: F14BaseMagazine50AMR
  components:
  - type: BallisticAmmoProvider
    proto: F14Cartridge50

- type: entity
  id: F14Magazine50AMRHEIAP
  name: "magazine (.50 BMG HEIAP)"
  parent: F14BaseMagazine50AMR
  suffix: HEIAP
  components:
  - type: BallisticAmmoProvider
    proto: F14Cartridge50HEIAP
