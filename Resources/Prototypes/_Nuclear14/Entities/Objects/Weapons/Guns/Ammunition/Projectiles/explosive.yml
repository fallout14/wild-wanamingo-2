# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Projectiles/explosive.yml

- type: entity
  id: N14BaseGrenadeProjectile
  name: grenade
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 6
  - type: ExplodeOnTrigger
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: MisfitsDefaultStructural
    maxIntensity: 4 # max 30 per tile
    intensitySlope: 1
    totalIntensity: 3 # 60 total damage to distribute over tiles
    maxTileBreak: 0

- type: entity
  id: N14GrenadeProjectile
  name: grenade
  parent: N14BaseGrenadeProjectile
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 0
  - type: ExplodeOnTrigger
  - type: Explosive
    # Misfits Change - retain the 100-damage cap but broaden the blast to
    # approximately 2.5 tiles, compensating for HE having no fragmentation.
    explosionType: Misfits40mmHE
    maxIntensity: 8
    intensitySlope: 4
    totalIntensity: 65
    maxTileBreak: 0

- type: entity
  id: N14FireGrenadeProjectile
  name: fire grenade
  parent: N14BaseGrenadeProjectile
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 0
  - type: ExplodeOnTrigger
  - type: Explosive
    # Misfits Change - applies four fire stacks over a wider radius without
    # reaching the explosion system's knockdown threshold.
    explosionType: Misfits40mmIncendiary
    maxIntensity: 2
    intensitySlope: 1
    totalIntensity: 28
    maxTileBreak: 0

- type: entity
  id: N14BoilingWaterShot
  parent: [ SolutionVapor, SolutionSmall ]
  name: boiling water
  categories: [ HideSpawnMenu ]
  components:
  - type: Clickable
  - type: Physics
    bodyType: Dynamic
    linearDamping: 0
    angularDamping: 0
  - type: TimedDespawn
    lifetime: 10
  - type: Projectile
    damage:
      types:
        Heat: 10 #it's just boiling water, bro
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/water_shot.rsi
    layers:
    - state: icon
      map: ["enum.VaporVisualLayers.Base"]
  - type: Ammo
    muzzleFlash: null
  - type: Solution
    solution:
      maxVol: 15
      reagents:
      - ReagentId: Water
        Quantity: 15
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.10,-0.30,0.10,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Vapor
    active: true
  - type: Appearance
  - type: VaporVisuals
#Missiles

- type: entity
  id: N14ProjectileMissile
  name: Missile
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  description: An explosive missile.
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 0
  - type: ExplodeOnTrigger
  - type: Explosive
    # Misfits Change - lethal 220-damage center with a broad three-tile
    # knockdown radius supplied by the existing explosion crowd control.
    explosionType: MisfitsMissile
    maxIntensity: 22
    intensitySlope: 6
    # 310 total intensity is enough for the curve to reach its 22-point cap;
    # damage is 10 per intensity, so the epicenter actually reaches 220.
    totalIntensity: 310
    maxTileBreak: 0
