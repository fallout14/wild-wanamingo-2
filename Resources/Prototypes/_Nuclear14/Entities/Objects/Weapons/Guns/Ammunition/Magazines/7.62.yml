# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Magazines/7.62.yml

- type: entity
  id: N14BaseMagazine762Rifle
  name: "magazine (7.62mm)"
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - N14Magazine762Rifle
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - N14Cartridge762Rifle
    proto: N14Cartridge762Rifle
    capacity: 30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/7.62/mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  id: N14Magazine762Rifle
  name: "magazine (7.62mm)"
  parent: N14BaseMagazine762Rifle
  components:
  - type: BallisticAmmoProvider
    proto: N14Cartridge762Rifle

- type: entity
  id: N14Magazine762AmmoBelt
  name: "ammo belt (7.62mm)"
  parent: N14BaseMagazine762Rifle
  components:
  - type: Tag
    tags:
      - N14Magazine762Belt
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - N14Cartridge762Rifle
    proto: N14Cartridge762Rifle
    capacity: 100
  - type: Item # Forge-Change
    size: Normal
    shape:
    - 0,0,1,1
    - 0,1,0,1
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/7.62/belt.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false

- type: entity
  id: N14Magazine762AmmoShort
  name: "short magazine (7.62mm)"
  parent: N14BaseMagazine762Rifle
  components:
  - type: Tag
    tags:
      - N14Magazine762Short
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - N14Cartridge762Rifle
    proto: N14Cartridge762Rifle
    capacity: 20
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/7.62/mag2.rsi
