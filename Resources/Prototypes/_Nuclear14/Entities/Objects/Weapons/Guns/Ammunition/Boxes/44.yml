# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Boxes/44.yml

- type: entity
  abstract: true
  parent: BaseItem
  id: N14BaseMagazineBox44
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - N14Cartridge44Magnum
    proto: N14Cartridge44Magnum
    capacity: 32
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Boxes/44.rsi
    netsync: false
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: FoldableAmmoBox #Misfits Change /Add/: Empty cardboard ammo boxes can fold back into one cardboard sheet.

- type: entity
  parent: N14BaseMagazineBox44
  id: N14MagazineBox44
  name: ammunition box (.44)
  components:
  - type: BallisticAmmoProvider
    proto: N14Cartridge44Magnum
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
