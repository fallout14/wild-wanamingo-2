# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Magazines/308.yml

- type: entity
  id: N14BaseMagazine308Rifle
  name: "magazine (308.)"
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - N14Magazine308Rifle
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - N14Cartridge308Rifle
    proto: N14Cartridge308Rifle
    capacity: 21
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/308/mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  id: N14Magazine308Rifle
  name: "magazine (.308)"
  parent: N14BaseMagazine308Rifle
  components:
  - type: BallisticAmmoProvider
    proto: N14Cartridge308Rifle

- type: entity
  id: N14Magazine308RifleLong
  name: "long magazine (.308)"
  parent: N14BaseMagazine308Rifle
  components:
  - type: Tag
    tags:
      - N14Magazine308RifleLong
  - type: BallisticAmmoProvider
    proto: N14Cartridge308Rifle
    capacity: 40
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/308/mag3.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  id: N14ClipMagazine308Rifle
  name: "clip (.308)"
  description: A 8-round clip for .308 rifles.
  parent: N14BaseMagazine308Rifle
  components:
  - type: Tag
    tags:
      - N14Clip308Rifle
  - type: BallisticAmmoProvider
    proto: N14Cartridge308Rifle
    capacity: 8
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/308/mag2.rsi
  - type: Item
    size: Tiny
    shape:
    - 0,0,0,0

- type: entity
  id: N14Magazine308M60Box
  name: "M60 Box (.308)"
  parent: N14BaseMagazine308Rifle
  components:
  - type: Tag
    tags:
      - N14Magazine308M60Box
  - type: Item # Forge-Change
    size: Normal
    shape:
    - 0,0,1,1
    - 0,1,0,1
  - type: BallisticAmmoProvider
    proto: N14Cartridge308Rifle
    capacity: 50
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/308/mag4.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]


