- type: entity
  id: F14BaseMagazine127Pistol
  name: pistol magazine (12.7mm)
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - F14MagazinePistol12mm
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - F14CartridgePistol127
    capacity: 10
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/12.7/pistolmag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance

- type: entity
