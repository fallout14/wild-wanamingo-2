# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Magazines/12gauge.yml

- type: entity
  id: F14BaseMagazineShotgun12
  name: ammo drum (12 gauge shells)
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
    - F14MagazineShotgun12
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - F14ShellShotgun12
    capacity: 8
    soundRack:
      path: /Audio/Weapons/Guns/Cock/smg_cock.ogg
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/12gauge/mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  id: F14MagazineShotgun12
  name: ammo drum (12 gauge shells)
  parent: F14BaseMagazineShotgun12
  components:
  - type: BallisticAmmoProvider
    proto: F14ShellShotgun12
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
