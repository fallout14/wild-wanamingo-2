- type: entity
  abstract: true
  parent: BaseItem
  id: N14BaseMagazineBox762Rifle
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - N14Cartridge762Rifle
    proto: N14Cartridge762ifle
    capacity: 60
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Boxes/7-62.rsi
    netsync: false
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: FoldableAmmoBox #Misfits Change /Add/: Empty cardboard ammo boxes can fold back into one cardboard sheet.

- type: entity
  parent: N14BaseMagazineBox762Rifle
  id: N14MagazineBox762
  name: ammunition box (7.62mm)
  components:
  - type: BallisticAmmoProvider
    proto: N14Cartridge762Rifle
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
