# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Boxes/20gauge.yml

- type: entity
  abstract: true
  parent: BaseItem
  id: N14BaseMagazineBox20gauge
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - N14ShellShotgun20
    proto: N14ShellShotgun20
    capacity: 30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Boxes/20-gauge.rsi
    netsync: false
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: FoldableAmmoBox #Misfits Change /Add/: Empty cardboard ammo boxes can fold back into one cardboard sheet.

- type: entity
  parent: N14BaseMagazineBox20gauge
  id: N14MagazineBox20gauge
  name: ammunition box (20 gauge)
  components:
  - type: BallisticAmmoProvider
    proto: N14ShellShotgun20
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
