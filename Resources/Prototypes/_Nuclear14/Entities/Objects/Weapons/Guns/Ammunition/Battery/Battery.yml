# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Battery/Battery.yml

- type: entity
  name: microfusion cell
  description: A microfusion cell, typically used as ammunition for large energy weapons.
  id: F14BasePowerCell
  abstract: true
  parent: BaseItem
  components:
  - type: Battery
    pricePerJoule: 0.015
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: F14DefaultStructural
    maxIntensity: 200
    intensitySlope: 1.5
  - type: Tag
    tags:
      - F14MicrofusionCell
      - F14AmmoCell
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/microfusion.rsi
  - type: Solution
    id: battery
    solution:
      maxVol: 5
  - type: InjectableSolution
    solution: battery
  - type: DrawableSolution
    solution: battery
  - type: Extractable
    juiceSolution:
      reagents:
        - ReagentId: Zinc
          Quantity: 5
  - type: Appearance
  - type: PowerCell
  - type: BatteryVisuals
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerCellVisualLayers.Unshaded:
          Full: {visible: true, state: o2}
          Neither: {visible: true, state: o1}
          Empty: {visible: false}
  - type: Riggable
  # - type: Craftable  # #Misfits Remove: Stalker14 crafting system

- type: entity
  name: fusion core
  # WW: Mojave Sun 13 sprite. Feeds the fusion core generators (FusionCoreGenerator); power armor later.
  description: A heavy pre-war fusion core. Slots into fusion core generators and heavy energy weapons. Once it's spent, it's spent.
  id: F14FusionCore
  suffix: Full
  parent: F14BasePowerCell
  components:
  - type: Sprite
    sprite: MojaveSun/Objects/Power/fusion_core.rsi
    layers:
    - state: icon
      map: [ "enum.PowerCellVisualLayers.Base" ]
  - type: Item
    size: Normal
    sprite: MojaveSun/Objects/Power/fusion_core.rsi
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerCellVisualLayers.Base:
          Full: { state: icon }
          Neither: { state: icon }
          Empty: { state: icon-dead }
  - type: BatterySpentVisuals # WW Change - looks spent below 1% (a gun can't drain it to exactly zero)
  - type: Tag
    tags:
      - F14FusionCore
      - F14AmmoCell
  - type: Battery
    maxCharge: 5000
    startingCharge: 5000

- type: entity
  id: F14FusionCoreEmpty
  parent: F14FusionCore
  suffix: Empty
  components:
  - type: Battery
    maxCharge: 5000
    startingCharge: 0

- type: entity
  name: energy cell
  # WW: Mojave Sun 13 sprite. The only small energy cell; pulse pistols take it too.
  description: An energy cell, typically used as ammunition for small-arms energy weapons.
  id: F14PowerCellSmall
  suffix: Full
  parent: F14BasePowerCell
  components:
  - type: Sprite
    sprite: MojaveSun/Objects/Weapons/Guns/Ammunition/energy_cell.rsi
    layers:
    - state: icon
  - type: Item
    sprite: MojaveSun/Objects/Weapons/Guns/Ammunition/energy_cell.rsi
  - type: GenericVisualizer # the MS13 sprite has no charge overlay
    visuals: {}
  - type: Tag
    tags:
      - F14PowerCellSmall
      - F14AmmoCell
  - type: Battery
    maxCharge: 600
    startingCharge: 600

- type: entity
  name: base plasma cell
  description: A small green glowing cartridge, commonly used as ammo for any kind of plasma weapon.
  id: F14BasePlasmaCell
  abstract: true
  parent: BaseItem
  components:
  - type: Battery
    pricePerJoule: 0.015
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: F14DefaultStructural
    maxIntensity: 200
    intensitySlope: 1.5
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/plasma.rsi
  - type: Solution
    id: battery
    solution:
      maxVol: 5
  - type: InjectableSolution
    solution: battery
  - type: DrawableSolution
    solution: battery
  - type: Extractable
    juiceSolution:
      reagents:
        - ReagentId: Zinc
          Quantity: 5
  - type: Appearance
  - type: PowerCell
  - type: BatteryVisuals
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerCellVisualLayers.Unshaded:
          Full: {visible: true, state: o2}
          Neither: {visible: true, state: o1}
          Empty: {visible: false}
  - type: Riggable

- type: entity
  name: plasma cartridge
  description: A small green glowing cartridge, commonly used as ammo for any kind of plasma weapon.
  id: F14PlasmaCartridge
  suffix: Full
  parent: F14BasePlasmaCell
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/plasma.rsi
    layers:
      - map: [ "enum.PowerCellVisualLayers.Base" ]
        state: empty
      - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
        state: o2
        shader: unshaded
  - type: Tag
    tags:
      - F14PlasmaCartridge
      - F14AmmoCell
  - type: Battery
    maxCharge: 1800
    startingCharge: 1800

