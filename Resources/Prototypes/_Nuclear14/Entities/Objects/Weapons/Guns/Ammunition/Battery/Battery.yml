# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Battery/Battery.yml

- type: entity
  name: microfusion cell
  description: A microfusion cell, typically used as ammunition for large energy weapons.
  id: N14BasePowerCell
  abstract: true
  parent: BaseItem
  components:
  - type: Battery
    pricePerJoule: 0.015
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: N14DefaultStructural
    maxIntensity: 200
    intensitySlope: 1.5
  - type: Tag
    tags:
      - N14MicrofusionCell
      - N14AmmoCell
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/microfusion.rsi
  - type: Solution
    id: battery
    solution:
      maxVol: 5
  - type: InjectableSolution
    solution: battery
  - type: DrawableSolution
    solution: battery
  - type: Extractable
    juiceSolution:
      reagents:
        - ReagentId: Zinc
          Quantity: 5
  - type: Appearance
  - type: PowerCell
  - type: BatteryVisuals
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerCellVisualLayers.Unshaded:
          Full: {visible: true, state: o2}
          Neither: {visible: true, state: o1}
          Empty: {visible: false}
  - type: Riggable
  # - type: Craftable  # #Misfits Remove: Stalker14 crafting system

- type: entity
  name: microfusion cell
  description: A standard microfusion cell used as ammunition for energy weapons. The weapon's internal optics determine beam color and output — the cell simply provides charge.
  id: N14MicrofusionCell
  suffix: Full
  parent: N14BasePowerCell
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/microfusion.rsi
    layers:
      - map: [ "enum.PowerCellVisualLayers.Base" ]
        state: empty
      - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
        state: o2
        shader: unshaded
  - type: Battery
    maxCharge: 1200
    startingCharge: 1200

- type: entity
  name: microfusion cell (red)
  description: A standard microfusion cell calibrated to emit a red laser beam.
  id: N14MicrofusionCellRed
  parent: N14MicrofusionCell
  suffix: Full

- type: entity
  name: microfusion cell (green)
  description: A tuned microfusion cell calibrated to emit a green laser beam.
  id: N14MicrofusionCellGreen
  parent: N14MicrofusionCell
  suffix: Full

- type: entity
  name: microfusion cell (blue)
  description: An advanced microfusion cell calibrated to emit a blue laser beam.
  id: N14MicrofusionCellBlue
  parent: N14MicrofusionCell
  suffix: Full

- type: entity
  name: microfusion cell (violet)
  description: An experimental microfusion cell calibrated to emit a violet laser beam.
  id: N14MicrofusionCellViolet
  parent: N14MicrofusionCell
  suffix: Full

#MARK: Fusion Core — single consolidated type
# #Misfits Change - Consolidated from 4 colored variants into one generic fusion core.
# Only the Laser Gatling accepts these (N14FusionCore tag). Weapon controls beam via override.
# 5000 charge / 50 fireCost = 100 shots. Intended for heavy sustained-fire weapons.

- type: entity
  name: fusion core
  description: A heavy fusion core containing concentrated fusion fuel. Provides massive charge reserves for heavy energy weapons. Beam characteristics are determined by the weapon's optics.
  id: N14FusionCore
  suffix: Full
  parent: N14BasePowerCell
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/fusion.rsi
    layers:
      - map: [ "enum.PowerCellVisualLayers.Base" ]
        state: empty
      - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
        state: o2
        shader: unshaded
  - type: Tag
    tags:
      - N14FusionCore
      - N14AmmoCell
  - type: Item
    size: Normal
  - type: Battery
    maxCharge: 5000
    startingCharge: 5000

- type: entity
  id: N14FusionCoreRed
  parent: N14FusionCore
  suffix: Full

- type: entity
  id: N14FusionCoreGreen
  parent: N14FusionCore
  suffix: Full

- type: entity
  id: N14FusionCoreBlue
  parent: N14FusionCore
  suffix: Full

- type: entity
  id: N14FusionCoreViolet
  parent: N14FusionCore
  suffix: Full

#MARK: Electron Charge Pack — single player-facing type
# The pack only provides charge. Weapon profiles determine damage and beam color.
# Pulse weapons deal Heat + Shock damage (effective against mechanical targets).

- type: entity
  name: electron charge pack
  description: An electron charge pack used as ammunition for pulse weapons. The weapon's emitter array determines pulse characteristics — the pack simply provides charge.
  id: N14ElectronChargePack
  suffix: Full
  parent: N14BasePowerCell
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/ECP.rsi
    layers:
      - map: [ "enum.PowerCellVisualLayers.Base" ]
        state: empty
        scale: 0.5, 0.5
      - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
        state: o2
        scale: 0.5, 0.5
        shader: unshaded
  - type: Tag
    tags:
      - N14ElectronChargePack
      - N14AmmoCell
  - type: Battery
    maxCharge: 1600
    startingCharge: 1600

- type: entity
  name: electron charge pack (red)
  description: A standard electron charge pack calibrated for red pulse discharge.
  id: N14ElectronChargePackRed
  parent: N14ElectronChargePack
  suffix: Full

- type: entity
  name: electron charge pack (green)
  description: A tuned electron charge pack calibrated for green pulse discharge.
  id: N14ElectronChargePackGreen
  parent: N14ElectronChargePack
  suffix: Full

- type: entity
  name: electron charge pack (blue)
  description: An advanced electron charge pack calibrated for blue pulse discharge.
  id: N14ElectronChargePackBlue
  parent: N14ElectronChargePack
  suffix: Full

- type: entity
  name: electron charge pack (violet)
  description: An experimental electron charge pack calibrated for violet pulse discharge.
  id: N14ElectronChargePackViolet
  parent: N14ElectronChargePack
  suffix: Full

