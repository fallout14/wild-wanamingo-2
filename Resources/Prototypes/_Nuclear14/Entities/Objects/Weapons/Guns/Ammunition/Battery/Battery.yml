# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Battery/Battery.yml

- type: entity
  name: microfusion cell
  description: A microfusion cell, typically used as ammunition for large energy weapons.
  id: N14BasePowerCell
  abstract: true
  parent: BaseItem
  components:
  - type: Battery
    pricePerJoule: 0.015
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: MisfitsDefaultStructural
    maxIntensity: 200
    intensitySlope: 1.5
  - type: Tag
    tags:
      - MisfitsMicrofusionCell
      - N14AmmoCell
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/microfusion.rsi
  - type: Solution
    id: battery
    solution:
      maxVol: 5
  - type: InjectableSolution
    solution: battery
  - type: DrawableSolution
    solution: battery
  - type: Extractable
    juiceSolution:
      reagents:
        - ReagentId: Zinc
          Quantity: 5
  - type: Appearance
  - type: PowerCell
  - type: BatteryVisuals
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerCellVisualLayers.Unshaded:
          Full: {visible: true, state: o2}
          Neither: {visible: true, state: o1}
          Empty: {visible: false}
  - type: Riggable
  # - type: Craftable  # #Misfits Remove: Stalker14 crafting system

- type: entity
  name: fusion core
  description: A heavy fusion core containing concentrated fusion fuel. Provides massive charge reserves for heavy energy weapons. Beam characteristics are determined by the weapon's optics.
  id: N14FusionCore
  suffix: Full
  parent: N14BasePowerCell
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/fusion.rsi
    layers:
      - map: [ "enum.PowerCellVisualLayers.Base" ]
        state: empty
      - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
        state: o2
        shader: unshaded
  - type: Tag
    tags:
      - N14FusionCore
      - N14AmmoCell
  - type: Item
    size: Normal
  - type: Battery
    maxCharge: 5000
    startingCharge: 5000

- type: entity
  name: energy cell
  description: An energy cell, typically used as ammunition for small-arms energy weapons.
  id: N14PowerCellSmall
  suffix: Full
  parent: N14BasePowerCell
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/EC.rsi
    layers:
      - map: [ "enum.PowerCellVisualLayers.Base" ]
        state: empty
        scale: 0.5, 0.5
      - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
        state: o2
        shader: unshaded
        scale: 0.5, 0.5
  - type: Tag
    tags:
      - N14PowerCellSmall
      - N14AmmoCell
  - type: Battery
    maxCharge: 600
    startingCharge: 600

- type: entity
  name: base plasma cell
  description: A small green glowing cartridge, commonly used as ammo for any kind of plasma weapon.
  id: N14BasePlasmaCell
  abstract: true
  parent: BaseItem
  components:
  - type: Battery
    pricePerJoule: 0.015
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: MisfitsDefaultStructural
    maxIntensity: 200
    intensitySlope: 1.5
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/plasma.rsi
  - type: Solution
    id: battery
    solution:
      maxVol: 5
  - type: InjectableSolution
    solution: battery
  - type: DrawableSolution
    solution: battery
  - type: Extractable
    juiceSolution:
      reagents:
        - ReagentId: Zinc
          Quantity: 5
  - type: Appearance
  - type: PowerCell
  - type: BatteryVisuals
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerCellVisualLayers.Unshaded:
          Full: {visible: true, state: o2}
          Neither: {visible: true, state: o1}
          Empty: {visible: false}
  - type: Riggable

- type: entity
  name: plasma cartridge
  description: A small green glowing cartridge, commonly used as ammo for any kind of plasma weapon.
  id: N14PlasmaCartridge
  suffix: Full
  parent: N14BasePlasmaCell
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/plasma.rsi
    layers:
      - map: [ "enum.PowerCellVisualLayers.Base" ]
        state: empty
      - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
        state: o2
        shader: unshaded
  - type: Tag
    tags:
      - N14PlasmaCartridge
      - N14AmmoCell
  - type: Battery
    maxCharge: 1800
    startingCharge: 1800

