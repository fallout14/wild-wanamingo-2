- type: entity
  name: 9mm Pistol
  parent: F14BaseWeaponPistol
  id: F14WeaponPistol9mm
  description: The cheap and ubiquitous sidearm, chambered in 9mm ammo.
  components:
  - type: ContainerContainer  # spawn state
    containers:
      gun_magazine: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      gun_chamber: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      weapon_muzzle: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: FirearmAttachmentHost
    muzzleSlot:
      name: Suppressor
      priority: 3
      insertOnInteract: true
      ejectOnInteract: false
      ejectOnUse: false
      disableEject: true
      whitelist:
        components:
        - SuppressorAttachment
  - type: Tag
    tags:
    - Sidearm
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Pistols/9mm.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: Nuclear14/Objects/Weapons/Guns/Pistols/9mm.rsi
  - type: Gun
    fireRate: 5
    soundGunshot:
      collection: F14Pistol9mmGunshot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: F14MagazinePistol9mm
        whitelist:
          tags:
            - F14MagazinePistol9mm
      gun_chamber:
        name: Chamber
        startingItem: F14CartridgePistol9
        priority: 1
        whitelist:
          tags:
            - F14CartridgePistol9
  - type: StaticPrice
    price: 10

