# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Melee/sports.yml

- type: entity
  name: baseball bat
  parent: BaseItem
  id: F14BaseBallBat
  description: A robust baseball bat.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/baseball_bat.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 20
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 15
  - type: Item
    size: Large
  - type: Tool
    qualities:
    - Rolling
    speedModifier: 0.75 # a bit unwieldly but does the job
  - type: Clothing
    quickEquip: false
    slots:
    - back
  - type: Construction
    graph: WoodenBat
    node: bat
  - type: UseDelay
    delay: 1
  - type: Tag
    tags:
    - BaseballBat
  - type: StaticPrice
    price: 0

- type: entity
  name: pool cue
  parent: BaseItem
  id: F14PoolCue
  description: A pool cue used for hitting balls, usually the ones on pool tables, but also occasionally your enemy's.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Melee/pool_cue.rsi
    state: icon
  - type: Tag
    tags:
    - Spear
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
            - -0.40,-0.30
            - -0.30,-0.40
            - 0.40,0.30
            - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.7
    damage:
      types:
        Blunt: 10
    angle: 0
    animation: WeaponArcThrust
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 15
  - type: Item
    size: Large
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Melee/sledgehammer.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: StaticPrice
    price: 0

- type: entity
  name: golf club
  parent: BaseItem
  id: F14GolfClub
  description: A tool used for a pointless old-world sport, now used as an instrument of destruction.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Melee/golf_club.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.85
    damage:
      types:
        Blunt: 5
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 25
  - type: Item
    size: Large
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Melee/golf_club.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: StaticPrice
    price: 0
