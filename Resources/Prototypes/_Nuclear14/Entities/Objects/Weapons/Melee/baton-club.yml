# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Melee/baton-club.yml

- type: entity
  name: police baton
  description: STOP RESISTING!
  parent: BaseItem
  id: F14PoliceBaton
  components:
  - type: StaminaDamageOnHit
    damage: 10
  - type: StaminaDamageOnCollide
    damage: 10
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 8
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Melee/policebaton.rsi
    state: icon
  - type: Item
    size: Normal
  - type: Tag
    tags:
    - F14PoliceBaton # #Cythisiax Added - tag so security belts can whitelist the baton
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Melee/policebaton.rsi
    quickEquip: false
    slots:
    - belt
    - suitStorage
  - type: StaticPrice
    price: 8 # Forge-Change

- type: entity
  name: tribal club
  parent: BaseItem
  id: F14TribalClub
  components:
  - type: MeleeWeapon
