# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Melee/spear.yml

- type: entity
  name: throwing spear
  parent: BaseItem
  id: F14BaseThrowingSpear
  description: Definition of a classic. Keeping murder affordable since 200,000 BCE.
  components:
  - type: EmbeddableProjectile
    offset: -0.15,-0.15 # WW Change - MS13 spear art points down-left (N14 pointed up-right)
  - type: ThrowingAngle
    angle: 45 # WW Change - MS13 art faces the other way
  - type: Tag
    tags:
    - Spear
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
            - -0.40,-0.30
            - -0.30,-0.40
            - 0.40,0.30
            - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sprite # WW Change - MS13 sprites (no poison fill overlay in MS13 art)
    sprite: MojaveSun/Objects/Weapons/Melee/spear_throwing.rsi
    layers:
    - state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 45 # WW Change - MS13 art faces the other way
    damage:
      types:
        Piercing: 10
        Slash: 2
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 34
        Slash: 7
  - type: Item
    size: Large
    sprite: MojaveSun/Objects/Weapons/Melee/spear_throwing.rsi
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: Solution
    id: melee
    solution:
      maxVol: 10
  - type: MeleeChemicalInjector
    solution: melee
  - type: RefillableSolution
    solution: melee
  - type: InjectableSolution
    solution: melee
  - type: SolutionInjectOnEmbed
    transferAmount: 5
    solution: melee
  - type: SolutionTransfer
    maxTransferAmount: 2
  - type: DamageOnLand
    damage:
      types:
        Blunt: 5
  - type: UseDelay
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: spear
  - type: StaticPrice
    price: 30

