- type: entity
  name: NCR battle flag
  parent: F14WastelandSpear
  id: F14WastelandFlagSpear
  description: A long spear with an NCR flag tied on the end, only the most loyal soldiers carry these to boost the morale.
  components:
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Melee/flagspear.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: Tag
    tags:
    - Spear
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Melee/flagspear.rsi
    netsync: false
    layers: # WW Change - own layers/in-hands; the parent spear now uses the MS13 sprite
    - state: spear
  - type: Item
    size: Large
    sprite: Nuclear14/Objects/Weapons/Melee/flagspear.rsi
  # WW Change - N14 art points up-right; the parent spear now uses MS13 art, which points the other way
  - type: ThrowingAngle
    angle: 225
  - type: EmbeddableProjectile
    offset: 0.15,0.15
  - type: MeleeWeapon
    wideAnimationRotation: -135

