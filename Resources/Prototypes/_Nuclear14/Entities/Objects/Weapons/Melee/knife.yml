- type: entity
  name: brass Knife
  parent: [F14BaseKnife, F14CombatKnife]
  id: F14BrassKnife
  description: Homemade brass knife with a cross-guard.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Melee/brass_knife.rsi
    state: icon
  - type: Item
    sprite: Nuclear14/Objects/Weapons/Melee/brass_knife.rsi
  - type: StaticPrice
    price: 20
