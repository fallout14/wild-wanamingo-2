# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Melee/knife.yml

- type: entity
  parent: BaseItem
  id: F14BaseKnife
  abstract: true
  components:
  - type: Tag
    tags:
    - Knife
  - type: Execution
    doAfterDuration: 4.0
  - type: Utensil
    types:
      - Knife
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.8
    damage:
      types:
        Slash: 8
        Piercing: 4
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Sprite
  - type: Item
    size: Small
  - type: Tool
    qualities:
      - Slicing
    useSound:
      path: /Audio/Items/Culinary/chop.ogg

- type: entity
  name: kitchen knife
  parent: F14BaseKnife
  id: F14KitchenKnifeBase
  description: A general purpose chef's knife. Good for preparing food before and after it's alive.
  components:
  - type: Tag
    tags:
    - Knife
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Melee/kitchen_knife.rsi
    state: icon
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 14
        Piercing: 6
  - type: Item
    sprite: Nuclear14/Objects/Weapons/Melee/kitchen_knife.rsi
  - type: DisarmMalus
    malus: 0.225
  - type: StaticPrice
    price: 0

- type: entity
  name: butcher's cleaver
  parent: F14BaseKnife
  id: F14ButchersCleaver
  description: "A huge blade used for hackin', whackin', and choppin' up meat."
  components:
  - type: Tag
    tags:
    - Knife
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Melee/cleaver.rsi
    state: butch
  - type: MeleeWeapon
    attackRate: 1
    damage:
      types:
        Slash: 20
        Blunt: 2
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 18
        Blunt: 2
  - type: Item
    sprite: Nuclear14/Objects/Weapons/Melee/cleaver.rsi
  - type: DisarmMalus
    malus: 0.225
  - type: StaticPrice
    price: 0

- type: entity
  name: combat knife
  parent: F14BaseKnife
  id: F14CombatKnife
  description: A deadly serrated knife intended for melee confrontations.
  components:
  - type: Tag
    tags:
    - CombatKnife
    - Knife
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Melee/combat_knife.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.8
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 10
        Piercing: 10
  - type: Item
    sprite: Nuclear14/Objects/Weapons/Melee/combat_knife.rsi
  - type: DisarmMalus
    malus: 0.225
  - type: StaticPrice
    price: 30

- type: entity
  name: tribal knife
  parent: F14BaseKnife
  id: F14TribalKnife
  description: A deadly knife intended for melee confrontations, this one is handmade by tribals.
  components:
  - type: Tag
    tags:
    - CombatKnife
    - Knife
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Melee/tribalknife.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.8
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 12
        Piercing: 8
  - type: Item
    sprite: Nuclear14/Objects/Weapons/Melee/tribalknife.rsi
  - type: DisarmMalus
    malus: 0.225
  - type: StaticPrice
