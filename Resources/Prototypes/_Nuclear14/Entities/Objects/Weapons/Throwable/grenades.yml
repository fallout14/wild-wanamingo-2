# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Throwable/grenades.yml

- type: entity
  abstract: true
  parent: BaseItem
  id: N14IgnitableGrenadeBase
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Grenades/Dynamite.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: Item
    size: Small
  - type: Clothing
    quickEquip: false
    slots:
    - Belt
  - type: Appearance
  - type: AnimationPlayer
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        enum.ConstructionVisuals.Layer:
          Primed: { state: primed }
          Unprimed: { state: icon }
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: ExplodeOnTrigger
  - type: Flammable
    fireSpread: false
    canResistFire: false
    alwaysCombustible: true
    canExtinguish: false 
    damage:
      types:
        Heat: 1
  - type: FireVisuals
    sprite: Nuclear14/Objects/Weapons/Grenades/Dynamite.rsi
    normalState: primed

- type: entity
  name: dynamite
  description: A stick of dynamite that produces a broad, powerful pressure wave without fragmentation.
  parent: N14IgnitableGrenadeBase
  id: N14Dynamite
  components:
  - type: Explosive
    # #Misfits Change - broad pure blast: 6 intensity produces 60 blunt and 30
    # heat at the epicenter, with no piercing or spawned fragmentation.
    explosionType: MisfitsDynamite
    maxIntensity: 6
    intensitySlope: 5
    totalIntensity: 100
    canCreateVacuum: false
    maxTileBreak: 0
    tileBreakScale: 0
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg" 
    - trigger:
        !type:DamageTrigger
        damage: 4
      behaviors:
      - !type:PlaySoundBehavior
        sound: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg" 
    - trigger:
        !type:DamageTrigger
        damage: 7
      behaviors:
      - !type:PlaySoundBehavior
        sound: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg" 
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg" 
    - trigger:
        !type:DamageTrigger
        damage: 13
      behaviors:
      - !type:PlaySoundBehavior
        sound: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg" 
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:TriggerBehavior

    

- type: entity
  name: Baseball grenade
  description: A hollowed-out baseball filled with explosives. Prime it in hand before throwing to detonate on impact.
  parent: MisfitsBaseImpactGrenade
  id: N14BaseballNade
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Grenades/Baseballnade.rsi
    layers:
    - state: icon
  - type: ExplodeOnTrigger
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: MisfitsDefaultStructural
    maxIntensity: 2
    intensitySlope: 10
    totalIntensity: 20
    canCreateVacuum: false
    maxTileBreak: 0
    tileBreakScale: 0

- type: entity
  name: Tin-nade
  description: An improvised grenade whose thin casing scatters a small amount of weak shrapnel.
  parent: GrenadeBase
  id: N14TinNade
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Grenades/TincanNade.rsi
  # #Misfits Add - 10 x 15-piercing fragments. This is deliberately far below
  # the offensive frag grenade's 20 x 45-piercing military fragmentation.
  - type: ProjectileGrenade
    triggerKey: trigger
    fillPrototype: MisfitsPelletTinFragment
    capacity: 10
  - type: SpawnOnTrigger
    proto: MisfitsGrenadeTinExplosion
  - type: TriggerOnUse
    keyOut: prime
  - type: TimerTrigger
    keysIn: [ prime ]
    keyOut: trigger
    examinable: false
    delay: 1
    beepSound:
      path: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg"
      params:
        volume: 4
  - type: RandomTimerTrigger
    min: 1
    max: 5
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container

- type: entity
  name: Nuka-nade
  description: An improvised Nuka-Cola grenade that erupts in a compact burst of Quantum-blue caustic plasma.
  parent: GrenadeBase
  id: N14NukaNade
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Grenades/NukaNade.rsi
  - type: ExplodeOnTrigger
  - type: Explosive
    # Misfits Change - lighter plasma: 5 x 15 = 75 maximum caustic damage,
    # with a smaller footprint than the standard plasma grenade. No ignition.
    explosionType: MisfitsNukaPlasma
    maxIntensity: 5
    intensitySlope: 4
    totalIntensity: 25
    canCreateVacuum: false
    maxTileBreak: 0
    tileBreakScale: 0
  - type: TriggerOnUse
    keyOut: prime
  - type: TimerTrigger
    keysIn: [ prime ]
    keyOut: trigger
    examinable: false
    delay: 1.5
    beepSound:
      path: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg"
      params:
        volume: 4
  - type: RandomTimerTrigger
    min: 3
    max: 4

- type: entity #should spawn fire only when it was activated and then thrown, but when its not activated it just breaks and spills welding fuel. 
  name: Nuka cocktail
  description: Nuka-Cola bottle filled with flammable fuel.
  parent: N14IgnitableGrenadeBase
  id: N14NukaCocktail
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Grenades/NukaCocktail.rsi  
  - type: ExplodeOnTrigger
  - type: Explosive # Weak explosion in a small/medium radius. Ignites surrounding entities.
    explosionType: FireBomb
    maxIntensity: 2
    intensitySlope: 9
    totalIntensity: 30
    canCreateVacuum: false
    maxTileBreak: 0
    tileBreakScale: 0
  - type: DamageOnLand
    damage:
      types:
        Blunt: 20
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageGroupTrigger  
        damageGroup: Burn 
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg" 
    - trigger:
        !type:DamageGroupTrigger  
        damageGroup: Burn 
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg" 
    - trigger:
        !type:DamageGroupTrigger  
        damageGroup: Burn 
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg" 
    - trigger:
        !type:DamageGroupTrigger  
        damageGroup: Burn 
        damage: 20
      behaviors:
      - !type:TriggerBehavior
    - trigger:
        !type:DamageTrigger # either was thrown ([1 * time] burn damage + 20 brute) or burned too long (21 burn damage)
        damage: 21
      behaviors:
      - !type:TriggerBehavior
    - trigger:
        !type:DamageGroupTrigger #20 brute damage which means wasnt set on fire, so no reason to set on fire, it should only splash some welding fuel
        damageGroup: Brute 
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpillBehavior { }
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: FireVisuals
    sprite: Nuclear14/Objects/Weapons/Grenades/NukaCocktail.rsi
    normalState: primed
  - type: Solution
    id: drink
    solution:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 30
  - type: Spillable
    solution: drink

- type: entity
  parent: GrenadeBase
  id: N14PlasmaGrenade
  name: plasma grenade
  description: Powerful plasma grenade.
  components:
  - type: Sprite
    sprite:  Nuclear14/Objects/Weapons/Grenades/PlasmaGrenade.rsi  
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: ProjectileGrenade
    triggerKey: trigger
    fillPrototype: N14BulletPlasma
    capacity: 16
  - type: PacifismDangerousAttack
  - type: TriggerOnUse
    keyOut: prime
  - type: TimerTrigger
    keysIn: [ prime ]
    keyOut: trigger
    beepSound:
      path: "/Audio/Effects/beep1.ogg"
      params:
        volume: 5
    initialBeepDelay: 0
    beepInterval: 2
  - type: EmitSoundOnTrigger
    sound:
      path: "/Audio/Nuclear14/Weapons/Guns/Battery/N14WeaponPlasmaAutoRifle/shot1.ogg"
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container

- type: entity
  parent: GrenadeBase
  id: N14KettleBomb
  name: kettle bomb
  description: Caution, hot!
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Grenades/KettleBomb.rsi 
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: ProjectileGrenade
    triggerKey: trigger
    fillPrototype: N14BoilingWaterShot
    capacity: 20
  - type: PacifismDangerousAttack
  - type: TriggerOnUse
    keyOut: prime
  - type: TimerTrigger
    keysIn: [ prime ]
    keyOut: trigger
    beepSound:
      path: "/Audio/Effects/beep1.ogg" #has to be whistling sound
      params:
        volume: 5
    initialBeepDelay: 0
    beepInterval: 2
  - type: EmitSoundOnTrigger
    sound:
      path: "/Audio/Weapons/Guns/Gunshots/water_spray.ogg"
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container

- type: entity
  parent: GrenadeBase
  id: N14FirecrackerFull
  name: firecrackers
  description: BIG POP POP!
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Grenades/FirecrackerFull.rsi  
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: ScatteringGrenade
    triggerKey: trigger
    fillPrototype: N14FirecrackerHalf
    capacity: 3
    distance: 15
    velocity: 3
  - type: PacifismDangerousAttack
  - type: EmitSoundOnTrigger
    sound:
      path: "/Audio/Nuclear14/Weapons/Guns/Battery/N14WeaponPlasmaAutoRifle/shot1.ogg" # NEEDS small explosion sound probably from those popping thingies
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: TriggerOnUse
    keyOut: prime
  - type: TimerTrigger
    keysIn: [ prime ]
    keyOut: trigger
    delay: 10

- type: entity
  parent: GrenadeBase
  id: N14FirecrackerHalf
  name: firecrackers
  description: POP POP!
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Grenades/FirecrackerHalf.rsi  
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: ScatteringGrenade
    triggerKey: trigger
    fillPrototype: N14Firecracker
    capacity: 4
    distance: 7
    velocity: 2
  - type: PacifismDangerousAttack
  - type: EmitSoundOnTrigger
    sound:
      path: "/Audio/Effects/snap.ogg" 
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container

- type: entity
  parent: GrenadeBase
  id: N14Firecracker
  name: firecracker
  description: POP POP!
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Grenades/Firecracker.rsi  
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: ExplodeOnTrigger
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: MisfitsDefaultStructural
    maxIntensity: 1
    intensitySlope: 5
    totalIntensity: 5 # should be about 1 tile max very small damage
    canCreateVacuum: false
    maxTileBreak: 0
    tileBreakScale: 0
  - type: DamageOnLand
    damage:
      types:
        Blunt: 3
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:ExplodeBehavior
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/snap.ogg
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic

- type: entity
  name: cryo grenade
  description: B-brrr.
  parent: GrenadeBase
  id: N14CryoGrenade
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Grenades/CryoGrenade.rsi
  - type: ExplodeOnTrigger
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: MisfitsDefaultStructural
    maxIntensity: 5
    intensitySlope: 1
    totalIntensity: 1
    canCreateVacuum: false
    maxTileBreak: 0
    tileBreakScale: 0
  - type: TriggerOnUse
    keyOut: prime
  - type: TimerTrigger
    keysIn: [ prime ]
    keyOut: trigger
    examinable: false
    delay: 1.5
    beepSound:
      path: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg"
      params:
        volume: 4
  - type: RandomTimerTrigger
    min: 3
    max: 4
  - type: SmokeOnTrigger
    duration: 5
    spreadAmount: 15
    solution:
      reagents:
      - ReagentId: Fresium
        Quantity: 15
