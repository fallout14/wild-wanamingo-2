# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Materials/materials.yml

- type: entity
  abstract: true
  parent: MaterialBase
  id: F14MaterialBase
  description: A raw material.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/materials.rsi
  - type: Material
  - type: Appearance
  # - type: Craftable # Corvax-Change  # #Misfits Remove: Stalker14 crafting system

- type: entity
  parent: F14MaterialBase
  id: F14MaterialBasePowder
  abstract: true
  components:
  - type: Sprite
    sprite: /Textures/Nuclear14/Objects/Misc/materials.rsi
    state: powder_lead
  - type: ExaminableSolution
    solution: powder
  - type: Extractable
    grindableSolutionName: powder

# Other
#MARK: Gunpowder

- type: entity
  parent: F14MaterialBasePowder
  id: F14Gunpowder
  name: gunpowder
  description: Explosive.
  categories: [ HideSpawnMenu ]
  components:
  - type: PhysicalComposition
    materialComposition:
      F14Gunpowder: 100
  - type: Stack
    stackType: F14Gunpowder
    baseLayer: powder_lead
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/materials.rsi
    state: powder_lead
    layers:
    - state: powder_lead
      map: ["base"]
  - type: Item
    heldPrefix: powder_lead
  - type: Solution
    id: powder
    solution:
      reagents:
      - ReagentId: F14Gunpowder
        Quantity: 10
  - type: StackPrice # Forge-Change
    price: 1 # PH

