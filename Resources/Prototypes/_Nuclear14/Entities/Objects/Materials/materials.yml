#MARK: Sheet paper

- type: entity
  parent: [ Paper, SheetOtherBase ]
  id: F14Paper
  name: paper
  categories: [ HideSpawnMenu ]
  components:
  - type: Stack
    stackType: F14Paper
    count: 10
    baseLayer: base
    layerStates:
    - paper
    - paper
    - paper
  - type: Material
  - type: Tag
    tags:
    - Sheet
    - Document
  - type: Sprite
    sprite: /Textures/Nuclear14/Objects/Misc/clutter.rsi
    state: paper
    layers:
    - state: paper
      map: ["base"]
  - type: Item
    heldPrefix: paper
  - type: Flammable
    fireSpread: true
    canResistFire: false
    alwaysCombustible: true
    canExtinguish: false
    damage:
      types:
        Heat: 1
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: fire
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PhysicalComposition
    materialComposition:
      F14Paper: 100
  - type: Extractable
    grindableSolutionName: paper
  - type: Solution
    id: paper
    solution:
      reagents:
      - ReagentId: Cellulose
        Quantity: 3
  - type: StackPrice
    price: 0

- type: entity
  parent: F14Paper
  id: F14Paper10
  suffix: 10
  components:
  - type: Stack
    count: 10

- type: entity
  parent: F14Paper
  id: F14Paper1
  suffix: Single
  components:
  - type: Stack
    count: 1

