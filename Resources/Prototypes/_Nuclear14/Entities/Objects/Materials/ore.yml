- type: entity
  parent: OreBase # From Entities\Objects\Materials\ore.yml
  id: F14LeadOre
  name: lead ore
  suffix: Full
  components:
  - type: Stack
    stackType: F14LeadOre
    count: 10
  - type: Sprite
    sprite: /Textures/Nuclear14/Objects/Misc/materials.rsi
    state: lead
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      F14RawLead: 500
  - type: Extractable
    grindableSolutionName: leadore
  - type: Solution
    id: leadore
    solution:
      reagents:
      - ReagentId: Lead
        Quantity: 10

