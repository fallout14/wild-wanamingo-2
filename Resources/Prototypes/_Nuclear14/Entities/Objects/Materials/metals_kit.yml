# More of metals.yml. Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Materials/metals.yml

- type: entity
  parent: IngotBase
  id: F14IngotLead
  name: lead bar
  suffix: Full, 30
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Lead: 100
  - type: Stack
    stackType: Lead
    baseLayer: base
    layerStates:
    - ingot_lead
    - ingot_lead
    - ingot_lead
  - type: Sprite
    sprite: /Textures/Nuclear14/Objects/Misc/materials.rsi
    state: ingot_lead
    layers:
    - state: ingot_lead
      map: ["base"]
  - type: MeleeWeapon
    attackRate: 0.6
    damage:
      types:
        Blunt: 9
    soundHit:
      path: /Audio/Weapons/smash.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 14  
  - type: Item
    heldPrefix: ingot_lead
  - type: Appearance
  - type: Extractable
    grindableSolutionName: lead
  - type: Solution
    id: lead
    solution:
      reagents:
      - ReagentId: Lead
        Quantity: 10

- type: entity
  parent: F14IngotLead
  id: F14IngotLead1
  name: lead bar
  suffix: Single
  components:
  - type: Sprite
    state: ingot_lead
  - type: Stack
    count: 1

- type: entity
  parent: F14IngotLead
  id: F14IngotLead20
  name: lead bar
  suffix: 20
  components:
  - type: Sprite
    state: ingot_lead
  - type: Stack
    count: 20

