# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Tools/welders.yml

- type: entity
  name: welding tool
  parent: Welder
  id: F14Welder
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Tools/welder.rsi
    layers:
    - state: icon
    - state: welder_flame
      visible: false
      shader: unshaded
      map: ["enum.ToggleableVisuals.Layer"]
  - type: Item
    sprite: Nuclear14/Objects/Tools/welder.rsi
  - type: PointLight
    netsync: false
    enabled: false
    radius: 1.5
    color: orange
  - type: Tag # Corvax-Change
    tags:
      - F14Welder

- type: entity
  name: industrial welding tool
  parent: F14Welder
  id: F14WelderIndustrial
  description: "An industrial welder with over double the fuel capacity."
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Tools/welder_industrial.rsi
  - type: Item
    sprite: Nuclear14/Objects/Tools/welder_industrial.rsi
  - type: Solution
    id: Welder
    solution:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 250
      maxVol: 250

- type: entity
  name: advanced industrial welding tool
  parent: F14WelderIndustrial
  id: F14WelderIndustrialAdvanced
  description: "An advanced industrial welder with over double the fuel capacity and hotter flame."
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Tools/welder_industrialadv.rsi
  - type: Item
    sprite: Nuclear14/Objects/Tools/welder_industrialadv.rsi
  - type: Tool
    speedModifier: 1.3

- type: entity
  name: experimental welding tool
  parent: F14Welder
  id: F14WelderExperimental
  description: "An experimental welder capable of self-fuel generation and less harmful to the eyes."
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Tools/welder_experimental.rsi
  - type: Item
    sprite: Nuclear14/Objects/Tools/welder_experimental.rsi
  - type: Solution
    id: Welder
    solution:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 1000
      maxVol: 1000
  - type: PointLight
    enabled: false
    radius: 1.5
    color: lightblue
