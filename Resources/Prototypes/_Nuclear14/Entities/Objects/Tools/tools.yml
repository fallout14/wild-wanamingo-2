# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Tools/tools.yml

- type: entity
  parent: PowerDrill
  id: F14PowerDrill
  components:
  - type: StaticPrice
    price: 65

- type: entity
  name: wirecutters
  parent: Wirecutter
  id: F14WirecutterBase
  description: This kills the wire.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Tools/wirecutters.rsi
    netsync: false
    layers:
    - state: cutters
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: cutters-cutty-thingy
  - type: Item
    sprite: Nuclear14/Objects/Tools/wirecutters.rsi
    storedRotation: -90
  - type: MeleeWeapon
    wideAnimationRotation: -90
    damage:
      types:
        Slash: 1
        Piercing: 1
    attackRate: 2 #open and close that shit on their arm like hell! because you sure aren't doing any damage with this
    soundHit:
      path: "/Audio/Items/wirecutter.ogg"

- type: entity
  name: screwdriver
  parent: Screwdriver
  id: F14ScrewdriverBase
  description: Industrial grade torque in a small screwdriving package.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Tools/screwdriver.rsi
    netsync: false
    layers:
    - state: screwdriver
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: screwdriver-screwybits
  - type: Item
    sprite: Nuclear14/Objects/Tools/screwdriver.rsi
    storedRotation: -90
  - type: MeleeWeapon
    wideAnimationRotation: -90
    attackRate: 1
    damage:
      types:
        Piercing: 6
    soundHit:
      path: "/Audio/Weapons/bladeslice.ogg"

- type: entity
  name: wrench
  parent: Wrench
  id: F14WrenchBase
  description: 'A common tool for assembly and disassembly. Remember: righty tighty, lefty loosey.'
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Tools/wrench.rsi
    state: icon
    netsync: false
  - type: Item
    sprite: Nuclear14/Objects/Tools/wrench.rsi
    storedRotation: -90
  - type: MeleeWeapon
    wideAnimationRotation: 135
    attackRate: 1.5
    damage:
      types:
        Blunt: 8
    soundHit:
      collection: MetalThud
  # - type: Craftable # Corvax-Change  # #Misfits Remove: Stalker14 crafting system

- type: entity
  name: crowbar
  parent: Crowbar
  id: F14CrowbarBase
  description: A multipurpose tool to pry open doors and fighting inter uhh planet invaders from China?
  components:
  - type: MeleeWeapon
    wideAnimationRotation: 135
    attackRate: 1.0
    damage:
      types:
        Blunt: 15
    soundHit:
      collection: MetalThud
    bluntStaminaDamageFactor: 2

- type: entity
  name: multitool
  parent: Multitool
  id: F14Multitool
  description: An advanced tool to copy, store, and send electrical pulses and signals through wires and machines.
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/multitool_drop.ogg
  - type: Sprite
    sprite: Nuclear14/Objects/Tools/multitool.rsi
    layers:
    - state: icon
    - state: green-unlit
      shader: unshaded
  - type: Item
    sprite: Nuclear14/Objects/Tools/multitool.rsi
    storedRotation: -90

- type: entity
  name: saw
  id: F14Saw
  parent: Saw
  components:
  - type: Utensil
    types:
      - Knife
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/saw.rsi
    state: saw
  - type: Item
    sprite: Objects/Specific/Medical/Surgery/saw.rsi
    storedRotation: 90
  - type: Tool
    qualities:
      - Sawing
    speedModifier: 1.0
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Slash: 10
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg

- type: entity
  name: choppa
  id: F14SawImprovised
  parent: F14Saw
  description: A wicked serrated blade made of whatever nasty sharp things you could find. # It would make a pretty decent weapon, given there are more space for some tool mods too.
  components:
  - type: Sprite
    state: improv
  - type: Item
    heldPrefix: improv
  - type: Tool
    qualities:
      - Sawing
    speedModifier: 0.5

- type: entity
  parent: F14Saw
  id: F14SawAdvanced
  name: advanced circular saw
  description: You think you can cut anything with it.
  components:
  - type: Sprite
    state: advanced
  - type: Item
    heldPrefix: advanced
    storedRotation: 90
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Slash: 12
        Blunt: 3
    soundHit:
      path: /Audio/Items/drill_hit.ogg
  - type: Tool
    qualities:
      - Sawing
    speedModifier: 2.0
