# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Misc/materials.yml

- type: entity
  parent: BaseItem
  id: F14Dung
  name: dung pile
  description: Flip those cowpatties into free fertilizer!
  components:
  - type: Sprite
    sprite: /Textures/Nuclear14/Objects/Misc/crafting_material.rsi
    noRot: true
    layers:
      - state: dung
      - state: dung-flies
# N14:TODO: Add creampie ing but worse and it makes you throw up.
  - type: Solution
    id: dung
    solution:
      maxVol: 25
      reagents:
      - ReagentId: F14Dung
        Quantity: 25
  - type: DrainableSolution
    solution: dung
  - type: SolutionTransfer
    canChangeTransferAmount: false
  - type: DeleteOnSolutionEmpty
    solution: dung
  # #Misfits Fix: Re-applied the original cleanup timer so dung does not accumulate indefinitely.
  - type: TimedDespawn
    lifetime: 300

- type: entity
  parent: F14Dung
  id: F14BrahminDung
  name: brahmin dung
  description: A dung pile more acrid and vile than the rest, rancher's gold.
  components:
  - type: Solution
    id: dung
    solution:
      maxVol: 25
      reagents:
      - ReagentId: F14Dung
        Quantity: 15
      - ReagentId: Ammonia
        Quantity: 10

- type: entity
  parent: BaseItem
  id: F14CompostRotted
  name: compost
  description: Rotting remains, like compost. Good for fertilizing.
  components:
  - type: Sprite
    sprite: /Textures/Nuclear14/Objects/Misc/crafting_material.rsi
    state: compost
  - type: Solution
    id: compost
    solution:
      maxVol: 25
      reagents:
      - ReagentId: F14Fertilizer
        Quantity: 25
  - type: DrainableSolution
    solution: compost
  - type: SolutionTransfer
    canChangeTransferAmount: false
  - type: DeleteOnSolutionEmpty
    solution: compost
  # Match the dung cleanup window so rotted compost does not accumulate on the map.
  - type: TimedDespawn
    lifetime: 300
  # Pause the despawn timer while compost is stored in a crate so storage works as expected.
  - type: PauseTimedDespawnInEntityStorage
  - type: Material
  - type: Stack
    stackType: F14Compost
    count: 1
