# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Misc/currency.yml

- type: entity
  name: wallet
  id: F14Wallet
  parent: BaseStorageItem
  description: A wallet for storing lots of money.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/storage.rsi
    state: wallet
    offset: "0.0,-0.02"
    # scale: 0.8, 0.8
  - type: Item
    storedRotation: -90
  - type: Storage
    grid:
    - 0,0,2,1
    maxItemSize: Normal
    quickInsert: true
    areaInsert: true
    whitelist:
      tags:
      - F14BottleCap
      - F14Currency
      - DoorBumpOpener
  # Pull loose bottlecaps into the wallet while it is worn, like an OreBag.
  - type: Dumpable

- type: entity
  parent: BaseItem
  id: F14CurrencyCap
  name: bottlecap
  description: A bottlecap from a bottle of Nuka-Cola.
  components:
  - type: Cash
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Credit: 1
  - type: StackPrice
    price: 0
  - type: Tag
    tags:
      - F14Currency
      - F14BottleCap
  - type: Stack
    stackType: F14Caps
    count: 1
    baseLayer: base
    layerStates:
    - caps
    - caps2
    - caps3
    - moneypouch
    - moneybag
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/currency.rsi
    state: caps
    scale: 0.6, 0.6
    layers:
    - state: caps3
      map: ["base"]
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        density: 30
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.2,0.25,0.1"
        mask:
        - ItemMask
  - type: Appearance
  - type: Item
    size: Tiny
  # cherry-pick from space-station#32938 courtesy of Ilya246
  # end cherry-pick from ss#32938

- type: stack
  id: F14Caps
  name: misfits-kit-caps
  icon: { sprite: Nuclear14/Objects/Misc/currency.rsi, state: caps3 }
  spawn: F14CurrencyCap

- type: entity
  parent: F14CurrencyCap
  id: F14CurrencyCap10
  suffix: 10
  components:
  - type: Icon
    sprite: Nuclear14/Objects/Misc/currency.rsi
