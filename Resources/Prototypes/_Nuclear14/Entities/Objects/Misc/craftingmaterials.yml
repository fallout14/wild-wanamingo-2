# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Misc/craftingmaterials.yml

- type: entity
  parent: BaseItem
  id: F14MaterialRadscorpionTail
  name: radscorpion tail
  description: It's the stinger from a radscorpion.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/crafting_material.rsi
    state: radscorpiontail
  - type: Solution
    solution:
      maxVol: 10
      reagents:
      - ReagentId: F14ScorpionTail
        Quantity: 10
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: F14ScorpionTail
        Quantity: 10
  # - type: Craftable # Corvax-Change  # #Misfits Remove: Stalker14 crafting system

#MARK: Hides

- type: entity
  parent: BaseItem
  id: F14MaterialBaseHide
  abstract: true
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/mob_drops.rsi
    state: hide_brahmin
  - type: Tag
    tags:
      - F14RawLeather
  - type: PhysicalComposition
    materialComposition:
      F14RawLeather: 400
  - type: Material
  - type: Item
    size: Normal
  # - type: Craftable # Corvax-Change  # #Misfits Remove: Stalker14 crafting system

- type: entity
  parent: F14MaterialBaseHide
  id: F14MaterialBrahminHide
  name: brahmin hide
  description: The hide of a brahmin. Leather-like and tough.
  suffix: Full, 4
  components:
  - type: Sprite
    state: hide_brahmin_2
    layers:
    - state: hide_brahmin_2
      map: ["base"]
  - type: Stack
    stackType: F14BrahminHide
    count: 4
    baseLayer: base
    layerStates:
    - hide_brahmin_1
    - hide_brahmin_1
    - hide_brahmin_2
  - type: Appearance
  - type: StackPrice # Forge-Change
    price: 1 # PH

- type: entity
  parent: F14MaterialBrahminHide
  id: F14MaterialBrahminHide1
  suffix: Single
  components:
  - type: Stack
    stackType: F14BrahminHide
    count: 1

- type: entity
  parent: F14MaterialBaseHide
  id: F14MaterialNightstalkerPelt
  name: nightstalker pelt
  description: A pelt of fresh nightstalker leather.
  components:
