# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Specific/Kits/kits.yml

- type: entity
  name: rifleman kit
  parent: BaseItem
  id: N14KitBase
  description: A box containing military supplies.
  abstract: true
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/kits.rsi
  - type: Item
    size: Huge
  - type: SpawnItemsOnUse
    items:
      - id: N14CombatKnife
    sound:
      path: /Audio/Effects/unwrap.ogg

