    - SurgeryTool
  - type: StaticPrice
    price: 20

# Cautery

- type: entity
  name: cautery
  id: F14Cautery
  suffix: N14, New
  parent: F14BaseToolSurgery
  description: A surgical tool used to cauterize open wounds.
  components:
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery
  - type: Item
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/cautery.rsi
    storedRotation: 90
  - type: MeleeWeapon
    damage:
       types:
        Heat: 5
    soundHit:
      path: /Audio/Effects/lightburn.ogg
  - type: ThrowingAngle
    angle: 45
  - type: StaticPrice
    price: 40

- type: entity
  name: cautery
  id: F14CauteryRust
  suffix: N14, Old
  parent: F14Cautery
  description: A surgical tool used to cauterize open wounds. It's covered in rust.
  components:
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery
  - type: Item
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/cautery.rsi
    storedRotation: 90
  - type: StaticPrice
    price: 25

