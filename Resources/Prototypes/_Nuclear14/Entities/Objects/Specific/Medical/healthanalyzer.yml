# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Specific/Medical/healthanalyzer.yml

- type: entity
  id: F14HandheldHealthAnalyzerUnpowered
  parent: BaseItem
  name: health analyzer
  description: A hand-held body scanner capable of distinguishing vital signs of the subject.
  categories: [ HideSpawnMenu ]
  suffix: Do not map
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/healthanalyzer.rsi
    state: icon
    layers:
      - state: icon
      - state: analyzer
        shader: unshaded
        visible: true
        map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  # Merged 2026-11-28 from the Misfits Legacy unpowered analyzer (was F14HandheldHealthAnalyzerUnpoweredLegacy).
  - type: Item
    storedRotation: -90
  - type: ActivatableUI
    key: enum.HealthAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface
  - type: ItemToggle
    onUse: false
  - type: HealthAnalyzer
    scanningEndSound:
      path: "/Audio/Items/Medical/healthscanner.ogg"
  - type: Tag
    tags:
      - DiscreteHealthAnalyzer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  # #Misfits Removed - GuideHelp: guide entries not present in Nuclear-14 (MedicalDoctor)
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5

- type: entity
  id: F14HandheldHealthAnalyzer
  parent: [ F14HandheldHealthAnalyzerUnpowered, PowerCellSlotSmallItem]
  suffix: Powered
  components:
  - type: PowerCellDraw
    drawRate: 1.2 #Calculated for 5 minutes on a small cell
  - type: ToggleCellDraw
  - type: ActivatableUIRequiresPowerCell

- type: entity
  id: F14HandheldHealthAnalyzerAdmin
  parent: [ F14HandheldHealthAnalyzerUnpowered, PowerCellSlotSmallItem]
  suffix: Admin
  components:
  - type: PowerCellDraw
    drawRate: 0.1 # No need for this
  - type: ToggleCellDraw
  - type: ActivatableUIRequiresPowerCell
  - type: HealthAnalyzer
    scanningEndSound:
      path: "/Audio/Items/Medical/healthscanner.ogg"
    maxScanRange: 999
    silent: true
