# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Specific/Medical/healthanalyzer.yml

- type: entity
  id: F14HandheldHealthAnalyzerUnpowered
  parent: HandheldHealthAnalyzerUnpowered
  name: health analyzer
  description: A hand-held body scanner capable of distinguishing vital signs of the subject.
  categories: [ HideSpawnMenu ]
  suffix: Do not map
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/healthanalyzer.rsi
    state: icon
    layers:
      - state: icon
      - state: analyzer
        shader: unshaded
        visible: true
        map: [ "enum.PowerDeviceVisualLayers.Powered" ]

- type: entity
  id: F14HandheldHealthAnalyzer
  parent: [ F14HandheldHealthAnalyzerUnpowered, PowerCellSlotSmallItem]
  suffix: Powered
  components:
  - type: PowerCellDraw
    drawRate: 1.2 #Calculated for 5 minutes on a small cell
  - type: ToggleCellDraw
  - type: ActivatableUIRequiresPowerCell

- type: entity
  id: F14HandheldHealthAnalyzerAdmin
  parent: [ F14HandheldHealthAnalyzerUnpowered, PowerCellSlotSmallItem]
  suffix: Admin
  components:
  - type: PowerCellDraw
    drawRate: 0.1 # No need for this
  - type: ToggleCellDraw
  - type: ActivatableUIRequiresPowerCell
  - type: HealthAnalyzer
    scanningEndSound:
      path: "/Audio/Items/Medical/healthscanner.ogg"
    maxScanRange: 999
    silent: true
