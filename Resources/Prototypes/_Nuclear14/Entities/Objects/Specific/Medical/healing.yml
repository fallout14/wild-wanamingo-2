    tags:
    - N14DirtyGauze
    - Gauze
  - type: Sprite
    scale: 0.66, 0.66
    sprite: Nuclear14/Objects/Specific/Medical/ms13_medical.rsi
    state: gauze_diy1
  - type: Healing
    damageContainers:
      - Biological
    damage:
      types:
        Slash: -7
        Piercing: -7
        Poison: 1
        Heat: -0.5
        Shock: -0.5
        Cold: -0.5
        Caustic: -0.5
    bloodlossModifier: -7
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
  - type: Stack
    stackType: N14DirtyGauze10
    count: 10
  - type: StackPrice
    price: 2 # Forge-Change
  - type: Butcherable
    spawned:
    - id: MaterialCloth1
      amount: 2

