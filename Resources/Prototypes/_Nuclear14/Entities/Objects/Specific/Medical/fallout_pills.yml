# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Specific/Medical/fallout_pills.yml

- type: entity
  name: rad-x pill
  parent: Pill
  id: F14RadXPill
  description: A pill of Rad-X. It makes you more resistant to radiation.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/pills.rsi
    state: pill5
  - type: Item
    sprite: Nuclear14/Objects/Specific/Medical/pills.rsi
  - type: Edible
    edible: Food
    forceFeedDelay: 1
    transferAmount: null
    useSound: /Audio/Items/pill.ogg
  - type: Solution
    solution:
      maxVol: 20
      reagents:
      - ReagentId: F14RadX
        Quantity: 20
  - type: SolutionSpiker
    sourceSolution: food
  - type: DeleteOnTrigger
  - type: Extractable
    grindableSolutionName: food

