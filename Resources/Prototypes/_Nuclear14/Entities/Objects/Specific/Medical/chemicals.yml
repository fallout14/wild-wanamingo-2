# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Specific/Medical/chemicals.yml

- type: entity
  parent: BaseItem
  id: N14ChemicalSyringe
  name: chemical syringe
  description: A syringe filled with an unknown chemical. Chem junkies would kill you for it.
  components:
  - type: Item
    sprite: Nuclear14/Objects/Specific/Medical/ms13_stimpak.rsi
    heldPrefix: stimpak
  - type: Sprite
    scale: 0.75, 0.75
    sprite: Nuclear14/Objects/Specific/Medical/ms13_stimpak.rsi
    layers:
    - state: stimpakfill1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: stimpak-empty
      map: [ "enum.SolutionContainerLayers.Base" ]
  - type: Icon
    sprite: Nuclear14/Objects/Specific/Medical/ms13_stimpak.rsi
    state: "stimpak-empty"
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: true
    fillBaseName: stimpakfill
    emptySpriteName: stimpak-empty
  - type: Solution
    id: pen
    solution:
      maxVol: 15
  - type: ExaminableSolution
    solution: pen
  - type: Injector
    solutionName: pen
    currentTransferAmount: null
    ignoreClosed: false
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
  - type: Appearance
  - type: ToolRefinable
    refineResult:
    - id: SheetPlastic1
  - type: Tag
    tags:
    - Syringe

- type: entity
  name: doctors syringe
  parent: BaseItem
  description: Used to draw blood samples from mobs, or to inject them with reagents. Chem junkies would kill you for it.
  id: N14BaseSyringe
  abstract: true
  components:
  - type: Item
    sprite: Nuclear14/Objects/Specific/Medical/ms13_doctorssyringe.rsi
  - type: Sprite
    scale: 0.75, 0.75
