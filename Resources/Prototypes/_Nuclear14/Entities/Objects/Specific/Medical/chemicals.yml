- type: entity
  parent: DrinkBase
  id: N14AntidoteBottleBase
  abstract: true
  name: antidote bottle
  description: A glass bottle for storing wasteland antidotes.
  components:
  - type: Tag
    tags:
    - Bottle
  - type: Solution
    id: drink
    solution:
      maxVol: 60
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/fallout2.rsi
    state: antidote
  - type: Item
    size: Tiny
    sprite: Nuclear14/Objects/Specific/Medical/fallout2.rsi

- type: entity
  parent: N14AntidoteBottleBase
  id: N14AntidoteEmpty
  suffix: empty
  name: antidote bottle
  description: An empty glass bottle sized for antidote batches.

- type: entity
  parent: N14AntidoteBottleBase
  id: N14Antidote
  name: antidote
  description: A toxin antidote made from radscorpion tail, ethanol, and tarberries.
  components:
  - type: Solution
    id: drink
    solution:
      maxVol: 60
      reagents:
      - ReagentId: Antidote
        Quantity: 60

- type: entity
  # #Misfits Change /Tweak/ - Smelling salts use a long resuscitation interaction instead of injecting a reagent.
  parent: BaseItem
  id: N14SmellingSalts
  name: smelling salts
  description: A small glass ampoule containing smelling salts. Their smell is said to wake up even a dead ghoul.
  components:
  - type: Item
    size: Tiny
    sprite: Nuclear14/Objects/Specific/Medical/ms13_medical.rsi
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/ms13_medical.rsi
    state: powder1
  - type: SmellingSalts
    reviveHeal:
      types:
        Asphyxiation: -40
  - type: DoAfter

- type: entity
  parent: N14HealingPowder
  id: N14HealingPoultice
  name: healing poultice
  description: A bag of poultice to help with all common ailments if slowly.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/drugs.rsi
    state: healingpoultice
  - type: Item
    sprite: Nuclear14/Objects/Specific/Medical/drugs.rsi
  - type: Solution
    solution:
      maxVol: 25
      reagents:
      - ReagentId: HealingPoultice
        Quantity: 25

- type: entity
  parent: DrinkBase
  id: N14BitterdrinkBottleBase
  abstract: true
  name: bitterdrink bottle
  description: A bottle for storing brewed tribal remedies.
  components:
  - type: Tag
    tags:
    - Bottle
  - type: Solution
    id: drink
    solution:
      maxVol: 50
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/drugs.rsi
    state: bitterdrink
  - type: Item
    size: Tiny
    sprite: Nuclear14/Objects/Specific/Medical/drugs.rsi

- type: entity
  parent: N14BitterdrinkBottleBase
  id: N14BitterdrinkEmpty
  suffix: empty
  name: bitterdrink bottle
  description: An empty bottle meant for bitterdrink and similar herbal brews.

- type: entity
  parent: N14BitterdrinkBottleBase
  id: N14Bitterdrink
  name: Bitterdrink
  description: A bottle containing a mixture of plants to aid against poisons and radiation.
  components:
  - type: Solution
    id: drink
    solution:
      maxVol: 50
      reagents:
      - ReagentId: Bitterdrink
        Quantity: 50

- type: entity
  parent: N14HealingPowder
  id: N14MourningPoultice
  name: mourning poultice
  description: A bag of powder made from poisonous flowers for use within tribal ceremonies.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/drugs.rsi
    state: mourningpoultice
  - type: Item
    sprite: Nuclear14/Objects/Specific/Medical/drugs.rsi
  - type: Solution
    solution:
      maxVol: 20
      reagents:
      - ReagentId: MourningPoultice
        Quantity: 20

- type: entity
  parent: N14SuperStimpak
  id: N14UltraStimpak
  name: ultra stimpak
  description: A special type of super-stimpak with an additional mixture of chemicals which makes a man near invincible at a great cost. It is widely deemed inhumane and outlawed.
  components:
  - type: Injector
    solutionName: pen
    currentTransferAmount: null
    ignoreClosed: false
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
  - type: Solution
    id: pen
    solution:
      maxVol: 25
      reagents:
      - ReagentId: UltraRobustHealingMixture
        Quantity: 25

- type: entity
  parent: N14HealingPowder
  id: N14Traumapack #TODO: N14Traumapack needs new sound
  name: traumapack
  description: A backpack filled with a blend of healing chemicals that inject automatically upon the wearer being hurt. The mechanism seems to be broken, however.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/drugs.rsi
    state: traumapack
  - type: Item
    size: Normal
  - type: Solution
    solution:
      maxVol: 30
      reagents:
      - ReagentId: TraumaPowder
        Quantity: 30
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: food
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseHealingItem
  id: N14Bandage #! Corvax-Change
  name: bandage
  description: A long strip of cloth which can stop bleeding. Mostly sterile.
  suffix: full
  components:
  - type: Tag
    tags:
    - N14Bandage
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/drugs.rsi
    state: bandage
  - type: Healing
    damageContainers:
      - Biological
    damage:
      types:
        Heat: -0.5
        Shock: -0.5
        Cold: -0.5
        Caustic: -0.5
        Slash: -10
        Piercing: -15
    bloodlossModifier: -10
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
  - type: Stack
    stackType: N14Bandage
    count: 15 #Was 10, Buffed due to limb damage changes
  - type: StackPrice
    price: 2 # Corvax-Change

- type: entity
  parent: N14Bandage
  id: N14Bandage1
  suffix: Single
  components:
  - type: Stack
    count: 1

- type: entity
  name: aloe salve
  description: Used to treat those nasty burns. Less effective on caustic burns.
  parent: Ointment
  id: N14AloeSalve
  suffix: Full
  components:
  - type: Stack
    stackType: N14AloeSalve
    count: 10
    baseLayer: base
    layerStates:
    - aloe1
    - aloe2
    - aloe3
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/ms13_medical_new.rsi
    layers:
    - state: aloe3
      map: ["base"]

- type: entity
  id: N14AloeSalve1
  parent: N14AloeSalve
  suffix: Single
  components:
  - type: Stack
    stackType: N14AloeSalve
    count: 1
  - type: Sprite
    state: aloe1
