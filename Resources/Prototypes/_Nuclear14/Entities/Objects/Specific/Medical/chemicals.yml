    layers:
    - state: doctorssyringefill1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: doctorssyringe-empty
      map: [ "enum.SolutionContainerLayers.Base" ]
  - type: Icon
    sprite: Nuclear14/Objects/Specific/Medical/ms13_doctorssyringe.rsi
    state: "doctorssyringe-empty"
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: true
    fillBaseName: doctorssyringefill
    emptySpriteName: doctorssyringe-empty
  - type: Appearance
  - type: Solution
    id: injector
    solution:
      maxVol: 15
  - type: Injector
    activeModeProtoId: SyringeDrawMode
    allowedModes:
    - SyringeDrawMode
    - SyringeInjectMode
  - type: ExaminableSolution
    solution: injector
  - type: Spillable
    solution: injector
  - type: TrashOnSolutionEmpty
    solution: injector
  - type: ToolRefinable
    refineResult:
    - id: SheetPlastic1
  - type: Tag
    tags:
    - Syringe
  - type: DoAfter

