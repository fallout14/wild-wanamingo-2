- type: entity
  name: rad-x canister
  id: F14RadXCanister
  parent: PillCanister
  description: Holds up to 12 pills. Usually contains pills of Rad-X. 
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/pill_canisters.rsi
    state: pill_canister_radx
  - type: Item
    sprite: Nuclear14/Objects/Specific/Medical/pill_canisters.rsi
  - type: Storage
    whitelist:
      components:
      - Pill

