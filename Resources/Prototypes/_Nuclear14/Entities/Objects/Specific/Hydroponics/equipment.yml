# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Specific/Hydroponics/equipment.yml

- type: entity
  parent: BaseStorageItem
  id: F14Sack
  name: sack
  description: A woven sack for storing things.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/Sacks/daesack.rsi
    state: icon
    netsync: true
    scale: 0.75, 0.75
  - type: Item
    size: Huge
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,7,4
  - type: PhysicalComposition
    materialComposition:
      Cloth: 100
  - type: Tag
    tags:
    - F14ComposterCompatible

- type: entity
  parent: F14Sack
  id: F14Sack4
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/Sacks/daesack4.rsi
    state: icon

- type: entity
  parent: F14Sack
  id: F14Sack5
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/Sacks/daesack5.rsi
    state: icon

- type: entity
  parent: BaseItem
  id: F14SackCompost
  name: compost sack
  description: A sack for storing compost or dung.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/Sacks/daesack3.rsi
    state: icon
    netsync: true
    scale: 0.75, 0.75
  - type: Item
    size: Huge
  - type: PhysicalComposition
    materialComposition:
      Cloth: 300
  - type: DrainableSolution
    solution: sack
  - type: ExaminableSolution
    solution: sack
  - type: DrawableSolution
    solution: sack
  - type: RefillableSolution
    solution: sack
  - type: SolutionTransfer # Forge-Add
    maxTransferAmount: 100
    minTransferAmount: 5
    canChangeTransferAmount: true
  - type: Solution
    id: sack
    solution:
      maxVol: 100
  - type: Tag
    tags:
    - F14ComposterCompatible

- type: entity
  parent: F14SackCompost
  id: F14SackCompostFull
  suffix: full
