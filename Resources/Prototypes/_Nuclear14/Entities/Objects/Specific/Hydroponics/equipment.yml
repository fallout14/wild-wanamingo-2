- type: entity
  parent: F14SackCompost
  id: F14SackFertilizer
  name: fertilizer sack
  description: A sack for storing fertilizer.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/Sacks/daesack2.rsi
    state: icon
    netsync: true
    scale: 0.75, 0.75

- type: entity
  parent: F14SackFertilizer
  id: F14SackFertilizerFull
  suffix: full
  name: fertilizer sack
  description: A sack for storing fertilizer.
  components:
  - type: Solution
    id: sack
    solution:
      maxVol: 100
      reagents:
      - ReagentId: F14Fertilizer
        Quantity: 100
