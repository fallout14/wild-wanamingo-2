# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Consumable/Food/taco.yml

- type: entity
  name: taco shell
  parent: F14CookedFoodMealBase
  id: F14CookedFoodTacoShell
  description: A taco shell, easy to hold, but falls on its side when put down.
  components:
  - type: Item
    storedRotation: -90
  - type: Edible
    edible: Food
  - type: Sprite
    sprite: Misfits/Legacy/Objects/Consumable/Food/taco.rsi
    layers:
    - state: tacoshell
  - type: Solution
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Nutriment
        Quantity: 6.66 # Just using the same values as the bun values, since the recipe for taco shells is roughly the same as buns.

- type: entity
  parent: FoodInjectableBase
  id: F14CookedFoodTacoBase
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
      - meaty
      - cheesy
  - type: Edible
    edible: Food
    transferAmount: 3
  - type: Sprite
    sprite: Objects/Consumable/Food/taco.rsi
  - type: Solution
    solution:
      maxVol: 15
      reagents:
      - ReagentId: Nutriment
        Quantity: 6
      - ReagentId: Vitamin
        Quantity: 4
  - type: Item
    sprite: Objects/Consumable/Food/taco.rsi
    storedRotation: -90
  - type: Tag
    tags:
      - Meat

