- type: entity
  parent: FoodInjectableBase
  id: F14CookedFoodNoodlesBase
  abstract: true
  description: Now that's a nice pasta!
  components:
  - type: Item
    storedRotation: -90
  - type: Sprite
    sprite: Objects/Consumable/Food/noodles.rsi
  - type: Solution
    solution:
      maxVol: 25
      reagents:
      - ReagentId: Nutriment
        Quantity: 20

- type: entity
  name: boiled spaghetti
  parent: F14CookedFoodNoodlesBase
  id: F14CookedFoodNoodlesBoiled
  description: A plain dish of noodles, this needs more ingredients.
  components:
  - type: FlavorProfile
    flavors:
      - pasta
  - type: Sprite
    state: boiled
# Tastes like pasta.

- type: entity
  name: spaghetti
  parent: F14CookedFoodNoodlesBase
  id: F14CookedFoodNoodles
  description: Spaghetti and crushed tatos. People used to eat this slop?
  components:
  - type: FlavorProfile
    flavors:
      - pasta
      - F14Tato
      - terrible
  - type: Sprite
    state: tomato
  - type: Tag
    tags:
    - Fruit
# Tastes like pasta, tomato.

- type: entity
  name: spaghetti and meatballs
  parent: F14CookedFoodNoodlesBase
  id: F14CookedFoodNoodlesMeatball
  description: It's kind of annoying to eat, but tasty. #N14 change
  components:
  - type: FlavorProfile
    flavors:
      - pasta
      - meaty
      - F14Tato
  - type: Sprite
    state: meatball
  - type: Solution
    solution:
      maxVol: 15
      reagents:
      - ReagentId: Nutriment
        Quantity: 8
      - ReagentId: Vitamin
        Quantity: 4
  - type: Tag
    tags:
    - Meat
# Tastes like pasta, meat.

