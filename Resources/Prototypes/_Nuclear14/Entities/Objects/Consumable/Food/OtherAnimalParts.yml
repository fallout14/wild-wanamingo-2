- type: entity
  parent: BaseItem
  id: N14FoodFireantNectar
  name: fire ant nectar
  description: A small crystal of fire ant nectar.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/ingredients.rsi # N14TODO:SPRITE: Change me
    state: flour-big
  - type: Solution
    solution:
      maxVol: 10
      reagents:
      - ReagentId: N14FireAntNectar
        Quantity: 10
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: N14FireAntNectar
        Quantity: 10
  - type: Spillable
    solution: food
  - type: MeleeWeapon
    soundNoDamage:
      path: "/Audio/Effects/Fluids/splat.ogg"
    damage:
      types:
        Blunt: 0
  - type: StaticPrice # Forge-Change
    price: 15

