# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Consumable/Food/tin.yml

- type: entity
  parent: FoodTinBase
  id: F14FoodTinC1
  name: c ration type 1
  description: A canned food product containing the entree portion of a military combat ration.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Consumable/Food/Tins/c_ration_1.rsi
  - type: FlavorProfile
    flavors:
    - F14RationCornedBrahminHash
  - type: Edible
    edible: Food
    trash: 
    - F14FoodTinC1Trash
  - type: Tag
    tags:
    - Meat

- type: entity
  parent: F14FoodTinC1
  id: F14FoodTinC1Open
  suffix: Open
  components:
  - type: Sprite
    layers:
    - state: icon-open
      map: ["icon"]
  - type: Openable
    opened: true

- type: entity
  parent: FoodTinBaseTrash
  id: F14FoodTinC1Trash
  name: c ration type 1
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Consumable/Food/Tins/c_ration_1.rsi

