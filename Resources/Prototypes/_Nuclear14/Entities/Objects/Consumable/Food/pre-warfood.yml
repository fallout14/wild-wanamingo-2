- type: entity
  parent: FoodTinBase
  id: N14FoodDogfood
  name: canned dog food
  description: A can of beef stew meant for dogs.
  components:
  - type: Sprite  # MS13 art
    sprite: MojaveSun/Objects/Consumable/Food/Tins/dogfood.rsi
    layers:
    - state: dogfood
      map: ["icon"]
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        icon:
          True: {state: "dogfood_open"}
          False: {state: "dogfood"}
  - type: FlavorProfile
    flavors:
    - meaty
  - type: Edible
    edible: Food
    trash: 
    - N14FoodDogFoodTrash
  - type: Tag
    tags:
    - Meat
    - Soup

