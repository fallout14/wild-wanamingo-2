# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Consumable/Food/pre-warfood.yml

- type: entity
  parent: FoodBase
  id: N14FoodSnackBase
  abstract: true
  components:
  - type: Edible
    edible: Food
  - type: Sprite
    sprite: Nuclear14/Objects/Consumable/Food/pre-war.rsi
    netsync: false
  - type: Solution
    solution:
      maxVol: 30 # Room for extra condiments
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
  - type: Item
    sprite: Nuclear14/Objects/Consumable/Food/pre-war.rsi
    heldPrefix: packet
  - type: PhysicalComposition
    materialComposition:
      Cardboard: 100

- type: entity
  name: BlamCo Mac & Cheese
  parent: N14FoodSnackBase
  id: N14FoodBlamcomaccheese
  description: Highly processed macaroni with white cheese sauce and a healthy dose of preservatives.
  components:
  - type: Sprite  # MS13 art
    sprite: MojaveSun/Objects/Consumable/Food/Tins/macncheese.rsi
    state: macncheese
  - type: Edible
    edible: Food
    trash: 
    - N14FoodBlamcomaccheeseTrash

- type: entity
  name: Large BlamCo Mac & Cheese
  parent: N14FoodSnackBase
  id: N14FoodBlamcomaccheeseLarge
  description: Highly processed macaroni with white cheese sauce and a healthy dose of preservatives. This is a larger family box.
  components:
