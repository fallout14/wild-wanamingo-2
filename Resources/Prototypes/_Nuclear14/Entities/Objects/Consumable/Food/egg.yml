# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Consumable/Food/egg.yml

- type: entity
  parent: FoodEggBase
  id: N14FoodEggBase
  description: An egg!
  abstract: true
  components:
  - type: Tag
    tags:
      - Egg
      - Meat
  - type: Edible
    edible: Food
    trash:
    - Eggshells
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/mob_drops.rsi
  - type: Item
    sprite: Nuclear14/Objects/Misc/mob_drops.rsi
    size: Tiny
  - type: Solution
    solution:
      maxVol: 6
      reagents:
      - ReagentId: Egg
        Quantity: 6
  - type: DrawableSolution
    solution: food
  - type: SolutionSpiker
    sourceSolution: food
    ignoreEmpty: true
    popup: spike-solution-egg
  # egg fragile
  - type: DamageOnHighSpeedImpact
    minimumSpeed: 0.1
    damage:
      types:
        Blunt: 1
  - type: Damageable
  - type: Injurable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: desecration
      - !type:SpillBehavior
        solution: food
      - !type:SpawnEntitiesBehavior
        spawn:
          Eggshells:
            min: 1
            max: 1
          # Wow double-yolk you're so lucky!
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  # all below are for egg cooking/exploding
  - type: AtmosExposed
  - type: Temperature
  - type: InternalTemperature
    conductance: 0.456

# Egg

- type: entity
  parent: N14FoodEggBase
  id: N14FoodEggChicken
  name: chicken egg
  components:
  - type: Sprite
    state: egg
  - type: Construction
    graph: Egg
    node: start
  - type: StaticPrice # Forge-Change
    price: 1 # PH

- type: entity
  id: N14FoodEggChickenFertilized
  parent: N14FoodEggChicken
  suffix: Fertilized, Chicken
  components:
  - type: WastelandSpawner
    prototypes:
    - N14MobChicken
    - Eggshells
    intervalSeconds: 20
    minimumEntitiesSpawned: 2
    maximumEntitiesSpawned: 2
    ignoreSpawnBlock: true # Forge-Change
  - type: TimedDespawn #delete the egg after the chicken spawns
    lifetime: 21
  - type: StaticPrice # Forge-Change
    price: 1 # PH

- type: entity
  parent: N14FoodEggChicken
  id: N14CookedFoodEggChickenBoiled
  name: boiled chicken egg
  description: A delicious hardboiled egg.
  components:
  - type: Solution
    solution:
      maxVol: 6
      reagents:
      - ReagentId: EggCooked
        Quantity: 6
  - type: Temperature
  - type: StaticPrice # Forge-Change
    price: 1 # PH

