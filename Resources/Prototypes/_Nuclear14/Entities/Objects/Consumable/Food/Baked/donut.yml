# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Consumable/Food/Baked/donut.yml

- type: entity
  parent: FoodInjectableBase
  id: F14CookedFoodDonutBase
  abstract: true
  description: Goes great with robust coffee.
  components:
  - type: Edible
    edible: Food
  - type: Tag
    tags:
    - Donut
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/donut.rsi
  - type: Solution
    solution:
      maxVol: 5
      reagents:
      - ReagentId: Nutriment
        Quantity: 3
  - type: Item
    sprite: Objects/Consumable/Food/Baked/donut.rsi
    size: Tiny
# Tastes like donut.

# The sprinkles are now an overlay, so you can put them on any donut! If we really
# wanted to go for EXTREME roleplay we could apply a different color to the sprinkles
# Since it's technically an alpha layer.

# You'll be able to bake the plain donuts, then mix up different glazes for them to
# apply with a brush or something.

# Plain Donuts

- type: entity
  name: plain donut
  parent: F14CookedFoodDonutBase
  id: F14CookedFoodDonutPlain
  components:
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Sprite
    state: plain

- type: entity
  name: plain jelly-donut
  parent: F14CookedFoodDonutBase
  id: F14CookedFoodDonutJellyPlain
  components:
  - type: FlavorProfile
    flavors:
      - jelly
  - type: Sprite
    state: jelly-plain
  - type: Solution
    solution:
      maxVol: 5
      reagents:
      - ReagentId: Nutriment
        Quantity: 3
      - ReagentId: Vitamin
        Quantity: 1

- type: entity
  name: donut
  parent: F14CookedFoodDonutBase
  id: F14CookedFoodDonutHomer
  components:
  - type: FlavorProfile
    flavors:
      - pink
  - type: Sprite
    state: homer
  - type: Item
    heldPrefix: pink

- type: entity
