# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Consumable/Food/Baked/bread.yml

- type: entity
  parent: FoodInjectableBase
  id: N14CookedFoodBreadBase
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
      - bread
  - type: Edible
    edible: Food
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/bread.rsi
  - type: Tag
    tags:
    - Bread
  - type: Solution
    solution:
      maxVol: 26
      reagents:
      - ReagentId: Nutriment
        Quantity: 20

- type: entity
  parent: N14CookedFoodBreadBase
  id: N14CookedFoodBreadSliceBase
  abstract: true
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
      - bread
  - type: Tag
    tags: [] #override bread
  - type: Solution
    solution:
      maxVol: 8
      reagents:
      - ReagentId: Nutriment
        Quantity: 4

- type: entity
  name: volcanic loaf
  parent: [N14CookedFoodBreadBase, BaseSlicingRefinableFood]
  id: N14CookedFoodBreadVolcanic
  description: A dark loaf. Resembles pumice.
  components:
  - type: Edible
    edible: Food
  - type: Sprite
    layers:
    - state: alpha
      color: "#281415"
    - state: alpha-filling
      color: "#FF613F"
  - type: ToolRefinable
    refineResult:
    - id: N14CookedFoodBreadVolcanicSlice
      amount: 1

- type: entity
  name: volcanic slice
  parent: N14CookedFoodBreadSliceBase
  id: N14CookedFoodBreadVolcanicSlice
  description: A slice of dark loaf. Resembles pumice.
  components:
  - type: Edible
    edible: Food
  - type: Sprite
    layers:
    - state: alpha-slice
      color: "#281415"
    - state: alpha-slice-filling
      color: "#FF613F"

