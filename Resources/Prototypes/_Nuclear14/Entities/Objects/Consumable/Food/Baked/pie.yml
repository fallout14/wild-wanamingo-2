# Tart

- type: entity
  name: chocolate lava tart
  parent: F14CookedFoodPieBase
  id: F14CookedFoodTartCoco
  description: A tasty dessert made of chocolate, with a liquid core.
  components:
  - type: FlavorProfile
    flavors:
      - chocolate
  - type: Sprite
    state: cocolava
  - type: Solution
    solution:
      maxVol: 26
      reagents:
      - ReagentId: Nutriment
        Quantity: 15
      - ReagentId: Theobromine
        Quantity: 2
