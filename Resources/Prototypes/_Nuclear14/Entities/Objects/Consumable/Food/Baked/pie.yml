# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Consumable/Food/Baked/pie.yml

- type: entity
  parent: FoodInjectableBase
  id: F14CookedFoodPieBase
  abstract: true
  components:
  - type: Item
    storedRotation: -90
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/pie.rsi
  - type: Solution
    solution:
      maxVol: 20
      reagents: #Most of these are this with slight variations, not worth changing until we have the rest of the reagents
      - ReagentId: Nutriment
        Quantity: 11
      - ReagentId: Vitamin
        Quantity: 5
  - type: Edible
    edible: Food
    trash:
    - FoodPlateTin
  - type: Tag
    tags:
    - Pie

- type: entity
  parent: FoodInjectableBase # Not sliceable
  id: F14CookedFoodPieSliceBase
  abstract: true
  description: A slice of pie. Tasty!
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/pie.rsi
  - type: Solution
    solution:
      maxVol: 6
      reagents:
      - ReagentId: Nutriment
        Quantity: 1.2
      - ReagentId: Vitamin
        Quantity: 1

- type: entity
  name: mutfruit pie #N14 change
  parent: [F14CookedFoodPieBase, BaseSlicingRefinableFood]
  id: F14CookedFoodPieMutfruit
  description: It's all... gloppy. #N14 change
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - F14Mutfruit
  - type: Sprite
    layers:
    - state: tin
    - state: apple
  - type: ToolRefinable
    refineResult:
    - id: F14CookedFoodPieMutfruitSlice
      amount: 1
  - type: Tag
    tags:
    - Fruit
    - Pie

- type: entity
  name: slice of mutfruit pie #N14 change
  parent: F14CookedFoodPieSliceBase
  id: F14CookedFoodPieMutfruitSlice
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - F14Mutfruit
  - type: Sprite
    layers:
    - state: plain-slice
    - state: alpha-slice-filling
      color: purple
  - type: Tag
    tags:
    - Fruit
    - Pie
    - Slice
# Tastes like pie, apple.

- type: entity
  name: baklava
  parent: [F14CookedFoodPieBase, BaseSlicingRefinableFood]
  id: F14CookedFoodPieBaklava
