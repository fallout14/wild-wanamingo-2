# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Consumable/Food/Baked/cake.yml

- type: entity
  parent: FoodInjectableBase
  id: F14CookedFoodCakeBase
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Edible
    edible: Food
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/cake.rsi
  - type: Solution
    solution:
      maxVol: 30
      reagents:
      - ReagentId: Nutriment
        Quantity: 20
      - ReagentId: Vitamin
        Quantity: 5
  - type: Item
    size: Normal
  - type: Tag
    tags:
    - Cake

- type: entity
  parent: F14CookedFoodCakeBase
  id: F14CookedFoodCakeSliceBase
  abstract: true
  description: A decadent slice of simple cake.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Edible
    edible: Food
  - type: Solution
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Nutriment
        Quantity: 4
      - ReagentId: Vitamin
        Quantity: 1
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Cake
    - Slice

# Custom Cake Example

- type: entity
  name: tarberry cake #N14 change
  parent: [F14CookedFoodCakeBase, BaseSlicingRefinableFood]
  id: F14CookedFoodCakeTarberry
  description: A hearty, filling tarberry cake. #N14 change
  components:
  - type: Sprite
    layers:
    - state: plain
    - state: alpha-filling
      color: blue
  - type: ToolRefinable
    refineResult:
    - id: F14CookedFoodCakeTarberrySlice
      amount: 1
  - type: Tag
    tags:
    - Fruit

- type: entity
  name: tarberry slice #N14 change
  parent: F14CookedFoodCakeSliceBase
  id: F14CookedFoodCakeTarberrySlice
  description: Stains - and sticks to - your teeth. #N14 change
  components:
  - type: Sprite
    layers:
    - state: plain-slice
    - state: alpha-slice-filling
      color: blue
  - type: Tag
    tags:
    - Fruit
    - Slice

# Cake

- type: entity
  name: cake
  parent: [F14CookedFoodCakeBase, BaseSlicingRefinableFood]
  id: F14CookedFoodCakePlain
  description: A plain cake. Obscene luxury, even so. #N14 change
  components:
  - type: Sprite
    state: plain
  - type: ToolRefinable
    refineResult:
    - id: F14CookedFoodCakePlainSlice
      amount: 1

- type: entity
  name: slice of cake
  parent: F14CookedFoodCakeSliceBase
  id: F14CookedFoodCakePlainSlice
  description: A decadent slice of simple cake. #N14 change
  components:
  - type: Sprite
    state: plain-slice
# Tastes like sweetness, cake.

- type: entity
  name: carrot cake
  parent: [F14CookedFoodCakeBase, BaseSlicingRefinableFood]
  id: F14CookedFoodCakeCarrot
  description: Cake? Actual cake in the wasteland? Pinch yourself. Make sure you're not in heaven. #N14 change
  components:
  - type: Sprite
    state: carrot
  - type: ToolRefinable
    refineResult:
    - id: F14CookedFoodCakeCarrotSlice
      amount: 1
  - type: Solution
    solution:
      maxVol: 30
      reagents:
      - ReagentId: JuiceCarrot
        Quantity: 15
      - ReagentId: Sugar
        Quantity: 5
      - ReagentId: Vitamin
        Quantity: 5
      - ReagentId: Nutriment #Misfits Fix: carrot cake lacked direct hunger satiation; all other cakes carry Nutriment
        Quantity: 10

- type: entity
  name: slice of carrot cake
  parent: F14CookedFoodCakeSliceBase
  id: F14CookedFoodCakeCarrotSlice
  description: Delicious! Also good for your eyes, if you're a dumbfuck who welded without protection. #N14 change
  components:
  - type: Sprite
    state: carrot-slice
  - type: Solution
    solution:
      maxVol: 6
      reagents:
      - ReagentId: JuiceCarrot
        Quantity: 3
      - ReagentId: Sugar
        Quantity: 1
      - ReagentId: Vitamin
        Quantity: 1
      - ReagentId: Nutriment #Misfits Fix: proportional to whole cake fix (10/5 ratio = 2 per slice)
        Quantity: 2

