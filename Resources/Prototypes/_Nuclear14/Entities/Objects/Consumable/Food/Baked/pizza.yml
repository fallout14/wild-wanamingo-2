# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Consumable/Food/Baked/pizza.yml

- type: entity
  parent: FoodInjectableBase
  id: F14CookedFoodPizzaBase
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
      - oily
      - bread
  - type: Edible
    edible: Food
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/pizza.rsi
  - type: Solution
    solution:
      maxVol: 40
      reagents:
      - ReagentId: Nutriment
        Quantity: 30
      - ReagentId: Vitamin
        Quantity: 5
  - type: Item
    size: Normal
  - type: Tag
    tags:
    - Pizza
    - ReptilianFood

- type: entity
  parent: FoodInjectableBase # Not sliceable
  id: F14CookedFoodPizzaSliceBase
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
      - oily
      - bread
  - type: Edible
    edible: Food
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/pizza.rsi
  - type: Solution
    solution:
      # Note: Keep FoodPizzaMoldySlice & N14FoodPizzaSliceBase roughly in sync
      maxVol: 6
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Vitamin
        Quantity: 0.8
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Pizza
    - ReptilianFood

# Pizza

- type: entity
  name: margherita pizza
  parent: [F14CookedFoodPizzaBase, BaseSlicingRefinableFood]
  id: F14CookedFoodPizzaMargherita
  description: The flavor of some place called... Iti-lie..? #N14 change
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
      - oily
      - bread
      - F14Tato
  - type: Sprite
    layers:
    - state: margherita
  - type: ToolRefinable
    refineResult:
    - id: F14CookedFoodPizzaMargheritaSlice
      amount: 1

- type: entity
  name: slice of margherita pizza
  parent: F14CookedFoodPizzaSliceBase
  id: F14CookedFoodPizzaMargheritaSlice
  description: A slice of Iti-lie. #N14 change
