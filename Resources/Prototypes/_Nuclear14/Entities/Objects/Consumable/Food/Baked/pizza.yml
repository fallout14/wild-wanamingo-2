#TODO: Make this do poison damage and make cut pizza slices eventually rot into this.

- type: entity
  name: slice of moldy pizza
  parent: F14CookedFoodPizzaSliceBase
  id: F14CookedFoodPizzaMoldySlice
  description: Once a perfectly good slice of pizza pie, but now it lies here, rancid and bursting with spores.
  components:
  - type: FlavorProfile
    flavors:
      - bitter
      - terrible
      - mushroom
  - type: Sprite
    layers:
    - state: moldy-slice
  - type: Solution
    solution:
      # Note: Keep FoodPizzaMoldySlice & N14FoodPizzaSliceBase roughly in sync
      maxVol: 5
      reagents:
      - ReagentId: Nutriment
        Quantity: 2
      - ReagentId: Mold
        Quantity: 2
      - ReagentId: Vitamin
        Quantity: 1
