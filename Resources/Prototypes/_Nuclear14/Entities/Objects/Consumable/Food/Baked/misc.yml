# Nuggets

- type: entity
  name: chicken nugget
  parent: N14CookedFoodBakedBase
  id: N14CookedFoodBakedNugget
  description: A "chicken" nugget vaguely shaped into an object. # Should change depending on name.
  components:
  - type: Tag
    tags:
      - Nugget
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/nuggets.rsi
    layers:
      - state: tendie
        map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          tendie: ""
          lizard: ""
          star: ""
          corgi: ""
  - type: Solution
    solution:
      maxVol: 8
      reagents:
      - ReagentId: Nutriment
        Quantity: 2
      - ReagentId: Protein
        Quantity: 2
      - ReagentId: Vitamin
        Quantity: 1

- type: entity
