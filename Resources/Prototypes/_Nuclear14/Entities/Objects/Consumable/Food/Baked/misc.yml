# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Consumable/Food/Baked/misc.yml

- type: entity
  parent: FoodInjectableBase
  id: N14CookedFoodBakedBase #I've avoiding messing with the bases for now because upstream references them a lot.
  abstract: true
  components:
  - type: Edible
    edible: Food
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/misc.rsi
  - type: Solution
    solution:
      maxVol: 6
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
  - type: Item
    size: Tiny

