    tags:
    - Raw
  - type: Sprite
    scale: 1, 1
    sprite: Objects/Consumable/Food/meat.rsi
    state: plain
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 3
      - ReagentId: UncookedAnimalProteins
        Quantity: 6
  - type: FlavorProfile # tastes meaty, and like people...
    flavors:
