# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Consumable/Food/meat.yml

- type: entity
  parent: FoodMeatRawBase
  id: F14FoodMeatBase
  abstract: true
  components:
  - type: Edible
    edible: Food
  - type: Sprite
    scale: 0.75, 0.75
    sprite: Nuclear14/Objects/Consumable/Food/meat.rsi
    state: brahminmeat
    netsync: false
  - type: Solution
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: UncookedAnimalProteins
        Quantity: 1
  - type: Temperature
  - type: InternalTemperature
    conductance: 0.43
  - type: Perishable
    # raw meat rots in 15 minutes, get it into the freezer fast or preserve it.
    rotAfter: 900
    # don't want meat giving off ammonia only bodies
    molsPerSecondPerUnitMass: 0

# Use tags for Raw, Cooked and Cutlet

# Raw

- type: entity
  name: raw irradiated meat
  parent: [F14FoodMeatBase, BaseSlicingRefinableFood]
  id: F14FoodMeatRadRaw
  description: A morsel of raw irradiated meat
  components:
  - type: Tag
    tags:
    - Raw
  - type: Sprite
    state: morsels
  - type: Solution
    solution:
      reagents:
      - ReagentId: F14UncookedAnimalProteinsRad
        Quantity: 5
  - type: ToolRefinable
    refineResult:
    - id: F14FoodMeatRadCutlet
      amount: 3
  - type: Construction # Corvax-Change
    graph: F14FoodMeatRad
    node: start
    defaultTarget: MeatCooked
  - type: StaticPrice # Forge-Change
