# Cutlets
# Raw

- type: entity
  name: raw rad cutlet
  parent: F14FoodMeatBase
  id: F14FoodMeatRadCutlet
  description: A raw meat cutlet from a wasteland animal.
  components:
  - type: Tag
    tags:
    - Raw
    - Cutlet
  - type: Sprite
    sprite: Objects/Consumable/Food/meat.rsi
    state: cutlet
  - type: Solution
    solution:
      reagents:
      - ReagentId: F14UncookedAnimalProteinsRad
        Quantity: 3
      - ReagentId: F14RadParticleFood
        Quantity: 1
  - type: Temperature
  - type: InternalTemperature
    conductance: 0.43
  - type: Perishable
    # raw meat rots in 15 minutes, get it into the freezer fast or preserve it.
    rotAfter: 900
    # don't want meat giving off ammonia only bodies
    molsPerSecondPerUnitMass: 0
  - type: Construction
    graph: F14MeatRadCutlet
    node: start
    defaultTarget: CutletCooked

