# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Consumable/Food/preserves.yml

- type: entity
  name: glass jar
  description: A glass jar, a cuter alternative to the glass cup.
  parent: DrinkGlassBase
  id: F14FoodJarBase
  components:
  - type: Appearance
  - type: Solution
    id: drink
    solution:
      maxVol: 30
  - type: SolutionContainerVisuals
    maxFillLevels: 7
    fillBaseName: fill
    metamorphic: true
    metamorphicDefaultSprite:
      sprite: Nuclear14/Objects/Consumable/Food/preserves.rsi # Forge-Change
      state: icon
  - type: TransformableContainer
  - type: Sprite
    sprite: Nuclear14/Objects/Consumable/Food/preserves.rsi # Forge-Change
    layers:
      - state: icon
        map: [ "enum.SolutionContainerLayers.Base" ]
      - state: fill1
        map: [ "enum.SolutionContainerLayers.Fill" ]
        visible: false
    scale: 0.5, 0.5

- type: entity
  parent: F14FoodJarBase
  id: F14FoodJamBase
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Consumable/Food/preserves.rsi
  - type: FlavorProfile
    flavors:
    - sweet
    - fruity
  - type: Tag
    tags:
    - F14Jam

# PickledBase

- type: entity
