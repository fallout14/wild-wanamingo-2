# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Consumable/Smokeables/smokeables.yml

- type: entity
  parent: BaseStorageItem
  name: pack of rolling paper
  id: F14PackRollingPaper
  description: A pack of thin pieces of paper used to make fine smokeables.
  components:
  - type: Storage
    grid:
    - 0,0,3,1
    whitelist:
      tags:
      - RollingPaper
      - CigFilter
  - type: StorageFill
    contents:
      - id: F14RollingPaper
        amount: 4
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigarettes/paper.rsi
    state: cigpapers
  - type: Item
    sprite: Objects/Consumable/Smokeables/Cigarettes/paper.rsi

- type: entity
  parent: PaperRolling
  id: F14RollingPaper
  suffix: Full
  components:
  - type: Stack
    stackType: F14RollingPaper
    count: 5
  - type: Sprite
    sprite: Nuclear14/Objects/Consumable/Smokeables/smokeables.rsi
    state: rollie_paper
    scale: 0.6, 0.6
  - type: Item
    sprite: Nuclear14/Objects/Consumable/Smokeables/smokeables.rsi
    size: Tiny

- type: entity
  id: F14RollingPaper1
  suffix: Single
  parent: F14RollingPaper
  components:
    - type: Stack
      count: 1
