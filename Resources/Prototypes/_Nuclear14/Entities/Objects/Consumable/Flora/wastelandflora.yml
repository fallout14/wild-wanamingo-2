# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Consumable/Flora/wastelandflora.yml

- type: entity
  abstract: true
  id: F14WastelandFlora
  description: A plant growing wild in the wasteland.
  components:
  - type: Transform
    anchored: true # doesn't need to be true, but then we need to add mass
  - type: Physics
    bodyType: Static
  - type: InteractionOutline
  - type: Clickable
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Consumable/Flora/wastelandflora.rsi
  - type: Item
    sprite: Nuclear14/Objects/Consumable/Flora/wastelandflora.rsi
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Gatherable
    toolWhitelist:
      components:
        - Hands
  - type: Tag
    tags:
      - Structure

# Plants

- type: entity
  parent: F14WastelandFlora
  id: F14WastelandFloraWildAgave
  name: wild agave plant
  description: An agave plant growing wild. It looks healthy.
  components:
  - type: Physics  # spawn state
    canCollide: False
  - type: Sprite
    state: wild_agave
  - type: OreVein
    currentOre: F14WildAgave
  - type: Gatherable
    toolWhitelist:
      components:
        - Hands
      tags:
        - PlantSampleTaker
    loot:
