# Base Wild Produce

- type: entity
  abstract: True
  parent: FoodProduceBase
  id: F14FloraProduce
  name: wild produce base
  description: A wild plant produce grown in the wastes.
  components:
  - type: Solution
    solution:
      maxVol: 3
      reagents:
      - ReagentId: Nutriment
        Quantity: 1
      - ReagentId: Vitamin
        Quantity: 1
      - ReagentId: F14RadParticleFood
        Quantity: 1
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Consumable/Flora/wastelandflora.rsi
    scale: 0.7, 0.7
  - type: Item
    sprite: Nuclear14/Objects/Consumable/Flora/wastelandflora.rsi

- type: entity
  abstract: True
  parent: F14FloraProduce
  id: F14FloraProduceFood
  name: wild food produce base
  description: A wild plant produce grown in the wastes.
  components:
  - type: Solution
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Vitamin
        Quantity: 4
      - ReagentId: F14RadParticleFood
        Quantity: 1

- type: entity
  parent: F14FloraProduce
  id: F14FloraProduceWildAgave
  name: wild agave leaves
  description: Wild agave plant leaves.
  components:
  - type: Sprite
    state: AgaveLeaf
  #Misfits Fix: Re-enabled Stack — map entities require StackComponent to deserialize (was commented out but maps still reference it)
  - type: Stack
    stackType: F14AgaveLeaf
    count: 1
  - type: Solution
    solution:
      maxVol: 10
      reagents:
      - ReagentId: F14ExtractAgaveNectar
        Quantity: 10
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: F14ExtractAgaveNectar
        Quantity: 10
  - type: Produce
    plantId: F14WildAgave
  - type: Seed
    plantId: F14WildAgave

- type: entity
