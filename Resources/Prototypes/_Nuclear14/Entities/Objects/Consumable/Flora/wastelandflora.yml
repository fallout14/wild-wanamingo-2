# Base Wild Produce

- type: entity
  abstract: True
  parent: FoodProduceBase
  id: N14FloraProduce
  name: wild produce base
  description: A wild plant produce grown in the wastes.
  components:
  - type: Solution
    solution:
      maxVol: 3
      reagents:
      - ReagentId: Nutriment
        Quantity: 1
      - ReagentId: Vitamin
        Quantity: 1
      - ReagentId: N14RadParticleFood
        Quantity: 1
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Consumable/Flora/wastelandflora.rsi
    scale: 0.7, 0.7
  - type: Item
    sprite: Nuclear14/Objects/Consumable/Flora/wastelandflora.rsi

- type: entity
  abstract: True
  parent: N14FloraProduce
  id: N14FloraProduceFood
  name: wild food produce base
  description: A wild plant produce grown in the wastes.
  components:
  - type: Solution
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Vitamin
        Quantity: 4
      - ReagentId: N14RadParticleFood
        Quantity: 1

- type: entity
  parent: N14FloraProduce
  id: N14FloraProduceWildAgave
  name: wild agave leaves
  description: Wild agave plant leaves.
  components:
  - type: Sprite
    state: AgaveLeaf
  #Misfits Fix: Re-enabled Stack — map entities require StackComponent to deserialize (was commented out but maps still reference it)
  - type: Stack
    stackType: N14AgaveLeaf
    count: 1
  - type: Solution
    solution:
      maxVol: 10
      reagents:
      - ReagentId: N14ExtractAgaveNectar
        Quantity: 10
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: N14ExtractAgaveNectar
        Quantity: 10
  - type: Produce
    plantId: N14WildAgave
  - type: Seed
    plantId: N14WildAgave

- type: entity
  parent: N14FloraProduceFood
