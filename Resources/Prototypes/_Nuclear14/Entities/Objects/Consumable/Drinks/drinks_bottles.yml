# Soda

- type: entity
  parent: N14DrinkBottleBaseFull50
  id: N14DrinkNukaColaBottleFull
  name: Nuka-Cola bottle
  description: A refreshing beverage that has a extremely sugary taste. Reminds you of vanilla and cinnamon.
  components:
  - type: MolotovConvertible
    wickOffset: "0,-0.0625"
  - type: DamageOnLand
    ignoreResistances: true
    damage:
      types:
        Blunt: 5
  - type: Openable # Forge-Change
    closeable: false
  - type: SpawnWhenOpened # Forge-Add
    prototypes:
    - id: N14CurrencyCap
      amount: 1
  - type: Solution
    id: drink
    solution:
      maxVol: 50
      reagents:
      - ReagentId: N14NukaCola
        Quantity: 50
  - type: Sprite
    sprite: Nuclear14/Objects/Consumable/Drinks/nuka_cola.rsi

- type: entity
  parent: N14DrinkBottleBaseFull50
  id: N14DrinkIrradiatedNukaColaBottleFull
  name: irradiated Nuka-Cola bottle
  description: An unrefreshing beverage that has a extremely sugary taste. The aftertaste is bitter and burnt.
  components:
  - type: MolotovConvertible
    wickOffset: "0,-0.0625" # Match the standard Nuka-Cola bottle.
  - type: DamageOnLand
    ignoreResistances: true
    damage:
      types:
        Blunt: 5
  - type: Openable # Forge-Change
    closeable: false
  - type: SpawnWhenOpened # Forge-Add
    prototypes:
    - id: N14CurrencyCap
      amount: 1
  - type: Solution
    id: drink
    solution:
      maxVol: 50
      reagents:
      - ReagentId: N14IrradiatedNukaCola
        Quantity: 50
  - type: Sprite
    sprite: Nuclear14/Objects/Consumable/Drinks/nuka_cola.rsi

# New Soda

- type: entity
  parent: N14DrinkBottleBaseEmpty50
  id: N14DrinkNukaColaEmpty
  name: Nuka-Cola bottle
  description: The leading cola since 2044.
  components:
  - type: Tag
    tags:
    - MisfitsEmptyNukaBottle
  - type: Sprite
    sprite: Nuclear14/Objects/Consumable/Drinks/nuka_cola_new.rsi
    state: empty
  - type: Openable # Forge-Change
    closeable: false
  - type: SpawnWhenOpened # Forge-Add
    prototypes:
    - id: N14CurrencyCap
      amount: 1
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpillBehavior { }
      - !type:SpawnEntitiesBehavior
        spawn:
          N14DrinkNukaColaBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Item
    size: Small
  - type: DamageOnLand
    ignoreResistances: true
    damage:
      types:
        Blunt: 5
  - type: MolotovConvertible
    wickOffset: "0,-0.15625" # Five pixels down for the short empty-bottle sprite.

- type: entity
