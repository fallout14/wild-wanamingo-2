# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Consumable/Drinks/drinks_bottles.yml

- type: entity
  parent: DrinkBottleGlassBaseFull
  id: N14DrinkBottleBaseFull50
  abstract: true
  components:
  - type: Solution
    id: drink
    solution:
      maxVol: 50

- type: entity
  parent: N14DrinkBottleBaseFull50
  id: N14DrinkBottleBaseEmpty50
  abstract: true
  suffix: empty

# Allows for caps and fill levels

- type: entity
  id: N14DrinkGlassVisualsOpenable
  abstract: true
  components:
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "icon_open"}
          False: {state: "icon"}
  - type: Sprite
    layers:
      - state: icon
        map: ["enum.OpenableVisuals.Layer"]

# Milk
# Empty Bottle

- type: entity
  parent: N14DrinkBottleBaseEmpty50
  id: N14DrinkBottleMilkEmpty
  name: milk bottle
  description: Looks good at holding milky substances.
  components:
  - type: MolotovConvertible
    wickOffset: "0,-0.0625"
  - type: Sprite
    sprite: Nuclear14/Objects/Consumable/Drinks/milk.rsi

# Basic Milk Bottle

- type: entity
  parent: [N14DrinkGlassVisualsOpenable, N14DrinkBottleBaseFull50]
  id: N14DrinkMilkBrahmin
  name: brahmin milk
  description: A glass bottle of brahmin milk.
  components:
  - type: MolotovConvertible
    wickOffset: "0,-0.0625" # Match the empty milk bottle.
  - type: Solution
    id: drink
    solution:
      maxVol: 50
      reagents:
      - ReagentId: N14MilkBrahmin
        Quantity: 50
  - type: Sprite
    sprite: Nuclear14/Objects/Consumable/Drinks/milk.rsi
    layers:
      - state: icon
        map: ["enum.OpenableVisuals.Layer"]
      - state: fill1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: fill

