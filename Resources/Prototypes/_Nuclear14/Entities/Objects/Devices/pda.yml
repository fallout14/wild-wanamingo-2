# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Devices/pda.yml

- type: entity
  abstract: true
  parent: BasePDA
  id: F14BasePipboy
  name: Pip-Boy 3000 MKIV
  description: A RobCo Industries Pip-Boy 3000 Mark IV Personal Information Processor.
  components:
  - type: Sprite
    sprite: MojaveSun/Objects/Devices/pipboy.rsi
    layers:
    - state: pda # Pda.state is gone in Wizden
      map: [ "enum.PdaVisualLayers.Base" ]
    - state: "light_overlay"
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: "unshaded"
      visible: false
    - state: "id_overlay"
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: "unshaded"
      visible: false
    scale: 0.75, 0.75
  - type: Icon
    sprite: MojaveSun/Objects/Devices/pipboy.rsi
    state: pda
  - type: PdaBorderColor
    borderColor: "#3a5a40"
  - type: Clothing
    quickEquip: false
    slots:
    - idcard
  - type: Pda
    paiSlot:
      priority: -2
      whitelist:
        components:
        - PAI
    penSlot:
      startingItem: Pen
      priority: -1
      whitelist:
        tags:
        - Write
    idSlot:
      name: access-id-card-component-default
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Machines/id_insert.ogg
      whitelist:
        # #Misfits Change - Faction ID tags: inserting one of these into the Pip-Boy
        # activates the corresponding shared tactical feed in the Pipboy Map cartridge.
        # IdCardVault     -> Vault shared map (VaultMap feed)
        # IdCardBrotherhood -> BOS shared map (Brotherhood feed) - same feed as N14BrotherhoodTacticalmap table and BOS helmets
        # IdCardNCR       -> NCR shared map (NCR feed)
        # IdCardLegion    -> Legion shared map (Legion feed)
        # When adding a new faction map, add its tag here AND define it in Misfits/tags.yml.
        components:
        - IdCard # #Misfits Add - accept any entity with IdCard component (belt-and-suspenders with tag list)
        tags:
        - F14IdCardVault # Misfits Change
        - F14IdCardBrotherhood #Misfits Change
        - F14IdCardNCR #Misfits Change
        - F14IdCardLegion # #Misfits Change
        - F14IdCardWastelander # #Misfits Add - allows wastelander dogtags to be inserted
  # #Misfits Add - Pip-Boy can read holotapes when they are used on it.
  # Opens the holotape's own UI (not the Pip-Boy's) since the PDA already has its own UserInterface.
  - type: HolotapeReader
  - type: Geiger
    isEnabled: true
    showControl: true
    showExamine: true
  - type: RadiationReceiver
  - type: Tag
    tags:
    - F14PipBoy
  - type: EntityTableContainerFill
    containers:
      preinstalled-program-container: !type:AllSelector
        children:
        - id: CrewManifestCartridge
        - id: NotekeeperCartridge
        - id: NewsReaderCartridge
        - id: F14NanoChatCartridge
        - id: F14PipBoyContactsCartridge
        - id: F14PipBoyGroupsCartridge
        - id: F14PipBoyDirectoryCartridge
        - id: F14PipBoySettingsCartridge

- type: entity
  parent: F14BasePipboy
  id: F14Pipboy

- type: entity
  parent: F14BasePipboy
  id: F14VaultPDA
  suffix: Vault
  components:
  - type: Pda
    id: F14IDCardVault
