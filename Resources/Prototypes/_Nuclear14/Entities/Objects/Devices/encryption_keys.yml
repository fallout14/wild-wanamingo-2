# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Devices/encryption_keys.yml

- type: entity
  parent: EncryptionKey
  id: F14EncryptionKeyEnclave
  name: Enclave encryption key
  description: An encryption key used by the Enclave.
  categories: [ HideSpawnMenu ]
  components:
  - type: EncryptionKey
    channels:
    - F14Enclave
    defaultChannel: F14Enclave
  - type: Sprite
    layers:
    - state: crypt_red
    - state: synd_label

- type: entity
  parent: EncryptionKey
  id: F14EncryptionKeyNCR
  name: NCR encryption key
  description: An encryption key used by the NCR.
  components:
  - type: EncryptionKey
    channels:
    - F14NCR
    defaultChannel: F14NCR
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: sec_label

- type: entity
  parent: EncryptionKey
  id: F14EncryptionKeyVault
  name: Vault encryption key
  description: An encryption key used by the local Vault.
  components:
  - type: EncryptionKey
    channels:
    - F14VaultCommon
    defaultChannel: F14VaultCommon
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: com_label

- type: entity
  parent: EncryptionKey
  id: F14EncryptionKeyPBS
  name: PBS encryption key
  description: An encryption key used by the local broadcast messages.
  components:
  - type: EncryptionKey
    channels:
    - F14PBS
    defaultChannel: F14PBS
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: com_label

