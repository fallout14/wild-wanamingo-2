# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Mobs/NPCs/plants.yml

- type: entity
  name: wasteland plant
  abstract: true
  id: F14MobBaseHostilePlant
  parent: F14MobBaseHostile
  description: A mutated plant. You wonder where it came from, a vault perhaps?
  components:
  - type: Damageable
  - type: Injurable
    damageContainer: Biological
  - type: NoSlip
  - type: Speech
    speechSounds: Squeak
  - type: ReplacementAccent
    accent: genericAggressive
  - type: Butcherable
    spawned:
    - id: F14FoodMeatRadRaw #change to something else
      amount: 1
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.30
        density: 30
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer

- type: entity
  name: spore plant
  parent: F14MobBaseHostilePlant
  id: F14MobSporeplant
  description: A mutated venus fly trap. Who knew they got this big?
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: sporeplant
      sprite: Nuclear14/Mobs/Plants/sporeplant.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: sporeplant
      Critical:
        Base: sporeplant
      Dead:
        Base: dead
  - type: MovementSpeedModifier
    baseWalkSpeed : 0
    baseSprintSpeed : 0
  - type: Stamina
    baseCritThreshold: 20
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 50
  - type: ReplacementAccent
    accent: mouse
  - type: MobThresholds
    thresholds:
      0: Alive
      65: Dead
  - type: MeleeWeapon
    range: 2
    damage:
      types:
        Blunt: 2
        Slash: 2
        Piercing: 2
