# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Mobs/NPCs/robots.yml

- type: entity
  abstract: true
  parent: MobSiliconBase
  id: F14MobRobotHostile
  suffix: hostile npc
  name: robot
  description: Designed to serve humankind. Maybe it ended it.
  components:
  - type: InputMover
  - type: MobMover
  - type: NpcFactionMember
    factions:
    - F14HostileRobot
  #- type: MobRobotAggro #Misfits Change — removed: NPC hostile robots should be hostile to player robots, not neutral.
  - type: ProximityNPC # Misfits Add — sleep distant NPCs to reduce tick load
  - type: HTN
    rootTask:
      task: F14HostileCompound
    blackboard:
      NavSmash: !type:Bool
        true
  - type: Sprite
    drawdepth: Mobs
  - type: Physics
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 6
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.4
        density: 150
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobState
    allowedStates:
      - Alive
      - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
    stateAlertDict:
      Alive: BorgHealth
      Dead: HumanDead
  - type: Stamina
    baseCritThreshold: 20
  - type: MovementAlwaysTouching
  - type: Appearance
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Dead:
        Base: dead
  # - type: Bloodstream
    # bloodMaxVolume: 50
  - type: CombatMode
  # - type: GhostTakeoverAvailable
  # - type: GhostRole
    # prob: 0.33
    # makeSentient: true
    # name: hostile attacker # wave defence
    # description: |
      # Wreak havoc and kill all humans!
  - type: ReplacementAccent
    accent: genericAggressive
  - type: Damageable
    damageModifierSet: F14WastelandAnimal
  - type: Injurable
    damageContainer: Biological
  - type: Puller
    needsHands: true
  - type: Grammar # Misfits Change - proper noun so names appear capitalized in says/emotes when possessed
    attributes:
      proper: true
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          F14ScrapElectronic1:
            min: 1
            max: 3
          F14MaterialCircuitry1:
            min: 1
            max: 3
          F14Scrap1:
            min: 1
            max: 3
          F14CurrencyPrewar: #Misfits Change /Add: Drop prewar money on death (5-25)
            min: 5
            max: 25
      - !type:PlaySoundBehavior # Misfits Change - robot death sound
        sound:
          path: /Audio/Misfits/Legacy/Machines/AI/borg_death.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Tag #Misfits Change - robot footstep sounds
    tags:
    - DoorBumpOpener
    - FootstepSound
    - SiliconEmotes
  - type: Deathgasp #Misfits Change - keep robot death emotes consistent with silicon mobs
    prototype: SiliconDeathgasp
  - type: Vocal #Misfits Change - generic fallback emotes for robots without a dedicated sound set
    emoteSounds: UnisexSilicon

- type: entity
  abstract: true
  parent: F14MobRobotHostile
  id: F14MobRobotHostileMelee
  components:
  - type: MeleeWeapon
    hidden: true
    soundHit:
        path: /Audio/Effects/metal_thud1.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 1.66667
        Slash: 1.66667
        Piercing: 1.66667

- type: entity
  parent: F14MobRobotHostileMelee
  id: F14MobRobotAssaultronHostile
  name: Assaultron
  description: Horrifying. Fast. Deadly.
  components:
  - type: IdleSound #Misfits Change - use the dedicated Assaultron idle loop set
  - type: SpamEmitSound #Misfits Change - periodic Assaultron idle chatter
    minInterval: 10
    maxInterval: 35
    sound:
      collection: F14AssaultronIdle
      params:
        volume: -6
        maxDistance: 7
  - type: HTN
    rootTask:
      task: F14RangedHostileCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead # Corvax-Change
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          F14ScrapElectronic1:
            min: 1
            max: 3
          F14MaterialCircuitry1:
            min: 1
            max: 3
          F14Scrap1:
            min: 1
            max: 3
          F14CurrencyPrewar: #Misfits Change /Add: Drop prewar money on death (5-25)
            min: 5
            max: 25
      - !type:PlaySoundBehavior # Misfits Change - robot death sound
        sound:
          path: /Audio/Misfits/Legacy/Machines/AI/borg_death.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 6
  - type: MeleeWeapon #Misfits Change - replace generic clangs with Assaultron attack vocals
    hidden: true
    soundHit:
      collection: F14AssaultronAttack
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Slash: 15 #Misfits Tweak - tone down NPC assaultron claw lethality per balance request
  # - type: GhostRole
    # prob: 1
    # makeSentient: true
    # name: Assaultron
    # description: |
      # Protect your area and remove any trespassers.
  - type: Sprite
    sprite: Nuclear14/Mobs/Robots/assaultron.rsi
    layers:
    - state: icon
      map: ["movement"]
    # - state: icon
      # map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: icon  # change me
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: icon # change me
      shader: unshaded
      map: ["light"]
      visible: false
  - type: SpriteMovement
    movementLayers:
      movement:
        state: walking
    noMovementLayers:
      movement:
        state: icon
  - type: DamageStateVisuals
    states:
      Alive:
        Base: deathclaw
      Dead:
        Base: dead
  - type: AggroSound #Misfits Change
    sound:
      collection: F14AssaultronAttack
      params:
        volume: -3
        maxDistance: 12
  # Misfits Add - robot/broadcast languages when player-controlled.

