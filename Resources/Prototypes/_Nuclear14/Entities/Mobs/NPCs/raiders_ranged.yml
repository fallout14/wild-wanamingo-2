- type: entity
  name: Psycho Raider
  parent: N14BaseMobRaider
  id: N14MobRaiderPsychoRanged
  description: Psychopatic raider who will shoot and rob just about anyone.
  components:
    - type: Gun #Mobs currently cannot bolt a gun, so we have to simulate them firing it
      minAngle: 6
      maxAngle: 22.5
      angleIncrease: 1
      angleDecay: 4
      fireRate: 1.33
      soundGunshot: /Audio/Nuclear14/Weapons/Guns/Pistols/N14WeaponPistol10mm/shot1.ogg
      useKey: false
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
    - type: CombatMode
    - type: BasicEntityAmmoProvider
      proto: N14CartridgePistol10
      capacity: 10
      count: 10
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 2
      rechargeSound:
        path: /Audio/Nuclear14/Weapons/Effects/Reload/Pistols/pistol_magin.ogg
    - type: Loadout
      prototypes:
        - N14RaiderPistolGear
    - type: Sprite
      layers:
      - map: [ "enum.HumanoidVisualLayers.Chest" ]
      - map: [ "enum.HumanoidVisualLayers.Head" ]
      - map: [ "enum.HumanoidVisualLayers.Snout" ]
      - map: [ "enum.HumanoidVisualLayers.Eyes" ]
      - map: [ "enum.HumanoidVisualLayers.Eyelids" ]
      - map: [ "enum.HumanoidVisualLayers.OverEyes" ]
      - map: [ "enum.HumanoidVisualLayers.RArm" ]
      - map: [ "enum.HumanoidVisualLayers.LArm" ]
      - map: [ "enum.HumanoidVisualLayers.RLeg" ]
      - map: [ "enum.HumanoidVisualLayers.LLeg" ]
      - map: [ "enum.HumanoidVisualLayers.UndergarmentBottom" ]
