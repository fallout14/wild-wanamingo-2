# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Mobs/NPCs/pets_organic.yml

- type: entity
  name: Basic Pet
  id: F14MobPetBasic
  parent: F14MobBaseHostileNoAccent
  categories: [ HideSpawnMenu ]
  description: Why are you even reading this?
  components:
  - type: NpcFactionMember
    factions:
      - SimpleNeutral
  - type: NameIdentifier
    group: GenericNumber
  - type: Puller
    needsHands: false
  - type: Hands # #Misfits Add - allows player-controlled pets to drag items; pickup blocked by MisfitsPetNoPickup
  - type: MisfitsPetNoPickup # #Misfits Add - cancels PickupAttemptEvent so pets can drag but not pick up items
  - type: Body # #Misfits Add - override N14Animal with N14PetAnimal to include heart (Medicine/Poison metabolizer for stimpaks and healing powder)
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.75
    baseSprintSpeed : 5.5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.30
        density: 20
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: shepherd
      sprite: Nuclear14/Mobs/Animals/dogsheperd.rsi
  - type: MobState
    allowedStates:
      - Alive
      - Critical
      - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Critical
      160: Dead
    allowRevives: true # Misfits Fix - organic pets should be revivable by medicine like other tamed animals
  - type: DamageStateVisuals
    states:
      Alive:
        Base: shepherd
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: MeleeWeapon
    range: 1.25
    altDisarm: false
    hidden: true
    soundHit:
      collection: F14DogAttack #Misfits Change
    angle: 60
    animation: WeaponArcBite
    wideAnimation: WeaponArcBite
    damage:
      types:
        Blunt: 4
        Slash: 8
  - type: IdleSound #Misfits Change
  - type: SpamEmitSound #Misfits Change
    minInterval: 10
    maxInterval: 60
    sound:
      collection: F14DogIdle
      params:
        volume: -10
        maxDistance: 5
  - type: Deathgasp
  - type: PassiveDamage
    allowedStates:
    - Alive
    - Critical
    damage:
      types:
        Blunt: -0.166667
        Slash: -0.166667
        Piercing: -0.166667
        Heat: -0.125
        Shock: -0.125
        Cold: -0.125
        Caustic: -0.125
        Poison: -0.25
        Radiation: -0.25
        Asphyxiation: -1.5
        Bloodloss: -1.5

- type: entity
  name: Basic Mutt
  id: F14MobPetDog
  parent: F14MobPetBasic
  description: A rather normal dog, seems to have a collar with a name on it.
  components:
  - type: RadiationReceiver
  - type: RandomMetadata
    nameSegments: [names_N14pet_dog]
  - type: InteractionPopup
    interactSuccessString: petting-success-dog
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      collection: F14DogBark #Misfits Change
  - type: GhostRole
    name: ghost-role-information-n14pet-dog-name
    description: ghost-role-information-n14pet-generic-description
    rules: ghost-role-component-default-rules
    makeSentient: false
    allowMovement: true
  - type: GhostTakeoverAvailable
  - type: Speech # Corvax-Change
    speechSounds: Dog
  #- type: DogVision # Corvax-Change | #Misfits Change: Disabled — greyscale shader should not apply to players inhabiting pet mobs
  - type: Tag
    tags:
    - DoorBumpOpener
    - VulpEmotes
  - type: InventorySlots
  - type: PetCollarHolder
  - type: Inventory
    speciesId: cat
    templateId: F14CatPet
  - type: Emoting
  - type: Hands # #Misfits Add - allows dragging and item handling
  - type: BorgHands # #Misfits Add - gives cats actual holdable hand slots
    handCount: 1
  - type: ComplexInteraction # #Misfits Add - allows click-opening doors and other complex hand interactions
  - type: RobotWeaponPickupBlacklist # #Misfits Add - cats should not be able to pick up guns/melee weapons
    blacklist:
      components:
      - Gun
      - MeleeWeapon
  - type: MisfitsPetNoPickup # So they cant pick up items but can drag

