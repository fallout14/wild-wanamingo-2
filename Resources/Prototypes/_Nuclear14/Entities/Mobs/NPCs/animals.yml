#MARK: Brahmin

- type: entity
  name: brahmin
  parent: MobCow
  id: F14MobBrahmin
  description: The ultimate beast of burden, it can carry heavy packs, produces fertilizer for farms and milk, can be butchered for hide and meat, and you can ride it.
  components:
  - type: Sprite
    drawdepth: Mobs
    scale: 1.25, 1.25
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: brahmin-2
      sprite: Nuclear14/Mobs/Animals/brahmin.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: brahmin-2
      Dead:
        Base: dead
  - type: Stamina
    baseCritThreshold: 200
  - type: Strap
    buckleOffset: "0, -0.4" # WW: Mountable riderOffset
    # #Misfits Add - brahmin riding is perk-gated through the shared riding marker component.
    whitelist:
      requireAll: true
      components:
      - HumanoidProfile
    # #Misfits Fix - Super Mutants and Power Armor wearers are too heavy to ride brahmin
    blacklist:
      tags:
      - F14CannotRide
      components:
      - PowerArmorWorn
    buckleSound:
      path: /Audio/_NC/Effects/lift-saddle.ogg
      params:
        volume: 20
    unbuckleSound:
      path: /Audio/_NC/Effects/dismount-saddle.ogg
      params:
        volume: 20
  - type: NPCRetaliation # Aggro on the attacker when damaged from any range
    attackMemoryLength: 30
  - type: ProximityNPC # Misfits fix — Didn't have comp to reduce tick load and activate ai
                        #TODO: make every NPC inherit from same base to avoid issues in future
  - type: HTN
    rootTask:
     task: RuminantHostileCompound
    blackboard:
     NavSmash: !type:Bool
       false
  - type: MeleeWeapon
    range: 2
    altDisarm: false
    hidden: true
    soundHit:
      collection: MetalThud
    angle: 60
    animation: WeaponArcClaw
    wideAnimation: WeaponArcClaw
    damage:
      types:
        Blunt: 10
  - type: Mountable
  - type: Tag
    tags:
    - F14Brahmin
  - type: Butcherable
    spawned:
    - id: F14FoodMeatBrahmin
      amount: 4
    - id: F14MaterialBrahminHide1
      amount: 1
      prob: 0.95
    - id: F14MiscBrahminSkull
      amount: 1
      prob: 0.75
  - type: SolutionManager
    solutions:
    - F14MobBrahminSolutionUdder
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: F14WastelandBlood
        Quantity: 1800
  - type: Damageable
    damageModifierSet: F14WastelandAnimal
  - type: Injurable
    damageContainer: Biological
  - type: WastelandSpawner
    prototypes:
      - F14BrahminDung
    chance: 0.5
    intervalSeconds: 300
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 1
    ignoreSpawnBlock: true # Forge-Change
  - type: Reproductive
    breedChance: 0.05
    birthPopup: reproductive-birth-popup
    makeOffspringInfant: false
    partnerWhitelist:
      tags:
      - F14Brahmin
    offspring:
    - id: F14MobBrahmin
      maxAmount: 1
  - type: ReproductivePartner
  - type: MobPrice
    price: 250 # Corvax-Change
  - type: Vocalizer
    minVocalizeInterval: 120
    maxVocalizeInterval: 300
  - type: DatasetVocalizer
    dataset: F14BrahminSays
  - type: Inventory
    templateId: F14Brahmin
  - type: InventorySlots
  - type: Strippable
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface

#MARK: Bighorner

- type: entity
  parent: Solution
  id: F14MobBrahminSolutionUdder
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: udder
    solution:
      maxVol: 100
      reagents:
      - ReagentId: F14MilkBrahmin
        Quantity: 30

- type: entity
  name: bighorner
  parent: F14MobBrahmin
  id: F14MobBighorner
  description: These ornery beasts are really only good for meat and hide. Try to put a pack or saddle on them and they'll just lay down and refuse to move.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: bighorner
      sprite: Nuclear14/Mobs/Animals/bighorner.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: bighorner
      Dead:
        Base: dead
  - type: Stamina
    baseCritThreshold: 200
  - type: Strap
    # #Misfits Change - bighorners inherit brahmin straps, so blacklist humanoid riders to keep them non-mountable.
    blacklist:
      components:
      - HumanoidProfile
  - type: Tag
    tags:
    - F14Bighorner
  - type: Butcherable
    spawned:
    - id: F14FoodMeatBighorner
      amount: 4
    - id: F14MaterialRawLeather1
      amount: 4
    - id: F14MiscBighornerSkull
      amount: 1
      prob: 0.75
  - type: MeleeWeapon
    range: 1 # Cythfix - Bighorner had range 3 (too long, could attack from ~4 tiles). Normal melee range, so set to 1
    altDisarm: false
    hidden: true
    soundHit:
      collection: MetalThud
    angle: 60
    animation: WeaponArcClaw
    wideAnimation: WeaponArcClaw
    damage:
      types:
        Blunt: 10
        Slash: 8
  - type: NPCRetaliation # Aggro on the attacker when damaged from any range
  - type: HTN
    rootTask:
     task: RuminantHostileCompound
    blackboard:
     NavSmash: !type:Bool
       true
  - type: SolutionManager
    solutions:
    - F14MobBighornerSolutionUdder
  - type: WastelandSpawner
    prototypes:
      - F14Dung
    chance: 0.5
    ignoreSpawnBlock: true # Forge-Change
  - type: Reproductive
    breedChance: 0.05
    birthPopup: reproductive-birth-popup
    makeOffspringInfant: false
    partnerWhitelist:
      tags:
      - F14Bighorner
    offspring:
    - id: F14MobBighorner
      maxAmount: 1
  - type: ReproductivePartner

