- type: entity
  name: molerat
  id: F14MobMolerat
  parent: F14MobBaseHostile
  description: Eusocial creatures that prefer the underground. They are hostile to anything outside their colony.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: molerat
      sprite: Nuclear14/Mobs/Animals/molerat.rsi
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 4
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.20
        density: 20
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      70: Dead
  - type: Stamina
    baseCritThreshold: 70
  - type: DamageStateVisuals
    states:
      Alive:
        Base: molerat
      Critical:
        Base: molerat
      Dead:
        Base: dead
  - type: MeleeWeapon
    altDisarm: false
    hidden: true
    soundHit:
      collection: F14MoleratAttack #Misfits Change
    angle: 60
    animation: WeaponArcBite
    wideAnimation: WeaponArcBite
    damage:
      types:
        Blunt: 1
        Slash: 1
        Piercing: 1
  - type: IdleSound #Misfits Change
  - type: SpamEmitSound #Misfits Change
    minInterval: 10
    maxInterval: 60
    sound:
      collection: F14MoleratIdle
      params:
        volume: -10
        maxDistance: 5
  - type: AggroSound #Misfits Change
    sound:
      collection: F14MoleratAttack
      params:
        volume: -3
        maxDistance: 10
