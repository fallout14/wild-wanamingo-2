# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Mobs/NPCs/lizards.yml

- type: entity
  name: gecko
  id: F14MobGecko
  parent: F14MobBaseHostileScaley
  description: Looks like a dinosaur. The bite is worse than the claws.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: gecko
      sprite: Nuclear14/Mobs/Animals/gecko.rsi
  - type: MovementSpeedModifier
    baseWalkSpeed : 4                         # Forge-Change
    baseSprintSpeed : 5                       # Forge-Change
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.3
        density: 20
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      130: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: gecko
      Critical:
        Base: gecko
      Dead:
        Base: dead
  - type: MeleeWeapon
    altDisarm: false
    hidden: true
    soundHit:
      collection: F14GeckoAttack #Misfits Change
    angle: 60
    animation: WeaponArcBite
    wideAnimation: WeaponArcBite
    damage:
      types:
        Slash: 8                        # Forge-Change
  - type: IdleSound #Misfits Change
  - type: SpamEmitSound #Misfits Change
    minInterval: 10
    maxInterval: 60
    sound:
      collection: F14GeckoIdle
      params:
        volume: -10
        maxDistance: 5
  - type: AggroSound #Misfits Change
    sound:
      collection: F14GeckoAttack
      params:
        volume: -3
        maxDistance: 10
  - type: Butcherable
    spawned:
    - id: F14FoodMeatGecko
      amount: 3
    - id: F14MaterialHideGecko
      amount: 1
  #- type: Reproductive
    #breedChance: 0.05
    #birthPopup: reproductive-laid-egg-popup
    #makeOffspringInfant: false
    #partnerWhitelist:
      #tags:
      #- Gecko
    #offspring:
    # id: F14FoodEggGeckoFertilized
     #maxAmount: 3
 #- type: ReproductivePartner
 #- type: EggLayer
   #eggSpawn:
   #- id: F14FoodEggGecko
#- type: Tag
   # tags:
    #- Gecko

- type: entity
  parent: F14MobGecko
  id: F14MobGeckoFire
  name: fire gecko
  description: A dangerous fire gecko. Don't let it get close!
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: gecko
      sprite: Nuclear14/Mobs/Animals/firegecko.rsi
  - type: MeleeWeapon
    altDisarm: false
    hidden: true
    soundHit:
      collection: F14GeckoAttack #Misfits Change
    angle: 60
    animation: WeaponArcBite
    wideAnimation: WeaponArcBite
    damage:
      types:
        Slash: 7                        # Forge-Change
  - type: Butcherable
    spawned:
    - id: F14FoodMeatGeckoFire
      amount: 3
    - id: F14MaterialHideGeckoFire
      amount: 1
  # - type: Reproductive
    # breedChance: 0.05
    # birthPopup: reproductive-laid-egg-popup
    # makeOffspringInfant: false
    # partnerWhitelist:
      # tags:
      # - Gecko
    # offspring:
    # - id: F14FoodEggGeckoFertilized
      # maxAmount: 3
  # - type: ReproductivePartner
  # - type: EggLayer
    # eggSpawn:
    # - id: F14FoodEggGecko
  # - type: Tag
    # tags:
     #- Gecko
  - type: Gun
    cameraRecoilScalar: 0 #no recoil
    fireRate: 3
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Nuclear14/Weapons/Guns/Flames/flamer.ogg
  - type: SolutionManager
    solutions:
    - F14MobGeckoFireSolutionChamber
  - type: FlamerAmmoProvider
    solutionId: chamber
    fireCost: 5
    fireTilePrototype: F14TileFire
    range: 4
  - type: NamedSolutionRegeneration
    solution: chamber
    generated:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 1
    duration: 0.1
  - type: HTN
    rootTask:
      task: F14RangedHostileCompound
  - type: Flammable
    fireSpread: false
    canResistFire: true
    firestackFade: -1
  - type: Damageable
    damageModifierSet: F14ScaleFireresist
  - type: AggroSound #Misfits Change
    sound:
      collection: F14GeckoAttack
      params:
        volume: -3
        maxDistance: 10

- type: entity
  parent: Solution
  id: F14MobGeckoFireSolutionChamber
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: chamber
    solution:
      maxVol: 100
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 100

