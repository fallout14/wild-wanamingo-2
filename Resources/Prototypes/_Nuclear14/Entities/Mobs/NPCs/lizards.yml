# Nightstalker Cub

- type: entity
  name: nightstalker cub
  id: F14MobNightstalkerCub
  parent: F14MobBaseHostile
  description: Is it a coyote? Why does it have a rattler... This one is small.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: nightstalker
      sprite: Nuclear14/Mobs/Animals/nightstalkercub.rsi
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: F14NightstalkerBlood
        Quantity: 30
  - type: MovementSpeedModifier
    baseWalkSpeed : 3.5
    baseSprintSpeed : 4.5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.3
        density: 20
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobState
    allowedStates:
      - Alive
      - Critical
      - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      150: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: nightstalker
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: MeleeWeapon
    altDisarm: false
    hidden: true
    soundHit:
      collection: F14NightstalkerAttack #Misfits Change
    angle: 60
    animation: WeaponArcBite
    wideAnimation: WeaponArcBite
    damage:
      types:
        Slash: 3
        Piercing: 3
  - type: IdleSound #Misfits Change
  - type: SpamEmitSound #Misfits Change
    minInterval: 10
    maxInterval: 60
    sound:
      collection: F14NightstalkerIdle
      params:
        volume: -10
        maxDistance: 5
  - type: AggroSound #Misfits Change
    sound:
      collection: F14NightstalkerAttack
      params:
        volume: -3
        maxDistance: 10
  - type: SolutionManager
    solutions:
    - F14MobNightstalkerCubSolutionMelee
    - F14MobNightstalkerCubSolutionUdder
  - type: NamedSolutionRegeneration
    solution: melee
    generated:
      reagents:
      - ReagentId: F14NightstalkerVenom
        Quantity: 1

