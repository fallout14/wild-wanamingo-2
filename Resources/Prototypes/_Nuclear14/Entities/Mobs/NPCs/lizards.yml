- type: entity
  name: deathclaw
  id: F14MobDeathclaw
  parent: F14MobBaseHostileScaley
  description: Look at those claws.
  components:
  - type: NpcFactionMember #Misfits Add - Deathclaw is its own faction; hostile to everything except other deathclaws
    factions:
    - F14Deathclaw
  - type: Damageable
    damageModifierSet: F14ToughAnimal
  - type: Injurable
    damageContainer: Biological
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: deathclaw
      sprite: Nuclear14/Mobs/Animals/deathclaw.rsi
  - type: HTN
    rootTask:
      task: F14HostileCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
      MeleeRange: !type:Single
        1.5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.4 # TODO: Test this can fit through doors
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobState
    allowedStates:
      - Alive
      - Critical
      - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      400: Critical
      500: Dead
  - type: Stamina
    baseCritThreshold: 999
  - type: SlowOnDamage
    speedModifierThresholds:
      100: 1.05
      150: 1.1
      200: 1.15
  - type: DamageStateVisuals
    states:
      Alive:
        Base: deathclaw
      Critical:
        Base: crit
      Dead:
        Base: dead
  - type: MeleeWeapon
    altDisarm: false
    hidden: true
    soundHit:
      collection: F14DeathclawAttack #Misfits Change
    angle: 60
    animation: WeaponArcClaw
    wideAnimation: WeaponArcClaw
    damage:
      types:
        Blunt: 15
        Slash: 25
        Piercing: 5
    range: 2
  - type: IdleSound #Misfits Change
  - type: SpamEmitSound #Misfits Change
    minInterval: 10
    maxInterval: 30
    sound:
      collection: F14DeathclawIdle
      params:
        volume: -8
        maxDistance: 5
  - type: AggroSound #Misfits Change
    sound:
      collection: F14DeathclawAttack
      params:
        volume: -3
        maxDistance: 10
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 6
  - type: Hands
  - type: Puller
  - type: Tool
    speedModifier: 1.5
    qualities:
      - Prying
  - type: Prying
    pryPowered: !type:Bool
        true
    force: !type:Bool
      true
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Insulated
  # - type: GhostRole
    # prob: 0.5
    # makeSentient: true
    # name: deathclaw
    # description: You're a smart killer. Use tactics to hunt and stalk.
  - type: NoSlip
  - type: NoPull #Misfits Add - Deathclaws are too powerful to be grabbed
  # - type: Reproductive
    # breedChance: 0.05
    # birthPopup: reproductive-laid-egg-popup
    # makeOffspringInfant: false
    # partnerWhitelist:
      # tags:
      # - Deathclaw
    # offspring:
    # - id: F14FoodEggDeathclawFertilized
      # maxAmount: 1
  # - type: ReproductivePartner
  # - type: EggLayer
    # eggSpawn:
    # - id: F14FoodEggDeathclaw
  - type: Tag
    tags:
    - F14Deathclaw
  - type: Butcherable
    spawned:
    - id: F14FoodMeatRadRaw
      amount: 12
    - id: F14MaterialRawLeather1
      amount: 8

