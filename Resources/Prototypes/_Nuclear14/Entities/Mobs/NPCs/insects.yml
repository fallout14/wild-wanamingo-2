# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Mobs/NPCs/insects.yml

- type: entity
  name: bloatfly
  parent: N14MobBaseHostileInsect
  id: N14MobBloatfly
  description: A mutated floating bug with an infectious bite and parasitic stinger capable of launching larvae.
  components:
  - type: HTN
    rootTask:
      task: N14RangedHostileCompound
    blackboard:
      NavSmash: !type:Bool
        true
      MeleeRange: !type:Single
        1.5
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: bloatfly
      sprite: Nuclear14/Mobs/Insects/bloatfly.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.25
        density: 10
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: bloatfly
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: Stamina
    baseCritThreshold: 99
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 50
  - type: ReplacementAccent
    accent: mouse
  - type: BallisticAmmoProvider
    proto: N14BulletAcid
    capacity: 100
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1
  - type: Gun
    minAngle: 5
    maxAngle: 15
    angleIncrease: 2
    angleDecay: 4
    fireRate: 0.5
    availableModes:
      - FullAuto
    selectedMode: FullAuto
    soundGunshot: /Audio/Misfits/Mobs/Bloatfly/bloatfly_attack.ogg #Misfits Change
    useKey: false
  - type: Butcherable
    spawned:
    - id: N14MaterialAntChitin1
      amount: 1
    - id: N14FoodMeatRadRaw
      amount: 1
      prob: 0.75
    - id: N14FoodBloatflyAcidSac
      amount: 1
      prob: 0.75
  - type: AggroSound #Misfits Change
    sound:
      collection: N14BloatflyAttack
      params:
        volume: -3
        maxDistance: 10

#MARK: Giant Ant

- type: entity
  name: giant ant
  parent: N14MobBaseHostileInsect
  id: N14MobGiantAnt
  description: It's an ant...but giant. Watch for the nippers.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: giantant
      sprite: Nuclear14/Mobs/Insects/giantant.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.3
        density: 400
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: giantant
      Critical:
        Base: giantant
      Dead:
        Base: dead
  - type: Butcherable
    spawned:
    - id: N14MaterialAntChitin1
      amount: 2
    - id: N14FoodMeatRadRaw
      amount: 3
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 500
  - type: Temperature
  - type: TemperatureDamage
    heatDamageThreshold: 500
    coldDamageThreshold: 0
  - type: MeleeWeapon
    altDisarm: false
    hidden: true
    soundHit:
      collection: N14RadscorpionAttack #Misfits Change
    angle: 60
    animation: WeaponArcClaw
    wideAnimation: WeaponArcClaw
    damage:
      types:
        Blunt: 1.66667
        Slash: 1.66667
        Piercing: 1.66667
  - type: AggroSound #Misfits Change
    sound:
      collection: N14RadroachAttack
      params:
        volume: -3
        maxDistance: 10

#MARK: Giant Fire Ant

- type: entity
  name: giant fire ant
  parent: N14MobGiantAnt
  id: N14MobGiantFireAnt
  description: It's an ant...but giant and red. Watch for the nippers and bring some ointment.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
