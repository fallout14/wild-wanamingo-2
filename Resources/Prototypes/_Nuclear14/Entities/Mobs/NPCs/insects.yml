        volume: -3
        maxDistance: 10

#MARK: Radroach

- type: entity
  parent: Solution
  id: N14MobGiantFireAntSolutionMelee
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: melee
    solution:
      reagents:
      - ReagentId: FireToxin
        Quantity: 10

- type: entity
  name: radroach
  id: N14MobRadroach
  parent: N14MobBaseHostileInsect
  description: Stinking roaches survived the bombs.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: radroach
      scale: 0.75, 0.75
      sprite: Nuclear14/Mobs/Insects/radroach.rsi
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 5 # Corvax-Change
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.20
        density: 20
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      15: Dead
  - type: Stamina
    baseCritThreshold: 20
  - type: DamageStateVisuals
    states:
      Alive:
        Base: radroach
      Critical:
        Base: radroach
      Dead:
        Base: dead
  - type: MeleeWeapon
    altDisarm: false
    hidden: true
    soundHit:
      collection: N14RadroachAttack #Misfits Change
    angle: 60
    animation: WeaponArcBite
    wideAnimation: WeaponArcBite
    damage:
      types:
        Blunt: 0.666667
        Slash: 0.666667
        Piercing: 0.666667
  - type: IdleSound #Misfits Change
  - type: SpamEmitSound #Misfits Change
    minInterval: 10
    maxInterval: 60
    sound:
      collection: N14RadroachIdle
      params:
        volume: -12
        maxDistance: 5
  - type: AggroSound #Misfits Change
    sound:
      collection: N14RadroachAttack
      params:
        volume: -3
        maxDistance: 10
  - type: Butcherable
    spawned:
    - id: N14FoodMeatRadroachFillet
      amount: 1

