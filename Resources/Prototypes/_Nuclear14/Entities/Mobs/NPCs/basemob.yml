# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Mobs/NPCs/basemob.yml

- type: entity
  name: wasteland animal
  abstract: true
  id: N14MobBaseSimple
  parent: SimpleSpaceMobBase
  description: It's a dirty wasteland animal. Watch out for it's bite, it could be infectious.
  components:
  - type: Body
  - type: InputMover
  - type: ProximityNPC # Misfits fix — Didn't have comp to reduce tick load and activate ai
                        #TODO: make every NPC inherit from same base to avoid issues in future
  - type: MobMover
  - type: NpcFactionMember
    factions:
    - N14WastelandAnimal
  - type: Sprite
    drawdepth: Mobs # Replace this with a mob error or something
  - type: Physics
  - type: MovementSpeedModifier
    baseWalkSpeed : 2
    baseSprintSpeed : 3.9
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.30
        density: 20
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobState
    allowedStates:
      - Alive
      - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      15: Dead
  - type: MovementAlwaysTouching
  - type: Appearance
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Dead:
        Base: dead
  - type: Butcherable
    spawned:
    - id: N14FoodMeatRadRaw
      amount: 1
    - id: N14MaterialRawLeather1
      amount: 1
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: N14WastelandBlood
        Quantity: 50
  - type: Damageable
    damageModifierSet: N14WastelandAnimal
  - type: Injurable
    damageContainer: Biological
  - type: Puller
    needsHands: true
  - type: IgnitionSource
  - type: Grammar # Misfits Change - proper noun so names appear capitalized in says/emotes when possessed
    attributes:
      proper: true
  - type: Tag #Misfits Change - footstep sounds
    tags:
    - DoorBumpOpener
    - FootstepSound

#MARK: Base Hostile

- type: entity
  abstract: true
  id: N14MobBaseHostile
  parent: N14MobBaseSimple
  description: It's a dirty wasteland animal. Watch out for it's bite, it could be infectious.
  components:
  - type: NPCRetaliation # Aggro on the attacker when damaged from any range
    attackMemoryLength: 30
  - type: NpcFactionMember
    factions:
    - N14WastelandAnimal
  - type: ProximityNPC # Misfits Add — sleep distant NPCs to reduce tick load
  - type: HTN
    rootTask:
      task: N14RangedHostileCompound
    blackboard:
      NavSmash: !type:Bool
        true
      MeleeRange: !type:Single
        1.5
  - type: Sprite
    drawdepth: Mobs
  - type: MobState
    allowedStates:
      - Alive
      - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      15: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Dead:
        Base: dead
  - type: Butcherable
    spawned:
    - id: N14FoodMeatRadRaw
      amount: 1
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: N14WastelandBlood
        Quantity: 50
  - type: CombatMode
  - type: MeleeWeapon
    hidden: true
    attackRate: 2
    range: 1.5
    soundHit:
        path: /Audio/Effects/bite.ogg
    angle: 60
    animation: WeaponArcBite
    wideAnimation: WeaponArcBite
    damage:
      types:
        Blunt: 0.666667
        Slash: 0.666667
        Piercing: 0.666667
  - type: SolutionManager
    solutions:
    - N14MobBaseHostileSolutionMelee
  - type: MeleeChemicalInjector
    solution: melee
  - type: ReplacementAccent
    accent: genericAggressive

- type: entity
  parent: Solution
  id: N14MobBaseHostileSolutionMelee
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: melee
    solution:
      reagents:
      - ReagentId: Toxin
        Quantity: 0.1

- type: entity
  name: scaley wasteland animal
  abstract: true
  id: N14MobBaseHostileScaley
  parent: N14MobBaseHostile
  components:
  - type: Damageable
    damageModifierSet: N14Scale
  - type: Injurable
    damageContainer: Biological
  - type: Speech
    speechSounds: Squeak
  - type: ReplacementAccent
    accent: genericAggressive

