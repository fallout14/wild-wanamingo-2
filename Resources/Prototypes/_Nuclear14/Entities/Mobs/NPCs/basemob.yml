#MARK: Base Humanoid

- type: entity
  name: raider
  abstract: true
  id: N14MobBaseHostileRaider
  parent: N14MobBaseHostile
  components:
  - type: Damageable
  - type: Injurable
    damageContainer: MisfitsNPCBiological # Misfits Change
  - type: NoSlip
  - type: NpcFactionMember
    factions:
    - N14Raider
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.50
        density: 20
        mask:
        - MobMask
        layer:
        - MobLayer

- type: entity
  name: feral ghoul
  abstract: true
  id: N14MobBaseHostileFeral
  parent: N14MobBaseHostile
  description: A mean looking ghoul.
  components:
  - type: Damageable
    damageModifierSet: N14GhoulNPC
  # - type: NoSlip
  - type: Injurable
    damageContainer: MisfitsNPCBiological  # Misfits Change - no hunger/thirst damage for feral ghouls
  - type: NpcFactionMember
    factions:
    - N14Feral
  #- type: MobGhoulAggro #Misfits Change — removed: NPC feral ghouls should be hostile to player ghouls, not neutral.
  - type: HTN
    rootTask:
      task: N14HostileCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavSmash: !type:Bool
        true
      MeleeRange: !type:Single
        1.5
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Critical:
        Base: alive
      Dead:
        Base: dead
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.75
    baseSprintSpeed : 5.5
  - type: Hands
  - type: Puller
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.8
      80: 0.6
  - type: Appearance
  - type: PassiveDamage
    allowedStates:
    - Alive
    - Critical
    damage:
      types:
        Radiation: -5

#MARK: SuperMutant Base
# Misfits Change - Base entity for all Super Mutant NPC variants
# Ported from DesertRose2/desertrose supermutant.dm

- type: entity
  name: wave attacker
  abstract: true
  id: N14MobWave
  components:
  - type: ProximityNPC # Misfits Tweak — wave mobs inherit ProximityNPC from their hostile parent; override to stay awake so they rush immediately
    startAsleep: false
  - type: HTN
    rootTask:
      task: N14HostileCompound
    blackboard:
      NavInteract: !type:Bool
        true
      NavClimb: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
      ESP: !type:Bool
        true
      VisionRadius: !type:Single
        1000.0
      MeleeRange: !type:Single
        1.5
  - type: GhostTakeoverAvailable
  - type: GhostRole
    prob: 0.33
    makeSentient: true
    name: hostile wildlife # wave defence
    description: |
      Smash, break, kill!

- type: entity
  abstract: true
  id: N14MobWaveAnimal
  parent: N14MobWave

- type: entity
  abstract: true
  id: N14MobWaveInsect
  parent: N14MobWave

- type: entity
  abstract: true
  id: N14TameableMobBase
  parent: SimpleMobBase
  components:
#  - type: NPCTamingOnTouchBehaviour
#    follow: true
#    persistent: true
#    tameChance: 0.5
#    oneTry: false
#    successPopup: This pet is your friend now!
#    deniedPopup: This pet refused to be your friend.
#    whitelist:
#      components:
#      - HumanoidAppearance
  - type: ProximityNPC # Misfits Add — sleep distant NPCs to reduce tick load
  - type: HTN
    rootTask:
      task: SimpleFollowHostileCompound # HTN compound must include FollowCompound so pet can follow its owner
