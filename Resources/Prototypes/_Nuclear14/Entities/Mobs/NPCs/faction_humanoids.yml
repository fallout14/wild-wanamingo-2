# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Mobs/NPCs/faction_humanoids.yml

- type: entity
  name: Civil Militia
  parent: F14BaseMobRaider
  id: F14MobNPCTown
  suffix: NPC
  description: Uniformed angry mob ready to defend their homes, might not be the best at combat but he is trying his best.
  components:
    - type: NpcFactionMember
      factions:
      - F14Townsfolk
    - type: Loadout
      prototypes:
        - F14TownMilitiaNPC

- type: entity
  name: Town Enforcer
  parent: F14BaseMobRaider
  id: F14MobNPCTownGuard
  suffix: NPC
  description: Professional mercenary armed with a combat shotgun. He won't show mercy to anyone if they can't prove proof of their citizenship in a moment's notice.
  components:
    - type: NpcFactionMember
      factions:
      - F14TownsfolkSecureArea # Especialy made for the clinic & store, will attack anyone who steps in the storage and not a legal resident.
    - type: Gun
      minAngle: 23
      maxAngle: 104
      angleIncrease: 4
      angleDecay: 16
      fireRate: 1
      soundGunshot:
        collection: F14AutoShotgunGunshot
      useKey: false
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
    - type: BasicEntityAmmoProvider
      proto: F14ShellShotgun12
      capacity: 8
      count: 8
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 2
      rechargeSound:
        path: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
    - type: Loadout
      prototypes:
        - F14TownMilitiaGuardNPC
    - type: Sprite
      layers:
      - map: [ "enum.HumanoidVisualLayers.Chest" ]
      - map: [ "enum.HumanoidVisualLayers.Head" ]
      - map: [ "enum.HumanoidVisualLayers.Snout" ]
      - map: [ "enum.HumanoidVisualLayers.Eyes" ]
      - map: [ "enum.HumanoidVisualLayers.Eyelids" ]
      - map: [ "enum.HumanoidVisualLayers.OverEyes" ]
      - map: [ "enum.HumanoidVisualLayers.RArm" ]
      - map: [ "enum.HumanoidVisualLayers.LArm" ]
      - map: [ "enum.HumanoidVisualLayers.RLeg" ]
      - map: [ "enum.HumanoidVisualLayers.LLeg" ]
      - map: [ "enum.HumanoidVisualLayers.UndergarmentBottom" ]
      - map: [ "enum.HumanoidVisualLayers.UndergarmentTop" ]
      - map: ["jumpsuit"]
      - map: ["enum.HumanoidVisualLayers.LFoot"]
      - map: ["enum.HumanoidVisualLayers.RFoot"]
      - map: ["enum.HumanoidVisualLayers.LHand"]
      - map: ["enum.HumanoidVisualLayers.RHand"]
      - map: ["enum.HumanoidVisualLayers.Overlay"]
      - map: [ "gloves" ]
      - map: [ "shoes" ]
      - map: [ "ears" ]
      - map: [ "eyes" ]
      - map: [ "belt" ]
      - map: [ "id" ]
      - map: [ "outerClothing" ]
      - map: [ "back" ]
      - map: [ "neck" ]
      - map: [ "suitstorage" ]
      - map: [ "enum.HumanoidVisualLayers.SnoutCover" ]
      - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
      - map: [ "enum.HumanoidVisualLayers.Hair" ]
      - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
      - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
      - map: [ "enum.HumanoidVisualLayers.Tail" ]
      - map: [ "enum.HumanoidVisualLayers.TailOverlay" ]
      - map: [ "mask" ]
      - map: [ "head" ]
      - map: [ "pocket1" ]
      - map: [ "pocket2" ]
      - map: ["enum.HumanoidVisualLayers.Handcuffs"]
        color: "#ffffff"
        sprite: Objects/Misc/handcuffs.rsi
        state: body-overlay-2
        visible: false
      - sprite: Nuclear14/Objects/Weapons/Guns/Shotguns/combat_shotgun.rsi
        state: inhand-right  # Only part we change, the gun sprite.

# Midwestern chapter's humanoid NPCs for event making and such.

- type: entity
  name: Chapter Serf
  parent: F14BaseMobRaider
  id: F14MobNPCMBoSSerf
  suffix: NPC
  description: A servant of the Brotherhood chapter, not a full member. He likely works for food and shelter.
  components:
    - type: NpcFactionMember
      factions:
      - F14BrotherhoodOfSteelSecureArea
    - type: Loadout
      prototypes:
        - F14MBoSSerfNPC

- type: entity
  name: BoS Knight
  parent: F14BaseMobRaider
  id: F14MobNPCMBoSKnight
  suffix: NPC
  description: A soldier of the Brotherhood, not the most skilled and easily forgetable. Still, he might be dangerous.
  components:
    - type: NpcFactionMember
      factions:
      - F14BrotherhoodOfSteelSecureArea
    - type: Gun
      minAngle: 4
      maxAngle: 9
      angleIncrease: 4
      angleDecay: 16
      fireRate: 2.5
      soundGunshot:
        collection: F14CarbineGunshot
      useKey: false
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
    - type: BasicEntityAmmoProvider
      proto: F14Cartridge556Rifle
      capacity: 35
      count: 35
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 2
      rechargeSound:
        path: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
    - type: Loadout
      prototypes:
        - F14MBoSKnightNPC

- type: entity
  name: NCR Army Guard
  parent: F14BaseMobRaider
  id: F14MobNPCNCRGuard
  suffix: NPC
  description: An trooper in the uniform of the NCR Army's Military Police section. He's here to keep the order by spraying lead.
  components:
    - type: NpcFactionMember
      factions:
      - F14NCRSecureArea
    - type: Loadout
      prototypes:
        - F14NCRAGuardNPC

