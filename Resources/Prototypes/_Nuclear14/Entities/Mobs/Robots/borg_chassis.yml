# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Mobs/Robots/borg_chassis.yml

- type: entity
  parent: F14BaseRobotChassis
  id: F14RobotProtectron
  name: protectron
  components:
  - type: IdleSound # #Misfits Change: give protectrons their ambient voice lines again
  - type: SpamEmitSound # #Misfits Change: periodic idle chatter from the Protectron sound set
    minInterval: 12
    maxInterval: 45
    sound:
      collection: F14ProtectronIdle
      params:
        volume: -7
        maxDistance: 6
  - type: Sprite
    sprite: Nuclear14/Mobs/Robots/protectron.rsi
    layers:
    - state: icon
      map: ["movement"]
    - state: on # #Misfits Fix: lit indicator; BorgSystem overrides at runtime
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: on # #Misfits Fix: 'on' RSI state is the lit variant used as the flashlight glow overlay
      shader: unshaded
      map: ["light"]
      visible: false
  - type: SpriteMovement
    movementLayers:
      movement:
        state: walking
    noMovementLayers:
      movement:
        state: icon
  # - type: Construction
    # node: cyborg
  - type: Tag # #Misfits Change: Protectron walks, so it should have footstep sounds
    tags:
    - DoorBumpOpener
    - CanPilot
    - FootstepSound
  - type: Speech
    speechVerb: Robotic
  - type: Inventory
    templateId: borgShort
  - type: ActivatableUI
    key: enum.BorgUiKey.Key
  - type: WiresPanel
  - type: ActivatableUIRequiresPanel
  - type: Lock
    locked: true
  - type: UIRequiresLock
    userInterfaceKeys:
    - enum.BorgUiKey.Key
  - type: GhostRole
    prob: 1
    makeSentient: true
    name: Friendly Protectron
    description: |
      Do as your masters say with a literal but reasonable level of logic.

- type: entity
  parent: F14RobotProtectron
  id: F14RobotProtectronBuilder
  name: protectron builder
  components:
  - type: Sprite
    sprite: Nuclear14/Mobs/Robots/protectron-builder.rsi
    layers:
    - state: icon
      map: ["movement"]
    - state: icon
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: icon
      shader: unshaded
      map: ["light"]
      visible: false
  - type: SpriteMovement
    movementLayers:
      movement:
        state: walking
    noMovementLayers:
      movement:
        state: icon
  - type: BorgChassis
    maxModules: 4
    moduleWhitelist:
      tags:
      - BorgModuleGeneric
      - BorgModuleCargo
      - BorgModuleEngineering
    hasMindState: on
    noMindState: off
  # - type: Construction
    # node: mining
  - type: Inventory
    templateId: borgTall
  - type: GhostRole
    prob: 1
    makeSentient: true
    name: Friendly Protectron Builder
    description: |
      Do as your masters say with a literal but reasonable level of logic.
    

