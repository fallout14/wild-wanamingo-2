# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Clothing/Neck/scarfs.yml

- type: entity
  parent: ClothingNeckBase
  id: F14ClothingNeckRedScarf
  name: red scarf
  description: A short red scarf.
  components:
  - type: Sprite
    sprite: Nuclear14/Clothing/Neck/Bandanas/redscarf.rsi
  - type: Clothing
    sprite: Nuclear14/Clothing/Neck/Bandanas/redscarf.rsi
  - type: ToggleableClothing
    clothingPrototype: F14ClothingMaskRedMask
    requiredSlot: neck
    slot: mask
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot

