# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Clothing/Neck/pins.yml

- type: entity
  parent: ClothingNeckPinBase
  id: F14ClothingNeckPinNCRRecruit
  name: recruit pin
  description: A worn Republic Armed Forces badge showing the wearer's rank.
  components:
  - type: RankTitle
    rankTitle: Recruit
  - type: Sprite
    sprite: Nuclear14/Clothing/Neck/Misc/pins.rsi
    layers:
    - state: recruit
  - type: Clothing
    sprite: /Nuclear14/Clothing/Neck/Misc/pins.rsi
    clothingVisuals:
      neck:
      - state: empty-equipped
  - type: Tag
    tags:
    - F14SuperMutantWearable

