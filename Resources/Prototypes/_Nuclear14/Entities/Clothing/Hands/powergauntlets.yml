# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Clothing/Hands/powergauntlets.yml

- type: entity
  parent: ClothingHandsBase
  id: F14ClothingPAGauntlets
  name: power armor gauntlets
  description: A pair of power suit gauntlets for rough work and battle.
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Sprite
    sprite: Nuclear14/Clothing/Hands/PowerGauntlets/basic.rsi
    scale: 0.75, 0.75
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    slots: gloves
  - type: Tag
    tags:
    - F14SuperMutantWearable
  - type: Insulated # Don't electrocute my Paladins!
  - type: MeleeWeapon # Misfits Change - BoS hardsuit punch: wall destruction, slight reach and damage boost
    soundHit:
      collection: MetalThud
    range: 1.3
    attackRate: 1.0
    damage:
      types:
        Blunt: 18
        Structural: 12
    animation: WeaponArcFist
    wideAnimation: WeaponArcFist
    mustBeEquippedToUse: true
  - type: MeleeThrowOnHit
    speed: 10
    distance: 0.25
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.925
        Slash: 0.925
        Piercing: 0.95
        Heat: 0.95

- type: entity
  parent: F14ClothingPAGauntlets
  id: F14ClothingPAGauntletsTesla
  name: tesla armor gauntlets
  description: A pair of power suit gauntlets that allows people near the user feel energised.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Nuclear14/Clothing/Hands/PowerGauntlets/tesla.rsi
  - type: MeleeWeapon
    attackRate: 1.0
    damage:
      types:
        Blunt: 12
        Shock: 3 # Tesla armour should have shocking punches.
        Structural: 6

