# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Clothing/Belt/belts.yml

- type: entity
  parent: ClothingBeltStorageBase
  id: N14ClothingBeltStorageBase
  name: Abstract Belt
  description: You shouldn't be seeing this.
  abstract: true
  components:
  - type: Storage
    whitelist:
      tags:
        - CigPack
        - N14AmmoCell
        # #Cythisiax Added - every N14 belt can store the Wendover map (Document)
        - Document
      components:
        - BallisticAmmoProvider
        - CartridgeAmmo

- type: entity
  parent: N14ClothingBeltStorageBase
  id: N14ClothingBeltBoSCarrier
  name: Brotherhood of Steel Carrier
  description: A simple black carrier capable of holding all kind of ammo.
  components:
  - type: Sprite
    sprite: Nuclear14/Clothing/Belt/boswebbing.rsi
  - type: Clothing
    sprite: Nuclear14/Clothing/Belt/boswebbing.rsi
  - type: Appearance
  # #Cythisiax Added - classic BoS carrier carries a welder for field repairs
  - type: Storage
    whitelist:
      tags:
        - CigPack
        - N14AmmoCell
        - N14Welder
        - Document
        - ThrowingKnife
      components:
        - BallisticAmmoProvider
        - CartridgeAmmo

- type: entity
  parent: N14ClothingBeltStorageBase
  id: N14ClothingBeltBoSWebbing
  name: Brotherhood of Steel Webbing
  description: A simple black carrier, capable of holding all kind of ammo and medicine for field-use.
  components:
  - type: Sprite
    sprite: Nuclear14/Clothing/Belt/midwestboswebbing.rsi
  - type: Clothing
    sprite: Nuclear14/Clothing/Belt/midwestboswebbing.rsi
  - type: Appearance
  - type: Storage
    whitelist:
      tags:
        - Wrench
        - Bottle
        - Spray
        - Brutepack
        - Bloodpack
        - Gauze
        - Ointment
        - CigPack
        - PillCanister
        - Radio
        - DiscreteHealthAnalyzer
        - SurgeryTool
        - CigPack
        - N14AmmoCell
        # #Cythisiax Added - BoS webbing carries welders for field repairs (also covers Squire webbings)
        - N14Welder
        # #Cythisiax Added - tool sterilizers (Abraxo) & Wendover map (Document)
        - N14Abraxo
        - Document
        - ThrowingKnife
      components:
        - Injector
        - Pill
        - HandLabeler
        - BallisticAmmoProvider
        - CartridgeAmmo

