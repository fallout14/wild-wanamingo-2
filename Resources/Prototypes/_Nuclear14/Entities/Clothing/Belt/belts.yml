  # #Cythisiax Added - military carrier boost: reuses the upstream salvage-rig sprite, so let it carry tools/meds/radio like other webbing, not just ammo
  - type: Storage
    whitelist:
      tags:
        - Wrench
        - Bottle
        - Spray
        - Brutepack
        - Bloodpack
        - Gauze
        - Ointment
        - CigPack
        - PillCanister
        - Radio
        - DiscreteHealthAnalyzer
