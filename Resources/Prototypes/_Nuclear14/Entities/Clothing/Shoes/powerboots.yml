# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Clothing/Shoes/powerboots.yml

- type: entity
  parent: ClothingShoesBase
  id: F14ClothingPABoots
  name: power armor boots
  description: A pair of mechanical boots made from durable materials.
  categories: [ HideSpawnMenu ]
  components:
  - type: ContainerContainer  # spawn state
    containers:
      item: !type:ContainerSlot {}
  - type: Appearance
  - type: Sprite
    sprite: Nuclear14/Clothing/Shoes/PowerBoots/basic.rsi
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    slots: [ feet ]
  - type: NoSlip # Power armour users shouldn't slip.
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.925
        Slash: 0.925
        Piercing: 0.95
        Heat: 0.95
  - type: FootstepModifier
    footstepSoundCollection:
      collection: F14FootstepPowerArmor
  - type: Matchbox
  - type: ItemSlots
    slots:
      item:
        name: clothing-boots-sidearm
        whitelist:
          tags:
          - Knife
          - Sidearm
  - type: Tag
    tags:
    - F14SuperMutantWearable

