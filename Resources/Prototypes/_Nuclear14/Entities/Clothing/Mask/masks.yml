- type: entity
  parent: ClothingMaskBase
  id: F14ClothingMaskBrownBalaclava
  name: brown balaclava
  description: A piece of cloth with a hole in it to see, not really a big invention from the pre-war but it can be warm enough to protect from the cold. This one is brown.
  components:
  - type: Sprite
    sprite: Nuclear14/Clothing/Mask/brownbalaclava.rsi
  - type: Clothing
    sprite: Nuclear14/Clothing/Mask/brownbalaclava.rsi
  - type: IngestionBlocker
  - type: BreathMask
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
  # #Misfits Fix - Brown balaclava should hide identity like other balaclavas.
  - type: IdentityBlocker

