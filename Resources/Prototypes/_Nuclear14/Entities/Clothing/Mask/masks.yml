# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Clothing/Mask/masks.yml

- type: entity
  parent: ClothingMaskPullableBase
  id: F14ClothingMaskHockey
  name: hockey mask
  description: A light white mask with red lines and holes to breath through.
  components:
  - type: Sprite
    sprite: Nuclear14/Clothing/Mask/hockeymask.rsi
  - type: Clothing
    sprite: Nuclear14/Clothing/Mask/hockeymask.rsi
  - type: Mask
  - type: IngestionBlocker
  # #Misfits Fix - Face-covering masks should block identification.
  - type: IdentityBlocker
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
    priceMultiplier: 0.5
  - type: Tag
    tags:
    - WhitelistChameleon

