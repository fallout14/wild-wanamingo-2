# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Clothing/Ears/headsets_alt.yml

- type: entity
  abstract: true
  parent: Clothing
  id: N14ClothingHeadsetAlt
  name: headset
  description: An earpiece with an intercom built into it, almost like a radio? Takes encryption keys.
  components:
  - type: Headset
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
      - MisfitsEncryptionKeyWastelandGlobal
  - type: EncryptionKeyHolder
    keySlots: 4
  - type: Sprite
    scale: 0.75, 0.75
    state: icon
  - type: Clothing
    # equippedPrefix: alt
    slots:
    - ears
  - type: Item
    size: Small

- type: entity
  parent: N14ClothingHeadsetAlt
  id: N14ClothingHeadsetVaulttec #No longer used, all Vault dwellers got the same headset now
  name: Vault-Tec over-ear headset
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyStationMaster
      - MisfitsEncryptionKeyWastelandGlobal
  - type: Sprite
    sprite: Clothing/Ears/Headsets/centcom.rsi
  - type: Clothing
    sprite: Clothing/Ears/Headsets/centcom.rsi

