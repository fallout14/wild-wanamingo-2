# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Clothing/Ears/headsets_light.yml

- type: entity
  abstract: true
  parent: Clothing
  id: F14ClothingHeadsetLightScribe
  name: headset
  description: A modular intercom that fits over the head. Takes encryption keys and has a powerful light.
  components:
  - type: Item
    heldPrefix: off
  - type: Headset
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
      cell_slot: !type:ContainerSlot
  - type: Sprite
    sprite: Nuclear14/Clothing/Ears/bosheadset.rsi
    layers:
    - state: icon
    - state: light-icon
      shader: unshaded
      visible: false
      map: [ "light" ]
  - type: Clothing
    sprite: Nuclear14/Clothing/Ears/bosheadset.rsi
    equippedPrefix: off
    slots:
    - ears
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
      - F14EncryptionKeyWastelandGlobal
  - type: EncryptionKeyHolder
    keySlots: 4
  - type: Appearance
  - type: PointLight
    enabled: false
    radius: 4.5
    energy: 1
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    netsync: false
  - type: HandheldLight
    addPrefix: false
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
  - type: LightBehaviour
    behaviours:
      - !type:FadeBehaviour
        id: radiating
        interpolate: Linear
        maxDuration: 2.0
        startValue: 3.0
        endValue: 2.0
        isLooped: true
        property: AnimatedRadius
        enabled: false
        reverseWhenFinished: true
      - !type:PulseBehaviour
        id: blinking
        interpolate: Nearest
        maxDuration: 1.0
        startValue: 0.1
        endValue: 2.0
        isLooped: true
        property: AnimatedRadius
        enabled: false
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: on-equipped-EARS
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium


