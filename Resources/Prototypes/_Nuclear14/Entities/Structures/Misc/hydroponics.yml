# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Misc/hydroponics.yml

- type: entity
  parent: BaseStructure
  id: F14CompostBox
  name: compost box
  # #Misfits Fix: Reworked to function as a pour-in solution container (like a bucket).
  # The old ItemSlots + SolutionContainerMixer approach couldn't extract reagents from
  # slotted items (FinishMix uses TryGetFitsInDispenser which none of our items had).
  # Now: click F14Dung or produce items on the box to pour their reagents in; the
  # Composting / CompostingOrganic reactions fire automatically when thresholds are met.
  description: Pour animal dung or organic matter in here to produce compost.
  placement:
    mode: SnapgridCenter
  components:
  - type: InteractionOutline
  - type: Damageable # We need to make N14BaseStructureWood etc to reparent in bulk for destruction.
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: ReactionMixer
    reactionTypes:
    - F14Composting
  - type: SolutionContainerMixer # #Misfits Fix: Triggers reactions when player clicks to mix,
    mixDuration: 3                # spawning F14CompostRotted from Dung or CompostingOrganic reactions.
    mixingSound:
      path: /Audio/Machines/buzz_loop.ogg
      params:
        volume: -5
  - type: Solution
    id: composting
    solution:
      maxVol: 250
  - type: RefillableSolution
    solution: composting
  - type: ExaminableSolution
    solution: composting
  - type: DeleteOnSolutionEmpty # #Misfits Add: Clear spent solution after reaction completes.
    solution: composting
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Hydroponics/equipment.rsi
    snapCardinals: true
    # netsync: false # #Misfits Fix - this was preventing the sprite from rendering on clients
    state: compostbin
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false


# Seed Extractor

- type: entity
  parent: BaseStructure
  id: F14SeedExtractor
  name: seed extractor
  description: Extracts seeds from produce.
  components:
  - type: ContainerContainer  # spawn state
    containers:
      machine_board: !type:Container
        ents: []
      machine_parts: !type:Container
        ents: []
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Hydroponics/equipment.rsi
    snapCardinals: true
    netsync: false
    state: seedextractor
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.4,0.25,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: SeedExtractor
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false
  - type: Construction
    graph: F14SeedExtractor
    node: seedextractor
  - type: Anchorable
  - type: Rotatable
  - type: Machine
    board: SeedExtractorMachineCircuitboard

- type: entity
  id: F14SeedExtractorFrame
  name: seed extractor frame
  parent: BaseStructure
  description: Extracts seeds from produce. This one isn't finished building
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Hydroponics/equipment.rsi
    layers:
    - state: seedextractor0
      map: [ "enum.ConstructionVisuals.Layer" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          seedextractorhalf: { state: seedextractor0 }
          seedextractorpot: { state: seedextractor1 }
          seedextractorreinforced: { state: seedextractor2 }
          seedextractorunscrewed: { state: seedextractor3 }
  - type: Construction
    graph: F14SeedExtractor
    node: seedextractorhalf

# Soils and Planters

- type: entity
  id: F14Soil
  name: soil
  description: Looks good for planting things in.
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.1"
        density: 190
        hard: false
        mask:
        - FullTileMask
        layer:
        - FullTileMask
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Sprite
    sprite: Structures/Hydroponics/misc.rsi
    state: soil
    snapCardinals: true
    noRot: true
  - type: PlantTray
    drawWarnings: false
  - type: Solution
    id: soil
    solution:
      maxVol: 200
  - type: RefillableSolution
    solution: soil
    maxRefill: 50
  - type: Transform
    anchored: true
  - type: Reactive
    reactions:
    - reagents: [Water]
      methods: [Touch, Ingestion, Injection]
      effects:
      - !type:AddReagentToSolution
        reagent: Water
        solution: soil
  - type: Appearance
  - type: PlantTrayVisuals

- type: entity
  parent: BaseStructure
  id: F14HydroponicsPlanterEmpty
  name: planter
  description: A wooden planter for growing things. Just needs soil.
  components:
  - type: Sprite
    layers:
      - sprite: Nuclear14/Structures/Hydroponics/planterbox.rsi
        state: empty
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.1"
        density: 190
        hard: true
        mask:
        - MachineMask
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: F14Planter
    node: box

- type: entity
  parent: F14Soil
  id: F14HydroponicsPlanter
  name: planter
  description: A wooden planter with soil for growing things in.
  components:
  - type: Sprite
    layers:
      - sprite: Nuclear14/Structures/Hydroponics/planterbox.rsi
        state: icon
      - sprite: Nuclear14/Structures/Hydroponics/planterbox.rsi
        state: redflag
        map: [ "health_alert" ]
        visible: false
      - sprite: Nuclear14/Structures/Hydroponics/planterbox.rsi
        state: blueflag
        map: [ "water_alert" ]
        visible: false
      - sprite: Nuclear14/Structures/Hydroponics/planterbox.rsi
        state: yellowflag
        map: [ "nutri_alert" ]
        visible: false
      - sprite: Nuclear14/Structures/Hydroponics/planterbox.rsi
        state: redflag
        map: [ "undefined_alert" ]
        visible: false
      - sprite: Nuclear14/Structures/Hydroponics/planterbox.rsi
        state: greenflag
        map: [ "harvest_alert" ]
        visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PlantTrayVisuals.HealthLight:
        health_alert:
          True: { visible: true }
          False: { visible: false }
      enum.PlantTrayVisuals.WaterLight:
        water_alert:
          True: { visible: true }
          False: { visible: false }
      enum.PlantTrayVisuals.NutritionLight:
        nutri_alert:
          True: { visible: true }
          False: { visible: false }
      enum.PlantTrayVisuals.AlertLight:
        undefined_alert:
          True: { visible: true }
          False: { visible: false }
      enum.PlantTrayVisuals.HarvestLight:
        harvest_alert:
          True: { visible: true }
          False: { visible: false }
  - type: PlantTray
    drawWarnings: true
  - type: AmbientSound
    volume: -9
    range: 5
    sound:
      path: /Audio/Ambience/Objects/flowing_water_open.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: F14Planter
    node: Planter
