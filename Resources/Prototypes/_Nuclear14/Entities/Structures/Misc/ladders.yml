# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Misc/ladders.yml

- type: entity
  id: N14BaseLadder
  name: ladder
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Misc/ladderss13.rsi
    noRot: true
    netsync: false
    offset: 0, 0.25
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Physics
    canCollide: true
    bodyStatus: OnGround
    bodyType: Static
  - type: Tag
    tags:
      - Structure
  - type: InteractionOutline
  - type: Portal # WW: Wizden portal (was Warper)
    canTeleportToOtherMaps: true
    randomTeleport: false
  - type: F14PortalLink
    linkId: ""
  - type: Fixtures
    fixtures:
      portalFixture:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        hard: false

- type: entity
  parent: N14BaseLadder
  id: N14LadderTop
  suffix: top
  description: The top of a ladder. Use it to go down.
  components:
  - type: Sprite
    state: ladder_top
    

- type: entity
  parent: N14BaseLadder
  id: N14LadderBottom
  suffix: bottom
  description: The bottom of a ladder. Use it to go up.
  components:
  - type: Sprite
    state: ladder_bottom
  - type: Fixtures
    fixtures:
      portalFixture:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        hard: false
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.0,-1.0,0.3,0.1"
        density: 100
        mask:
        - MachineMask
        layer:
        - MidImpassable
        
# MS13 Sprites

- type: entity
  parent: N14LadderTop
  id: N14LadderTopBunkerOpen
  name: bunker entrance
  suffix: open
  description: Looks like it leads down somewhere.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Misc/laddersms13.rsi
    state: bunker_open
    

- type: entity
  parent: N14LadderTop
  id: N14LadderTopManholeOpen
  name: manhole
  suffix: open
  description: Looks like it leads down somewhere.
  components:
  - type: Sprite
    drawdepth: FloorTiles
    sprite: Nuclear14/Structures/Misc/laddersms13.rsi
    state: manhole_open
    

- type: entity
  parent: N14LadderTop
  id: N14LadderSquareTop
  suffix: square
  description: Looks like it leads down somewhere.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Misc/laddersms13.rsi
    state: ladder01
    

- type: entity
  parent: N14LadderBottom
  id: N14LadderSquareBottom
  suffix: bottom, square
  description: The bottom of a ladder. Use it to go up.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Misc/laddersms13.rsi
    state: ladder10
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.25,0,0.25,0.5"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        

- type: entity
  parent: N14LadderSquareBottom
  id: N14LadderSquareMid
  suffix: mid, square
  description: The middle of a ladder. Up or down.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Misc/laddersms13.rsi
    state: ladder11
    

- type: entity
  parent: N14BaseLadder
  id: N14LadderRopeTop1
  suffix: rope, top
  name: climbing rope
  description: The top of a rope. Going down!
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Misc/laddersms13.rsi
    state: rope
    

- type: entity
  parent: N14BaseLadder
  id: N14LadderRopeBottom1
  suffix: rope, bottom
  name: climbing rope
  description: The bottom of a rope. Going up!
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Misc/laddersms13.rsi
    state: rope_down
    

- type: entity
  parent: BaseStructure
  id: N14LadderTopBunkerClosed
  name: bunker entrance
  suffix: closed
  description: A closed up entrance to a bunker.
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics  # spawn state
    canCollide: False
  - type: Sprite
    sprite: Nuclear14/Structures/Misc/laddersms13.rsi
    state: bunker_closed
    noRot: true
    netsync: false
    offset: 0, 0.25
  - type: Transform
    anchored: true
  - type: Fixtures
  

- type: entity
  parent: N14LadderTopBunkerClosed
  id: N14LadderTopManholeClosed
  name: manhole cover
  suffix: closed
  description: A closed up entrance to a bunker.
  components:
  - type: Physics  # spawn state
    canCollide: False
  - type: Sprite
    drawdepth: FloorTiles
    state: manhole_closed

