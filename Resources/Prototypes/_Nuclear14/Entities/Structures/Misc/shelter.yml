# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Misc/shelter.yml

- type: entity
  parent: BaseStructure
  id: F14PulowskiShelterNew
  name:  Pulowski Preservation Shelter
  description: "Pulowski: Nuclear protection on a budget!"
  components:
  - type: Sprite
    scale: 0.54, 0.54
    offset: 0, 0.5
    drawdepth: FloorObjects
    noRot: true
    sprite: Nuclear14/Structures/Misc/shelternew.rsi
    layers:
    - state: open
      map: ["base"]
  - type: InteractionOutline
  - type: Cryostorage
  - type: Physics
    canCollide: false
  - type: DragInsertContainer
    containerId: storage
  - type: ExitContainerOnMove
    containerId: storage
  - type: ContainerContainer
    containers:
      storage: !type:ContainerSlot
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CryostorageVisuals.Full:
        base:
          True: { state: closed }
          False: { state: open }

- type: entity
  parent: F14PulowskiShelterNew
  id: F14PulowskiShelterWorn
  name:  Pulowski Preservation Shelter
  description: "Pulowski: Nuclear protection on a budget!"
  components:
  - type: Sprite
    noRot: true
    sprite: Nuclear14/Structures/Misc/shelterworn.rsi
    layers:
    - state: open
      map: ["base"]
