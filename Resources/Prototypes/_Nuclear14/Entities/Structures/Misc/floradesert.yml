- type: entity
  parent: F14FloraDesertCactus
  id: F14FloraTreeBald
  name: bald tree
  description: "What? Even trees go bald."
  components:
  - type: Sprite  # MS13 art
    sprite: MojaveSun/Objects/Decoration/Flora/trees.rsi
    state: bald
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.2,-1.8,0.2,-1.4"
        density: 1000
        layer:
        - WallLayer

- type: entity
  parent: F14FloraTreeBald
  id: F14FloraTreePine
  name: pine tree
  description: It has an almost overwhelming scent.
  components:
  - type: Sprite
    layers:
    - state: pine_1
      map: [ "tree" ]
  - type: RandomSprite
    available:
      - tree:
          pine_1: ""
          pine_1_alt: ""

