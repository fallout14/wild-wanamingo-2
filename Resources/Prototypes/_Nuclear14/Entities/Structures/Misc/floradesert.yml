# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Misc/floradesert.yml

- type: entity
  parent: BaseTree
  id: F14FloraDesertCactus
  name: Cactus
  description: Some kind of wasteland flora.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Misc/floradesert.rsi
    state: cactus
    offset: 0,0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.7,-1.2,-0.4,-0.3"
        density: 1000
        layer:
        - WallLayer

- type: entity
  parent: F14FloraDesertCactus
  id: F14FloraDesertTree1
  name: "Yucca Brevifolia"
  description: A beautiful Joshua Tree, native to the Mojave Desert. Despite looking much like a tree, its actually a succulent. But it'll be a challenge to find anyone who actually cares about the distinction around these parts.
  components:
  - type: Sprite
    state: joshua_1
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.2,-1.2,0.3,-0.3"
        density: 1000
        layer:
        - WallLayer

- type: entity
  parent: F14FloraDesertTree1
  id: F14FloraDesertTree2
  components:
  - type: Sprite
    state: joshua_2

- type: entity
  parent: F14FloraDesertTree1
  id: F14FloraDesertTree3
  components:
  - type: Sprite
    state: joshua_3

- type: entity
  parent: F14FloraDesertTree1
