- type: entity
  parent: BaseStructure
  id: N14WorkbenchChemistryset
  description: A chemistry set for crafting drugs and compounds
  name: chemical set
  components:
  - type: Construction
    graph: N14WorkbenchChemistryset
    node: WorkbenchChemistryset
  - type: InteractionOutline
  - type: Sprite
    sprite: Nuclear14/Structures/Misc/workbenches.rsi
    state: chemicalset
    drawdepth: SmallObjects
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5" # Misfit Change
        density: 1500
        mask:
        - TabletopMachineMask
  - type: ActivatableUI
    key: enum.ChemMasterUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ChemMasterUiKey.Key:
        type: ChemMasterBoundUserInterface
  - type: ChemMaster
    pillDosageLimit: 20
  - type: ContainerContainer
    containers:
      beakerSlot: !type:ContainerSlot
      outputSlot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      beakerSlot:
        whitelist:
          components:
          - FitsInDispenser
      outputSlot:
        whitelistFailPopup: chem-master-component-cannot-put-entity-message
        whitelist:
          tags:
          - Bottle
          - PillCanister
  - type: Solution
    id: buffer
    solution:
      maxVol: 10000 # #Misfits Tweak - cap buffer to prevent unlimited super-chem stacking
  - type: SolutionManager
    solutions:
    - N14WorkbenchChemistrysetSolutionPillBuffer
  - type: DumpableSolution
    solution: buffer
  - type: Anchorable
  - type: Rotatable
  # #Misfits
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice

- type: entity
  parent: Solution
  id: N14WorkbenchChemistrysetSolutionPillBuffer
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: pillBuffer
    solution:
      maxVol: 1000

