# ID Printer

- type: entity
  parent: BaseLathe
  id: N14WorkbenchIDPrinter # Circuit imprinter parent of this
  description: An ID printer.
  name: ID Printer
  abstract: true # Base off of this per faction.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Machines/circuit_imprinter.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: [ "enum.LatheVisualLayers.IsRunning" ]
    - state: unlit
      shader: unshaded
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
    - state: panel
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot # Corvax-Change
  - type: Lathe
    producingSound: /Audio/Machines/circuitprinter.ogg
    idleState: icon
    runningState: building

