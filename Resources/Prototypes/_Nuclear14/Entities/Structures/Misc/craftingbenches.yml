# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Misc/craftingbenches.yml

- type: entity
  parent: BaseStructure
  id: N14WorkbenchBase
  description: A workbench with metal working tools for crafting.
  name: workbench
  abstract: true
  components:
  - type: InteractionOutline
  - type: Appearance
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,0,1.25,0.3"
        density: 3000
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Nuclear14/Structures/Misc/workbenches.rsi
    state: workbench
    # Misfit Remove: Fix the offset issue with construction benches
    offset: 0.5, 0
  - type: Lathe
  - type: MaterialStorage
  - type: ActivatableUI
    key: enum.LatheUiKey.Key
  - type: UserInterface
    interfaces:
      enum.LatheUiKey.Key:
        type: LatheBoundUserInterface
  - type: ExtensionCableReceiver
  - type: ApcPowerReceiver
    needsPower: false
  - type: Anchorable
  - type: Rotatable
  - type: Tag
    tags:
    - CorvaxWorkbench

- type: entity
  parent: N14WorkbenchBase
  id: N14WorkbenchWeaponbench
  description: A workbench with weapon working tools for crafting.
  name: weapon workbench
  components:
  - type: Construction
    graph: N14WorkbenchWeaponbench
    node: WorkbenchWeaponbench
  - type: Sprite
    state: weaponbench
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.LatheUiKey.Key:
        type: LatheBoundUserInterface
  # - type: Craftable  # #Misfits Remove: Stalker14 crafting system
  - type: Storage
    maxItemSize: Ginormous
    grid:
    - 0,0,12,9
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
      - N14Scrap
  - type: Lathe
    idleState: icon
    runningState: icon # change this
    staticPacks:
    - F14WorkbenchWeaponbenchStatic

