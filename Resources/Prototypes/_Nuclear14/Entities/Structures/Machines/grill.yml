# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Machines/grill.yml

- type: entity
  id: F14CookingStove
  parent: KitchenElectricGrill
  name: stove
  description: A pre-war stove for cooking things.
  components:
  - type: Physics
  - type: Fixtures
    fixtures:
      itemcollide:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.2,0.3,0.5"
        layer:
        - HighImpassable
        hard: false
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.3,-0.2,0.3,0.5"
        density: 190
        mask:
        - HalfWallLayer
        layer:
        - HalfWallLayer
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Structures/Decoration/crafting_junk.rsi
    snapCardinals: false
    drawdepth: Objects
    noRot: true
    layers:
    - state: stove
    - map: ["enum.EntityHeaterVisuals.Setting"]
      shader: unshaded
      visible: false
  - type: Rotatable
  - type: Transform
    noRot: false
  - type: GenericVisualizer
    visuals:
      enum.EntityHeaterVisuals.Setting:
        enum.EntityHeaterVisuals.Setting:
          Off: { visible: false }
          Low: { visible: true, state: stove_on }
          Medium: { visible: true, state: stove_on }
          High: { visible: true, state: stove_on }
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false
  - type: UnpoweredHeater
  # #Misfits Change /Add/ - Keep the stove audible while it is actively heating.
  - type: SpamEmitSound
    enabled: false
    minInterval: 20
    maxInterval: 45
    sound:
      path: /Audio/Misfits/Machines/steam_long.ogg
      params:
        volume: -8
        maxDistance: 5
  - type: GrillHeaterSound
    startSound:
      path: /Audio/Misfits/Machines/grill.ogg

- type: entity
  id: F14CookingStoveWide
  parent: F14CookingStove
  suffix: wide
  components:
  - type: Sprite
    layers:
    - state: stove_wide
    - map: ["enum.EntityHeaterVisuals.Setting"]
      shader: unshaded
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.EntityHeaterVisuals.Setting:
        enum.EntityHeaterVisuals.Setting:
          Off: { visible: false }
          Low: { visible: true, state: stove_wide_on }
          Medium: { visible: true, state: stove_wide_on }
          High: { visible: true, state: stove_wide_on }

- type: entity
  parent: F14CookingStove
  id: F14KitchenGrill
  name: propane grill
  description: A microwave? No, a real man cooks steaks on a grill!
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Machines/grill.rsi
    layers:
    - state: propane # need to get this to require fuel not power
    - map: ["enum.EntityHeaterVisuals.Setting"]
      color: "#b7aca0" # Keep the active grill readable without washing it out to flat white.
      shader: unshaded
      visible: false
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false
  - type: EntityHeater
  - type: SpamEmitSound
    enabled: false
    minInterval: 20
    maxInterval: 45
    sound:
      path: /Audio/Misfits/Machines/steam_long.ogg
      params:
        volume: -8
        maxDistance: 5
  - type: GrillHeaterSound
    startSound:
      path: /Audio/Misfits/Machines/grill.ogg
  - type: ItemPlacer
    maxEntities: 4 # big grill, many steaks
    whitelist:
      components:
      - Temperature
  - type: PlaceableSurface
  - type: GenericVisualizer
    visuals:
      enum.EntityHeaterVisuals.Setting:
        enum.EntityHeaterVisuals.Setting:
          Off: { visible: false }
          Low: { visible: true, state: propane }
          Medium: { visible: true, state: propane }
          High: { visible: true, state: propane }

- type: entity
  parent: F14KitchenGrill
  id: F14KitchenGrillWide
  suffix: wide
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Machines/grill.rsi
    layers:
    - state: propane_wide # need to get this to require fuel not power
    - map: ["enum.EntityHeaterVisuals.Setting"]
      color: "#b7aca0" # Keep the active grill readable without washing it out to flat white.
      shader: unshaded
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.EntityHeaterVisuals.Setting:
        enum.EntityHeaterVisuals.Setting:
          Off: { visible: false }
          Low: { visible: true, state: propane_wide }
          Medium: { visible: true, state: propane_wide }
          High: { visible: true, state: propane_wide }
