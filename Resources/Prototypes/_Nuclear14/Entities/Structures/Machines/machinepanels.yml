- type: entity
  parent: F14BaseMachinePowered
  id: F14MachineRackTelecomsServer
  suffix: empty
  name: communications server
  description: An old communications server rack.
  components:
  - type: EncryptionKeyHolder
    keysExtractionMethod: Prying
    keySlots: 10
  - type: TelecomServer
  - type: Machine
    board: TelecomServerCircuitboard
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container

- type: entity
  parent: F14MachineRackTelecomsServer
