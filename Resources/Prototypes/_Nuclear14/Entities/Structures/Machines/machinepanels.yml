# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Machines/machinepanels.yml

- type: entity
  id: F14MachineFrameTall
  name: tall machine frame
  description: A metal frame for housing machinery and electronics
  suffix: Frame
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Power/32x48_machines.rsi
    state: rackempty
    offset: 0, 1
    drawdepth: Overdoors
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,0.5,0.45,1.5"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Clickable
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: destroyedMachineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: F14TallMachineFrame
    node: missingWires

- type: entity
  parent: F14MachineFrameTall
  id: F14MachineFrameTallDestroyed
  name: destroyed machine
  description: A destroyed frame that used to hold machinery and electronics
  components:
    - type: Sprite
      sprite: Nuclear14/Structures/Power/32x48_machines.rsi
      state: rackdestroyed
      offset: 0, 1
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
        - !type:SpawnEntitiesBehavior
          spawn:
            SheetSteel1:
              min: 3
              max: 5
            F14ScrapGold1:
              min: 2
              max: 5
            F14ScrapElectronic1:
              min: 3
              max: 6
        - !type:DoActsBehavior
          acts: ["Destruction"]
    - type: Construction
      graph: F14TallMachineFrame
      node: destroyedMachineFrame

- type: entity
  parent: F14MachineFrameTall
  id: F14MachineFrameTallWired
  description: A metal frame for housing machinery and electronics
  suffix: Wired
  components:
    - type: Sprite
      sprite: Nuclear14/Structures/Power/32x48_machines.rsi
      state: rackparts
      offset: 0, 1
    - type: Construction
      graph: F14TallMachineFrame
      node: machineFrame

# Machine Base

- type: entity
  abstract: true
  parent: BaseStructure
  id: F14BaseMachine
  components: # Not Anchorable due to sprite offset needs
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,0.5,0.45,1.5"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: destroyedMachineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Sprite
    offset: 0, 1
    drawdepth: Overdoors

- type: entity
  parent: F14BaseMachine
  id: F14BaseMachinePowered
  name: server rack
  description: An old server rack filled with electronics.
  abstract: true
  components:
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,0.5,0.45,1.5"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Nuclear14/Structures/Power/32x48_machines.rsi
    snapCardinals: true
    offset: 0, 1
    layers:
    - state: serverrack
    - state: serverrack_on
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: Appearance

- type: entity
  parent: F14BaseMachinePowered
  id: F14MachineRackElectronics
  name: electronics rack
  description: An old rack filled with electronics.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Power/32x48_machines.rsi
    snapCardinals: true
    offset: 0, 1
    layers:
    - state: rack
    - state: rack_on
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Construction
    graph: F14TallMachineFrame
    node: ElectronicsRack

- type: entity
  parent: F14BaseMachinePowered
  id: F14MachineRackServer
  name: server rack
  description: An old server rack filled with electronics.
  components:
  - type: Construction
    graph: F14TallMachineFrame
    node: ServerRack

- type: entity
  parent: F14BaseMachinePowered
  id: F14MachineRackRecorder
  name: electrical recorder
  description: An old rack with a fault recorder in.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Power/32x48_machines.rsi
    snapCardinals: true
    offset: 0, 1
    layers:
    - state: recorder
    - state: recorder_on
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Construction
    graph: F14TallMachineFrame
    node: RecorderRack

- type: entity
  parent: F14BaseMachine
  id: F14MachineComputerMainframe # Probably a computer, move it there?
  name: mainframe
  description: Probably the biggest computer you've ever seen.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Machines/mainframe.rsi
    snapCardinals: true
    layers:
    - state: mainframe
    - state: mainframe_on
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.1,-0.5,1.2,1"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer

- type: entity
  parent: F14BaseMachine
  id: F14MachineModularMachinebox
  name: machine box
  description: An old box forming part of a machine.
  placement:
    mode: AlignWall
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Machines/ms13_modular.rsi
    snapCardinals: false
    # offset: 0, 1
    state: box
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          F14ScrapElectronic1:
           min: 2
           max: 5
          F14ScrapSteel1:
           min: 3
           max: 6
          F14ScrapCopper1:
           min: 2
           max: 4
  - type: Transform
    noRot: false
    anchored: false

- type: entity
  parent: F14MachineModularMachinebox
  id: F14MachineModularMachineDials
  name: machine dials
  description: An old box with dials forming part of a machine.
  components:
  - type: Sprite
    state: dials

- type: entity
  parent: F14MachineModularMachineDials
  id: F14MachineModularMachineDialsTall
  suffix: tall
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Machines/ms13_modulartall.rsi

- type: entity
  parent: F14MachineModularMachineDialsTall
  id: F14MachineModularMachineConsoleTall
  name: machine console
  description: An old console from a machine.
  components:
  - type: Sprite
    state: console

- type: entity
  parent: F14MachineModularMachineDialsTall
  id: F14MachineModularMachineScreenTall
  name: machine screen
  description: An old screen for a machine.
  components:
  - type: Sprite
    state: screen

# Panels in use
## Base

- type: entity
  parent: F14MachineRackRecorder
  id: F14MachineRackCameraRouterBase
  name: camera router
  description: An old rack with camera recording equipment in.
  abstract: true
  components:
    - type: DeviceNetwork
      deviceNetId: Wired
      receiveFrequencyId: SurveillanceCamera
      transmitFrequencyId: SurveillanceCamera
    - type: WiredNetwork
    - type: DeviceNetworkRequiresPower
    - type: UserInterface
      interfaces:
        enum.SurveillanceCameraSetupUiKey.Router:
          type: SurveillanceCameraSetupBoundUi

