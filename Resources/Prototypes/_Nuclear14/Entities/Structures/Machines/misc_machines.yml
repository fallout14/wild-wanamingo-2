# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Machines/misc_machines.yml

- type: entity
  parent: BaseStructure
  id: F14MachineWaterTreatmentBroken
  name: water treatment works
  description: A broken all in one water treatment machine.
  suffix: broken
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Machines/water_treatment.rsi
    layers:
    - state: watertreatment_broken
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.8,-0.5,0.8,0.4"
        density: 10000
        mask:
        - MachineMask
        layer:
        - MachineLayer

- type: entity
  parent: F14MachineWaterTreatmentBroken
  id: F14MachineWaterTreatment
  name: water treatment works
  description: An all in one water treatment machine.
  suffix: ""
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Machines/water_treatment.rsi
    layers:
    - state: watertreatment
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          F14MachineWaterTreatmentBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Solution
    id: well
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 500
  - type: DrainableSolution
    solution: well
  - type: ReagentTank
  - type: NamedSolutionRegeneration
    solution: well
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 1
