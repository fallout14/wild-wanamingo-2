# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Furniture/junk.yml

- type: entity
  id: F14JunkWoodBase
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Furniture/junk.rsi
    snapCardinals: true
    netsync: false
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Tag
    tags:
    - Wooden
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
  - type: Pullable
  - type: Clickable
# No fixture on this base, inherit from further down for fixture

- type: entity
  parent: F14JunkWoodBase
  id: F14JunkMetalBase
  abstract: true
  components:
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 125
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Tag
    tags:
    - Metal

# Wood Junk

- type: entity
  parent: F14JunkWoodBase
  id: F14JunkDresser
  name: broken dresser
  description: Once held underwear. Now it's junk.
  components:
  - type: Sprite
    state: junk_dresser
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

- type: entity
  parent: F14JunkDresser
  id: F14JunkCabinet
  name: broken cabinet
  description: Once held clothes. Now it's junk.
  components:
  - type: Sprite
    state: junk_cabinet

- type: entity
  parent: F14JunkDresser
  id: F14JunkTable
  name: broken table
  description: Ate without table, now I'm angry. Junk.
  components:
  - type: Sprite
    state: junk_table

- type: entity
  parent: F14JunkWoodBase
  id: F14JunkBench
  name: broken bench
  description: If only I could have rested here. Junk.
  components:
  - type: Physics  # spawn state
    canCollide: False
  - type: Sprite
    snapCardinals: false
    state: junk_bench
    noRot: true

# Metal Junk

- type: entity
  parent: F14JunkMetalBase
