# Washroom

- type: entity
  parent: N14DecorFloorBase
  id: N14Shower
  name: shower
  description: Wash off that scum...wait, then there would be nothing left.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/world.rsi
    snapCardinals: false
    state: shower
    # drawdepth: Overdoors
  - type: Clickable
  - type: InteractionOutline
  - type: Anchorable
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 80
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 40
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
  - type: AmbientSound
    enabled: false
    volume: -8
    range: 8
    sound:
      path: /Audio/Ambience/Objects/drain.ogg

- type: entity
  parent: SeatBase
  id: N14Toilet
  name: toilet
  description: Waste not, want not
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/world.rsi
    state: toilet
  - type: Clickable
  - type: InteractionOutline
  - type: Anchorable
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 80
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 40
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
  - type: AmbientSound
    enabled: false
    volume: -8
    range: 8
    sound:
      path: /Audio/Ambience/Objects/drain.ogg
  - type: SecretStash
    secretStashName: secret-stash-toilet
  - type: ContainerContainer
    containers:
      stash: !type:ContainerSlot {}
  - type: Solution
    id: drainBuffer
    solution:
      maxVol: 500
  - type: SolutionManager
    solutions:
    - N14ToiletSolutionToilet
  - type: DumpableSolution
    solution: drainBuffer

- type: entity
  parent: Solution
  id: N14ToiletSolutionToilet
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: toilet
    solution:
      maxVol: 250

- type: entity
  parent: N14Toilet
  id: N14ToiletWater
  suffix: filled water
  components:
  - type: Solution
    id: toilet
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 200
  - type: SolutionManager
    solutions: []
  - type: NamedSolutionRegeneration
    solution: toilet
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 2

- type: entity
  parent: N14Toilet
  id: N14ToiletDirty
  suffix: filled dirty water
  components:
  - type: Solution
    id: toilet
    solution:
      reagents:
      - ReagentId: N14WaterDirty
        Quantity: 180
      - ReagentId: GastroToxin
        Quantity: 20
  - type: SolutionManager
    solutions: []
  - type: NamedSolutionRegeneration
    solution: toilet
    generated:
      reagents:
      - ReagentId: N14WaterDirty
        Quantity: 3
      - ReagentId: GastroToxin
        Quantity: 1

- type: entity
  parent: N14Toilet
  id: N14ToiletIrradiated
  suffix: filled rad water
  components:
  - type: Solution
    id: toilet
    solution:
      reagents:
      - ReagentId: N14WaterIrradiated
        Quantity: 180
      - ReagentId: GastroToxin
        Quantity: 20
  - type: NamedSolutionRegeneration
