# Other Furniture

- type: entity
  parent: BaseStructure
  id: F14DecorStreetPayphone
  name: payphone
  description: An old payphone
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/world.rsi
    snapCardinals: false
    state: payphone
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 80
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 40
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: Pullable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.4,0.2,0.2"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

- type: entity
  parent: F14DecorStreetPayphone
  id: F14DecorStreetMailbox
  name: mailbox
  description: An old mailbox
  components:
  - type: Sprite
    netsync: false
    state: mailbox_old
  - type: Storage
    grid:
    - 0,0,3,3
    maxItemSize: Large
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: InteractionOutline

- type: entity
  parent: F14DecorStreetMailbox
  id: F14DecorStreetMailboxWide
  suffix: Wide
  name: mailbox
  description: An old wide mailbox
  components:
  - type: Sprite
    state: mailbox

- type: entity
  parent: F14DecorStreetMailbox
  id: F14DecorStreetTrashbin
  name: trash bin
  description: You get the feeling it hasn't been changed in awhile.
  components:
  - type: Sprite
    state: trashbin

- type: entity
  parent: F14DecorStreetTrashbin
  id: F14DecorStreetTrashbinDamaged
  suffix: damaged, random
  components:
  - type: Sprite
    layers:
    - state: trashbin-1
      map: [ "body" ]
  - type: RandomSprite
    available:
      - body:
          trashbin-1: ""
          trashbin-2: ""
          trashbin-3: ""
