# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Furniture/fitness.yml

- type: entity
  parent: SeatBase
  id: F14FitnessWeightsBench1
  name: weights bench
  description: A bench for pumping iron.
  placement: # WW: snap to the tile
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
  - type: Rotatable
  - type: Sprite
    sprite: Nuclear14/Structures/Furniture/np13_misc.rsi
    state: fitnessweight

- type: entity
  parent: F14FitnessWeightsBench1
  id: F14FitnessWeightLifter
  name: weight lifter
  components:
  - type: Sprite
    state: fitnesslifter
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.1"


