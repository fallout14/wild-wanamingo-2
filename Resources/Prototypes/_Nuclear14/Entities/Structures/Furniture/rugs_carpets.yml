# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Furniture/rugs_carpets.yml

- type: entity
  id: F14CarpetSingleBase
  parent: BaseStructure
  description: Better than the floor.
  suffix: Mapping
  abstract: true
  components:
  - type: Sprite
    drawdepth: FloorTiles
  - type: Physics
    canCollide: false
  - type: Fixtures
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 10
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]


# #Cythisiax Fixed - Added missing Construction components (graph N14Rugs) to all craftable rug/mat entities.
# The legacy G-menu craft path (ConstructionSystem.Construct) requires the target entity to have a
# ConstructionComponent, otherwise crafting silently fails and the construction ghost stays behind.

- type: entity
  parent: F14CarpetSingleBase
  id: F14RugMat
  name: mat
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Furniture/rugs.rsi
    state: mat_blank
  - type: Construction
    graph: F14Rugs
    node: rugmat

- type: entity
  parent: F14RugMat
  id: F14RugMatWelcome
  suffix: welcome
  components:
  - type: Sprite
    state: mat_welcome
  - type: Construction
    graph: F14Rugs
    node: rugwelcome

- type: entity
