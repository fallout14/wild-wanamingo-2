# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Walls/walls.yml

- type: entity
  parent: BaseWall
  id: F14WallStore
  name: store wall
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Walls/nc14/store.rsi
  - type: Icon
    sprite: Nuclear14/Structures/Walls/nc14/store.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: wallsstore
    states:
    - !type:CornerSpriteSmoothing
      mask: [ wallsstore ]
      base: store

- type: entity
  parent: F14WallStore
  id: F14WallSuperstore
  name: store wall
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Walls/nc14/superstore.rsi
  - type: Icon
    sprite: Nuclear14/Structures/Walls/nc14/superstore.rsi

