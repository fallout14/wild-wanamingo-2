# Metal walls

- type: entity
  parent: BaseWall
  id: F14WallMetalEnclave
  name: metal wall
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Walls/nc14/enclavewall.rsi
  - type: Icon
    sprite: Nuclear14/Structures/Walls/nc14/enclavewall.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: wallsenclave
    states:
    - !type:CornerSpriteSmoothing
      mask: [ wallsenclave ]
      base: enclave

# Wood walls

- type: entity
  id: F14WallWoodFrame
  parent: Barricade
  name: wooden wall Frame
  description: A frame for building into a wall.
  components:
  - type: Construction
    graph: F14WoodWall
    node: Frame
  - type: Sprite
    sprite: Nuclear14/Structures/Walls/nc14/woodlog.rsi
    state: girder
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy

- type: entity
  parent: BaseWall
  id: F14WallWoodWhite
  name: wooden wall
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Walls/nc14/woodwhite.rsi
  - type: Icon
    sprite: Nuclear14/Structures/Walls/nc14/woodwhite.rsi
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: wallswood
    states:
    - !type:CornerSpriteSmoothing
      mask: [ wallswood ]
      base: wood

- type: entity
  parent: BaseStructureDynamic
  id: F14WallWoodWhiteFrame
  name: wall frame
  description: Part of a wooden wall supporting the structure.
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - GlassAirlockLayer
  - type: Sprite
    sprite: Nuclear14/Structures/Walls/nc14/woodwhite.rsi
    state: girder
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: F14WallWoodWhite
  id: F14WallWoodDark
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Walls/nc14/wooddark.rsi
  - type: Icon
    sprite: Nuclear14/Structures/Walls/nc14/wooddark.rsi

- type: entity
  parent: F14WallWoodWhiteFrame
  id: F14WallWoodDarkFrame
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Walls/nc14/wooddark.rsi
    state: girder

- type: entity
  parent: F14WallWoodWhite
  id: F14WallWoodLog
  name: log wall
  description: A wall made out of wooden logs.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Walls/nc14/woodlognew.rsi
  - type: Icon
    sprite: Nuclear14/Structures/Walls/nc14/woodlognew.rsi
  - type: IconSmooth
    key: log
    states:
    - !type:CornerSpriteSmoothing
      mask: [ log ]
      base: log
  - type: Construction
    graph: F14WoodWall
    node: logWall

# Tent Walls

- type: entity
  parent: BaseWall
  id: F14WallTent
  name: tent wall
  description: A tent made from cloth. Keeps the weather out at least.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Walls/nc14/tent.rsi
  - type: Icon
    sprite: Nuclear14/Structures/Walls/nc14/tent.rsi
  - type: Damageable
    damageModifierSet: Web
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: tent
    states:
    - !type:CornerSpriteSmoothing
      mask: [ tent ]
      base: tent

- type: entity
  id: F14BlastDoorExteriorIndestructible
  parent: BlastDoor
  suffix: Indestructible, Closed
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10000 # pseudo indestructible
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: F14BlastDoorExteriorIndestructibleOpen
  parent: BlastDoorOpen
  suffix: Indestructible, Open
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
