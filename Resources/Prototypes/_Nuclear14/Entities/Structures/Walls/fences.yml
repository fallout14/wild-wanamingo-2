# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Walls/fences.yml

- type: entity
  abstract: true
  parent: BaseStructure
  id: F14BaseFence
  name: fence
  description: Helps keep trespassers out.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Sprite
    netsync: false
    drawdepth: Walls
  - type: Icon
    state: full
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        # Misfits Change - WallLayer minus BulletImpassable so bullets pass through fences
        - Opaque
        - Impassable
        - HighImpassable
        - MidImpassable
        - LowImpassable
        - InteractImpassable
        density: 100

- type: entity
  parent: F14BaseFence
  id: F14WallFenceChain
  name: chainlink fence
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Walls/nc14/fencechain.rsi
  - type: Icon
    sprite: Nuclear14/Structures/Walls/nc14/fencechain.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: fence
    states:
    - !type:CornerSpriteSmoothing
      mask: [ fence ]
      base: fence
  - type: InteractionPopup
    interactSuccessString: fence-rattle-success
    messagePerceivedByOthers: fence-rattle-success
    interactSuccessSound:
      collection: FenceRattle
  - type: Climbable
