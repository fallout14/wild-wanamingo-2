# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Walls/tall_obstacles.yml

- type: entity
  parent: BaseStructure
  id: N14BaseTallObstacle
  suffix: tall
  abstract: true
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Walls/ms13/tallobstacles.rsi
    drawdepth: Mobs
  - type: SpriteFade
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Injurable
    damageContainer: Inorganic
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MetalBulletImpact
    soundTypes:
      Heat:
        collection:
          MetalLaserImpact
  - type: PlacementReplacement
    key: walls
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.6,0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
        

- type: entity
  parent: N14BaseTallObstacle
  id: N14BarricadeWoodTall
  name: wooden barricade
  suffix: tall
  components:
  - type: Sprite
    state: barricade
  - type: Damageable
    damageModifierSet: FlimsyMetallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Construction
    graph: MisfitsBarricadeWoodTall
    node: WoodTall
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.6,0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
    

- type: entity
  parent: N14BaseTallObstacle
  id: N14CellBars
  name: cell bars
  components:
  - type: Sprite
    state: bars
  - type: InteractionPopup
    interactSuccessString: fence-rattle-success
    messagePerceivedByOthers: fence-rattle-success
    interactSuccessSound:
      collection: FenceRattle
    

- type: entity
  parent: N14CellBars
  id: N14CellBarsSlot
  suffix: slot
  components:
  - type: Sprite
    state: barsslot
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.6,-0.15,-0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "0.15,-0.6,0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
    

- type: entity
  parent: N14CellBars
  id: N14CellBarsCorner
  suffix: corner
  components:
  - type: Sprite
    state: barscorner
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.6,0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "0.5,-0.5,0.6,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
        
    

- type: entity
  parent: N14CellBars
  id: N14CellBarsRust
  name: cell bars
  components:
  - type: Sprite
    state: bars_rust
    

- type: entity
  parent: N14CellBarsSlot
  id: N14CellBarsSlotRust
  suffix: slot
  components:
  - type: Sprite
    state: barsslot_rust
    

- type: entity
  parent: N14CellBarsCorner
  id: N14CellBarsCornerRust
  suffix: corner
  components:
