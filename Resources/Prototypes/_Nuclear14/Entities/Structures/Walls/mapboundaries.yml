# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Walls/mapboundaries.yml

- type: entity
  parent: BaseStructure
  id: F14WallRockIndestructible
  suffix: Indestructible
  name: rock
  components:
    - type: Occluder
    - type: Airtight
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
          density: 100
          mask:
            - FullTileMask
          layer:
            - WallLayer
    - type: IconSmooth
      key: walls
      states:
      - !type:EdgeSpriteSmoothing
        mask: [ walls, windows, grilles, marble, doors ]
        base: rock_
    - type: Sprite
      sprite: Misfits/Legacy/Structures/Walls/rock.rsi
      layers:
        - state: rock

- type: entity
  abstract: true
  parent: BaseStructure
  id: F14BaseFenceIndestructible
  name: fence
  description: Helps keep trespassers out.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Sprite
    netsync: false
    drawdepth: Walls
  - type: Icon
    state: full
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 100

- type: entity
  parent: F14BaseFenceIndestructible
  id: F14WallFenceChainMapBoundary
  suffix: Indestructible
  name: chainlink fence
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Walls/nc14/fencechain.rsi
  - type: Icon
    sprite: Nuclear14/Structures/Walls/nc14/fencechain.rsi
  - type: IconSmooth
    key: fence
    states:
    - !type:CornerSpriteSmoothing
      mask: [ fence ]
      base: fence
