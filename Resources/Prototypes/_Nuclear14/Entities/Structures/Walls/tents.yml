# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Walls/tents.yml

- type: entity
  parent: BaseStructure
  id: F14TentLeatherWall
  name: tent
  description: A tent made out of leather.
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: Nuclear14/Structures/Walls/nc14/tents.rsi
    state: leather_edge
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 100
  - type: Damageable
    damageModifierSet: Web
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          GenericHit
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Occluder
  - type: RadiationBlocker
    resistance: 1
  - type: BlockWeather
  - type: Tag
    tags:
    - ForceNoFixRotations

- type: entity
  parent: F14TentLeatherWall
  id: F14TentLeatherCorner
  suffix: corner
  components:
  - type: Sprite
    state: leather_corner
  - type: Tag
    tags:
    - ForceNoFixRotations

- type: entity
  parent: F14TentLeatherWall
  id: F14TentClothWall
  name: tent
  description: A tent made out of cloth.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Walls/nc14/tents.rsi
    state: cloth_edge
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Tag
    tags:
    - ForceNoFixRotations

- type: entity
  parent: F14TentClothWall
  id: F14TentClothCorner
  suffix: corner
  components:
  - type: Sprite
    state: cloth_corner
  - type: Tag
    tags:
    - ForceNoFixRotations
