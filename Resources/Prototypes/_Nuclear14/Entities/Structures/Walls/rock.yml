# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Walls/rock.yml

# Rock
- type: entity
  id: F14RockGrey
  parent: BaseWall
  name: asteroid rock
  description: A rocky asteroid.
  components:
  - type: Transform
    noRot: true
  - type: IconSmooth
    key: walls
    states:
    - !type:EdgeSpriteSmoothing
      mask: [ walls, windows, grilles, marble, doors ]
      base: rock_asteroid_
  - type: Icon
    sprite: Nuclear14/Structures/Walls/rock.rsi
    state: rock_asteroid
  - type: Sprite
    sprite: Nuclear14/Structures/Walls/rock.rsi
    layers:
      - state: rock_asteroid
  - type: Damageable
    damageModifierSet: Rock
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6

# Ore veins
- type: entity
  id: F14RockGreyCoal
  parent: F14RockGrey
  description: An ore vein rich with coal.
  suffix: Coal
  components:
    - type: OreVein
      oreChance: 1.0
      currentOre: OreCoal
    - type: Sprite
      layers:
        - state: rock_asteroid
        - state: rock_coal

- type: entity
