    oreChance: 0.33
    oreRarityPrototypeId: RandomOreDistributionStandard


# Rocks and ore veins
- type: entity
  id: F14WallRock
  parent: BaseWall
  name: rock
  suffix: planetmap
  components:
    - type: Transform
      noRot: true
    - type: SoundOnGather
    - type: Gatherable
      toolWhitelist:
        tags:
          - Pickaxe
    - type: Damageable
      damageModifierSet: Metallic
    - type: Injurable
      damageContainer: Inorganic
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 150
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
    - type: IconSmooth
      key: walls
      states:
      - !type:EdgeSpriteSmoothing
        mask: [ walls, windows, grilles, marble, doors ]
        base: rock_
    - type: Icon
      sprite: Nuclear14/Structures/Walls/rock.rsi
      state: rock
    - type: Sprite
      sprite: Nuclear14/Structures/Walls/rock.rsi
      layers:
        - state: rock

