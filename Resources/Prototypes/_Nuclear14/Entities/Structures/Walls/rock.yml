- type: entity
  id: F14RockGreyMining
  parent: F14RockGrey # AsteroidAltRock no longer exists
  name: ore vein
  suffix: higher ore yield .44
  description: An asteroid.
  components:
  - type: OreVein
    oreChance: 0.44
    oreRarityPrototypeId: RandomOreDistributionStandard
  - type: Damageable # Corvax-Change
    damageModifierSet: Rock
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible # Corvax-Change
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 400
        behaviors:
          - !type:DoActsBehavior
            acts: ["Destruction"]

- type: entity
  id: F14SteelRock
  parent: F14RockGrey
  name: ore vein
  suffix: Low Ore Yield
  description: A rocky asteroid.
  components:
  - type: IconSmooth
    key: walls
    states:
    - !type:EdgeSpriteSmoothing
      mask: [ walls, windows, grilles, marble, doors ]
      base: rock_asteroid_
  - type: Sprite
    sprite: Nuclear14/Structures/Walls/rock.rsi
    layers:
      - state: rock_asteroid_south

