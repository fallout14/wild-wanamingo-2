# Cold Mountain Rock.
- type: entity
  id: F14ColdMountainRock
  parent: BaseStructure
  name: cold mountain rock
  suffix: Un-mineable
  description: A craggy mountain wall. It is too hard to mine. Colder.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Walls/cold_mountain_rock.rsi
    state: full
  - type: Occluder
  - type: Airtight
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 100
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: IconSmooth
    key: walls
    states:
    - !type:CornerSpriteSmoothing
      mask: [ walls, windows, grilles, marble, doors ]
      base: rock_
  - type: BlockWeather

