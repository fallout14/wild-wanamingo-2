# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Walls/halfwalls.yml

- type: entity
  abstract: true
  parent: BaseStructure
  id: F14HalfWallBase
  name: basewall
  description: A nice half wall for a window or boundary.
  suffix: half
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MetalBulletImpact
    soundTypes:
      Heat:
        collection:
          MetalLaserImpact
  - type: Tag
    tags:
    - Wall
  - type: Sprite
    drawdepth: Walls
  - type: Icon
    state: full
  - type: PlacementReplacement
    key: windows
  - type: Damageable
    damageModifierSet: FlimsyMetallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - TableMask
        layer:
        - TableLayer
        density: 1000
  - type: RadiationBlocker
    resistance: 2
  - type: BlockWeather
  - type: Climbable
    range: 0.05

- type: entity
  parent: F14HalfWallBase
  id: F14WallBrickHalf
  name: brick wall
  suffix: half
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Walls/ms13/half/brick.rsi
  - type: Icon
    sprite: Nuclear14/Structures/Walls/ms13/half/brick.rsi
  - type: Damageable
    damageModifierSet: FlimsyMetallic
  - type: Injurable
    damageContainer: Inorganic
  - type: IconSmooth
    key: windows
    states:
    - !type:CornerSpriteSmoothing
      mask: [ windows ]
      base: brick
    

