# Resources/Prototypes/_Nuclear14/Entities/Structures/Walls/tallwalls.yml

- type: entity
  parent: BaseWall
  id: F14BaseWallTall
  suffix: tall
  abstract: true
  components:
  - type: Sprite
    drawdepth: Mobs
  - type: SpriteFade
  - type: Damageable
    damageModifierSet: Rock
  - type: Injurable
    damageContainer: Inorganic

- type: entity
  parent: F14BaseWallTall
  id: F14BaseWallTallMetalWeak
  abstract: true
  components:
  - type: Damageable
    damageModifierSet: PerforatedMetallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 5
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

