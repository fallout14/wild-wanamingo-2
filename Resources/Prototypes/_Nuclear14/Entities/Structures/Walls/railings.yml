# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Walls/railings.yml

- type: entity
  parent: Railing
  id: F14RailingYellow
  name: yellow railing
  description: Basic railing meant to protect idiots like you from falling.
  components:
  - type: Sprite
    netsync: false
    drawdepth: WallTops
    sprite: Nuclear14/Structures/Walls/nc14/railingyellow.rsi
    state: side
  - type: Icon
    sprite: Nuclear14/Structures/Walls/nc14/railingyellow.rsi
    state: side
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.5,0.0,0.5,0.2"
        density: 100
        mask:
        - TableMask
        layer:
        - TableLayer

