# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Windows/windowcovers.yml

- type: entity
  id: F14BarricadeWindow
  parent: BaseStructure
  name: barricade
  description: A makeshift barricade.
  components:
    - type: Sprite
      netsync: false
      drawdepth: Overdoors
      sprite: Nuclear14/Structures/Furniture/barricades.rsi
      state: boarded
    - type: Icon
      sprite: Nuclear14/Structures/Furniture/barricades.rsi
      state: boarded
    - type: Damageable
      damageModifierSet: Wood
    - type: Injurable
      damageContainer: Inorganic
    - type: Physics
      bodyType: Static
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
              bounds: "-0.5,-0.5,0.5,0.5"
          layer:
          - GlassLayer
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
              

- type: entity
  parent: F14BarricadeWindow
  id: F14BarricadeDoor
  name: locked door
  description: A locked door. Might have to break it down.
  components:
    - type: Sprite
      sprite: Nuclear14/Structures/Furniture/barricades.rsi
      state: locked
    - type: Icon
      sprite: Nuclear14/Structures/Furniture/barricades.rsi
      state: locked

- type: entity
  id: F14WindowBars
  parent: BaseStructure
  name: window bars
  description: Sturdy looking bars blocking access.
  components:
    - type: Construction
      graph: F14WindowBars
      node: bars
    - type: MeleeSound
      soundGroups:
        Brute:
          path:
            "/Audio/Weapons/grille_hit.ogg"
    - type: Sprite
      sprite: Nuclear14/Structures/Windows/windowbars.rsi
      state: icon
    - type: Icon
      sprite: Nuclear14/Structures/Windows/windowbars.rsi
      state: icon
    - type: Damageable
      damageModifierSet: Metallic
    - type: Injurable
      damageContainer: Inorganic
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 200
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
    - type: PowerConsumer
    - type: Electrified
      requirePower: true
      noWindowInTile: true
      highVoltageNode: high
      mediumVoltageNode: medium
      lowVoltageNode: low
    - type: NodeContainer
      nodes:
        high:
          !type:CableDeviceNode
          nodeGroupID: HVPower
        medium:
          !type:CableDeviceNode
          nodeGroupID: MVPower
        low:
          !type:CableDeviceNode
          nodeGroupID: Apc
              

- type: entity
  id: F14WindowBars2
  parent: F14WindowBars
  components:
    - type: Sprite
      netsync: false
      drawdepth: Overdoors
      sprite: Nuclear14/Structures/Furniture/barricades.rsi
      state: bars
    - type: Icon
      sprite: Nuclear14/Structures/Furniture/barricades.rsi
      state: bars
