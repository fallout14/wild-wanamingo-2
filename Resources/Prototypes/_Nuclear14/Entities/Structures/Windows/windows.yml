# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Windows/windows.yml

- type: entity
  parent: BaseStructure
  id: F14WindowBase # use for single tile / standalone windows & broken windows
  description: A window for seeing into places.
  abstract: true
  name: window
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: WallMount
    arc: 360 # interact despite grilles
  - type: Tag
    tags:
      - ForceFixRotations
      - Window
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb {}
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Damageable
    damageModifierSet: Glass
  - type: Injurable
    damageContainer: StructuralInorganic # #Misfits Fix - was Inorganic which ignored Structural damage, making windows unbreakable by sledgehammers
  - type: ExaminableDamage
    messages: WindowMessages
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150 #excess damage (nuke?). avoid computational cost of spawning entities.
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Appearance
        

- type: entity
  parent: F14WindowBase
  id: F14WindowBaseAirtight # use for single tile / standalone windows that are intact
  description: A window for seeing into places. 
  abstract: true
  components:
  - type: Airtight
  - type: DamageVisuals
    thresholds: [4, 8, 12]
    damageDivisor: 2
    trackAllDamage: true
    damageOverlay:
      sprite: Misfits/Legacy/Structures/Windows/cracks.rsi
  - type: InteractionPopup
    interactSuccessString: comp-window-knock
    messagePerceivedByOthers: comp-window-knock
    interactSuccessSound:
      path: /Audio/Effects/glass_knock.ogg
      

- type: entity
  parent: F14WindowBase
  id: F14WindowSmoothBase # Use for windows that smooth together
  description: A window for seeing into places.
  abstract: true
  components:
  - type: Sprite
    netsync: false
    drawdepth: WallTops
    sprite: Nuclear14/Structures/Windows/window.rsi
  - type: Icon
    sprite: Nuclear14/Structures/Windows/window.rsi
    state: full
  - type: IconSmooth
    key: windows
    states:
    - !type:CornerSpriteSmoothing
      mask: [ windows ]
      base: window
    

- type: entity
  parent: F14WindowSmoothBase
  id: F14WindowSmoothBaseAirtight # use for windows that smooth together that are intact
  description: A window for seeing into places.
  abstract: true
  components:
  - type: Airtight
  - type: Repairable
  - type: InteractionPopup
    interactSuccessString: comp-window-knock
    messagePerceivedByOthers: comp-window-knock
    interactSuccessSound:
      path: /Audio/Effects/glass_knock.ogg
  - type: DamageVisuals
    thresholds: [4, 8, 12]
    damageDivisor: 2
    trackAllDamage: true
    damageOverlay:
      sprite: Misfits/Legacy/Structures/Windows/cracks.rsi

## Smooth Windows

- type: entity
  id: F14Window
  parent: F14WindowSmoothBaseAirtight
    

- type: entity
  parent: F14WindowSmoothBase
  id: F14WindowBroken
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Windows/windowbroken.rsi
  - type: Icon
    sprite: Nuclear14/Structures/Windows/windowbroken.rsi
    state: full
    
