# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Storage/tanks.yml

- type: entity
  parent: BaseStructure
  id: N14StorageTankBase
  name: storage tank
  description: A liquids storage tank.
  abstract: true
  components:
  - type: Sprite
    noRot: true
  - type: InteractionOutline
  - type: Physics
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: tank
    - trigger:
        !type:DamageTypeTrigger
        damageType: Piercing
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: tank
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:SpillBehavior
        solution: tank
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Solution
    id: tank
    solution:
      maxVol: 1500
  - type: DrainableSolution
    solution: tank
  - type: ReagentTank
  - type: Transform
    noRot: true

# In use

- type: entity
  id: N14StorageTankWide
  parent: N14StorageTankBase
  name: fuel tank
  description: A fuel tank. It's used to store high amounts of fuel.
  suffix: Empty
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/tanks.rsi
    layers:
      - state: chemical_container
      # - state: chemical_container
        # map: ["enum.SolutionContainerLayers.Fill"]
        # visible: false
  - type: Appearance
  # - type: SolutionContainerVisuals
    # maxFillLevels: 3
    # fillBaseName: fueltank-2-
  - type: ExaminableSolution
    solution: tank
  - type: ReagentTank
    tankType: Fuel
  - type: DamageOnToolInteract
    tools: Welding
    weldingDamage:
      types:
        Heat: 10
  - type: PacifismDangerousAttack
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: MisfitsDefaultStructural
    totalIntensity: 120 # ~ 5 tile radius
    maxTileBreak: 0 # Don't break floor tiles!
    tileBreakScale: 0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.9,-0.5,0.9,0.2"
        density: 155
        mask:
        - MachineMask
        layer:
        - WallLayer

- type: entity
  parent: N14StorageTankWide
  id: N14StorageTankWideFullFuel
  suffix: Full
  components:
  - type: Solution
    id: tank
    solution:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 2000
          
          

