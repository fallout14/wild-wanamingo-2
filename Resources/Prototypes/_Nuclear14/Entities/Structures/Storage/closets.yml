# Wooden Closets
  components:
  - type: EntityStorage
    capacity: 40

- type: entity
  parent: F14ClosetBase
  id: F14ClosetCabinetWood
  name: cabinet
  description: An old pre-war wooden cabinet.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/Closets/cabinet.rsi
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 0
            max: 1
          F14ScrapBrass1:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Tag
    tags:
    - Wooden

- type: entity
  parent: [ F14ClosetCabinetWood, F14TimedStorageFillDomestic ]
  id: F14ClosetCabinetWoodRefilling
  suffix: Refilling,Domestic,Random

- type: entity
  parent: [ F14ClosetCabinetWood, F14StorageFillDomestic ]
  id: F14LootClosetCabinetWood
  suffix: Loot,Domestic,Random
  components:
  - type: EntityStorage
    capacity: 34

