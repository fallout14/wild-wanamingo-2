# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Storage/barrels.yml

- type: entity
  parent: BaseStructureDynamic
  id: F14BaseBarrel
  name: barrel
  description: This barrel looks like it could contain something.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/barrels.rsi
    state: blue-closed
    netsync: false
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.2,-0.2,0.2,0.45"
        density: 50
        mask:
        - MachineMask
        layer:
        - WallLayer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: barrel
    - trigger:
        !type:DamageTypeTrigger
        damageType: Piercing
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: barrel
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpillBehavior
        solution: barrel
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]

# Base Open

- type: entity
  parent: F14BaseBarrel
  id: F14BaseBarrelOpen
  suffix: open
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: barrel
    solution:
      maxVol: 500
  - type: DrainableSolution
    solution: barrel
  - type: ReagentTank

# Closed

- type: entity
  parent: F14BaseBarrel
  id: F14BlackBarrel
  name: black barrel
  description: A worn out black barrel. The label is torn off.
  components:
  - type: Construction
    graph: F14Barrels
    node: barrelblack
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/barrels.rsi
    state: black-closed
  - type: RadiationSource #Misfits Change - pre-war nuclear waste disposal container
    intensity: 0.5
    slope: 1

- type: entity
  parent: F14BaseBarrel
  id: F14BlueBarrel
  name: blue barrel
  description: A blue barrel with a warning sign of. Maybe it contains water?
  components:
  - type: Construction
    graph: F14Barrels
    node: barrelblue
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/barrels.rsi
    state: blue-closed

- type: entity
  parent: F14BaseBarrel
  id: F14RedBarrel
  name: red barrel
  description: A red barrel with an explosive warning sign on. Better be careful.
  components:
  - type: Construction
    graph: F14Barrels
    node: barrelred
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/barrels.rsi
    state: red-closed
  - type: Solution
    id: barrel
    solution:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 100
  - type: DamageOnToolInteract
    tools: Welding
    weldingDamage:
      types:
        Heat: 10
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: F14DefaultStructural
    totalIntensity: 90

- type: entity
  parent: F14BaseBarrel
  id: F14YellowBarrel
  name: yellow barrel
  description: A yellow barrel with a radiation warning sign on. Better be careful.
  components:
  - type: Construction
    graph: F14Barrels
    node: barrelyellow
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/barrels.rsi
    state: yellow-closed
  - type: RadiationSource
    intensity: 2
    slope: 1

# Open

- type: entity
  parent: F14BaseBarrelOpen
  id: F14BlackBarrelOpen
  suffix: open
  name: black barrel
  description: A worn out black barrel. The label is torn off. The lid is off and you can see inside.
  components:
  - type: Construction
    graph: F14Barrels
    node: barrelblackopen
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/barrels.rsi
    state: black-open
  - type: RadiationSource #Misfits Change - open lid exposes waste; slightly stronger than sealed
    intensity: 0.8
    slope: 1

- type: entity
  parent: F14BaseBarrelOpen
  id: F14BlueBarrelOpen
  suffix: open
  name: blue barrel
  description: A blue barrel with a warning sign of. The lid is off and you can see inside.
  components:
  - type: Construction
    graph: F14Barrels
    node: barrelblueopen
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/barrels.rsi
    state: blue-open

- type: entity
  parent: F14BaseBarrelOpen
  id: F14RedBarrelOpen
  suffix: open
  name: red barrel
  description: A red barrel with an explosive warning sign on. The lid is off and you can see inside.
  components:
  - type: Construction
    graph: F14Barrels
    node: barrelredopen
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/barrels.rsi
    state: red-open

- type: entity
  parent: F14BaseBarrelOpen
  id: F14YellowBarrelOpen
  suffix: open
  name: yellow barrel
  description: A yellow barrel with a radiation warning sign on. The lid is off and you can see inside but it still makes you twitch.
  components:
  - type: Construction
    graph: F14Barrels
    node: barrelyellowopen
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/barrels.rsi
    state: yellow-open
  - type: RadiationSource
    intensity: 1
    slope: 1

# Full barrels

- type: entity
  parent: F14BlackBarrelOpen
  id: F14BlackBarrelFull
  suffix: full
  description: A worn out black barrel. This one looks full of some dark liquid.
  components:
  - type: Construction
    graph: F14Barrels
    node: barrelblackfull
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/barrels.rsi
    state: black-full
    # TODO - fill with some sort of waste product? Maybe just dirty water.
  - type: RadiationSource #Misfits Change - full of unknown dark waste; highest intensity of the set
    intensity: 1.2
    slope: 1

- type: entity
  parent: F14RedBarrelOpen
  id: F14RedBarrelFull
  suffix: full
  description: A red barrel with an explosive warning sign on. It has a golden liquid inside.
  components:
  - type: Construction
    graph: F14Barrels
    node: barrelredfull
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/barrels.rsi
    state: red-full
  - type: Solution
    id: barrel
    solution:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 100
  - type: DamageOnToolInteract
    tools: Welding
    weldingDamage:
      types:
        Heat: 10
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: F14DefaultStructural
    totalIntensity: 90

- type: entity
  parent: F14YellowBarrelOpen
  id: F14YellowBarrelFull
  suffix: full
  description: A yellow barrel with a radiation warning sign on. You can see the glowing goo bubble.
  components:
  - type: Construction
    graph: F14Barrels
    node: barrelyellowfull
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/barrels.rsi
    state: yellow-full
  - type: RadiationSource
    intensity: 3
    slope: 1
  - type: PointLight
    netsync: false
    radius: 1.5
    energy: 1.6
    color: "#3db83b"
    castShadows: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:SpillBehavior
        solution: barrel
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
    # TODO - fill with some sort of radioactive waste reagent.

# Burning Barrels

- type: entity
  parent: BaseStructureDynamic
  id: F14BurningBarrel
  name: burnt barrel
  description: This barrel looks like it once contained a fire.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/burningbarrel.rsi
    state: burnbarrel
    netsync: false
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.2
        density: 50
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

- type: entity
  parent: F14BurningBarrel
  id: F14BurningBarrelLit
  name: burning barrel
  description: This barrel is smoldering. Toasty
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/burningbarrel.rsi
    state: burnbarrel_lit
    netsync: false
  - type: PointLight
    radius: 5
    energy: 3
    color: "#FFC90C"
  - type: AmbientSound
    volume: -7
    range: 4
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: LightBehaviour
    behaviours:
      - !type:RandomizeBehaviour # immediately make it bright and flickery
        id: N14burnbarrel_lit
        interpolate: Nearest
        minDuration: 0.02
        maxDuration: 0.06
        startValue: 6.0
        endValue: 9.0
        property: Energy
        isLooped: true
