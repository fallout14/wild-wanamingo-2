# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Storage/furniture.yml

- type: entity
  parent: ClosetBase
  id: F14FurnitureWashingmachine
  name: washing machine
  description: wishy washy.
  components:
  - type: Physics  # spawn state
    bodyType: Static
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/Furniture/washingmachine.rsi
    layers:
    - state: generic
      map: ["enum.StorageVisualLayers.Base"]
    - state: generic_door
      map: ["enum.StorageVisualLayers.Door"]
  - type: EntityStorageVisuals
    stateBaseClosed: generic
    stateDoorOpen: generic_open
    stateDoorClosed: generic_door
  - type: Transform
    anchored: true
    noRot: false

- type: entity
  parent: F14FurnitureWashingmachine
  id: F14FurnitureWashingmachineIndustrial
  suffix: Industrial
  components:
  - type: Physics  # spawn state
    bodyType: Static
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/Furniture/washingmachine_industrial.rsi

# Safes

- type: entity
  parent: F14ClosetBaseW
  id: F14ClosetSafe
  name: safe
  description: Might be filled with valuables.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/Furniture/safe.rsi

- type: entity
  parent: [ F14ClosetSafe, F14BaseMilitaryStorageFill ]
  id: F14LootClosetSafe
  suffix: Loot, Random Military

- type: entity
  parent: [ F14ClosetSafe, F14StorageFillCurrencyFill ]
  id: F14LootClosetSafeCurrency
  suffix: Loot, Currency one stack random

- type: entity
  parent: [ F14ClosetSafe, F14StorageFillSafePrewarFill ]
  id: F14LootClosetSafePrewar
  suffix: Loot, safe pre-war

- type: entity
  parent: F14ClosetSafe
  id: F14ClosetSafeSpinner
  suffix: spinner
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Storage/Furniture/safespinner.rsi
