# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Wallmount/base_lighting.yml

- type: entity
  parent: SmallLight
  id: F14LightSmallAlwayson
  name: small light
  suffix: Always on
  description: "An always powered light."
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Wallmounts/lightbulbcaged.rsi
    state: base
    drawdepth: Overdoors
    offset: 0, 1 # 0.75 is better but breaks for east west placement
  - type: PointLight
    energy: 1.0
    radius: 6
    softness: 1.1
    enabled: true
  - type: WallMount

- type: entity
  parent: PoweredSmallLightEmpty
  id: F14LightSmallEmpty
  name: small light
  description: "A light fixture. Draws power and produces light when equipped with a light bulb."
  suffix: Empty
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Wallmounts/lightbulbcaged.rsi
    state: empty
    offset: 0, 1
  - type: Construction
    graph: F14Lightbulb
    node: bulbLight
  - type: WallMount

- type: entity
  parent: PoweredSmallLight
  id: F14LightSmall
  suffix: ""
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Wallmounts/lightbulbcaged.rsi
    state: base
    offset: 0, 1
  - type: WallMount

- type: entity
  parent: SmallLight
  id: F14LightSmallAlwaysonNormie
  name: small light
  suffix: Always ON, Use Me
  description: "An always powered light."
  components:
  - type: Sprite
    offset: 0, 0
    sprite: Nuclear14/Structures/Wallmounts/lightbulbcaged.rsi
    state: base
    drawdepth: Overdoors
  - type: PointLight
    energy: 1.0
    radius: 6
    softness: 1.1
    enabled: true
  - type: WallMount

- type: entity
  parent: PoweredSmallLightEmpty
  id: F14LightSmallEmptyNormie
  name: small light
  suffix: Empty, Use Me
  description: "A light fixture. Draws power and produces light when equipped with a light bulb."
  components:
  - type: Sprite
    offset: 0, 0
    sprite: Nuclear14/Structures/Wallmounts/lightbulbcaged.rsi
    state: empty
  - type: Construction
    graph: F14Lightbulb
    node: bulbLight
  - type: WallMount

- type: entity
  parent: PoweredSmallLight
  id: F14LightSmallNormie
  suffix: Mappers Use Me
  components:
  - type: Sprite
    offset: 0, 0
    sprite: Nuclear14/Structures/Wallmounts/lightbulbcaged.rsi
    state: base
  - type: WallMount
