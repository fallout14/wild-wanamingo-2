- type: entity
  parent: F14SignBase
  id: F14SignBar
  name: bar sign
  description: Bar! Get drunk here.
  suffix: Mapping
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Wallmounts/signs_32x32.rsi
    state: bar

- type: entity
  parent: F14SignBar
  id: F14SignClinic
  name: clinic sign
  description: A clinic sign. Hopefully they have meds.
  components:
