  components:
  - type: Sprite
    state: danger_sign

- type: entity
  parent: F14SignNotice
  id: F14WallDecorExitsign
  name: exit sign
  description: A sign that says EXIT. I wonder what it means.
  components:
  - type: Sprite
    snapCardinals: false
    state: exit
    noRot: true

