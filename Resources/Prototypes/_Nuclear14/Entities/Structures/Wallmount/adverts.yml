# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Wallmount/adverts.yml

- type: entity
  parent: F14SignBase
  id: F14SignNukaColaGirl
  name: Nuka-Cola advert
  description: "A near pristine pre-war advert for Nuka-Cola."
  components:
  - type: Sprite
    state: nukagirl
    scale: 0.5, 0.5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          F14SignNukaColaGirlDamaged:
            min: 1
            max: 1
        offset: 0

