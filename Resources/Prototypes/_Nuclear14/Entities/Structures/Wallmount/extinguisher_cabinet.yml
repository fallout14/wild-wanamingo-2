# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Wallmount/extinguisher_cabinet.yml
# Rewritten for Wizden's cabinet system (ItemSlots + Openable); only the sprite differs from ExtinguisherCabinet.
- type: entity
  parent: ExtinguisherCabinet
  id: F14FireExtinguisherCabinet
  name: extinguisher cabinet
  description: A small wall mounted cabinet designed to hold a fire extinguisher.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Wallmounts/fireextinguisher.rsi
    drawdepth: Overdoors
    layers:
    - state: frame
    - state: extinguisher
      map: ["enum.ItemCabinetVisuals.Layer"]
      visible: true
    - state: closed
      map: ["enum.OpenableVisuals.Layer"]

- type: entity
  parent: F14FireExtinguisherCabinet
  id: F14FireExtinguisherCabinetOpen
  suffix: Open
  components:
  - type: Openable
    opened: true

- type: entity
  parent: F14FireExtinguisherCabinet
  id: F14FireExtinguisherCabinetFilled
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      ItemCabinet:
      - FireExtinguisher

- type: entity
  parent: [F14FireExtinguisherCabinetFilled, F14FireExtinguisherCabinetOpen]
  id: F14FireExtinguisherCabinetFilledOpen
  suffix: Filled, Open
