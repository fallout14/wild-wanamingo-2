# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Decoration/rails.yml

- type: entity
  id: F14Rails
  name: railway
  suffix: Mapping
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/rails64.rsi
    state: rails
    snapCardinals: false
    netsync: false
    drawdepth: FloorObjects
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Transform
    anchored: true
  - type: Physics
    canCollide: False
    bodyType: Static
  - type: Clickable

- type: entity
  parent: F14Rails
  id: F14RailsJunctionRightTop
  suffix: junction right top
  components:
  - type: Sprite
    state: junction-right-top

- type: entity
  parent: F14Rails
  id: F14RailsJunctionLeftTop
  suffix: junction left top
  components:
  - type: Sprite
    state: junction-left-top

- type: entity
  parent: F14Rails
  id: F14RailsJunctionRightBottom
  suffix: junction right bottom
  components:
  - type: Sprite
    state: junction-right-bottom

- type: entity
  parent: F14Rails
  id: F14RailsJunctionLeftBottom
  suffix: junction left bottom
  components:
  - type: Sprite
    state: junction-left-bottom

- type: entity
  parent: F14Rails
  id: F14RailsTurnWS
  suffix: turn west-south
  components:
  - type: Sprite
    state: turn-WS

- type: entity
  parent: F14Rails
  id: F14RailsTurnNW
  suffix: turn north-west
  components:
  - type: Sprite
    state: turn-NW

- type: entity
  parent: F14Rails
  id: F14RailsTurnNE
  suffix: turn north-east
  components:
  - type: Sprite
    state: turn-NE

- type: entity
  parent: F14Rails
  id: F14RailsTurnSE
  suffix: turn south-east
  components:
  - type: Sprite
    state: turn-SE
