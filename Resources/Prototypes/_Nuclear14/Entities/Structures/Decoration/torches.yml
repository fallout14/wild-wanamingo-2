# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Decoration/torches.yml

- type: entity
  id: N14Torch
  name: torch
  suffix: floor, mapping
  description: A flaming torch for lighting an area.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: False
  - type: Sprite
    netsync: false
    noRot: true
    sprite: MojaveSun/Structures/Lighting/torches.rsi   # WW Change - Mojave Sun 13 sprites
    state: torch_lit                                   # WW Change - Mojave Sun 13 sprites
  - type: Appearance
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
  - type: ExtinguishOnInteract
    extinguishAttemptSound:
      path: /Audio/Items/candle_blowing.ogg
      params:
        variation: 0.05
        volume: 10
  - type: UseDelay
  - type: Flammable
    fireSpread: false
    canResistFire: false
    alwaysCombustible: true
    canExtinguish: true
    firestacksOnIgnite: 3.0
    firestackFade: -0.01
    damage:
      types:
        Heat: 0.1
  - type: FireVisuals
    sprite: MojaveSun/Structures/Lighting/torches.rsi     # WW Change - Mojave Sun 13 sprites
    normalState: torch_lit                               # Forge-Change
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ToggleableVisuals
    spriteLayer: null
  - type: PointLight
    color: "#e39c40"
    radius: 5
    power: 16

- type: entity
  parent: N14Torch
  id: N14TorchWall
  suffix: wall, mapping
  components:
  - type: Sprite
    noRot: false
    state: wall_torch_lite # WW Change - Mojave Sun 13 sprites
  - type: FireVisuals
    sprite: MojaveSun/Structures/Lighting/torches.rsi # WW Change - Mojave Sun 13 sprites
    normalState: wall_torch_lite # Forge-Change
