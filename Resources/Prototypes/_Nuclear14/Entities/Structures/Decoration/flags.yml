- type: entity
  parent: F14DecorationFlagFlammable
  id: F14DecorationFlagChurch
  name: Flag of the Church of Renewal
  description: The banner of the Church of Renewal, a cult that believes the nuclear apocalypse was a gift of creation, and that forced evolution of humanity is not only our one path to survival, but our sacred destiny.
  components:
  - type: Physics  # spawn state
    canCollide: False
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/flags.rsi
    state: cotc
