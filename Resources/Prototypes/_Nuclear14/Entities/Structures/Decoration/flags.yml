# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Decoration/flags.yml

- type: entity
  id: F14DecorationFlagBearerEmpty
  name: Empty Banner Standard
  description: A post for hanging banners of various cults, factions and nations. A challenge to everyone else to shoot at you.
  suffix: Mapping
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/flags.rsi
    state: emptyflag
    snapCardinals: true
    netsync: false
    noRot: true
    drawdepth: Overdoors
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: False
  - type: Clickable
  - type: SpriteFade

- type: entity
  parent: F14DecorationFlagBearerEmpty
  id: F14DecorationFlagFlammable
  categories: [ HideSpawnMenu ]
  components:
  - type: Physics  # spawn state
    canCollide: False
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
  - type: ExtinguishOnInteract
    extinguishAttemptSound:
      path: /Audio/Items/candle_blowing.ogg
      params:
        variation: 0.05
        volume: 10
  - type: UseDelay
  - type: Flammable
    fireSpread: true
    canResistFire: false
    alwaysCombustible: true
    canExtinguish: true
    firestacksOnIgnite: 3.0
    firestackFade: -0.01
    damage:
      types:
        Heat: 0.1
  - type: Appearance
  - type: FireVisuals
    sprite: Mobs/Effects/onfire.rsi
    normalState: Standing
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          F14DecorationFlagBearerEmpty:
            min: 1
            max: 1

- type: entity
  parent: F14DecorationFlagFlammable
  id: F14DecorationFlagNCR
  name: Flag of the New California Republic
  description: The banner of the New California Republic, a nation that despite enemies within and without, has done its best to provide comfort and equality to its citizens.
  components:
  - type: Physics  # spawn state
    canCollide: False
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/flags.rsi
    state: ncrflag

- type: entity
  parent: F14DecorationFlagFlammable
  id: F14DecorationFlagOasis
  name: Flag of the Oasis Tribe
  description: The banner of the Oasis Tribe, originating in the remains of Pahrump, Nevada. The tribe was incorporated into the New California Republic, yet its members still remember their roots as they settle new lands.
  components:
  - type: Physics  # spawn state
    canCollide: False
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/flags.rsi
    state: oasisflag

- type: entity
  parent: F14DecorationFlagFlammable
  id: F14DecorationFlagBrotherhoodWashington
  name: Flag of the Washington Brotherhood of Steel
  description: The banner of the Washington Brotherhood of Steel, a chapter that split off from the Midwest Brotherhood and settled into Seattle, turning to conscription, slavery, and violent oppression of the locals under the rule of the Elder Immortal.
  components:
  - type: Physics  # spawn state
    canCollide: False
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/flags2.rsi
    state: wbosflag

- type: entity
  parent: F14DecorationFlagFlammable
  id: F14DecorationFlagBrotherhoodMidwest
  name: Flag of the Brotherhood of Steel
  description: The banner of the Brotherhood of Steel, descendents of the United States military who now attempt to confiscate and safeguard dangerous technology to prevent another apocalypse.
  components:
  - type: Physics  # spawn state
    canCollide: False
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/flags2.rsi
    state: mbosflag

- type: entity
  parent: F14DecorationFlagFlammable
  id: F14DecorationFlagFollowers
  name: Flag of the Followers of the Apocalypse
  description: The banner of the Followers of the Apocalypse, a humanitarian organization with the goal of providing medical services to those in need and a distinct disinterest in taking power, they are rarely a target and often protected by others.
  components:
  - type: Physics  # spawn state
    canCollide: False
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/flags.rsi
    state: followersflag

- type: entity
  parent: F14DecorationFlagFlammable
  id: F14DecorationFlagEnclave
  name: Flag of the U.S. Army
  description: The banner of the U.S. Army, the descendents of America's elite who claim to be the true inheritors of the United States federal government.
  components:
  - type: Physics  # spawn state
    canCollide: False
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/flags.rsi
    state: enclaveflag

- type: entity
  parent: F14DecorationFlagFlammable
  id: F14DecorationFlagGunner
  name: Flag of the Gunner Mercenary Corps
  description: The banner of the Gunners, a mercenary company from deeper in the unknown United States territory. They act without any moral limitations, but will not murder or pillage any more than the employer has ordered.
  components:
  - type: Physics  # spawn state
    canCollide: False
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/flags.rsi
    state: gunnerflag

- type: entity
  parent: F14DecorationFlagFlammable
  id: F14DecorationFlagLocust
  name: Flag of the Locust Tribe
  description: The banner of the Locusts, a tribe of raiders native to Wendover, Utah. When the bombs first dropped, Wendover split into three survivor communities, the Locusts, Vultures and Willowers. The Locust Tribe believed the survivors should raid outsiders and take what they could through strength. After the first few years, they turned on the two other tribes as well.
  components:
  - type: Physics  # spawn state
    canCollide: False
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/flags.rsi
    state: locustflag

- type: entity
  parent: F14DecorationFlagFlammable
  id: F14DecorationFlagHighvalleyhills
  name: Flag of High Valley Hills
  description: The banner of High Valley Hills, a settlement that cropped up around Vault City in the New California Republic from those who were not permitted entry; it is a mix of a slum and work camp for the desperate.
  components:
  - type: Physics  # spawn state
    canCollide: False
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/flags.rsi
    state: hvhflag

- type: entity
  parent: F14DecorationFlagFlammable
  id: F14DecorationFlagVaultTecCityCoalition
  name: Flag of Vault City
  description: The banner of Vault City, a major settlement that evolved from Vault 8 in what remains of the west coast of the United States. They are a notable exporter of medical technology.
  components:
  - type: Physics  # spawn state
    canCollide: False
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/flags.rsi
    state: vtccflag

- type: entity
  parent: F14DecorationFlagFlammable
  id: F14DecorationFlagYuma
  name: Flag of Yuma City
  description: The banner of the city of Yuma, Arizona. It serves as both an important source of food for tributes to Caesar's Legion, and an important waterway between Arizona and California's southern edge.
  components:
  - type: Physics  # spawn state
    canCollide: False
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/flags.rsi
    state: cornflag
