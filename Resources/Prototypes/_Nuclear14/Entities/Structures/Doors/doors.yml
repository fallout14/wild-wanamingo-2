# Glass Doors

- type: entity
  parent: F14DoorMakeshift
  id: F14DoorGlass
  name: glass door
  description: It's a door with panels made of clean glass.
  components:
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Structures/Doors/FalloutDoors/glassdoor.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Door
    occludes: false
  - type: Occluder
    enabled: false
  - type: Damageable
    damageModifierSet: Glass
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          F14DoorGlassBroken:
            min: 1
            max: 1
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 2

