# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Doors/FalloutDoors/airlocks.yml

- type: entity
  id: N14Airlock
  parent: Airlock
  name: bunker door
  description: It opens, it closes, it might crush you, and there might be only radiation and monsters behind it. Has to be manually activated.
  abstract: true
  components:
  - type: Door
    bumpOpen: false
    crushDamage:
      types:
        Blunt: 30 #if the 2 ton vault door breaking every bone in your body doesn't kill you, the suffocation will
    openSound:
      path: /Audio/Machines/airlock_ext_open.ogg
    closeSound:
      path: /Audio/Machines/airlock_ext_close.ogg
    denySound:
      path: /Audio/Machines/airlock_deny.ogg

- type: entity
  parent: N14Airlock
  id: N14DoorBunkerVault
  suffix: Vault
  components:
  - type: Door
    bumpOpen: false
    crushDamage:
      types:
        Blunt: 80 #if the 2 ton vault door breaking every bone in your body doesn't kill you, the suffocation will
  - type: Sprite
    sprite: Nuclear14/Structures/Doors/FalloutDoors/vaultdoor.rsi

- type: entity
  parent: N14Airlock
  id: N14DoorBunker
  components:
  - type: Sprite
    sprite: MojaveSun/Structures/Doors/Airlocks/mechanical.rsi # WW Change - Mojave Sun 13 mechanical door
  - type: Construction
    graph: N14DoorBunker
    node: bunker
    containers:
    - board

- type: entity
  parent: N14Airlock
  id: N14DoorBunkerGlass
  components:
  - type: Door
    occludes: false
  - type: Occluder
    enabled: false
  - type: Sprite
    sprite: Nuclear14/Structures/Doors/FalloutDoors/glassbunkerdoor.rsi
  - type: Construction
    graph: N14DoorBunker
    node: glassBunker
    containers:
    - board
