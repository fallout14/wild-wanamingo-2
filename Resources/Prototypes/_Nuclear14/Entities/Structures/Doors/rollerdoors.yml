# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Doors/rollerdoors.yml

- type: entity
  parent: BaseMaterialDoor
  id: F14DoorShutterFramedRoller
  name: shutter
  description: A lightweight airtight roller shutter door.
  components:
  - type: Door
    bumpOpen: false
    crushDamage:
      types:
        Blunt: 5
    openSound:
      path: /Audio/Machines/airlock_ext_open.ogg
    closeSound:
      path: /Audio/Machines/airlock_ext_close.ogg
    denySound:
      path: /Audio/Machines/airlock_deny.ogg
  - type: Sprite
    sprite: Nuclear14/Structures/Doors/RollerDoors/framedshutter.rsi
    

- type: entity
  parent: BaseMaterialDoor
  id: F14DoorShutterRoller
  name: garage shutter
  suffix: frameless
  description: A lightweight airtight roller shutter door.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Doors/RollerDoors/garageshutter.rsi
