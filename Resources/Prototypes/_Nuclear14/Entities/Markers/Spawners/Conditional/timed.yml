# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Markers/Spawners/Conditional/timed.yml

- type: entity
  name: Molerat Timed Spawner
  id: F14TimedSpawnerMolerat
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - state: blue
        - sprite: Nuclear14/Mobs/Animals/molerat.rsi
          state: molerat
        - state: timed
    - type: WastelandSpawner
      prototypes:
        - F14MobMolerat
      chance: 0.65
      intervalSeconds: 2400
      minimumEntitiesSpawned: 1
      maximumEntitiesSpawned: 3
      activationRange: 60 # #Misfits Add - Only spawn when a living player is within 60 tiles
      maxAlivePerPrototype: 12 # #Misfits Add - Cap alive mobs of this type per map to prevent accumulation

