# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Species/ghoul.yml, ghoulglowing.yml, Entities/Mobs/Species/ghouls.yml,
# Entities/Mobs/Player/ghouls.yml
# Changed for Wild Wanamingo: rewritten for Wizden's organ-based bodies. Ghouls are humans with ghoul skin (their
# parts.rsi has the same states as Wizden's human one), radiation healing and tougher insides. Misfits' custom
# starvation/dehydration damage is left out (Wizden's Satiation replaces hunger and thirst). NPC factions come from the
# job (Misfits also set Wastelander on the species).

# Same marking slots as humans (hair, facial hair...).
- type: markingsGroup
  parent: Human
  id: F14Ghoul

# --- Ghoul

- type: entity
  parent: AppearanceHuman
  id: F14AppearanceGhoul
  categories: [ HideSpawnMenu ]
  name: ghoul appearance
  components:
  - type: InitialBody
    organs:
      Torso: F14OrganGhoulTorso
      Head: F14OrganGhoulHead
      ArmLeft: F14OrganGhoulArmLeft
      ArmRight: F14OrganGhoulArmRight
      HandRight: F14OrganGhoulHandRight
      HandLeft: F14OrganGhoulHandLeft
      LegLeft: F14OrganGhoulLegLeft
      LegRight: F14OrganGhoulLegRight
      FootLeft: F14OrganGhoulFootLeft
      FootRight: F14OrganGhoulFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: F14Ghoul

- type: entity
  parent:
  - F14AppearanceGhoul
  - BaseSpeciesMobOrganic
  id: F14MobGhoul
  name: Urist McGhoul
  components:
  - type: Icon
    sprite: Nuclear14/Mobs/Species/Ghoul/parts.rsi
    state: full
  - type: Perishable
    rotAfter: 3600 # an entire in-game day
  - type: Damageable
    damageModifierSet: F14Ghoul
  - type: RadiationReceiver
  - type: RadiationHealing
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      150: Dead

- type: entity
  parent: OrganHuman
  id: F14OrganGhoulExternal
  abstract: true
  components:
  - type: Sprite
    sprite: Nuclear14/Mobs/Species/Ghoul/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Nuclear14/Mobs/Species/Ghoul/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: F14Ghoul

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, F14OrganGhoulExternal ]
  id: F14OrganGhoulTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, F14OrganGhoulExternal ]
  id: F14OrganGhoulHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.FacialHair

- type: entity
  parent: [ OrganBaseArmLeft, F14OrganGhoulExternal ]
  id: F14OrganGhoulArmLeft

- type: entity
  parent: [ OrganBaseArmRight, F14OrganGhoulExternal ]
  id: F14OrganGhoulArmRight

- type: entity
  parent: [ OrganBaseHandLeft, F14OrganGhoulExternal ]
  id: F14OrganGhoulHandLeft

- type: entity
  parent: [ OrganBaseHandRight, F14OrganGhoulExternal ]
  id: F14OrganGhoulHandRight

- type: entity
  parent: [ OrganBaseLegLeft, F14OrganGhoulExternal ]
  id: F14OrganGhoulLegLeft

- type: entity
  parent: [ OrganBaseLegRight, F14OrganGhoulExternal ]
  id: F14OrganGhoulLegRight

- type: entity
  parent: [ OrganBaseFootLeft, F14OrganGhoulExternal ]
  id: F14OrganGhoulFootLeft

- type: entity
  parent: [ OrganBaseFootRight, F14OrganGhoulExternal ]
  id: F14OrganGhoulFootRight

# --- Glowing ghoul: glows, emits a little radiation, resists gamma, and is frailer.

- type: entity
  parent: AppearanceHuman
  id: F14AppearanceGhoulGlowing
  categories: [ HideSpawnMenu ]
  name: glowing ghoul appearance
  components:
  - type: InitialBody
    organs:
      Torso: F14OrganGhoulGlowingTorso
      Head: F14OrganGhoulGlowingHead
      ArmLeft: F14OrganGhoulGlowingArmLeft
      ArmRight: F14OrganGhoulGlowingArmRight
      HandRight: F14OrganGhoulGlowingHandRight
      HandLeft: F14OrganGhoulGlowingHandLeft
      LegLeft: F14OrganGhoulGlowingLegLeft
      LegRight: F14OrganGhoulGlowingLegRight
      FootLeft: F14OrganGhoulGlowingFootLeft
      FootRight: F14OrganGhoulGlowingFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: F14GhoulGlowing

- type: entity
  parent:
  - F14AppearanceGhoulGlowing
  - BaseSpeciesMobOrganic
  id: F14MobGhoulGlowing
  name: Urist McGlow
  components:
  - type: Icon
    sprite: Nuclear14/Mobs/Species/GhoulGlowing/parts.rsi
    state: full
  - type: Perishable
    rotAfter: 3600
  - type: Damageable
    damageModifierSet: F14GhoulGlowing # GhoulGlowing x F14GammaShield (Wizden allows one set)
  - type: RadiationReceiver
  - type: RadiationHealing
  - type: MobThresholds
    thresholds:
      0: Alive
      90: Critical
      130: Dead
  - type: PointLight
    radius: 2
    energy: 0.5
  - type: RadiationSource
    intensity: 0.5
    slope: 0.25

- type: entity
  parent: OrganHuman
  id: F14OrganGhoulGlowingExternal
  abstract: true
  components:
  - type: Sprite
    sprite: Nuclear14/Mobs/Species/GhoulGlowing/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Nuclear14/Mobs/Species/GhoulGlowing/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: F14Ghoul

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, F14OrganGhoulGlowingExternal ]
  id: F14OrganGhoulGlowingTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, F14OrganGhoulGlowingExternal ]
  id: F14OrganGhoulGlowingHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.FacialHair

- type: entity
  parent: [ OrganBaseArmLeft, F14OrganGhoulGlowingExternal ]
  id: F14OrganGhoulGlowingArmLeft

- type: entity
  parent: [ OrganBaseArmRight, F14OrganGhoulGlowingExternal ]
  id: F14OrganGhoulGlowingArmRight

- type: entity
  parent: [ OrganBaseHandLeft, F14OrganGhoulGlowingExternal ]
  id: F14OrganGhoulGlowingHandLeft

- type: entity
  parent: [ OrganBaseHandRight, F14OrganGhoulGlowingExternal ]
  id: F14OrganGhoulGlowingHandRight

- type: entity
  parent: [ OrganBaseLegLeft, F14OrganGhoulGlowingExternal ]
  id: F14OrganGhoulGlowingLegLeft

- type: entity
  parent: [ OrganBaseLegRight, F14OrganGhoulGlowingExternal ]
  id: F14OrganGhoulGlowingLegRight

- type: entity
