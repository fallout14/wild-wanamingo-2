- type: reagent
  id: F14SmellingSalts
  name: reagent-name-smelling-salts
  group: Chems
  desc: reagent-desc-smelling-salts
  physicalDesc: reagent-physical-desc-strong-smelling
  color: "#e1f5f4"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.2 # Slow Acting
      effects:
      - !type:AmbientDrugFlavorText
        cooldownId: SmellingSaltsAmbient
        cooldown: 25
        messageKeys:
        - drug-ambience-smelling-salts-1
        - drug-ambience-smelling-salts-2
      - !type:HealthChange # Base Airloss fixing
        damage:
          types:
            Asphyxiation: -5
            Cold: -2
      - !type:HealthChange # Conditional Epinephrine-like bonus on unconscious
        conditions:
        - !type:MobStateCondition
          mobstate: Critical
        - !type:ReagentCondition
          reagent: F14SmellingSalts
          min: 0
          max: 20
        damage:
          types:
            Asphyxiation: -3
            Poison: -0.5
            Blunt: -0.166667
            Slash: -0.166667
            Piercing: -0.166667
            Heat: -0.125
            Shock: -0.125
            Cold: -0.125
            Caustic: -0.125
      - !type:HealthChange # 20u threshold
        conditions:
        - !type:ReagentCondition
          reagent: F14SmellingSalts
          min: 20
        damage:
          types:
            Asphyxiation: 3
            Poison: 1
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStunned
        time: 0.75
        type: Remove
      - !type:ModifyKnockdown
        time: 0.75
        type: Remove
      - !type:Jitter
      - !type:Vomit
        probability: 0.05

- type: reagent
  id: F14HealingPoultice
  name: reagent-name-healing-poultice
  group: Chems
  desc: reagent-desc-healing-poultice
  physicalDesc: reagent-physical-desc-soothing
  color: "#24b530"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.2
      effects:
      - !type:AmbientDrugFlavorText
        cooldownId: HealingPoulticeAmbient
        cooldown: 150 # Misfits Tweak: raised from 50 — was flooding chat when multiple doses stacked
        messageKeys:
        - drug-ambience-healing-poultice-1
        - drug-ambience-healing-poultice-2
      - !type:HealthChange
        damage:
          types:
            Heat: -1.125
            Shock: -1.125
            Cold: -1.125
            Caustic: -1.125
            Blunt: -1.5
            Slash: -1.5
            Piercing: -1.5
            Asphyxiation: -0.5
            Bloodloss: -0.5
      - !type:ModifyBleed
        amount: -2
      # !type:Drunk — #Misfits Tweak: Removed. TryAddTime accumulates per metabolism tick, causing ~10 min overlay.
      # HealingPoultice is a medicine not a drink; Jitter below already signals discomfort without screen distortion.
      - !type:Jitter
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: F14HealingPoultice
          min: 26
      # #Misfits Add - OD threshold: drinking poultice in bulk causes poison damage
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: F14HealingPoultice
          min: 30
        - !type:MobStateCondition
        damage:
          types:
            Poison: 1.5

- type: reagent
  id: F14Bitterdrink
  name: reagent-name-bitterdrink
  group: Chems
  desc: reagent-desc-bitterdrink
  physicalDesc: reagent-physical-desc-sticky
  color: "#ba67f5"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.2 # Effectively once every 5 seconds.
      effects:
      - !type:AmbientDrugFlavorText
        cooldownId: BitterdrinkAmbient
        cooldown: 50
        messageKeys:
        - drug-ambience-bitterdrink-1
        - drug-ambience-bitterdrink-2
      - !type:HealthChange
        damage:
          types:
            Radiation: -1.5 # Misfits Change - Bitterdrink previously was dirt cheap and outperformed antidote and radaway. Now it requires actual chemistry to make but works as a solid anti-rad/poison mix.
            Poison: -1.5
      - !type:Emote # Misfits Change - Bitterdrink is supposed to taste fucking awful
        emote: Cough
        showInChat: true
        probability: 0.05
      - !type:Vomit
        probability: 0.05
        conditions:
        - !type:ReagentCondition
          reagent: F14Bitterdrink
          min: 25

