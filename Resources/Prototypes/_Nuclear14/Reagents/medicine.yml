# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Reagents/medicine.yml

- type: reagent
  id: F14HealingMixture #used in regular stimpacks
  #Misfits Change /Fix:/ aligned metabolism effects list items under the same sequence.
  name: reagent-name-healing-mixture
  group: Chems
  desc: reagent-desc-healing-mixture
  physicalDesc: reagent-physical-desc-soothing
  color: "#934435"
  metabolisms:
    Bloodstream:
      metabolismRate: 1.0
      effects:
      - !type:AmbientDrugFlavorText
        cooldownId: HealingMixtureAmbient
        cooldown: 45
        messageKeys:
        - drug-ambience-healing-mixture-1
        - drug-ambience-healing-mixture-2
      - !type:HealthChange
        damage:
          types:
            Heat: -2.25
            Shock: -2.25
            Cold: -2.25
            Caustic: -2.25
            Blunt: -3
            Slash: -3
            Piercing: -3
            Asphyxiation: -1.5
            Bloodloss: -1.5
      - !type:ModifyBleed
        amount: -2
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: F14HealingMixture
          min: 30

- type: reagent
  id: F14DirtyStimpak
  name: reagent-name-dirty-stimpak
  group: Chems
  desc: reagent-desc-dirty-stimpak
  physicalDesc: reagent-physical-desc-soothing
  color: "#934435"
  metabolisms:
    Bloodstream:
      effects:
      - !type:AmbientDrugFlavorText
        cooldownId: DirtyStimpakAmbient
        cooldown: 45
        messageKeys:
        - drug-ambience-dirty-stimpak-1
        - drug-ambience-dirty-stimpak-2
      - !type:HealthChange
        damage:
          types:
            Heat: -0.5
            Shock: -0.5
            Cold: -0.5
            Caustic: -0.5
            Blunt: -0.666667
            Slash: -0.666667
            Piercing: -0.666667
            Asphyxiation: -1
            Bloodloss: -1
            Radiation: 0.25
            Poison: 0.25
      - !type:ModifyBleed
        amount: -1
      - !type:HealthChange # to prevent doping
        conditions:
        - !type:ReagentCondition
          reagent: F14DirtyStimpak
          min: 30
        damage:
          types:
            Heat: -0.25
            Shock: -0.25
            Cold: -0.25
            Caustic: -0.25
            Blunt: -0.333333
            Slash: -0.333333
            Piercing: -0.333333
            Asphyxiation: -0.5
            Bloodloss: -0.5
            Poison: 0.75
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: F14DirtyStimpak
          min: 50
        - !type:MobStateCondition #Misfits Tweak: OD can push to crit but never kill
        damage:
          types:
            Poison: 1

