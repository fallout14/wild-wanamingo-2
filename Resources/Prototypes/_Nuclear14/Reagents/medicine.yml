- type: reagent
  id: F14RobustHealingMixture #used in super stimpacks
  name: reagent-name-robust-healing-mixture
  group: Chems
  desc: reagent-desc-robust-healing-mixture
  physicalDesc: reagent-physical-desc-gleaming
  color: "#ff113a"
  metabolisms:
    Bloodstream:
      effects:
      - !type:AmbientDrugFlavorText
        cooldownId: RobustHealingMixtureAmbient
        cooldown: 40
        messageKeys:
        - drug-ambience-robust-healing-mixture-1
        - drug-ambience-robust-healing-mixture-2
      - !type:HealthChange
        damage:
          types:
            Heat: -2.25
            Shock: -2.25
            Cold: -2.25
            Caustic: -2.25
            Blunt: -3
            Slash: -3
            Piercing: -3
            Asphyxiation: -2.25
            Bloodloss: -2.25
      - !type:ModifyBleed
        amount: -3
      - !type:HealthChange # Taking 2 is more or less a guaranteed death
        conditions:
        - !type:ReagentCondition
          reagent: F14RobustHealingMixture
          min: 30
        - !type:MobStateCondition #Misfits Tweak: OD can push to crit but never kill
        damage:
          types:
            Heat: -0.375
            Shock: -0.375
            Cold: -0.375
            Caustic: -0.375
            Blunt: -0.5
            Slash: -0.5
            Piercing: -0.5
            Asphyxiation: -0.75
            Bloodloss: -0.75
            Poison: 5
            Cellular: 0.75
      - !type:MovementSpeedModifier
        walkSpeedModifier: 0.50
        sprintSpeedModifier: 0.50
        conditions:
        - !type:ReagentCondition
          reagent: F14RobustHealingMixture
          min: 30
      # !type:Drunk — #Misfits Tweak: Removed. TryAddTime stacks per tick → multi-minute overlay on OD.
      # MovespeedModifier above already communicates the OD state visually.
      # conditions:
      # - !type:ReagentThreshold
      #   min: 30

