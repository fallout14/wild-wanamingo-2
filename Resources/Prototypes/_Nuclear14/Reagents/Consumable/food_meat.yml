# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Reagents/Consumable/food.yml
# Rewritten for Wizden's metabolism: Wizden's UncookedAnimalProteins plus N14's radiation damage.
# The super mutant metabolism from Misfits comes back with the species port.

- type: reagent
  id: F14UncookedAnimalProteinsRad
  name: reagent-name-uncooked-animal-proteins-rad
  group: Foods
  desc: reagent-desc-uncooked-animal-proteins-rad
  physicalDesc: reagent-physical-desc-clumpy
  flavor: bitter
  color: "#FFFFE5"
  metabolisms:
    Bloodstream:
      effects:
      - !type:PopupMessage
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Animal, Vox, Arachnid ]
          inverted: true
        type: Local
        visualType: MediumCaution
        messages: [ "generic-reagent-effect-sick" ]
        probability: 0.5
      - !type:Vomit
        probability: 0.1
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Animal, Vox, Plant, Arachnid ]
          inverted: true
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Animal, Vox, Plant, Arachnid ]
          inverted: true
        damage:
          types:
            Poison: 1
            Radiation: 1
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Plant ]
        damage:
          types:
            Poison: .25
      - !type:AdjustReagent
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Animal, Arachnid ]
        reagent: Protein
        amount: 0.5
      - !type:AdjustReagent
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Vox ]
        reagent: Protein
        amount: 0.25
