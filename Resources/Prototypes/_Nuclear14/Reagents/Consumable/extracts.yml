- type: reagent
  parent: MisfitsM14BaseProduceExtract
  id: N14ExtractAgaveNectar
  name: reagent-name-extract-agave-nectar
  group: Extracts
  desc: reagent-desc-extract-agave-nectar
  physicalDesc: reagent-physical-desc-syrupy
  flavor: syrupy
  color: "#babf4d"
  metabolisms:
    Digestion:
      effects:
      - !type:AdjustReagent
        reagent: Nutriment
        amount: .2
      - !type:AdjustReagent
        reagent: Water
        amount: 1
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Heat: -0.025
            Shock: -0.025
            Cold: -0.025
            Caustic: -0.025
      - !type:HealthChange
        damage:
          types:
            Radiation: .1

