- type: reagent
  id: N14Buffout
  name: reagent-name-buffout
  group: Chems
  desc: reagent-desc-buffout
  physicalDesc: reagent-physical-desc-fortifying
  color: "#8b4513"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.2 # Effectively once every 5 seconds.
      effects:
      - !type:AmbientDrugFlavorText
        cooldownId: BuffoutAmbient
        cooldown: 45
        messageKeys:
        - drug-ambience-buffout-1
        - drug-ambience-buffout-2
      - !type:Emote #Misfits Change - something to add a visible sign of drug use
        emote: Laugh
        showInChat: true
        probability: 0.05
      - !type:Addicting #Misfits Change
        reagent: N14Buffout
        time: 6
        # Buffout withdrawal: muscles ache from sudden loss of chemical strength augmentation.
        withdrawalDamage:
          types:
            Blunt: 0.0666667
            Slash: 0.0666667
            Piercing: 0.0666667
        withdrawalStaminaDrain: 8.0
      - !type:HealthChange #Misfits Change /Add:/ Minor wound healing — Buffout's physical enhancement knits minor cuts.
        conditions:
        - !type:ReagentCondition
          reagent: N14Buffout
          max: 30
        damage:
          types:
            Blunt: -0.1
            Slash: -0.1
            Piercing: -0.1
            Heat: -0.075
            Shock: -0.075
            Cold: -0.075
            Caustic: -0.075
      - !type:HealthChange #Misfits Change /Add:/ Overdose — suffocates the player when stacking too much Buffout
        conditions:
        - !type:ReagentCondition
          reagent: N14Buffout
          min: 30
        - !type:MobStateCondition #Misfits Tweak: OD can push to crit but never kill
        damage:
          types:
            Asphyxiation: 15
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: N14Buffout
          min: 30
          max: 40
        damage:
          types:
            Poison: 0.25
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: N14Buffout
          min: 40
          max: 50
        damage:
          types:
            Poison: 0.75
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: N14Buffout
          min: 50
          max: 60
        damage:
          types:
            Poison: 1.25
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: N14Buffout
          min: 60
          max: 70
        damage:
          types:
            Poison: 1.75
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: N14Buffout
          min: 70
        damage:
          types:
            Poison: 2.25
      - !type:SpecialStatBoost
        strengthBoost: 2
