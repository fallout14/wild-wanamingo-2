# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Species/supermutant.yml, nightkin.yml
# Changed for Wild Wanamingo: rewritten for Wizden's species prototype. Misfits' whitelist, job and loadout
# restrictions aren't species fields in Wizden (they come back with jobs/whitelisting); size is set on the mob sprite.

- type: species
  id: F14SuperMutant
  name: species-name-supermutant
  roundStart: true
  randomSelectable: false # picked on purpose (Misfits whitelisted it)
  prototype: F14MobSuperMutant
  dollPrototype: AppearanceSuperMutant
  skinColoration: Hues
  defaultSkinTone: "#6b8e23"
  sexes:
  - Male
  - Female
  defaultSoundsBySex: # male, female, unsexed
  - F14SuperMutantEmotes
  - F14SuperMutantEmotes
  - F14SuperMutantEmotes
  voices:
  - F14SuperMutantEmotes

# Super mutants exposed to Stealth Boys for years: slate blue-purple skin.
- type: species
  id: F14Nightkin
  name: species-name-nightkin
  roundStart: true
  randomSelectable: false # picked on purpose (Misfits whitelisted it)
  prototype: F14MobNightkinPlayer
  dollPrototype: AppearanceNightkin
  skinColoration: Hues
  defaultSkinTone: "#4A5878"
  sexes:
  - Male
  - Female
  defaultSoundsBySex: # male, female, unsexed
  - F14SuperMutantEmotes
  - F14SuperMutantEmotes
  - F14SuperMutantEmotes
  voices:
  - F14SuperMutantEmotes
