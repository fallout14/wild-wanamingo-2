# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Species/deathclaw.yml
# Changed for Wild Wanamingo: rewritten for Wizden's species prototype. Misfits' whitelist/job locks
# (SentientDeathclawRegular, SentientDeathclaw for Bwonsamdi) come back with jobs/whitelisting. Deathclaws are
# animal bodies: no markings, sizes or skin tone (the tone is ignored by their sprite).

- type: species
  id: F14Deathclaw
  name: species-name-deathclaw
  roundStart: true
  randomSelectable: false # picked on purpose (Misfits whitelisted it)
  prototype: F14MobDeathclawSentient
  dollPrototype: AppearanceDeathclaw
  skinColoration: Hues
  defaultSkinTone: "#7a5a45"
  sexes:
  - Unsexed
  defaultSoundsBySex: # male, female, unsexed
  - F14DeathclawEmotes
  - F14DeathclawEmotes
  - F14DeathclawEmotes
  voices:
  - F14DeathclawEmotes

