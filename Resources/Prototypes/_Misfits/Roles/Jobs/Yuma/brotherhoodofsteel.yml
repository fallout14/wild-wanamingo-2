# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Roles/Jobs/, _Nuclear14/Roles/Jobs/
# Changed for Wild Wanamingo: Yuma's roster. Names, slots and whitelists from the server's roster; gear is
# Misfits' (minus the wallet slot and the skirt/satchel/duffel choices, which are loadouts in Wizden).
# Misfits' playtime and species requirements are left out for now.

- type: job
  id: BoSWestElderCommander
  name: job-name-bos-west-elder-comm
  description: job-description-bos-west-elder-comm
  playTimeTracker: BoSWestElderCommander
  startingGear: BoSWestElderCommanderGear
  icon: JobIconPassenger # placeholder: Misfits used Corvax job icons
  supervisors: job-supervisors-bos-west-elder
  whitelisted: true
  accessGroups:
  - BOSElder
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - BrotherhoodOfSteel
      - type: PowerArmorProficiency

- type: startingGear
  id: BoSWestElderCommanderGear
  equipment:
    jumpsuit: N14ClothingUniformJumpskirtBOSBlack
    back: N14ClothingBackpackMilitary
    shoes: N14ClothingBootsLeatherFilled
    outerClothing: N14ClothingOuterBrotherhoodElderCoat
    hands: N14ClothingHandsGlovesCombat
    pocket1: BoSBrotherhoodElderKits
    id: N14IDBrotherhoodOfSteelHolotagElder
    ears: N14ClothingHeadsetBrotherhoodOfSteel
    belt: N14ClothingBeltBoSWebbing
  storage:
    back:
    - MisfitsIFAKMilitary

