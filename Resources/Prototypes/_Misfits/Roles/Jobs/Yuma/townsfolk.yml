# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Roles/Jobs/, _Nuclear14/Roles/Jobs/
# Changed for Wild Wanamingo: Yuma's roster. Names, slots and whitelists from the server's roster; gear is
# Misfits' (minus the wallet slot and the skirt/satchel/duffel choices, which are loadouts in Wizden).
# Misfits' playtime and species requirements are left out for now.

- type: job
  id: TownMayor
  name: job-name-townmayor
  description: job-description-townmayor
  playTimeTracker: TownMayor
  startingGear: TownMayorGear
  icon: JobIconTownMayor
  supervisors: job-supervisors-townsfolk
  accessGroups:
  - Townie
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - Townsfolk

- type: startingGear
  id: TownMayorGear
  equipment:
    jumpsuit: N14ClothingUniformJumpsuitCheckered
    ears: MisfitsClothingHeadsetTown
    back: N14ClothingBackpackExplorer
    shoes: N14ClothingShoesBrown
    id: N14IDBadgeTownMayor
    pocket1: RadioHandheld
  storage:
    back:
    - MisfitsSurvivalKitWastelander

