    back: N14ClothingBackpackTrekker
    pocket1: N14TribalKnife
    pocket2: Triballoadoutkits
    id: N14IDTribeBossPendant
  storage:
    back:
    - Torch
    - Torch
    - Torch
    - N14Bandage
    - Ointment
    - N14ClothingDeathclawHelm

