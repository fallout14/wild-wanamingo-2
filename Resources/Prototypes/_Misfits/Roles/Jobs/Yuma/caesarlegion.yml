# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Roles/Jobs/, _Nuclear14/Roles/Jobs/
# Changed for Wild Wanamingo: Yuma's roster. Names, slots and whitelists from the server's roster; gear is
# Misfits' (minus the wallet slot and the skirt/satchel/duffel choices, which are loadouts in Wizden).
# Misfits' playtime and species requirements are left out for now.

- type: job
  id: CaesarLegionCenturion
  name: job-name-caesar-legion-centurion
  description: job-description-caesar-legion-centurion
  playTimeTracker: CaesarLegionCenturion
  startingGear: CaesarLegionCenturionGear
  icon: JobIconlegionerCenturion
  supervisors: job-name-caesar-legion
  whitelisted: true
  accessGroups:
  - CaesarLegionCenturion
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - CaesarLegion
      - type: ReplacementAccent
        accent: latin

- type: startingGear
  id: CaesarLegionCenturionGear
  equipment:
    jumpsuit: N14ClothingUniformJumpsuitLegionnaire
    ears: N14ClothingHeadsetLegion
    eyes: N14ClothingEyesGlassesWelding
    back: N14ClothingBackpackMilitary
    shoes: N14ClothingBootsCenturion
    gloves: N14ClothingHandsGlovesCenturion
    pocket1: F14KitSelectLegionCenturion
    pocket2: LegionCenturionArmorloadoutkits
    id: N14IDLegionaryMedalGold
  storage:
    back:
    - MisfitsIFAKLegion
    - N14HealingPowder

