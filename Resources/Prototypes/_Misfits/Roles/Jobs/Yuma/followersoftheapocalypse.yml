# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Roles/Jobs/, _Nuclear14/Roles/Jobs/
# Changed for Wild Wanamingo: Yuma's roster. Names, slots and whitelists from the server's roster; gear is
# Misfits' (minus the wallet slot and the skirt/satchel/duffel choices, which are loadouts in Wizden).
# Misfits' playtime and species requirements are left out for now.

- type: job
  id: FollowerDirector
  name: job-name-follower-director
  description: job-description-follower-director
  playTimeTracker: FollowerDirector
  startingGear: FollowerDirectorGear
  icon: JobIconPassenger
  supervisors: job-supervisors-follower-director
  accessGroups:
  - FollowersApocalypse
  - FotAHead
  - FotADoctor
  - FotA
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - Followers

- type: startingGear
  id: FollowerDirectorGear
  equipment:
    jumpsuit: N14ClothingUniformJumpsuitFollowers
    back: ClothingBackpackDuffelSurgeryFilled
    shoes: N14ClothingBootsLeather
    neck: ClothingNeckStethoscope
    id: N14IDFollowerHead
    ears: N14ClothingHeadsetFollowers
    outerClothing: N14ClothingOuterCoatFollowerLab
    belt: N14ClothingBeltMedicalFilled
    pocket2: N14HandheldHealthAnalyzer
    head: ClothingHeadHatBeretMedic

