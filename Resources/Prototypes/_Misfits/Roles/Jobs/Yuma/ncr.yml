# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Roles/Jobs/, _Nuclear14/Roles/Jobs/
# Changed for Wild Wanamingo: Yuma's roster. Names, slots and whitelists from the server's roster; gear is
# Misfits' (minus the wallet slot and the skirt/satchel/duffel choices, which are loadouts in Wizden).
# Misfits' playtime and species requirements are left out for now.

- type: job
  id: NCRCommander
  name: job-name-ncr-commander
  description: job-description-ncr-commander
  playTimeTracker: NCRCommander
  startingGear: NCRCommanderGear
  icon: JobIconPassenger # placeholder: Misfits used Corvax job icons
  supervisors: job-supervisors-ncr-commander
  whitelisted: true
  access:
  - NCR
  - NCRSGT
  - NCRMedic
  - NCRLT
  - NCRCaptain
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - NCR

- type: startingGear
  id: NCRCommanderGear
  equipment:
    head: N14ClothingHeadHatNCRBeretOfficer
    back: N14ClothingBackpackNCR
    jumpsuit: N14ClothingOfficerUniformNCRDesert
    outerClothing: MisfitsNCRCommandArmor
    shoes: N14ClothingBootsCombatFilled
    belt: ClothingBeltNCR
    eyes: ClothingEyesGlassesSunglasses
    ears: N14ClothingHeadsetNCR
    pocket1: F14KitNCRBaseCommander
    id: N14NCRCommanderPipboy
  storage:
    back:
    - MisfitsIFAKMilitary
    - SyndicateWhistle
    - N14Binoculars

