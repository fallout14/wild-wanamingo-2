# Misfits Change - Super Mutant damage modifier sets
# Ported from DesertRose2/desertrose: supermutant.dm bullet deflection (85% chance vs weak bullets)
# approximated here as flat Piercing coefficient reduction.

- type: damageModifierSet
  id: MisfitsSuperMutantMob # Thick mutant hide, highly radiation resistant, shrugs off weak impacts.
  coefficients:
