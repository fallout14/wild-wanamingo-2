# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Recipes/Crafting/Graphs/barricades.yml

- type: constructionGraph
  id: F14BarricadeTanktrap
  start: start
  graph:
    - node: start
      edges:
        - to: Tanktrap
          steps:
            - material: Steel
              amount: 7
              doAfter: 6
          completed:
            - !type:SnapToGrid
              southRotation: true

    - node: Tanktrap
      entity: F14BarricadeTanktrap
      edges:
        - to: start
          steps:
            - tool: Welding
              doAfter: 3
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 7
            - !type:DeleteEntity 

