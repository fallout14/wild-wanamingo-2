# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Recipes/Crafting/Graphs/furniture.yml

- type: constructionGraph
  id: F14ShelvesWood
  start: start
  graph:
    - node: start
      edges:
        - to: ShelfWood
          steps:
            - material: WoodPlank
              amount: 6
              doAfter: 4
        - to: ShelfWoodTall
          steps:
            - material: WoodPlank
              amount: 9
              doAfter: 4
        - to: ShelfWoodShowcase
          steps:
            - material: WoodPlank
              amount: 11
              doAfter: 6
        - to: ShelfWoodStand
          steps:
            - material: WoodPlank
              amount: 6
              doAfter: 5
        - to: ShelfWoodStandSmall
          steps:
            - material: WoodPlank
              amount: 5
              doAfter: 5
        - to: ShelfWoodClothesRack
          steps:
            - material: WoodPlank
              amount: 9
              doAfter: 6
    - node: ShelfWood
      entity: F14ShelfWood1
      edges: 
        - to: start
          steps:
            - tool: Screwing
              doAfter: 6
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 6
            - !type:DeleteEntity
    - node: ShelfWoodTall
      entity: F14ShelfWoodTall
      edges:
        - to: start
          steps:
            - tool: Screwing
              doAfter: 7
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 9
            - !type:DeleteEntity
    - node: ShelfWoodShowcase
      entity: F14ShelfWoodShowcase
      edges:
        - to: start
          steps:
            - tool: Screwing
              doAfter: 8
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 11
            - !type:DeleteEntity
    - node: ShelfWoodStand
      entity: F14ShelfWoodStand
      edges:
        - to: start
          steps:
            - tool: Screwing
              doAfter: 6
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 6
            - !type:DeleteEntity
    - node: ShelfWoodStandSmall
      entity: F14ShelfWoodStandSmall
      edges:
        - to: start
          steps:
            - tool: Screwing
              doAfter: 4
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 5
            - !type:DeleteEntity
    - node: ShelfWoodClothesRack
