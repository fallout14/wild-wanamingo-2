- type: entity
  parent: BaseHealingItem
  id: MisfitsHealingSalve
  name: healing salve
  description: A sticky herbal salve used to close lacerations and other slashing wounds. It is deliberately specialized rather than a universal ointment.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/ms13_medical_new.rsi
    state: ointment1
  - type: Item
    heldPrefix: ointment
  - type: Healing
    damageContainers:
    - Biological
    # BRUTE SPECIALIST: SLASH.
    damage:
      types:
        Slash: -12
    # Helps with the hemorrhage associated with open lacerations.
    bloodlossModifier: -3
    delay: 2
    healingBeginSound:
      path: "/Audio/Items/Medical/ointment_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/ointment_end.ogg"
  - type: Stack
    stackType: MisfitsHealingSalve
    count: 1

- type: entity
  parent: N14HealingPowder
  id: MisfitsGravesalt
  name: gravesalt
  description: A harsh pouch of ash, bitter herbs and mineral-rich plant matter used as an emergency poison purge.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/drugs.rsi
    state: smellingsalts
  - type: Solution
    solution:
      maxVol: 5
      reagents:
      - ReagentId: MisfitsGravesalt
        Quantity: 5

- type: entity
  parent: N14RadAwayBloodbag
  id: MisfitsGlowingBloodPack
  name: glowing blood pack
  description: A blood pack treated with irradiated fungus and medical alcohol. It emits a faint, unhealthy glow.
  components:
  - type: Solution
    id: pen
    solution:
      maxVol: 10
      reagents:
      - ReagentId: MisfitsGlowingBloodPack
        Quantity: 10
  - type: Injector
    solutionName: pen
    currentTransferAmount: null
    ignoreClosed: false
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode

- type: entity
  parent: BaseHealingItem
  id: MisfitsHerbalAnodyne
  name: herbal anodyne
  description: A soothing herbal balm massaged into bruised and battered tissue. It is specialized for blunt trauma rather than cuts or burns.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/ms13_medical_new.rsi
    state: aloe2
  - type: Item
    heldPrefix: ointment
  - type: Healing
    damageContainers:
    - Biological
    # BRUTE SPECIALIST: BLUNT.
    damage:
      types:
        Blunt: -10
    delay: 2.5
    healingBeginSound:
      path: "/Audio/Items/Medical/ointment_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/ointment_end.ogg"
  - type: Stack
    stackType: MisfitsHerbalAnodyne
    count: 1

- type: entity
  parent: BaseHealingItem
  id: MisfitsHerbalAntimicrobial
  name: herbal antimicrobial
  description: A pungent herbal poultice used to neutralize chemical burns and clean contaminated tissue.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/ms13_medical_new.rsi
    state: aloe3
  - type: Item
    heldPrefix: ointment
  - type: Healing
    damageContainers:
    - Biological
    # BURN SPECIALIST: CAUSTIC.
    # A small Poison heal represents cleaning contaminated tissue without turning
    # this into a general antidote.
    damage:
      types:
        Caustic: -10
        Poison: -2
    delay: 2.5
    healingBeginSound:
      path: "/Audio/Items/Medical/ointment_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/ointment_end.ogg"
  - type: Stack
    stackType: MisfitsHerbalAntimicrobial
    count: 1

- type: entity
  parent: N14HealingPowder
