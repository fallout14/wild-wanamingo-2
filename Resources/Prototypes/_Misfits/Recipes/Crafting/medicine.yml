- type: entity
  parent: BaseHealingItem
  id: MisfitsDaturaHide
  name: datura hide
  description: A numbing datura ointment for severe thermal burns. It is specialized for Heat damage and is poor treatment for other wounds.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/ms13_medical_new.rsi
    state: ointment4
  - type: Item
    heldPrefix: ointment
  - type: Healing
    damageContainers:
    - Biological
    # BURN SPECIALIST: HEAT.
    # Strong single-type healing is the reward for diagnosing the injury correctly.
    damage:
      types:
        Heat: -12
    delay: 2.5
    healingBeginSound:
      path: "/Audio/Items/Medical/ointment_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/ointment_end.ogg"
  - type: Stack
    stackType: MisfitsDaturaHide
    count: 1

- type: entity
  parent: BaseHealingItem
  id: MisfitsSnakebiteTourniquet
  name: snakebite tourniquet
  description: A treated binding packed with ground buffalo gourd for venomous bites and severe bleeding.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/ms13_medical_new.rsi
    state: tourniquet
  - type: Healing
    damageContainers:
    - Biological
    damage:
      types:
        Poison: -2
        Blunt: 0.666667
        Slash: 0.666667
        Piercing: 0.666667
    bloodlossModifier: -10
    delay: 1.5
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
  - type: Stack
    stackType: MisfitsSnakebiteTourniquet
    count: 1

- type: entity
