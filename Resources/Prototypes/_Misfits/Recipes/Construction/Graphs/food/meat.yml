# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Recipes/Construction/Graphs/food/meat.yml

- type: constructionGraph
  id: F14HumanMeatSteak
  start: start
  graph:

  - node: start
    edges:
    - to: human meat steak
      completed:
      - !type:PlaySound
        sound: /Audio/Effects/sizzle.ogg
      steps:
      - minTemperature: 345

  - node: human meat steak
    entity: F14FoodMeatHumanCooked

- type: constructionGraph
  id: F14HumanMeatCutlet
  start: start
  graph:

  - node: start
    edges:
    - to: human meat cutlet
      completed:
      - !type:PlaySound
        sound: /Audio/Effects/sizzle.ogg
      steps:
      - minTemperature: 345

  - node: human meat cutlet
    entity: F14FoodMeatHumanCutletCooked

- type: constructionGraph
  id: F14SupermutantMeatSteak
  start: start
  graph:

  - node: start
    edges:
    - to: supermutant meat steak
      completed:
      - !type:PlaySound
        sound: /Audio/Effects/sizzle.ogg
      steps:
      - minTemperature: 360 # tough meat! takes more to cook it

  - node: supermutant meat steak
    entity: F14FoodMeatSupermutantCooked

- type: constructionGraph
  id: F14SupermutantMeatCutlet
  start: start
  graph:

  - node: start
    edges:
    - to: supermutant meat cutlet
      completed:
      - !type:PlaySound
        sound: /Audio/Effects/sizzle.ogg
      steps:
      - minTemperature: 360 # tough meat! takes more to cook it

  - node: supermutant meat cutlet
    entity: F14FoodMeatSupermutantCutletCooked
