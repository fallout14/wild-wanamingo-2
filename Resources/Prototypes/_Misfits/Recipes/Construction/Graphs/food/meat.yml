# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Recipes/Construction/Graphs/food/meat.yml

- type: constructionGraph
  id: MisfitsHumanMeatSteak
  start: start
  graph:

  - node: start
    edges:
    - to: human meat steak
      completed:
      - !type:PlaySound
        sound: /Audio/Effects/sizzle.ogg
      steps:
      - minTemperature: 345

  - node: human meat steak
    entity: MisfitsFoodMeatHumanCooked

- type: constructionGraph
  id: MisfitsHumanMeatCutlet
  start: start
  graph:

  - node: start
    edges:
    - to: human meat cutlet
      completed:
      - !type:PlaySound
        sound: /Audio/Effects/sizzle.ogg
      steps:
      - minTemperature: 345

  - node: human meat cutlet
    entity: MisfitsFoodMeatHumanCutletCooked

- type: constructionGraph
  id: MisfitsSupermutantMeatSteak
  start: start
  graph:

  - node: start
    edges:
    - to: supermutant meat steak
      completed:
      - !type:PlaySound
        sound: /Audio/Effects/sizzle.ogg
      steps:
      - minTemperature: 360 # tough meat! takes more to cook it

  - node: supermutant meat steak
    entity: MisfitsFoodMeatSupermutantCooked

- type: constructionGraph
  id: MisfitsSupermutantMeatCutlet
  start: start
  graph:

  - node: start
    edges:
    - to: supermutant meat cutlet
      completed:
      - !type:PlaySound
        sound: /Audio/Effects/sizzle.ogg
      steps:
      - minTemperature: 360 # tough meat! takes more to cook it

  - node: supermutant meat cutlet
    entity: MisfitsFoodMeatSupermutantCutletCooked
