# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Recipes/Construction/sandbag.yml

- type: construction
  id: MisfitsBarricadeSandbagSingleConstruction
  graph: MisfitsSandbagBarricade
  startNode: start
  targetNode: sandbag
