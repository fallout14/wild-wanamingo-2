      edges:
        - to: sandbag
          steps:
            - material: MisfitsSand
              amount: 2
              doAfter: 2
            - material: N14Thread
              amount: 2
              doAfter: 1
    - node: sandbag
      entity: N14BarricadeSandbagSingle
