# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Reagents/Berserkermix.yml

- type: reagent
  id: MisfitsBerserkermix
  name: reagent-name-Berserker-mixture
  group: Chems
  desc: reagent-desc-Berserker-mixture
  physicalDesc: reagent-physical-desc-roaring
  flavor: sour
  color: "#4a0404"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.25 #lasts a bit, hence the low 11u OD
      effects:
      - !type:HealthChange
        damage:
          types:
            Heat: -0.15
            Shock: -0.15
            Cold: -0.15
            Caustic: -0.15
            Blunt: -0.5
            Slash: -0.5
            Piercing: -0.5
      - !type:ModifyBleed
        amount: -1
      - !type:AmbientDrugFlavorText
        cooldownId: BerserkermixAmbient
        cooldown: 25
        messageKeys:
        - drug-ambience-Berserker-mixture-1
        - drug-ambience-Berserker-mixture-2
      - !type:MovementSpeedModifier
        walkSpeedModifier: 1.1
        sprintSpeedModifier: 1.1
      - !type:ModifyStatusEffect
        effectProto: StatusEffectSeeingRainbow
        type: Add
        time: 5
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStunned
        time: 5
        type: Remove
        conditions:
        - !type:ReagentCondition
          reagent: MisfitsBerserkermix
          min: 5
      - !type:ModifyKnockdown
        time: 5
        type: Remove
        conditions:
        - !type:ReagentCondition
          reagent: MisfitsBerserkermix
          min: 5
      - !type:HealthChange #Misfits Change /Add:/ Overdose — suffocates the player when stacking too much Berserker mix
        conditions:
        - !type:ReagentCondition
          reagent: MisfitsBerserkermix
          min: 26
        - !type:MobStateCondition #Misfits Tweak: OD can push to crit but never kill
        damage:
          types:
            Asphyxiation: 6
