- type: reagent
  id: F14Antibiotics
  name: reagent-name-antibiotics
  group: Wasteland
  desc: reagent-desc-antibiotics
  physicalDesc: reagent-physical-desc-soothing
  flavor: medicine
  color: "#e8f0dc"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.1
      effects:
      # Diseases are not in yet, but we larp.
      - !type:Vomit
        probability: 0.01

- type: reagent
  id: F14RadShield
  name: reagent-name-radshield
  group: Wasteland
  desc: reagent-desc-radshield
  physicalDesc: reagent-physical-desc-oily
  flavor: medicine
  color: "#4ba356"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.1
      effects:
      # Existing RadiationProtection uses PotassiumIodide: Radiation coefficient 0.1.
      # This means 90% incoming radiation damage reduction while active.
      - !type:ModifyStatusEffect
        effectProto: StatusEffectRadiationProtection
        type: Add
        time: 12
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: F14RadShield
          min: 25
        damage:
          types:
            Poison: 0.4

