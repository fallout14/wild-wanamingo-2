# ============================================================================
# ANTIDOTES / EMERGENCY MEDICINE
# ============================================================================

- type: reagent
  id: F14LazarusCompound
  name: reagent-name-lazarus-compound
  group: Wasteland
  desc: reagent-desc-lazarus-compound
  physicalDesc: reagent-physical-desc-volatile
  flavor: medicine
  color: "#ece3bd"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.5
      effects:
      # Extremely potent only in critical condition.
      - !type:HealthChange
        conditions:
        - !type:MobStateCondition
          mobstate: Critical
        damage:
          types:
            Blunt: -0.5
            Slash: -0.5
            Piercing: -0.5
            Heat: -0.375
            Shock: -0.375
            Cold: -0.375
            Caustic: -0.375
            Asphyxiation: -3
            Bloodloss: -3
            Poison: -1
      - !type:ModifyBleed
        amount: -1
        conditions:
        - !type:MobStateCondition
          mobstate: Critical
      # The price of forcing the body back from the edge.
      - !type:HealthChange
        damage:
          types:
            Cellular: 0.5
            Poison: 0.25
      - !type:Jitter
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: F14LazarusCompound
          min: 12
        damage:
          types:
            Cellular: 1
