# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Hydroponics/seeds.yml

- type: entity
  parent: BasePlant
  id: Lemonade
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: Misfits/Objects/Specific/Hydroponics/lemonade.rsi
  - type: PlantData
    name: seeds-lemonade-name
    noun: seeds-noun-seeds
    packetPrototype: MisfitsLemonadeSeeds
    productPrototypes: [ MisfitsFoodLemonade ]
    mutationPrototypes: [LimePlants ]
  - type: Plant
    lifespan: 55
    maturation: 6
    production: 6
    yield: 3
    potency: 10
  - type: PlantHarvest
    harvestRepeat: Repeat
  - type: PlantChemicals
    chemicals:
      WeldingFuel:
        min: 1
        max: 5
        potencyDivisor: 20
      Napalm:
        min: 1
        max: 4
        potencyDivisor: 25
      ChlorineTrifluoride:
        min: 2
        max: 3
        potencyDivisor: 100

