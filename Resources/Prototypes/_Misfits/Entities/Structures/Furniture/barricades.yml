# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Structures/Furniture/barricades.yml

- type: entity
  parent: F14BarricadeSandbagSingle # Corvax-Change
  id: F14BarricadeConcreteBarrier
  name: concrete barricade
  description: A concrete fortification barrier for stopping traffic.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/barriers.rsi
    state: concrete_barrier
  - type: Construction
    graph: F14BarricadeConcrete
    node: Concrete
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Fixtures # Corvax-Change
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.10,0.49,-0"
        density: 1000
        mask:
        - MachineMask
        layer:
        - TableLayer
  - type: Destructible # Corvax-Change
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          F14Scrap1:
            min: 1
            max: 3
          F14MaterialCement1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: ["Destruction"]
