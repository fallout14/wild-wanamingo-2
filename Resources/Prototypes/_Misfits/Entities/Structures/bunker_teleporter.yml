# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Structures/bunker_teleporter.yml

- type: entity
  id: F14BaseBunkerTeleporter
  parent: BaseStructure
  abstract: true
  components:
  - type: InteractionOutline

- type: entity
  parent: F14BaseBunkerTeleporter
  id: F14BunkerHatchTunnel
  name: bunker hatch
  description: This hatch leads to a maze of tunnels.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Misc/laddersms13.rsi
    state: enclave_open
    drawdepth: FloorObjects
    noRot: true
    offset: 0, 0.25
  # Walk-over, same as every other ladder top.
  - type: Physics
    canCollide: true
  - type: Portal # WW: Wizden portal (was BunkerTeleporter)
    canTeleportToOtherMaps: true
    randomTeleport: false
  - type: F14PortalLink
    linkId: bunker_tunnel
    side: surface
  - type: Fixtures
    fixtures:
      portalFixture:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        hard: false

- type: entity
  parent: F14BaseBunkerTeleporter
  id: F14BunkerTunnelDoor
  name: bunker tunnel door
  description: Leads to the maze of tunnels.
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Doors/FalloutDoors/vaultdoor.rsi
    state: closed
    drawdepth: Walls
    noRot: true
  - type: Icon
    sprite: Nuclear14/Structures/Doors/FalloutDoors/vaultdoor.rsi
    state: closed
  # Sealed shut: blocks movement, sight and air like a wall. You go through it by using it, not by
  # opening it. Same fixture/occluder/airtight recipe as BaseWall.
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      portalFixture:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.55,-0.55,0.55,0.55"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        hard: false
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: Occluder
  - type: Airtight
  - type: Portal # WW: Wizden portal (was BunkerTeleporter)
    canTeleportToOtherMaps: true
    randomTeleport: false
  - type: F14PortalLink
    linkId: bunker_tunnel
    side: tunnel
