# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Structures/Trade/market_storage.yml

- type: entity
  id: F14MarketDepositStorage
  name: Market Deposit Storage
  components:
  - type: ContainerContainer  # spawn state
    containers:
      storagebase: !type:Container
        ents: []
  - type: Transform
    noRot: true
  - type: Storage
    grid:
    - 0,0,19,9   # 20x10 grid
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  # No sprite — invisible, parented to terminal
