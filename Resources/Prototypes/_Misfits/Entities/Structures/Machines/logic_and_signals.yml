# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Structures/Machines/logic_and_signals.yml

- type: entity
  id: F14DoorVaultExteriorControls
  parent: BaseStructure
  name: vault security terminal
  description: A weathered RobCo security terminal wired into the vault door's control network.
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
  components:
  - type: WallMount
    arc: 360
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    canCollide: false
  - type: Sprite
    drawdepth: SmallObjects
    sprite: Nuclear14/Structures/Machines/vaultdoor_controls.rsi
    layers:
    - state: on
    - state: overlay_off
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
  - type: Rotatable
  - type: Fixtures
  - type: DeviceNetwork
    deviceNetId: Wireless
  - type: WirelessNetwork
    range: 25
  - type: DeviceLinkSource
    ports:
    - Pressed
  - type: AutoLinkTransmitter
    channel: Vaultdoor
  - type: VaultDoorConsole
  - type: VaultDoorConsoleGate
  - type: ActivatableUI
    key: enum.VaultDoorConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.VaultDoorConsoleUiKey.Key:
        type: VaultDoorConsoleBoundUserInterface
