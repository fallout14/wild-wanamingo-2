# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Structures/material_extractor.yml

- type: entity
  parent: F14MachineWaterTreatmentBroken
  id: F14SeismicMaterialExtractor
  name: seismic material extractor
  description: A battered pre-war drill that hammers the ground for usable raw materials. Its racket draws unwanted attention.
  components:
  - type: Sprite
    sprite: Misfits/Structures/Machines/seismic_extractor.rsi
    layers:
    - state: seismic_extractor
  - type: PointLight
    enabled: false
    color: "#ff2020"
    radius: 3
    energy: 2
  - type: MaterialExtractorLandmark
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          F14SeismicMaterialExtractorBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  # Balance: all economic and encounter tuning is kept here.
  - type: MaterialExtractor
    operatorRadius: 4
    pulseIntervalSeconds: 2
    firstWaveMinSeconds: 15
    firstWaveMaxSeconds: 15
    waveMinSeconds: 20
    waveMaxSeconds: 20
    waveWarningSeconds: 0
    waveMinMobCount: 1
    waveMaxMobCount: 3
    waveSpawnMinDistance: 18 # WW Change - was 8-14, all inside the operator's view (half PVS 12.5 + buffer 3), so no wave could spawn
    waveSpawnMaxDistance: 28
    waveSpawnAttempts: 40
    waveSpawnPvsBuffer: 3
    waveMobWeights:
      F14MobMaterialExtractorMoleratWave: 24
      F14MobMaterialExtractorGeckoWave: 18
      F14MobMaterialExtractorMirelurkWave: 12
      F14MobMaterialExtractorRadhogWave: 10
      F14MobMaterialExtractorFireGeckoWave: 8
      F14MobMaterialExtractorNightstalkerCubWave: 8
      F14MobMaterialExtractorGiantAntWave: 7
      F14MobMaterialExtractorNightstalkerWave: 4
      F14MobMaterialExtractorRadMirelurkWave: 3
      F14MobMaterialExtractorGiantFireAntWave: 3
      F14MobMaterialExtractorRadscorpionWave: 3
    poorDepositChance: 0.25
    richDepositChance: 0.15
    poorYieldMultiplier: 0.7
    richYieldMultiplier: 1.4
    lowFuelWarningFraction: 0.25
    fuelSolution: tank
    fuelReagent: WeldingFuel
    outputWeights:
      F14IronOre1: 20
      F14CopperOre1: 18
      F14LeadOre1: 14
      F14SulfurOre1: 12
      F14Sand1: 12
      Salt1: 10
      F14ZincOre1: 6
      F14BauxiteOre1: 5
      F14FertilizerOre1: 3
  - type: FuelGenerator
    on: false
    targetPower: 1000
    minTargetPower: 1000
    optimalPower: 1000
    maxTargetPower: 1000
    # A full 250u tank lasts about two hours while the extractor runs.
    optimalBurnRate: 0.03333333
    fuelEfficiencyConstant: 0.3
  - type: PowerSupplier
    supplyRate: 1000
    supplyRampRate: 1000
    supplyRampTolerance: 1000
    enabled: false
  - type: ChemicalFuelGeneratorAdapter
    solution: tank
    reagents:
      WeldingFuel: 1
  - type: Solution
    id: tank
    solution:
      maxVol: 250
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 250
  - type: RefillableSolution
    solution: tank
  - type: Storage
    grid:
    - 0,0,10,7
    maxItemSize: Normal
    clickInsert: false
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.MaterialExtractorUiKey.Key:
        type: MaterialExtractorBoundUserInterface
  - type: ActivatableUI
    key: enum.StorageUiKey.Key
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Tag
    tags:
    - Structure

- type: entity
  parent: F14MachineWaterTreatmentBroken
  id: F14SeismicMaterialExtractorBroken
  name: destroyed seismic material extractor
  description: The drill is silent. Its ruined hopper is full of twisted machinery.
  components:
  - type: Sprite
    sprite: Misfits/Structures/Machines/seismic_extractor.rsi
    layers:
    - state: seismic_extractor_broken
  - type: MaterialExtractorLandmark
