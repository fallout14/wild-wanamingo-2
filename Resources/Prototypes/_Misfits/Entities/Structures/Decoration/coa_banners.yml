# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Structures/Decoration/coa_banners.yml

- type: entity
  parent: N14SignBase
  id: MisfitsBannerChildrenOfAtom
  name: Flag of the Children of Atom
  description: The banner of the Children of Atom cult. They believe that radiation is a gift that will help its followers ascend, as it transforms the land and the life within it.
  components:
  - type: Sprite
    sprite: Misfits/Structures/Decoration/coa_banner_small.rsi
    state: banner
  - type: Construction
    graph: MisfitsFlagSmallCoA
    node: flagbcoas

# --- Large COA Flag ---

- type: entity
  parent: N14DecorationFlagFlammable
  id: MisfitsDecorationFlagChildrenOfAtom
