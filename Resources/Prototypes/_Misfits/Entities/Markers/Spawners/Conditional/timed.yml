# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Markers/Spawners/Conditional/timed.yml

- type: entity
  name: Raider Timed Spawner - Rifle
  id: MisfitsTimedSpawnerRaiderPsychoHunter
  parent: N14TimedSpawnerMolerat
  components:
    - type: Sprite
      layers:
        - state: blue
        - sprite: Nuclear14/Mobs/RaidersSimpleMob/Raiders.rsi
          state: raider_ranged
        - state: timed
    - type: WastelandSpawner
      prototypes:
        - N14MobRaiderHunter
      chance: 0.65
      intervalSeconds: 1500
      minimumEntitiesSpawned: 1
      maximumEntitiesSpawned: 3

