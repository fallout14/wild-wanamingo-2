# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Markers/Spawners/pet_spawners.yml

- type: entity
  id: F14PetSpawnerBase
  name: pet spawner
  abstract: true
  components:
  - type: Transform
  - type: Sprite              # actually, maybe SOME sprite, but not one players will see
    drawdepth: Overdoors
    sprite: Markers/cross.rsi

# Dog companion spawner

- type: entity
  parent: F14PetSpawnerBase
  id: F14PetSpawnerDog
  name: companion dog spawner
  components:
  - type: GhostRole
    name: ghost-role-information-n14pet-dog-name
    description: ghost-role-information-n14pet-generic-description
    rules: ghost-role-component-default-rules
  - type: GhostRoleMobSpawner
    prototype: F14MobPetDog

