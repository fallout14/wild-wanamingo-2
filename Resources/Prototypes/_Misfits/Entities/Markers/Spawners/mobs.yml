# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Markers/Spawners/mobs.yml

- type: entity
  name: Sentry Bot Spawner
  id: MisfitsSpawnMobSentryBot
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: green
      - sprite: Nuclear14/Mobs/Robots/sentrybot.rsi
        state: icon
      - state: ai
  - type: ConditionalSpawner
    prototypes:
      - MisfitsMobRobotSentryBot

