# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Clothing/Head/powerarmorhelmet.yml

- type: entity
  parent: ClothingHeadHardsuitWithLightBase
  id: MisfitsEnclavePowerArmorHelmet
  # #Misfits Change - Renamed to APA MK I (removed 'Experimental' prefix per rebalance)
  name: APA MK I Power Armor Helmet
  description: A matching helmet to the U.S. Army's supermutant power armor.
  components:
  - type: Sprite
    netsync: false
    sprite: Misfits/Clothing/Head/PowerArmorHelmets/mutant_pa_helmet.rsi
    layers:
    - state: icon
    - state: icon-unshaded
    - state: light-overlay
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: HandheldLight
    addPrefix: false
  - type: ToggleableVisuals
    spriteLayer: light
    inhandVisuals:
      left:
      - state: on-inhand-left
      right:
      - state: on-inhand-right
    clothingVisuals:
      head:
      - state: on-equipped-HELMET
  - type: PointLight
    enabled: false
    radius: 8
    energy: 1
    offset: 0, .75
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    netsync: false
    color: "#ff0000" #Misfits Change: Your ride's over, mutie. Time to die.
  - type: Clothing
    equipSound: # Corvax-Change
      path: /Audio/Nuclear14/Effects/PowerArmor/PowerArmor_Equip_Helmet_01.ogg
      params:
        volume: -12
    unequipSound: # Corvax-Change
      path: /Audio/Nuclear14/Effects/PowerArmor/PowerArmor_Equip_Helmet_01.ogg
      params:
        volume: -12
    quickEquip: true
    clothingVisuals:
      head:
      - state: off-equipped-HELMET
      - state: equipped-HELMET-unshaded
  - type: EyeProtection
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.85
        Heat: 0.85
        Radiation: 0.6
  - type: ExplosionResistance
    damageCoefficient: 0.85
  - type: NightVision
  - type: ThermalVision
    isEquipment: true
    pulseTime: 2
    toggleAction: PulseThermalVision
  - type: BreathMask # Misfits Change
  - type: GasFilterMask # Misfits Change
  - type: IngestionBlocker # Misfits Change
  - type: Tag
    tags:
    - HidesHair
    - HidesBeard
    - MisfitsSuperMutantWearable
  # #Misfits Change - Enclave tactical HUD
  # End Misfits Change

# #Misfits Add - BOS-issue T-45 helmet with Brotherhood tactical HUD.
# Used by N14ClothingOuterPowerArmorT45 so BOS initiates/knights can access the shared map feed.
# Raiders intentionally keep the plain T45 helmet (no map) via their own ToggleableClothing override.

- type: entity
  parent: N14ClothingHeadHelmetPowerArmorT45
  id: MisfitsClothingHeadHelmetPowerArmorT45BOS
  name: t-45 power armor helmet
  description: An old helmet used with T-45 Power Armor suits. The Brotherhood of Steel keeps a tactical map feed active inside the visor.

- type: entity
  parent: N14ClothingHeadHelmetPowerArmorT60
  id: MisfitsClothingHeadHelmetPowerArmorT60BOS
  name: T-60 Power Armor Helmet
  description: An old helmet used with T-60 Power Armor suits, with a tactical map feed built into it. These helmets gazed down on hungry domestic protestors more than foreign enemy combatants.

- type: entity
  parent: N14ClothingHeadHelmetPowerArmorT45
  id: MisfitsClothingHeadHelmetPowerArmorMidwestSilver
  name: BoS Power Armor Helmet
  description: A unknown model of Power Armor helmet adopted by the Brotherhood of Steel chapter.
  components:
  - type: Sprite
    netsync: false
    sprite: Misfits/Clothing/Head/PowerArmorHelmets/midwest_silver_helmet.rsi
    layers:
    - state: icon
    - state: icon-unshaded
    - state: light-overlay
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: EyeProtection
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.85
        Heat: 0.85
        Radiation: 0.6
  - type: ExplosionResistance
    damageCoefficient: 0.85
