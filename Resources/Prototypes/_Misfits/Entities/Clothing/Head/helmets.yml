  - type: Sprite
    sprite: Nuclear14/Clothing/Head/FalloutHelmets/falloutvolmatsuit.rsi
  - type: Clothing
    sprite: Nuclear14/Clothing/Head/FalloutHelmets/falloutvolmatsuit.rsi
  - type: IdentityBlocker
