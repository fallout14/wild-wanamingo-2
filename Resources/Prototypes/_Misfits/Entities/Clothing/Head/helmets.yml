- type: entity
  parent: F14ClothingHeadSuitbase
  id: F14ClothingHeadHatHelmetVolMatHelmet
  name: VMHE helmet
  description: An advanced derivative of the radiation suit helmet specialized to counter rapidly expanding material delivering force impact to the face.
