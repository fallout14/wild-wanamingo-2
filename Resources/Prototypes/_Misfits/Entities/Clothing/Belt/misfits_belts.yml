# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Clothing/Belt/misfits_belts.yml

- type: entity
  parent: F14ClothingBeltStorageBase
  id: F14ClothingBeltLeatherPouches
  name: leather pouches belt
  description: Worn strips of leather stitched into a makeshift belt with small pouches for carrying supplies. Common on wastelanders who can't afford military webbing.
  components:
  - type: Sprite
    sprite: Misfits/Clothing/Belt/leatherpouches.rsi
  - type: Clothing
    sprite: Misfits/Clothing/Belt/leatherpouches.rsi
  - type: Appearance

- type: entity
  parent: F14ClothingBeltStorageBase
  id: F14ClothingBeltVaultSecurity
  name: vault security belt
  description: A used belt used by vault security, it can carry a few magazines but not much else.
  components:
  - type: Sprite
    sprite: Misfits/Clothing/Belt/vaultsecuritybelt.rsi
  - type: Clothing
    sprite: Misfits/Clothing/Belt/vaultsecuritybelt.rsi
  - type: Appearance
  # #Cythisiax Fixed - belt could only hold ammo; handcuffs & police baton could not be stored
  - type: Storage
    whitelist:
      tags:
        - CigPack
        - F14AmmoCell
        - Handcuffs
        - F14PoliceBaton
        # #Cythisiax Added - belt can store the Wendover map (Document)
        - Document
      components:
        - BallisticAmmoProvider
        - CartridgeAmmo

