# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Clothing/80s/helmets.yml

- type: entity
  parent: F14ClothingHeadHatCombatHelmet
  id: F14ClothingHeadBikeHelmet
  name: spiked motorcycle helmet
  description: A spiked bike helmet that makes you look like a psychopath, painted in blue just like the 80s sign.
  components:
  - type: Sprite
    sprite: Misfits/Clothing/80s/Head/bikehelmet.rsi
  - type: Clothing
    sprite: Misfits/Clothing/80s/Head/bikehelmet.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.90
        Piercing: 0.90

