# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Clothing/Ears/bos_headsets.yml

- type: entity
  parent: F14ClothingHeadsetAlt
  id: F14ClothingHeadsetBrotherhoodOfSteel
  name: Brotherhood radio earpiece
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - F14EncryptionKeyBrotherhoodOfSteel
      - F14EncryptionKeyWastelandGlobal
  - type: EncryptionKeyHolder
    keysUnlocked: false
  - type: Sprite
    sprite: Misfits/Clothing/Ears/Headsets/bos.rsi
  - type: Clothing
    sprite: Misfits/Clothing/Ears/Headsets/bos.rsi

- type: entity
  parent: F14ClothingHeadsetLightScribe
  id: F14ClothingHeadsetBrotherhoodOfSteelScribe
  name: Brotherhood scribe headset
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - F14EncryptionKeyBrotherhoodOfSteel
      - F14EncryptionKeyWastelandGlobal
  - type: EncryptionKeyHolder
    keysUnlocked: false
  # Keep light-capable state names while applying the new BoS sprite set.
  - type: Sprite
    sprite: Misfits/Clothing/Ears/Headsets/boslight.rsi
    layers:
    - state: icon
    - state: light-icon
      shader: unshaded
      visible: false
      map: [ "light" ]
  - type: Clothing
    sprite: Misfits/Clothing/Ears/Headsets/boslight.rsi
    equippedPrefix: off
