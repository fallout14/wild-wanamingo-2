# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Clothing/Ears/headsets_alt.yml

- type: entity
  parent: F14ClothingHeadsetNCR
  id: F14ClothingHeadsetOSI
  name: OSI radio earpiece
  description: An NCR headset fitted with separate Office of Science and Industry encryption.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - F14EncryptionKeyNCR
      - F14EncryptionKeyOSI
      - F14EncryptionKeyWastelandGlobal
  - type: EncryptionKeyHolder
    keysUnlocked: false

- type: entity
  parent: F14ClothingHeadsetNCR
  id: F14ClothingHeadsetNCRRanger
  name: NCR Ranger radio earpiece
  description: An NCR headset fitted with separate Ranger field encryption.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - F14EncryptionKeyNCR
      - F14EncryptionKeyNCRRangers
      - F14EncryptionKeyWastelandGlobal
  - type: EncryptionKeyHolder
    keysUnlocked: false

# #Misfits Change - Legion headset

- type: entity
  parent: F14ClothingHeadsetAlt
  id: F14ClothingHeadsetLegion
  name: Legion radio earpiece
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - F14EncryptionKeyLegion
      - F14EncryptionKeyWastelandGlobal
  - type: EncryptionKeyHolder
    keysUnlocked: false
  - type: Sprite
    sprite: Misfits/Clothing/Ears/Headsets/legion.rsi
  - type: Clothing
    sprite: Misfits/Clothing/Ears/Headsets/legion.rsi

# #Misfits Add — Followers of the Apocalypse headset; grants both faction and wasteland channels

- type: entity
  parent: F14ClothingHeadsetLightScribe
  id: F14ClothingHeadsetFollowers
  name: Followers radio headset
  components:
  - type: Item
    heldPrefix: off
    size: Small
  - type: ContainerFill
    containers:
      key_slots:
      - F14EncryptionKeyFollowers
      - F14EncryptionKeyWastelandGlobal
  - type: EncryptionKeyHolder
    keysUnlocked: false
  - type: Sprite
    sprite: Misfits/Clothing/Ears/Headsets/followerslight.rsi
    layers:
    - state: icon
    - state: light-icon
      shader: unshaded
      visible: false
      map: [ "light" ]
  - type: Clothing
    sprite: Misfits/Clothing/Ears/Headsets/followerslight.rsi
    equippedPrefix: off
