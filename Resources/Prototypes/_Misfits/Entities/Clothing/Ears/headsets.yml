# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Clothing/Ears/headsets.yml

- type: entity
  parent: F14ClothingHeadsetAlt
  id: F14ClothingHeadsetRobotVault
  name: integrated vault comms module
  description: A hardwired communications module tuned to both wasteland and Vault frequencies.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - F14EncryptionKeyWastelandGlobal
      - F14EncryptionKeyVault
  - type: EncryptionKeyHolder
    keysUnlocked: false
  - type: Sprite
    sprite: Misfits/Clothing/Ears/Headsets/scrap.rsi
  - type: Clothing
    sprite: Misfits/Clothing/Ears/Headsets/scrap.rsi

# #Misfits Change - Wasteland scrap headset for junk pile loot drops

- type: entity
  parent: F14ClothingHeadsetAlt
  id: F14ClothingHeadsetWastelandScrap
