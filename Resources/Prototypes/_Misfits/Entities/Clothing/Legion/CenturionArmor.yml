# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Clothing/Legion/CenturionArmor.yml

- type: entity
  parent: F14FalloutArmorBase
  id: F14CenturionCinderCohort
  name: Cinder Cohort Armor
  description: "Armor forged in the ashes of fallen legionnaires."
  components:
  - type: Sprite
    sprite: Misfits/Clothing/CaesarLegion/Centurion/Cinder_Cohort.rsi
  - type: Clothing
    sprite: Misfits/Clothing/CaesarLegion/Centurion/Cinder_Cohort.rsi
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.45
        Slash: 0.45
        Piercing: 0.45
        Heat: 0.45
  - type: ExplosionResistance
    damageCoefficient: 0.60
  - type: StaminaResistance
    damageCoefficient: 0.85

- type: entity
  parent: ClothingHeadBase
  id: F14CenturionCinderCohortHelmet
  name: Cinder Cohort Helmet
  description: "A helmet forged in the ashes of fallen legionnaires."
  components:
  - type: Sprite
    sprite: Misfits/Clothing/CaesarLegion/Centurion/Cinder_CohortHelm.rsi
  - type: Clothing
    sprite: Misfits/Clothing/CaesarLegion/Centurion/Cinder_CohortHelm.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.8
  - type: ExplosionResistance
    damageCoefficient: 0.90
  - type: HideLayerClothing
    slots:
    - Hair
    - FacialHair

