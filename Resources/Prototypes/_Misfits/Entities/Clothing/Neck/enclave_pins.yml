# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Clothing/Neck/enclave_pins.yml

- type: entity
  parent: ClothingNeckPinBase
  id: F14ClothingNeckPinEnclavePrivate
  name: U.S. Army private pin
  description: A United States Government rank insignia showing the wearer's rank.
  components:
  - type: RankTitle
    rankTitle: Private
  - type: Sprite
    sprite: Nuclear14/Clothing/Neck/Misc/pins.rsi
    layers:
    - state: private
  - type: Clothing
    sprite: Nuclear14/Clothing/Neck/Misc/pins.rsi
    clothingVisuals:
      neck:
      - state: gold-equipped
  # #Misfits Add - the supermutant neck slot only accepts SuperMutantWearable, and every
  # other Enclave pin inherits from this one, so tagging the base covers the whole set.
  - type: Tag
    tags:
    - F14SuperMutantWearable

