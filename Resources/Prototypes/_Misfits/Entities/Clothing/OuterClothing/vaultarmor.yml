# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Clothing/OuterClothing/vaultarmor.yml

- type: entity
  parent: N14FalloutArmorBase
  id: M14ClothingOuterVaultAdvancedVest
  name: advanced vault security vest
  description: An advanced ballistic vest manufactured for vault security, it restricts movement but provides great protection.
  components:
  - type: Sprite
    sprite: Misfits/Clothing/OuterClothing/Armor/advancedvaultvest.rsi
  - type: Clothing
    sprite: Misfits/Clothing/OuterClothing/Armor/advancedvaultvest.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.70
        Slash: 0.70
        Piercing: 0.675
        Heat: 0.75
    priceMultiplier: 0.5
  - type: ClothingSpeedModifier
    walkModifier: 0.975

- type: entity
  parent: [ClothingOuterStorageBase, ClothingOuterHardsuitBase]
  id: N14ClothingOuterVolMatSuit
  name: VMHE suit
  description: A versatile and advanced development of the Vault-Tec Radsuit, the Volatile Materials and Hazardous Environments suit is designed to keep its user alive through a variety of circumstances. Built with lightweight impact jel underneath a layer of treated polybenzimidazole, its efficacy is proven against acid rains, radiation, and chemical explosions. "DO NOT PUNCTURE".
  components:
  - type: ContainerContainer  # spawn state
    containers:
      storagebase: !type:Container
        ents: []
        showEnts: False
        occludes: True
      toggleable-clothing: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: Sprite
    sprite: Nuclear14/Clothing/OuterClothing/Coats/falloutvolmatsuit.rsi
  - type: Clothing
    sprite: Nuclear14/Clothing/OuterClothing/Coats/falloutvolmatsuit.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.90
        Piercing: 0.90
        Heat: 0.70
        Radiation: 0.15
        Caustic: 0.15
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: ExplosionResistance
    damageCoefficient: 0.15
  - type: ToggleableClothing
    clothingPrototype: N14ClothingHeadHatHelmetVolMatHelmet
    slot: head

- type: entity
  parent: [ClothingOuterStorageBase, ClothingOuterHardsuitBase]
  id: N14ClothingOuterVaultScoutSuit
  name: prototype vault security suit
  description: A modernized development of the armor designed for the security team of Vault-63, it's life preservation system has been repurposed to now passively injects a potent stimpak-derived combat stimulant formulated from the blood of the user, allowing them to carry the heat-resistant steel alloy without any significant loss of mobility.
  components:
  - type: ContainerContainer  # spawn state
    containers:
      storagebase: !type:Container
        ents: []
        showEnts: False
        occludes: True
      toggleable-clothing: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: Sprite
    sprite: Misfits/Clothing/OuterClothing/Armor/vaultscoutsuit.rsi
  - type: Clothing
    sprite: Misfits/Clothing/OuterClothing/Armor/vaultscoutsuit.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.57
        Slash: 0.57
        Piercing: 0.55
        Heat: 0.40
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: ExplosionResistance
    damageCoefficient: 0.20
  - type: ToggleableClothing
    clothingPrototype: N14ClothingHeadHatHelmetVaultScoutHelmet
    slot: head
