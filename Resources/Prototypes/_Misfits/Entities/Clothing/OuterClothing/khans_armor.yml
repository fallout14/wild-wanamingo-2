- type: entity
  parent: F14FalloutArmorBase
  id: F14ClothingOuterKhansJacket
  name: khans jacket
  description: Jackets popular with the Great Khans show off their skull emblem on the back, with small lead plate inserts providing some protection. Worn by rank-and-file Khan members.
  components:
  - type: Sprite
    sprite: Misfits/Clothing/OuterClothing/Armor/khansjacket.rsi
  - type: Clothing
    sprite: Misfits/Clothing/OuterClothing/Armor/khansjacket.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.88
        Slash: 0.80
        Piercing: 0.82
        Heat: 0.78
  - type: ExplosionResistance
    damageCoefficient: 0.9

- type: entity
  parent: F14ClothingOuterKhansJacket
  id: F14ClothingOuterKhansVest
  name: khans vest
  description: Vests popular with the Great Khans show off their skull emblem on the back, with small lead plate inserts providing some protection. Worn by rank-and-file Khan members. #Alternative sprite of Jacket. If there is ever a "alt" click for sprite change put this with F14ClothingOuterKhansJacket
  components:
  - type: Sprite
    sprite: Misfits/Clothing/OuterClothing/Armor/khansaltjacket.rsi
  - type: Clothing
    sprite: Misfits/Clothing/OuterClothing/Armor/khansaltjacket.rsi

- type: entity
  parent: F14FalloutArmorBase
  id: F14ClothingOuterKhansArmoredJacket
  name: khans armored jacket
  description: A Great Khans armored jacket with ceramic and metal inserts — more protection, same attitude. Standard issue for Khan enforcers looking to make a statement without slowing down.
  components:
  - type: Sprite
    sprite: Misfits/Clothing/OuterClothing/Armor/khansarmoredjacket.rsi
  - type: Clothing
    sprite: Misfits/Clothing/OuterClothing/Armor/khansarmoredjacket.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.775
        Slash: 0.775
        Piercing: 0.775
        Heat: 0.775
  - type: ExplosionResistance
    damageCoefficient: 0.9

- type: entity
  parent: F14ClothingOuterKhansArmoredJacket
  id: F14ClothingOuterKhansArmoredVest #Alternative sprite of Armored Jacket. If there is ever a "alt" click for sprite change put this with F14ClothingOuterKhansArmoredJacket
  name: khans armored vest
  description: A black leather vest. There is an illustration on the back - an aggressive, red-eyed skull wearing a fur hat with horns. The skull has a mongoloid moustache - it's obviously a Great Khans emblem.
  components:
  - type: Sprite
    sprite: Misfits/Clothing/OuterClothing/Armor/khansaltarmoredjacket.rsi
  - type: Clothing
    sprite: Misfits/Clothing/OuterClothing/Armor/khansaltarmoredjacket.rsi

