# T2 — Initiate (weakest BoS armor; base N14ClothingOuterMBoSInitiateArmor carries these stats)
# T3 — Squire (one step above Initiate, below Knight; still in training)

- type: entity
  parent: N14ClothingOuterMidwestArmor
  id: MisfitsBoSSquireArmor
  name: Brotherhood squire armor
  description: Light Brotherhood-issue armor worn by Squires; sturdy enough for patrol duty but not yet the full combat kit of a Knight.
  components:
  - type: Armor
    modifiers: # #Misfits Tweak: Squire raised T2→T3 (0.80/0.75) so it outranks Initiate (T2, 0.85/0.80)
      coefficients:
        Blunt: 0.80
        Slash: 0.80
        Piercing: 0.75
        Heat: 0.75
