# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Clothing/Bags/bwonsamdi_harness.yml

- type: entity
  id: MisfitsClothingBackpackBwonsamdiHarness
  name: trophy harness
  description: A weathered leather harness hung with tokens of the dead. It carries a few practical objects, but offers no protection.
  components:
  - type: Sprite
    sprite: Misfits/Clothing/Back/oldsatchel.rsi
    state: icon
  - type: Item
    size: Huge
  - type: Clothing
    quickEquip: false
    slots:
    - back
  - type: Storage
    grid:
    - 0,0,3,2
    maxItemSize: Normal
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: UseDelay
    delay: 0.5
  - type: Tag
    tags:
    - MisfitsBwonsamdiHarness
