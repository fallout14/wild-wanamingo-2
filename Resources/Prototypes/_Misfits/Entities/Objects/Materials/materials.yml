- type: entity
  parent: N14MaterialBasePowder
  id: MisfitsMaterialCement
  name: cement
  description: Cement powder used for making concrete.
  categories: [ HideSpawnMenu ]
  components:
  - type: Stack
    stackType: MisfitsCement
    baseLayer: powder_lead
  - type: PhysicalComposition
    materialComposition:
      MisfitsCement: 100
  - type: Sprite
    sprite: /Textures/Nuclear14/Objects/Misc/materials.rsi
    state: powder_brass
    layers:
    - state: powder_brass
      map: ["base"]
  - type: Item
    size: Small
  - type: Solution
    id: powder
    solution:
      maxVol: 5
      reagents:
      - ReagentId: MisfitsCement
        Quantity: 5
  - type: Tag
    tags:
    - MisfitsCement

