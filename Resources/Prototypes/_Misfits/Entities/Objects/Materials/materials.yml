- type: entity
  parent: F14MaterialBasePowder
  id: F14MaterialCement
  name: cement
  description: Cement powder used for making concrete.
  categories: [ HideSpawnMenu ]
  components:
  - type: Stack
    stackType: F14Cement
    baseLayer: powder_lead
  - type: PhysicalComposition
    materialComposition:
      F14Cement: 100
  - type: Sprite
    sprite: /Textures/Nuclear14/Objects/Misc/materials.rsi
    state: powder_brass
    layers:
    - state: powder_brass
      map: ["base"]
  - type: Item
    size: Small
  - type: Solution
    id: powder
    solution:
      maxVol: 5
      reagents:
      - ReagentId: F14Cement
        Quantity: 5
  - type: Tag
    tags:
    - F14Cement

