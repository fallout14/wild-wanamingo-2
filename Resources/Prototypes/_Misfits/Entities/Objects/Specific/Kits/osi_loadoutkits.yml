# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Specific/Kits/osi_loadoutkits.yml

- type: entity
  id: F14OSIloadoutkits
  name: Undecided OSI Loadout Kit
  parent: F14BaseLoadoutKit
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/kits.rsi
    state: medic
  - type: ThiefUndeterminedBackpack
    maxSelectedSets: 1
    toolName: n14-loadout-kit-window-title
    toolDesc: n14-loadout-kit-window-description
    possibleSets:
    - OSI_MechanicalSet
    - OSI_MedicalSet
    - OSI_FieldSet

- type: thiefBackpackSet
  id: OSI_MechanicalSet
  name: n14-loadout-kit-osi-mechanicalset-name
  description: n14-loadout-kit-osi-mechanicalset-description
  sprite:
    sprite: Nuclear14/Objects/Misc/kits.rsi
    state: pointman
  content:
  - F14KitOSIMechanical

- type: thiefBackpackSet
  id: OSI_MedicalSet
  name: n14-loadout-kit-osi-medicalset-name
  description: n14-loadout-kit-osi-medicalset-description
  sprite:
    sprite: Nuclear14/Objects/Misc/kits.rsi
    state: medic
  content:
  - F14KitOSIMedical

- type: thiefBackpackSet
  id: OSI_FieldSet
  name: n14-loadout-kit-osi-fieldset-name
  description: n14-loadout-kit-osi-fieldset-description
  sprite:
    sprite: Nuclear14/Objects/Misc/kits.rsi
    state: rifleman
  content:
  - F14KitOSIField

- type: entity
  id: F14KitOSIMechanical
  name: mechanical OSI kit
  parent: F14KitBase
  description: A crate containing tools and technical supplies for an OSI scientist assigned to mechanical and industrial work.
  components:
  - type: Sprite
    state: pointman
  - type: Item
    size: Huge
  - type: SpawnItemsOnUse
    items:
      - id: ToolboxMechanicalFilled
      - id: ToolboxElectricalFilled
      - id: RadioHandheld
      - id: F14Stimpak
      - id: F14CleanGauze10
      - id: F14Flare
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  id: F14KitOSIMedical
  name: medical OSI kit
  parent: F14KitBase
  description: A crate containing trauma and radiation support for an OSI scientist assigned to medical duties.
  components:
  - type: Sprite
    state: medic
  - type: Item
    size: Huge
  - type: SpawnItemsOnUse
    items:
      - id: F14MedkitCombatFilled
      - id: F14SuperStimpak
      - id: F14RadAwayBloodbag
      - id: F14CleanGauze10
        amount: 2
      - id: RadioHandheld
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  id: F14KitOSIField
  name: field OSI kit
  parent: F14KitBase
  description: A crate containing a radiation suit, survey gear, and a sidearm for an OSI scientist operating in the field.
  components:
  - type: Sprite
    state: rifleman
  - type: Item
    size: Huge
  - type: SpawnItemsOnUse
    items:
      - id: GeigerCounter
      - id: F14MedkitRadiationFilled
      - id: F14WeaponPistol9mm
      - id: F14Stimpak
      - id: F14CleanGauze10
      - id: F14Flare
      - id: RadioHandheld
    sound:
      path: /Audio/Effects/unwrap.ogg
