- type: entity
  name: private first class fireteam kit
  parent: F14KitBase
  id: F14KitNCRPFCFireteam
  description: A crate containing trusted fireteam gear for a dependable NCR private first class.
  components:
  - type: Sprite
    state: pointman
  - type: Item
    size: Huge
  - type: SpawnItemsOnUse
    items:
      - id: F14ClothingBeltNCRPouches
      - id: F14WeaponRifle556ServiceScoped
      - id: F14Magazine556Rifle
