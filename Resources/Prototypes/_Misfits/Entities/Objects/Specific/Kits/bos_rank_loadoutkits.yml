#Misfits Change /Add/: New Squire kit — wattz pistol + combat knife. Separate from initiate.

- type: entity
  name: BoS Squire Basic Kit
  parent: N14KitBase
  id: MisfitsKitSqrBasic
  description: A crate containing a sidearm and blade for Brotherhood Squires.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/kits.rsi
    state: rifleman
  - type: Item
    size: Huge
  - type: SpawnItemsOnUse
    items:
      - id: N14WeaponLaserPistol
      - id: N14PowerCellSmall # #Misfits Fix - was N14MicrofusionCellRed (wrong ammo type for AEP-7)
        amount: 2
      - id: N14CombatKnife
      - id: N14CleanGauze10
      - id: N14Stimpak
      - id: N14BoxCardboardMREBoxKFilled

- type: thiefBackpackSet
  id: Misfits_SqrBasic_Set
  name: n14-loadout-kit-misfits-sqrbasic-set-name
  description: n14-loadout-kit-misfits-sqrbasic-set-description
  sprite:
    sprite: Nuclear14/Objects/Misc/kits.rsi
    state: rifleman
  content:
  - MisfitsKitSqrBasic

#Misfits Tweak: Restored the Bozar to the shared paladin kit because the Wattz 2000 was overtuned.

- type: entity
  name: BoS Paladin Bozar Kit
  parent: N14KitBase
  id: MisfitsKitPalWattz
  description: A crate containing a Bozar and sidearm for Brotherhood Paladins.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/kits.rsi
    state: marksman
  - type: Item
    size: Huge
  - type: SpawnItemsOnUse
    items:
      - id: CorvaxWeaponRifleBozarGRA
      - id: N14LMGMagazine556Rifle
        amount: 1
      - id: N14WeaponPistol12mm
      - id: N14MagazinePistol12mm
        amount: 2
      - id: N14CleanGauze10
      - id: N14Stimpak
      - id: N14BoxCardboardMREBoxKFilled

- type: thiefBackpackSet
  id: Misfits_PalWattz_Set
  name: n14-loadout-kit-misfits-palwattz-set-name
