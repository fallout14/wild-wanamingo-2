# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Objects/Specific/Kits/kits.yml

- type: entity
  name: lieutenant's commissar kit
  parent: F14KitBase
  id: F14KitNCRLTCommissar
  description: A crate containing all an NCR Commissar needs to execute their tro- duties.
  components:
  - type: Sprite
    state: pointman
  - type: Item
    size: Huge
  - type: SpawnItemsOnUse
    items:
      - id: F14ClothingOuterNCRCommissarPlate
      - id: F14ClothingBeltNCR
      - id: F14NCRCommissarSabre
      - id: F14ClothingNeckNCRCommissarJacket
      - id: F14WeaponLaserdotDesertEagle44
      - id: F14MagazinePistol44
        amount: 4
      - id: F14ClothingMaskCommissar
      - id: F14ClothingHeadHatNCRCommissarHat
      - id: F14BoxCardboardMREBoxCFilled
      - id: F14Stimpak
      - id: F14SuperStimpak
      - id: F14RadAwayBloodbag
      - id: F14CleanGauze10
        amount: 2
      - id: F14Flare
    sound:
      path: /Audio/Effects/unwrap.ogg

