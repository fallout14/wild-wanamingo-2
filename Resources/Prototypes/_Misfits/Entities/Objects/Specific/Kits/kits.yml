# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Objects/Specific/Kits/kits.yml

- type: entity
  name: lieutenant's commissar kit
  parent: N14KitBase
  id: MisfitsKitNCR_LTCommissar
  description: A crate containing all an NCR Commissar needs to execute their tro- duties.
  components:
  - type: Sprite
    state: pointman
  - type: Item
    size: Huge
  - type: SpawnItemsOnUse
    items:
      - id: MisfitsClothingOuterNCRCommissarPlate
      - id: N14ClothingBeltNCR
      - id: MisfitsNCRCommissarSabre
      - id: MisfitsClothingNeckNCRCommissarJacket
      - id: N14WeaponLaserdotDesertEagle44
      - id: N14MagazinePistol44
        amount: 4
      - id: MisfitsClothingMaskCommissar
      - id: MisfitsClothingHeadHatNCRCommissarHat
      - id: N14BoxCardboardMREBoxCFilled
      - id: N14Stimpak
      - id: N14SuperStimpak
      - id: N14RadAwayBloodbag
      - id: N14CleanGauze10
        amount: 2
      - id: N14Flare
    sound:
      path: /Audio/Effects/unwrap.ogg

