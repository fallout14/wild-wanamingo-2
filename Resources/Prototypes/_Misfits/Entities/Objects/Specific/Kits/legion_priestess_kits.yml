# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Specific/Kits/legion_priestess_kits.yml

- type: entity
  name: priestess of zealotry
  parent: F14KitBase
  id: F14KitPriestessZealot
  description: "Inspire bloodlust in allies and terror in foes."
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Corvax/Objects/Misc/kits.rsi
    state: base
  - type: Item
    size: Huge
  - type: SpawnItemsOnUse
    items:
      - id: F14LegionnaireShield
      - id: F14AmmoBox12gauge
        amount: 2
      - id: F14ClothingBeltQuiverSpear
      - id: F14PilumSpear
        amount: 3
      - id: Bola
        amount: 2
      - id: F14FoodCazadorAcidSac
        amount: 2
      - id: F14FoodTinK
        amount: 2
      - id: F14JunkCeramicFlask
    sound:
      path: /Audio/Effects/unwrap.ogg

