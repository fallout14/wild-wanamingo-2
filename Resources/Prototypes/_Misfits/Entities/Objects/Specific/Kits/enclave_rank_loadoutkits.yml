- type: entity
  id: F14KitEnclaveCommandLaser
  name: command laser kit
  parent: F14KitBase
  description: A crate containing officer-grade laser weaponry, signaling tools, and sustain items for a U.S. Army commander.
  components:
  - type: Sprite
    state: pointman
  - type: Item
    size: Huge
  - type: SpawnItemsOnUse
    items:
      - id: F14ClothingOuterEnclaverOfficerCoat
      - id: F14ClothingBeltMilitary
      - id: F14WeaponLaserRifleWattz2000
      - id: F14WeaponLaserPistol
      - id: RadioHandheld
      - id: SmokeGrenade
        amount: 2
      - id: GrenadeFrag
      - id: F14Stimpak
      - id: F14SuperStimpak
      - id: F14CleanGauze10
        amount: 2
      - id: F14Flare
    sound:
      path: /Audio/Effects/unwrap.ogg

