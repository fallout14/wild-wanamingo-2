# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Specific/Robotics/borg_modules.yml

- type: entity
  id: F14BorgWeaponFlamer
  parent: BaseItem
  name: integrated flamer
  description: A built-in incendiary projector integrated into the chassis. Draws power from the robot's internal reserves and recharges automatically.
  suffix: borg, integrated
  categories: [ HideSpawnMenu ]
  components:
  - type: Battery
    maxCharge: 99999
    startingCharge: 99999
  - type: BatterySelfRecharger
    autoRechargeRate: 1000
  - type: Solution
    id: chamber
    solution:
      maxVol: 500
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 500
  - type: FlamerAmmoProvider
    solutionId: chamber
    fireCost: 5
    fireTilePrototype: F14TileFire
    range: 6
  - type: NamedSolutionRegeneration
    solution: chamber
    generated:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 10
    duration: 0.2
  - type: Gun
    cameraRecoilScalar: 0
    fireRate: 10
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Nuclear14/Weapons/Guns/Flames/flamer.ogg
  - type: Sprite
    sprite: Objects/Weapons/Guns/Pistols/soaker.rsi
    layers:
    - state: icon
  - type: Item
    size: Normal
  - type: EyeCursorOffset
    maxOffset: 2
    pvsIncrease: 0.2

- type: entity
  id: F14BorgModuleFlamer
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: flamer cyborg module
  description: An incendiary projector module. Provides an integrated flamer for close-range combat. The weapon draws from internal power reserves and recharges automatically.
  components:
  - type: Sprite
    layers:
    - state: generic
    - state: icon-fire-extinguisher
  - type: ItemBorgModule
    hands:
    - item: F14BorgWeaponFlamer

- type: entity
  id: F14BorgWeaponStunbaton
  parent: Stunbaton
  name: integrated stun baton
  description: A stun baton integrated into a Protectron chassis. Its internal cell draws from the robot's power reserves and recharges automatically.
  suffix: borg, integrated
  categories: [ HideSpawnMenu ]
  components:
  - type: BatterySelfRecharger
    autoRechargeRate: 20 # ~50s to refill from empty (1000 charge = 20 stuns)

# Self-recharging high-capacity cell used by borg-integrated lights. # #Misfits Fix

- type: entity
  id: F14BorgPowerCellHigh
  parent: PowerCellHigh
  name: borg microreactor power cell
  description: A high-capacity power cell with an integrated microreactor. Recharges itself slowly over time.
  suffix: Full, borg
  categories: [ HideSpawnMenu ]
  components:
  - type: BatterySelfRecharger
    autoRechargeRate: 18 # ~1 minute to refill from empty

# Integrated security flashlight for Police Protectron — self-recharging cell. # #Misfits Fix

- type: entity
  id: F14BorgWeaponSeclite
  parent: FlashlightSeclite
  name: integrated security flashlight
  description: A robust security flashlight integrated into a Protectron chassis. Its microreactor cell recharges automatically.
  suffix: borg, integrated
  categories: [ HideSpawnMenu ]
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: F14BorgPowerCellHigh

# Security module — provides stun baton, handcuffs, and a flashlight for Police Protectrons.

- type: entity
  id: F14BorgModuleSecurity
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: security cyborg module
  description: A law-enforcement module. Provides a stun baton, handcuffs, and a security flashlight for patrol and detainment duties.
  components:
  - type: Sprite
    layers:
    - state: generic
    - state: security
  - type: ItemBorgModule
    hands:
    - item: F14BorgWeaponStunbaton
    - item: Handcuffs
    - item: F14BorgWeaponSeclite

