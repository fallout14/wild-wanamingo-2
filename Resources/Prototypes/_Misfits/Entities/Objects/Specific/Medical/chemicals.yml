# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Objects/Specific/Medical/chemicals.yml

- type: entity
  parent: F14ChemicalSyringe
  id: F14MedXInjector
  name: med-x
  description: A syringe filled with a powerful painkiller. Some believe that it makes you more resistant to pain.
  components:
  - type: Sprite
    scale: 0.75, 0.75
    sprite: Nuclear14/Objects/Specific/Medical/ms13_drugs.rsi
    layers:
    - state: medxfill1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: medx-empty
      map: [ "enum.SolutionContainerLayers.Base" ]
  - type: Icon
    sprite: Nuclear14/Objects/Specific/Medical/ms13_drugs.rsi
    state: "medx-empty"
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: true
    fillBaseName: medxfill
    emptySpriteName: medx-empty
  - type: Appearance
  - type: Injector
    solutionName: pen
    currentTransferAmount: null
    ignoreClosed: false
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
  - type: Solution
    id: pen
    solution:
      maxVol: 20
  - type: UseDelay
    delay: 0.75

- type: entity
  parent: F14ChemicalSyringe
  id: F14CombatInjector
  suffix: empty
  name: combat injector
  description: A glass ampule attached to a rudimentary injector, used to house any number of medicines.
  components:
  - type: Sprite
    scale: 0.75, 0.75
    sprite: Nuclear14/Objects/Specific/Medical/combat-injector.rsi
    layers:
    - state: combatinjectorfill1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: combatinjector-empty
      map: [ "enum.SolutionContainerLayers.Base" ]
  - type: Icon
    sprite: Nuclear14/Objects/Specific/Medical/combat-injector.rsi
    state: "combatinjector-empty"
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: true
    fillBaseName: combatinjectorfill
    emptySpriteName: combatinjector-empty
  - type: Appearance
  - type: Injector
    solutionName: pen
    currentTransferAmount: null
    ignoreClosed: false
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
  - type: Solution
    id: pen
    solution:
      maxVol: 20
  - type: Tag
    tags:
    - Syringe
  - type: UseDelay
    delay: 0.5

#MARK: RadAway Inhaler

- type: entity
  parent: F14HealingPowder
  id: F14CleansingPowder
  name: cleansing powder
  description: A bag of anti-rad powder used by tribal and Legion healers. Makes the user drowsy.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/drugs.rsi
    layers:
    - state: healingpowder
      color: "#7fbf48"
  - type: Item
    sprite: Nuclear14/Objects/Specific/Medical/drugs.rsi
    size: Small
  - type: Solution
    id: food
    solution:
      maxVol: 10
      reagents:
      - ReagentId: F14CleansingPowder
        Quantity: 10 # Misfits Change - Cleansing Powder is bargain bin anti-rad. Low quantity with side-effects.

- type: entity
  parent: F14HealingPowder
  id: F14BerserkerPowder
  name: berserker powder
  description: A pouch of berserker powder, enhances physical abilities with some side effects.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/drugs.rsi
    layers:
    - state: berserkerpowder
  - type: Item
    sprite: Nuclear14/Objects/Specific/Medical/drugs.rsi
    size: Small
  - type: Solution
    id: food
    solution:
      maxVol: 25
      reagents:
      - ReagentId: F14Berserkermix
        Quantity: 25 # less than what youd get from minmaxxing with chem, od is 26.

