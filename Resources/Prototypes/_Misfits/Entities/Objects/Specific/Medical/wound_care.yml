# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Specific/Medical/wound_care.yml

- type: entity
  name: suture
  description: A plain surgical suture. Closes wounds and treats blunt-force trauma, though not as well as a medicated one.
  parent: MedicatedSuture
  id: F14Suture
  suffix: Full
  components:
  - type: Sprite
    sprite: Misfits/Objects/Specific/Medical/wound_care.rsi
    state: suture_3
    layers:
    - state: suture_3
      map: ["base"]
  - type: Healing
    damageContainers:
      - Biological
    damage:
      types:
        Blunt: -10
        Slash: -10
        Piercing: -10
    bloodlossModifier: -8
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
  - type: Stack
    stackType: F14Suture
    count: 10
    baseLayer: base
    layerStates:
    - suture
    - suture
    - suture
    - suture
    - suture_2
    - suture_2
    - suture_2
    - suture_3
    - suture_3
    - suture_3
    - suture_3
  - type: StackPrice
    price: 2

- type: entity
  id: F14Suture1
  parent: F14Suture
  suffix: Single
  components:
  - type: Stack
    stackType: F14Suture
    count: 1

- type: entity
  name: improvised suture
  description: Thread and a bent needle. It'll close a wound, but it's hardly sterile.
  parent: MedicatedSuture
  id: F14ImprovisedSuture
  suffix: Full
  components:
  - type: Sprite
    sprite: Misfits/Objects/Specific/Medical/wound_care.rsi
    state: suture_imp_3
    layers:
    - state: suture_imp_3
      map: ["base"]
  - type: Healing
    damageContainers:
      - Biological
    damage:
      types:
        Blunt: -5
        Slash: -5
        Piercing: -5
        Poison: 1
    bloodlossModifier: -5
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
  - type: Stack
    stackType: F14ImprovisedSuture
    count: 10
    baseLayer: base
    layerStates:
    - suture_imp
    - suture_imp
    - suture_imp
    - suture_imp
    - suture_imp_2
    - suture_imp_2
    - suture_imp_2
    - suture_imp_3
    - suture_imp_3
    - suture_imp_3
    - suture_imp_3
  - type: StackPrice
    price: 1

- type: entity
  id: F14ImprovisedSuture1
  parent: F14ImprovisedSuture
  suffix: Single
  components:
  - type: Stack
    stackType: F14ImprovisedSuture
    count: 1

