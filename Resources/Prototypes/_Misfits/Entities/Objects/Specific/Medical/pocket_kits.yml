# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Specific/Medical/pocket_kits.yml

- type: entity
  name: individual first aid kit
  description: An individual first aid kit. Small enough for a pocket, and only holds medical supplies.
  parent: BaseStorageItem
  id: F14IFAK
  components:
  - type: Sprite
    sprite: Misfits/Objects/Specific/Medical/pocket_kits.rsi
    state: ifak
  - type: Item
    size: Small
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,4,1
    whitelist:
      tags:
      - Brutepack
      - Bloodpack
      - Gauze
      - Ointment
      - PillCanister
      - F14Bandage
      - F14TribalMedicine
      components:
      - Healing
      - Injector
      - Pill

# Advanced first aid kit: a bigger IFAK. Not given to anyone yet.
# TODO: needs its own sprite, currently uses the IFAK one.

- type: entity
  name: advanced first aid kit
  description: An advanced first aid kit. Still fits in a pocket, with room for proper field surgery supplies.
  parent: F14IFAK
  id: F14AFAK
  components:
  - type: Storage
    grid:
    - 0,0,6,1

# Survival kit: holds anything small.

- type: entity
  name: survival kit
  description: A pocket-sized tin for keeping a few essentials on hand.
  parent: BaseStorageItem
  id: F14SurvivalKit
  components:
  - type: Sprite
    sprite: Misfits/Objects/Specific/Medical/pocket_kits.rsi
    state: survivalkit
  - type: Item
    size: Small
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,4,1

# ============================================================================
# FILLED KITS
# Small items are listed first so the fill packs cleanly.
# ============================================================================

# Replaces F14BoxPlasticFilledWastelander.

- type: entity
  parent: F14SurvivalKit
  id: F14SurvivalKitWastelander
  suffix: Wastelander
  components:
  - type: StorageFill
    contents:
    - id: F14DirtyGauze10
    - id: F14Stimpak
    - id: Flare
    - id: F14RadXPill
      amount: 3

# Replaces N14BoxPlasticFilledRaider.

- type: entity
  parent: F14SurvivalKit
  id: F14SurvivalKitRaider
  suffix: Raider
  components:
  - type: StorageFill
    contents:
    - id: F14DirtyGauze10
    - id: F14MedX
    - id: F14Jet
      prob: 0.5
      orGroup: RandomDrug
    - id: F14StimpakDirty
      prob: 0.5
      orGroup: RandomDrug
    - id: Flare
    - id: F14RadXPill
      amount: 3

# Replaces F14BoxPlasticFilledMilitary and F14BoxPlasticFilledMilitaryNCR.

- type: entity
  parent: F14IFAK
  id: F14IFAKMilitary
  suffix: Military
  components:
  - type: StorageFill
    contents:
    - id: F14CleanGauze10
    - id: F14Ointment10
    - id: F14Suture
    - id: F14Stimpak
    - id: F14RadXCanisterFilled

# Replaces N14BoxPlasticFilledMilitaryLegion. Tribal medicine only, no stimpaks.

- type: entity
  parent: F14IFAK
  id: F14IFAKLegion
  suffix: Legion
  components:
  - type: StorageFill
    contents:
    - id: F14CleanGauze10
    - id: F14HealingPowder
    - id: F14HealingPoultice
    - id: F14CleansingPowder

- type: entity
  parent: F14AFAK
  id: F14AFAKFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: F14SuperStimpak
    - id: RegenerativeMesh
    - id: MedicatedSuture
    - id: F14CleanGauze10
    - id: F14MedX
    - id: F14RadAwayInhaler
    - id: F14RadXCanisterFilled
