# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Weapons/firearm_attachments.yml

- type: entity
  parent: BaseItem
  id: F14FirearmSuppressor
  name: firearm suppressor
  description: A detachable muzzle suppressor. It dampens a compatible firearm's report and conceals its muzzle flash.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/crafting_junk.rsi
    state: recoilcomp
  - type: SuppressorAttachment
  - type: Tag
    tags:
    - F14FirearmMuzzleAttachment
  - type: StaticPrice
    price: 125

- type: entity
  parent: F14CombatKnife
  id: F14FirearmBayonet
  name: rifle bayonet
  description: A combat knife fitted with a mounting ring for use as a rifle bayonet.
  components:
  - type: BayonetAttachment
    damage:
      types:
        Piercing: 12
        Slash: 6
  - type: Tag
    tags:
    - CombatKnife
    - Knife
    - F14FirearmMuzzleAttachment
