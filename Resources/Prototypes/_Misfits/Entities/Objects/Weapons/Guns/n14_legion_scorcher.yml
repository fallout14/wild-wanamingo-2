# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Weapons/Guns/n14_legion_scorcher.yml

- type: entity
  parent: N14WeaponFireGunBase
  id: MisfitsWeaponLegionScorcher
  name: Scorcher
  description: A military-grade incendiary weapon seized from pre-war stockpiles and repurposed by Caesar's Legion. Centurions reserve these for breaking fortified positions and clearing out entrenched enemies. Handle with extreme care.
  components:
  - type: Gun
    cameraRecoilScalar: 0    # no recoil — too heavy to bounce
    fireRate: 15             # slightly slower than the stock flamer; deliberate and punishing
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_RMC/Weapons/Guns/Flamer/gun_flamethrower2.ogg
  - type: Sprite
    sprite: Misfits/Objects/Weapons/Guns/Flamethrower/m34.rsi
    state: base
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: Misfits/Objects/Weapons/Guns/Flamethrower/m34.rsi
    heldPrefix: inhand-right
    size: Large
  - type: Clothing
    sprite: Misfits/Objects/Weapons/Guns/Flamethrower/m34.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: EyeCursorOffset
    maxOffset: 2
    pvsIncrease: 0.2
  - type: StaticPrice
    price: 500
