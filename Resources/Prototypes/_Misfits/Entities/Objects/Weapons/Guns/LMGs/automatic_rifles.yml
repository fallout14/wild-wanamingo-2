# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Weapons/Guns/LMGs/automatic_rifles.yml

- type: entity
  name: heavy automatic rifle
  parent: F14WeaponLMGAutoRifle
  id: F14WeaponLMGAutoRifleHeavy
  description: An M1918A2 Browning Automatic Rifle. Heavier than the A1, with a bipod and a rate reducer that make its full-power .308 far easier to keep on target. It can also be fired one round at a time.
  components:
  - type: Clothing
    sprite: Misfits/Objects/Weapons/Guns/LMGs/autorifle_a2.rsi
  - type: Sprite
    sprite: Misfits/Objects/Weapons/Guns/LMGs/autorifle_a2.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Huge
    sprite: Misfits/Objects/Weapons/Guns/LMGs/autorifle_a2.rsi
  - type: Wieldable
  - type: SpeedModifiedOnWield
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: GunWieldBonus
    minAngle: -21
    maxAngle: -54 # bipod: wielded spread 3-6 instead of the A1's 5-10
  - type: Gun
    minAngle: 24
    maxAngle: 60
    angleIncrease: 3 # stable platform, recoil builds slowly
    angleDecay: 18
    fireRate: 4
    soundGunshot:
      collection: F14AutoRifleGunshot
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    - SemiAuto
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: StaticPrice
    price: 425

- type: entity
  name: Colt Monitor
  parent: F14WeaponLMGAutoRifle
  id: F14WeaponLMGAutoRifleMonitor
  description: A Colt R80 Monitor, the lightened and shortened Browning Automatic Rifle built for law enforcement. Fast-firing and easier to carry than any other BAR, and it takes the long 40-round .308 magazines as well as standard ones.
  components:
  - type: Clothing
    sprite: Misfits/Objects/Weapons/Guns/LMGs/monitor.rsi
  - type: Sprite
    sprite: Misfits/Objects/Weapons/Guns/LMGs/monitor.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Huge
    sprite: Misfits/Objects/Weapons/Guns/LMGs/monitor.rsi
  - type: Wieldable
  - type: SpeedModifiedOnWield
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: GunWieldBonus
    minAngle: -20
    maxAngle: -45
  - type: Gun
    minAngle: 23
    maxAngle: 55
    angleIncrease: 5
    angleDecay: 16
    fireRate: 5 # high rate of fire
    soundGunshot:
      collection: F14AutoRifleGunshot
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    - SemiAuto
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: F14Magazine308Rifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - F14Magazine308Rifle
            - F14Magazine308RifleLong # the long magazines the Bren used to take
      gun_chamber:
        name: Chamber
        startingItem: F14Cartridge308Rifle
        priority: 1
        whitelist:
          tags:
            - F14Cartridge308Rifle
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: StaticPrice
    price: 550
