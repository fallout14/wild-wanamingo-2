# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Weapons/Guns/Pistols/glock.yml

- type: entity
  name: Glock 37M
  parent: N14BaseWeaponPistol
  id: MisfitsGlock
  suffix: Admin Only
  description: An exceedingly rare Glock chambered in .45 Magnum. Its unusual caliber and limited production make it a true collector's piece if you are pro.
  components:
  - type: Tag
    tags:
    - Sidearm
  - type: Sprite
    sprite: Misfits/Objects/Weapons/Guns/Pistols/glock.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: Misfits/Objects/Weapons/Guns/Pistols/glock.rsi
  - type: Clothing
    sprite: Misfits/Objects/Weapons/Guns/Pistols/glock.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: Gun
    fireRate: 4
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MisfitsMagGlock
        insertSound: /Audio/Nuclear14/Weapons/Effects/Reload/Pistols/pistol_magin.ogg
        ejectSound: /Audio/Nuclear14/Weapons/Effects/Reload/Pistols/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineMagnum
      gun_chamber:
        name: Chamber
        startingItem: MisfitsCartridgeGlock45
        priority: 1
        whitelist:
          tags:
            - CartridgeMagnum
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: StaticPrice
    price: 45
