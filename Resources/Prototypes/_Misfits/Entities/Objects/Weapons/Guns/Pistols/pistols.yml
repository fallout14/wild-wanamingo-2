# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Weapons/Guns/Pistols/pistols.yml, Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Pistols/pistols.yml

- type: entity
  name: desert eagle 44
  parent: F14WeaponDesertEagle44
  id: F14WeaponEnclaveDesertEagle44
  description: An ancient Desert Eagle pistol, in .44 Magnum. Interest in late 20th century films made this one of the most popular handguns of all times.
  components:
  - type: Sprite
    sprite: Misfits/Objects/Weapons/Guns/Pistols/enclavedeagle.rsi
  - type: Item
    sprite: Misfits/Objects/Weapons/Guns/Pistols/enclavedeagle.rsi

- type: entity
  name: PPK12
  parent: BaseItem
  id: F14WeaponGaussPistol
  description: Praised for its range and stopping power, the PPK12 Gauss Pistol is of German design. The pistol uses an electromagnetic field to propel rounds at tremendous speed and punch through almost any armor.
  components:
  - type: Tag
    tags:
    - Sidearm
  - type: Sprite
    sprite: Misfits/Objects/Weapons/Guns/Pistols/gausspistol.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: Misfits/Objects/Weapons/Guns/Pistols/gausspistol.rsi
  - type: AmmoCounter
  - type: Gun
    fireRate: 2.0
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      collection: F14AutoShotgunGunshot
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: F14Magazine2mmECPistol
        priority: 2
        whitelist:
          tags:
          - F14Magazine2mmECPistol
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineAmmoProvider
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 100

# #Misfits Add - T-60 Pistol. Pre-war .44 sidearm issued alongside T-60 power armor.
# Ballistics and rate of fire are copied from the Desert Eagle .44
# (F14WeaponDesertEagle44) and it shares the same F14MagazinePistol44 magazines.
# The tightened spread values represent the integrated targeting electronics that
# stand in for the missing iron sights.

- type: entity
  name: T-60 pistol
  parent: F14BaseWeaponPistol
  id: F14WeaponPistolT60
  description: A large semi-automatic handgun chambered in .44, this weapon was designed pre-war for power armored units, specifically the T-60 line. Its lack of conventional sights is made up for by its built in electronics that increase its accuracy greatly.
  components:
  - type: Tag
    tags:
    - Sidearm
  - type: Sprite
    sprite: Misfits/Objects/Weapons/Guns/Pistols/t60pistol.rsi
  - type: Item
    sprite: Misfits/Objects/Weapons/Guns/Pistols/t60pistol.rsi
  - type: Gun
    fireRate: 2.5
    minAngle: 0
    maxAngle: 4
    angleIncrease: 0.3
    angleDecay: 8
    soundGunshot:
      collection: F14PistolDesertEagleGunshot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: F14MagazinePistol44
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - F14MagazinePistol44
      gun_chamber:
        name: Chamber
        startingItem: F14Cartridge44Magnum
        priority: 1
        whitelist:
          tags:
            - F14Cartridge44Magnum
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: StaticPrice
    price: 100

# #Misfits Add - .357 Automag: a long-slide magnum automatic. The Desert Eagle covers .44.

- type: entity
  name: .357 automag
  parent: F14BaseWeaponPistol
  id: F14WeaponPistol357Automag
  description: A long-slide stainless magnum automatic chambered in .357. Heavy, accurate and hard-hitting, fed from 7-round magazines. Will also fire .38 special.
  components:
  - type: Tag
    tags:
    - Sidearm
  - type: Sprite
    sprite: Misfits/Objects/Weapons/Guns/Pistols/automag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: Misfits/Objects/Weapons/Guns/Pistols/automag.rsi
  - type: GunDamageModifier
    damage: # long barrel: .357 22 + 3 = 25 (4-hit crit)
      types:
        Piercing: 3
  - type: Gun
    fireRate: 2.5
    minAngle: 0
    maxAngle: 5
    angleIncrease: 1.5
    angleDecay: 6
    soundGunshot:
      collection: F14PistolDesertEagleGunshot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: F14MagazinePistol357Automag
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - F14MagazinePistol357
      gun_chamber:
        name: Chamber
        startingItem: F14CartridgePistol357
        priority: 1
        whitelist:
          tags:
            - F14CartridgePistol357
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: StaticPrice
    price: 150

