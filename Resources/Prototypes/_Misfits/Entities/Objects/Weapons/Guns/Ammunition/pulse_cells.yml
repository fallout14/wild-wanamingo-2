# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Weapons/Guns/Ammunition/pulse_cells.yml

- type: entity
  name: pulse energy cell
  description: A compact pulse cell for small pulse weapons.
  id: F14PulseEnergyCell
  suffix: Full
  parent: F14BasePowerCell
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/EC.rsi
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: empty
      scale: 0.5, 0.5
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      shader: unshaded
      scale: 0.5, 0.5
  - type: Tag
    tags:
    - F14PulseEnergyCell
    - F14AmmoCell
  - type: Battery
    maxCharge: 600
    startingCharge: 600

- type: entity
  name: tesla electron charge pack
  description: An electron charge pack modified to discharge a sustained ball of electricity rather than a focused beam. The Tesla Cannon's signature munition.
  id: F14TeslaElectronChargePack
  suffix: Full
  parent: F14BasePowerCell
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/ECP.rsi
    layers:
      - map: [ "enum.PowerCellVisualLayers.Base" ]
        state: empty
        scale: 0.5, 0.5
      - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
        state: o2
        scale: 0.5, 0.5
        shader: unshaded
  - type: Tag
    tags:
      - F14PowerCellAdvanced   # fits Tesla Cannon whitelist
      - F14AmmoCell
  - type: Battery
    maxCharge: 2375
    startingCharge: 2375

- type: entity
  name: pulse microfusion cell
  description: A high-capacity pulse cell for medium and large pulse weapons.
  id: F14PulseMicrofusionCell
  suffix: Full
  parent: F14BasePowerCell
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/microfusion.rsi
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: empty
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      shader: unshaded
  - type: Tag
    tags:
    - F14PulseMicrofusionCell
    - F14AmmoCell
  - type: Battery
    maxCharge: 1200
    startingCharge: 1200
