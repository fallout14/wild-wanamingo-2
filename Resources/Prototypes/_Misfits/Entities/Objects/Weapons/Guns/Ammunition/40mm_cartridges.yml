# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Weapons/Guns/Ammunition/40mm_cartridges.yml

- type: entity
  id: F14Ammo40mmGrenadeHEDP
  parent: F14Ammo40mmGrenadeFrag
  name: 40mm HEDP grenade
  description: A 40mm round combining a compact explosive blast with lethal fragmentation. Use from cover.
  components:
  - type: CartridgeAmmo
    proto: F14Ammo40mmHEDPProjectile
  - type: Sprite
    sprite: Misfits/Legacy/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: he
      map: ["enum.AmmoVisualLayers.Base"]
  - type: SpentAmmoVisuals
    state: he

- type: entity
  id: F14Ammo40mmGrenadePulse
  parent: F14Ammo40mmGrenadeFrag
  name: 40mm pulse grenade
  description: A 40mm round that releases an electromagnetic pulse and a blue energy burst. Effective against robots and powered armor.
  components:
  - type: CartridgeAmmo
    proto: F14Ammo40mmPulseProjectile
  - type: Sprite
    layers:
    - state: emp
      map: ["enum.AmmoVisualLayers.Base"]
  - type: SpentAmmoVisuals
    state: emp

