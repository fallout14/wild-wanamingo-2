# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Magazines/_Misfits/drums.yml

- type: entity
  id: F14MagazineSMG9mmDrum
  name: drum magazine (9mm)
  parent: BaseItem
  components:
  - type: Tag
    tags:
      - F14MagazineSMG9mmDrum
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - F14CartridgePistol9
    capacity: 71 # Misfits 
    proto: F14CartridgePistol9
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Appearance 
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/22lr/smgmag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]

