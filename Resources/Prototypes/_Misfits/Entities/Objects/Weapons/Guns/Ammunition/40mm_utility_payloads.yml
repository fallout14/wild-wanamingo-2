# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Weapons/Guns/Ammunition/40mm_utility_payloads.yml

- type: entity
  id: F14Ammo40mmBuckshotPellet
  parent: F14PelletShotgun12
  name: 40mm buckshot pellet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    # Keep the twenty-pellet identity without allowing a point-blank hit to deal
    # the previous 200 raw damage. All twenty hits now total 80 before mitigation.
    damage:
      types:
        Piercing: 4
    deleteOnCollide: true

- type: entity
  id: F14Ammo40mmBuckshotSpread
  parent: F14Ammo40mmBuckshotPellet
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectileSpread
    proto: F14Ammo40mmBuckshotPellet
    count: 20
    spread: 20

# Utility rounds inherit only the zero-impact-damage projectile and its
# spawn/delete trigger behavior. No explosive blast is attached to these rounds.

- type: entity
  id: F14Ammo40mmSmokeProjectile
  parent: F14Ammo40mmHEDPProjectile
  name: smoke round
  categories: [ HideSpawnMenu ]
  components:
  - type: SpawnOnTrigger
    proto: F14Ammo40mmSmokePayload

- type: entity
  id: F14Ammo40mmWhitePhosphorusProjectile
  parent: F14Ammo40mmHEDPProjectile
  name: white phosphorus round
  categories: [ HideSpawnMenu ]
  components:
  - type: SpawnOnTrigger
    proto: F14Ammo40mmWhitePhosphorusPayload

- type: entity
  id: F14Ammo40mmTearGasProjectile
  parent: F14Ammo40mmHEDPProjectile
  name: tear gas round
  categories: [ HideSpawnMenu ]
  components:
  - type: SpawnOnTrigger
    proto: F14Ammo40mmTearGasPayload

- type: entity
  id: F14Ammo40mmFlashbangProjectile
  parent: F14Ammo40mmHEDPProjectile
  name: flashbang round
  categories: [ HideSpawnMenu ]
  components:
  - type: SpawnOnTrigger
    proto: F14Ammo40mmFlashbangPayload

# Match the handheld smoke's lifetime and spread. Spread is a tile budget,
# not a circular radius; walls and available space affect the final cloud.

- type: entity
  id: F14Ammo40mmSmokePayload
  categories: [ HideSpawnMenu ]
  components:
  - type: TriggerOnSpawn
  - type: SmokeOnTrigger
    duration: 30
    spreadAmount: 50
  - type: EmitSoundOnTrigger
    sound: /Audio/Items/smoke_grenade_smoke.ogg
  - type: DeleteOnTrigger

# Reuse the existing caustic WP reagent; deliberately no fire stacks or ignition.

- type: entity
  id: F14Ammo40mmWhitePhosphorusPayload
  parent: F14Ammo40mmSmokePayload
  categories: [ HideSpawnMenu ]
  components:
  - type: SmokeOnTrigger
    duration: 25
    spreadAmount: 50
    solution:
      reagents:
      - ReagentId: F14WhitePhosphorusSmoke
        Quantity: 50

- type: entity
  id: F14Ammo40mmTearGasPayload
  parent: F14Ammo40mmSmokePayload
  categories: [ HideSpawnMenu ]
  components:
  - type: SmokeOnTrigger
    duration: 10
    spreadAmount: 30
    solution:
      reagents:
      - ReagentId: TearGas
        Quantity: 50

# Reuse standard flash handling, including visibility and flash protection.

- type: entity
  id: F14Ammo40mmFlashbangPayload
  categories: [ HideSpawnMenu ]
  components:
  - type: TriggerOnSpawn
  - type: FlashOnTrigger
    range: 7
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Effects/flash_bang.ogg
  - type: SpawnOnTrigger
    proto: GrenadeFlashEffect
  - type: DeleteOnTrigger
