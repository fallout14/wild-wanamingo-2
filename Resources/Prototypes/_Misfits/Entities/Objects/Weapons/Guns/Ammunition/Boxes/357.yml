# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Weapons/Guns/Ammunition/Boxes/357.yml

- type: entity
  abstract: true
  parent: BaseItem
  id: F14BaseMagazineBox357
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - F14CartridgePistol357
    proto: F14CartridgePistol357
    capacity: 30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Boxes/44.rsi
    netsync: false
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: FoldableAmmoBox

- type: entity
  parent: F14BaseMagazineBox357
  id: F14AmmoBox357
  name: ammunition box (.357 magnum)
  components:
  - type: BallisticAmmoProvider
    proto: F14CartridgePistol357
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
