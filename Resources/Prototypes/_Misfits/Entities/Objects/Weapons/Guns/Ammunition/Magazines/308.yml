# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Magazines/308.yml

- type: entity
  id: F14SKSEnbloc308
  name: "en-bloc clip (SKS, .308)"
  description: A 10-round en-bloc clip for the SKS rifle. Standard-issue ammunition for Legion heavy riflemen in the field.
  parent: F14BaseMagazine308Rifle
  components:
  - type: Tag
    tags:
      - F14SKSEnbloc308
  - type: BallisticAmmoProvider
    proto: F14Cartridge308Rifle
    capacity: 10
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/garand308.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 1 # #Misfits Fix: RSI only has mag-0 (empty) and mag-1 (loaded); steps:1 maps correctly
    zeroVisible: true
  - type: Appearance

- type: entity # Forge-add-start
  id: F14Magazine308RifleSniper
  name: "sniper magazine (.308)"
  parent: F14BaseMagazine308Rifle
  components:
  - type: Tag
    tags:
      - F14Magazine308RifleSnipers
  - type: BallisticAmmoProvider
    proto: F14Cartridge308Rifle
    capacity: 10
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/308/mag5.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity # Forge-add-start
  id: F14MagazineOver308RifleSniper
  name: "sniper magazine (Overpressure .308)"
  description: A .308 overpressure magazine made for the sniper. Due to the bullets being slightly fatter, normal .308 won't fit in this mag.
  parent: F14BaseMagazine308Rifle
  components:
  - type: Tag
    tags:
      - F14MagazineOver308RifleSnipers
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - F14CartridgeOver308Rifle
    proto: F14CartridgeOver308Rifle
    capacity: 10
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/308/mag5.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]


