# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Battery/Battery.yml

- type: entity
  name: microfusion cell
  description: A standard microfusion cell used as ammunition for energy weapons. The weapon's internal optics determine beam color and output — the cell simply provides charge.
  id: F14MicrofusionCell
  suffix: Full
  parent: F14BasePowerCell
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/microfusion.rsi
    layers:
      - map: [ "enum.PowerCellVisualLayers.Base" ]
        state: empty
      - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
        state: o2
        shader: unshaded
  - type: Battery
    maxCharge: 1200
    startingCharge: 1200

- type: entity
  name: microfusion cell (red)
  description: A standard microfusion cell calibrated to emit a red laser beam.
  id: F14MicrofusionCellRed
  parent: F14MicrofusionCell
  suffix: Full

- type: entity
  name: microfusion cell (green)
  description: A tuned microfusion cell calibrated to emit a green laser beam.
  id: F14MicrofusionCellGreen
  parent: F14MicrofusionCell
  suffix: Full

- type: entity
  name: microfusion cell (blue)
  description: An advanced microfusion cell calibrated to emit a blue laser beam.
  id: F14MicrofusionCellBlue
  parent: F14MicrofusionCell
  suffix: Full

- type: entity
  name: microfusion cell (violet)
  description: An experimental microfusion cell calibrated to emit a violet laser beam.
  id: F14MicrofusionCellViolet
  parent: F14MicrofusionCell
  suffix: Full

#MARK: Fusion Core — single consolidated type
# #Misfits Change - Consolidated from 4 colored variants into one generic fusion core.
# Only the Laser Gatling accepts these (F14FusionCore tag). Weapon controls beam via override.
# 5000 charge / 50 fireCost = 100 shots. Intended for heavy sustained-fire weapons.

- type: entity
  id: F14FusionCoreRed
  parent: F14FusionCore
  suffix: Full

- type: entity
  id: F14FusionCoreGreen
  parent: F14FusionCore
  suffix: Full

- type: entity
  id: F14FusionCoreBlue
  parent: F14FusionCore
  suffix: Full

- type: entity
  id: F14FusionCoreViolet
  parent: F14FusionCore
  suffix: Full

#MARK: Electron Charge Pack — single player-facing type
# The pack only provides charge. Weapon profiles determine damage and beam color.
# Pulse weapons deal Heat + Shock damage (effective against mechanical targets).

- type: entity
  name: electron charge pack
  description: An electron charge pack used as ammunition for pulse weapons. The weapon's emitter array determines pulse characteristics — the pack simply provides charge.
  id: F14ElectronChargePack
  suffix: Full
  parent: F14BasePowerCell
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/ECP.rsi
    layers:
      - map: [ "enum.PowerCellVisualLayers.Base" ]
        state: empty
        scale: 0.5, 0.5
      - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
        state: o2
        scale: 0.5, 0.5
        shader: unshaded
  - type: Tag
    tags:
      - F14ElectronChargePack
      - F14AmmoCell
  - type: Battery
    maxCharge: 1600
    startingCharge: 1600

- type: entity
  name: electron charge pack (red)
  description: A standard electron charge pack calibrated for red pulse discharge.
  id: F14ElectronChargePackRed
  parent: F14ElectronChargePack
  suffix: Full

- type: entity
  name: electron charge pack (green)
  description: A tuned electron charge pack calibrated for green pulse discharge.
  id: F14ElectronChargePackGreen
  parent: F14ElectronChargePack
  suffix: Full

- type: entity
  name: electron charge pack (blue)
  description: An advanced electron charge pack calibrated for blue pulse discharge.
  id: F14ElectronChargePackBlue
  parent: F14ElectronChargePack
  suffix: Full

- type: entity
  name: electron charge pack (violet)
  description: An experimental electron charge pack calibrated for violet pulse discharge.
  id: F14ElectronChargePackViolet
  parent: F14ElectronChargePack
  suffix: Full

