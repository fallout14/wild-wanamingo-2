# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Weapons/Guns/Ammunition/Speedloaders/357.yml

- type: entity
  id: MisfitsBaseSpeedLoader357
  name: "speed loader (.357 magnum)"
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - MisfitsSpeedLoader357
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - MisfitsCartridgePistol357
    capacity: 6
  - type: Sprite
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

- type: entity
  id: MisfitsSpeedLoader357
  name: "speed loader (.357 magnum)"
  parent: MisfitsBaseSpeedLoader357
  components:
  - type: BallisticAmmoProvider
    proto: MisfitsCartridgePistol357
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Speedloaders/44loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: base-6
        map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: base
    steps: 7
    zeroVisible: false
  - type: Appearance

# #Misfits Add - .357 Magnum speed loader tube for tube-fed lever guns (Cowboy Repeater, Trail Carbine).
# Uses its own tag instead of the shared SpeedLoaderInternal so it cannot load other calibers.

- type: entity
  id: MisfitsBaseSpeedLoaderTube357
  name: "speed loader tube (.357 magnum)"
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - MisfitsSpeedLoaderTube357
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - MisfitsCartridgePistol357
    capacity: 12
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Speedloaders/45_70loadertube.rsi # placeholder
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

- type: entity
  id: MisfitsSpeedLoaderTube357
  name: "speed loader tube (.357 magnum)"
  parent: MisfitsBaseSpeedLoaderTube357
  components:
  - type: BallisticAmmoProvider
    proto: MisfitsCartridgePistol357
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: base-10
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: base
    steps: 11
    zeroVisible: false
  - type: Appearance
