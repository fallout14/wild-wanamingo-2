# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Weapons/Guns/Ammunition/Speedloaders/45.yml

- type: entity
  id: F14BaseSpeedLoader45
  name: "speed loader (.45 ACP)"
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - F14SpeedLoader45
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - F14CartridgePistol45
    capacity: 6
  - type: Sprite
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

- type: entity
  id: F14SpeedLoader45
  name: "speed loader (.45 ACP)"
  parent: F14BaseSpeedLoader45
  components:
  - type: BallisticAmmoProvider
    proto: F14CartridgePistol45
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Speedloaders/44loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: base-6
        map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: base
    steps: 7
    zeroVisible: false
  - type: Appearance

# Uses its own tag instead of the shared SpeedLoaderInternal so it cannot load other calibers.

- type: entity
  id: F14BaseSpeedLoaderTube45
  name: "speed loader tube (.45 ACP)"
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - F14SpeedLoaderTube45
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - F14CartridgePistol45
    capacity: 10
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Speedloaders/45_70loadertube.rsi
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

- type: entity
  id: F14SpeedLoaderTube45
  name: "speed loader tube (.45 ACP)"
  parent: F14BaseSpeedLoaderTube45
  components:
  - type: BallisticAmmoProvider
    proto: F14CartridgePistol45
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: base-10
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: base
    steps: 11
    zeroVisible: false
  - type: Appearance
