# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Magazines/2mmEC.yml

- type: entity
  id: MisfitsBaseMagazine2mmECRifle
  name: 2mmEC 20 capacity magazine
  parent: BaseItem
  components:
  - type: Tag
    tags:
    - MisfitsMagazine2mmECRifle
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - MisfitsCartridge2mmEC
    capacity: 12
    soundRack:
      path: /Audio/Weapons/Guns/Cock/smg_cock.ogg
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    netsync: false
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/308/mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  id: MisfitsMagazine2mmECRifle
  name: 2mmEC 12 capacity magazine
  parent: MisfitsBaseMagazine2mmECRifle
  components:
  - type: BallisticAmmoProvider
    proto: MisfitsCartridge2mmEC

