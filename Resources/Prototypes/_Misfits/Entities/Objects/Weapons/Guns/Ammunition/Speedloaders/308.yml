# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Ammunition/Speedloaders/308.yml

- type: entity
  id: MisfitsBaseSpeedLoaderInternal308
  name: "speed loader internal 308"
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
    - N14SpeedLoaderInternal
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - N14Cartridge308Rifle
    capacity: 8
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Ammunition/Speedloaders/45_70loadertube.rsi # Borrowing the 45-70 sprite
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

- type: entity
  id: MisfitsSpeedLoader308Tube
  name: "speed loader tube (.308)"
  parent: MisfitsBaseSpeedLoaderInternal308
  components:
  - type: BallisticAmmoProvider
    proto: N14Cartridge308Rifle
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: base-10
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: base
    steps: 9
    zeroVisible: false
  - type: Appearance
