# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Weapons/Guns/Ammunition/ClientCartridge/ClientsideSpentCart.yml

- type: entity
  id: F14ClientCartridgeStatic
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    visible: true
    sprite: Misfits/Objects/Weapons/Guns/Ammunition/SpentCartDefault.rsi
    state: base
    drawdepth: Items
    netsync: false
  - type: Tag
    tags:
      - HideContextMenu
  - type: MetaData
  - type: Fixtures
  - type: Transform
    netsync: false
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Weapons/Guns/Casings/casing_fall_1.ogg
      params:
        volume: -1
    netsync: false
  - type: Physics
    bodyType: Static
    netsync: false
    canCollide: False
  - type: TimedDespawn
    lifetime: 10
