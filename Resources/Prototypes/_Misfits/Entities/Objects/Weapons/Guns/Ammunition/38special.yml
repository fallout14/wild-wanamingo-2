# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Weapons/Guns/Ammunition/38special.yml

- type: entity
  id: MisfitsBullet38
  name: bullet (.38 special)
  parent: MisfitsBullet357
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 16 # .357 is 22

- type: entity
  id: MisfitsCartridgePistol38
  name: cartridge (.38 special)
  parent: MisfitsCartridgePistol357
  description: A lighter .38 special round. Fits any .357 magnum firearm, but hits noticeably softer.
  components:
  - type: CartridgeAmmo
    proto: MisfitsBullet38
    soundEject:
      collection: N14PistolCasingEject
  - type: Tag
    tags:
      - Cartridge
      - MisfitsCartridgePistol357
      - MisfitsCartridgePistol38

- type: entity
  parent: MisfitsBaseMagazineBox357
  id: MisfitsAmmoBox38
  name: ammunition box (.38 special)
  components:
  - type: BallisticAmmoProvider
    proto: MisfitsCartridgePistol38
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
