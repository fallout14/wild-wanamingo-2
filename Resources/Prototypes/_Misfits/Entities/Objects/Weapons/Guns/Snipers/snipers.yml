- type: entity
  name: 308 Sniper Rifle
  parent: N14WeaponRifleBase
  id: MisfitsWeaponRifle308SniperRifle
  description:  sniper rifle chambered in .308, its chamber can handle overpressured .308 ammo.
  components:
  - type: ContainerContainer  # spawn state
    containers:
      gun_magazine: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      gun_chamber: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      weapon_muzzle: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/Snipers/308SniperRifle.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Snipers/308SniperRifle.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: -44
  - type: Gun
    minAngle: 24
    maxAngle: 45
    angleIncrease: 4
    angleDecay: 16
    soundGunshot:
      collection: N14MarksmanGunshot
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MisfitsMagazineOver308RifleSniper
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MisfitsMagazineOver308RifleSnipers
            - MisfitsMagazine308RifleSnipers
      gun_chamber:
        name: Chamber
        startingItem: MisfitsCartridgeOver308Rifle
        priority: 1
        whitelist:
          tags:
            - MisfitsCartridgeOver308Rifle
            - N14Cartridge308Rifle
  - type: EyeCursorOffset
    maxOffset: 4
    pvsIncrease: 0.4
  - type: StaticPrice
    price: 175
  - type: Scope
    requireWielding: true
    zoomLevels:
    - name: 2x
      zoom: 1.2
      offset: 11
      allowMovement: false
      doAfter: 0.6
    - name: 4x
      zoom: 1.0
      offset: 15
      allowMovement: false
      doAfter: 0.8
    - name: 6x
      zoom: 0.8
      offset: 21
      allowMovement: false
      doAfter: 1.0
