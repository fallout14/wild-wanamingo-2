# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Snipers/snipers.yml

- type: entity
  name: trail carbine
  parent: N14WeaponSniperHunting
  id: MisfitsWeaponSniper357TrailCarbine
  description: A short, entry-level lever action carbine. Uses .357 magnum ammo, and will also chamber .38 special.
  components:
  - type: ItemSlots  # spawn state
  - type: ContainerContainer  # spawn state
    containers:
      ballistic-ammo: !type:Container
        ents: []
        showEnts: False
        occludes: True
      weapon_muzzle: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      weapon_optic: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: Clothing
    sprite: Misfits/Objects/Weapons/Guns/Snipers/trailcarbine.rsi
  - type: Sprite
    sprite: Misfits/Objects/Weapons/Guns/Snipers/trailcarbine.rsi
  - type: Item # Forge-Change
    size: Large # Forge-Change
  - type: Wieldable
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: -104
  - type: Gun
    minAngle: 24
    maxAngle: 105
    angleIncrease: 4
    angleDecay: 16
    fireRate: 2
    soundGunshot:
      collection: N14LeverCarbineGunshot
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - MisfitsCartridgePistol357
      - MisfitsSpeedLoaderTube357
    capacity: 10 # #Misfits Tweak - entry-level, was 12
    proto: MisfitsCartridgePistol357
  - type: EyeCursorOffset
    maxOffset: 4
    pvsIncrease: 0.4
  - type: StaticPrice
    price: 75
  - type: GunDamageModifier
    damage: # #Misfits Tweak - do not inherit the hunting rifle's sniper bonus
      types:
        Piercing: 0

- type: entity
