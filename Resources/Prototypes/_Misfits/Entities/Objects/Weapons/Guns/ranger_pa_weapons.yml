# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Weapons/Guns/ranger_pa_weapons.yml

- type: entity
  parent: F14WeaponLMG
  id: F14WeaponRangerPowerArmorLMG
  name: Ranger power armor light machine gun
  description: A power-armor-braced NCR light machine gun. Its heavy receiver and reinforced grip are intended for use in powered gauntlets.
  components:
  - type: Clothing
    sprite: Misfits/Objects/Weapons/Guns/LMGs/ranger_lmg.rsi
  - type: Sprite
    sprite: Misfits/Objects/Weapons/Guns/LMGs/ranger_lmg_icon.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: Misfits/Objects/Weapons/Guns/LMGs/ranger_lmg_icon.rsi

- type: entity
  parent: F14WeaponPistol10mm
  id: F14WeaponRangerPowerArmorPistol
  name: Ranger power armor pistol
  description: A rugged 10mm sidearm modified for NCR Ranger power armor gauntlets.
  components:
  - type: ContainerContainer  # spawn state
    containers:
      gun_magazine: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      gun_chamber: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      weapon_muzzle: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: Clothing
    sprite: Misfits/Objects/Weapons/Guns/Pistols/ranger_pistol.rsi
  - type: Sprite
    sprite: Misfits/Objects/Weapons/Guns/Pistols/ranger_pistol.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: Misfits/Objects/Weapons/Guns/Pistols/ranger_pistol.rsi
