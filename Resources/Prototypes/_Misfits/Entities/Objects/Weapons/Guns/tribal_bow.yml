# Tribal Bow

- type: entity
  parent: F14BaseBow
  id: F14TribalBow
  name: tribal bow
  description: A bone-and-sinew bow crafted using pre-war tribal techniques. Crude by Wasteland standards but surprisingly effective at close range — and completely silent.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Bow/bow.rsi # Use vanilla improv bow sprite for visual distinction cause we only got 1 fallout bow sprite rn lol

# #Misfits Add - War Bow: heavy draw weight, slower but hits harder with a higher projectile speed.

- type: entity
  parent: F14BaseBow
  id: F14TribalWarBow
  name: war bow
  description: A heavy-draw tribal war bow reinforced with braided sinew and bone laminates. Slower to fire but the arrows fly with devastating force.
  components:
  - type: Gun
    fireRate: 0.8
    projectileSpeed: 45.5
  - type: Wieldable
  - type: SpeedModifiedOnWield
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: Sprite
    color: "#e03d3d" # LEGION FLAVORED COLOR. Remove when we get a unique sprite

# #Misfits Add - Recurve Bow: lighter and faster, favored by tribal hunters for quick follow-up shots.

- type: entity
  parent: F14BaseBow
  id: F14TribalRecurveBow
  name: recurve bow
  description: A compact recurve bow with reflexed limb tips, designed for rapid shooting at the cost of raw stopping power. Popular among tribal hunters who value speed over force.
  components:
  - type: Gun
    fireRate: 1.2
    maxAngle: 5
  - type: UseDelay
    delay: .5    # Fire-rate didnt matter without this(need to draw the bow to shoot it)
  - type: Wieldable
  - type: SpeedModifiedOnWield
    walkModifier: 0.95
    sprintModifier: 0.95
