# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Weapons/Guns/SMGs/smgs.yml, Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/SMGs/smgs.yml

- type: entity
  name: Uzi
  parent: N14WeaponSMGBase
  id: MisfitsWeaponSMGUzi
  description: A compact 9mm submachine gun with a folding stock and a detachable magazine.
  components:
  - type: ContainerContainer  # spawn state
    containers:
      gun_magazine: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      gun_chamber: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      weapon_muzzle: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: FirearmAttachmentHost
    muzzleSlot:
      name: Suppressor
      priority: 3
      insertOnInteract: true
      ejectOnInteract: false
      ejectOnUse: false
      disableEject: true
      whitelist:
        components:
        - SuppressorAttachment
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/SMGs/9mmSMG.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Item # Forge-Change
    size: Large
    shape:
    - 0,0,2,1
    - 0,1,0,1
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/SMGs/9mmSMG.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    fireRate: 8.5
    soundGunshot:
      collection: N14Pistol9mmGunshot
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    minAngle: 8
    maxAngle: 24
    angleIncrease: 4
    angleDecay: 16
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Nuclear14/Weapons/Effects/Reload/SMGs/smg_cock.ogg
  - type: GunWieldBonus
    minAngle: -7
    maxAngle: -15
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: N14MagazineSMG9mm
        insertSound: /Audio/Nuclear14/Weapons/Effects/Reload/SMGs/smg_magin.ogg
        ejectSound: /Audio/Nuclear14/Weapons/Effects/Reload/SMGs/smg_magout.ogg
        whitelist:
          tags:
            - N14MagazineSMG9mm
      gun_chamber:
        name: Chamber
        startingItem: N14CartridgePistol9
        priority: 1
        whitelist:
          tags:
            - N14CartridgePistol9
  - type: StaticPrice
    price: 50

# Temporary artwork inherited from the Uzi; replace with dedicated MP5SD sprites.

- type: entity
  parent: MisfitsWeaponSMGUzi
  id: MisfitsWeaponSMGMP5SD
  name: MP5SD
  description: A 9mm submachine gun with an integral suppressor and a smooth automatic action.
  components:
  - type: ContainerContainer  # spawn state
    containers:
      gun_magazine: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      gun_chamber: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      weapon_muzzle: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: FirearmAttachmentHost
    showMuzzleVisual: false
    muzzleSlot:
      name: Integral suppressor
      startingItem: MisfitsFirearmSuppressor
      locked: true
      insertOnInteract: false
      ejectOnInteract: false
      ejectOnUse: false
      disableEject: true
  - type: Gun
    fireRate: 9
    soundGunshot:
      collection: N14PistolSpyGunshot
  - type: StaticPrice
    price: 175

# #Misfits Add - M50 Reising: cheap select-fire .45 ACP SMG, between the grease gun and the Thompson.

- type: entity
  name: M50 Reising
  parent: N14WeaponSMGBase
  id: MisfitsWeaponSMG45Reising
  description: A Reising M50, a wartime .45 ACP submachine gun built cheaply on a wooden stock. Faster than a grease gun but nowhere near a Thompson, and it can be switched to single shots.
  components:
  - type: Clothing
    sprite: Misfits/Objects/Weapons/Guns/SMGs/reising.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Item
    size: Large
    shape:
    - 0,0,2,1
    - 0,1,0,1
  - type: Sprite
    sprite: Misfits/Objects/Weapons/Guns/SMGs/reising.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    fireRate: 9 # ~540 rpm
    soundGunshot:
      collection: N1445SMGGunshot
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    - SemiAuto
    minAngle: 9
    maxAngle: 30
    angleIncrease: 5
    angleDecay: 16
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Nuclear14/Weapons/Effects/Reload/SMGs/smg_cock.ogg
  - type: GunWieldBonus
    minAngle: -7
    maxAngle: -15
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: N14Magazine45SubMachineGun
        insertSound: /Audio/Nuclear14/Weapons/Effects/Reload/SMGs/smg_magin.ogg
        ejectSound: /Audio/Nuclear14/Weapons/Effects/Reload/SMGs/smg_magout.ogg
        priority: 2 # eject beats the fire-mode toggle on alt-click; with no magazine, alt-click switches fire mode
        whitelist:
          tags:
            - N14Magazine45SubMachineGun
      gun_chamber:
        name: Chamber
        startingItem: N14CartridgePistol45
        priority: 1
        whitelist:
          tags:
            - N14CartridgePistol45
  - type: StaticPrice
    price: 60

