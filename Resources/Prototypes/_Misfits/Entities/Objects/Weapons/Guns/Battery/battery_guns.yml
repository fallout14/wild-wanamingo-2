- type: entity
  name: Tesla Cannon
  parent: N14BaseWeaponPowerCell
  id: MisfitsWeaponTeslaCannon
  description: A shoulder-mounted heavy energy weapon that fires arcing electrical discharge. Devastating against groups and anything mechanical. Slow to cycle, impossible to misidentify. Brotherhood of Steel heavy ordnance — not commonly seen in the field.
  components:
  - type: BatteryAmmoProvider
    proto: TeslaGunBullet
    fireCost: 250
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Battery/teslacannon.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/Battery/teslacannon.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Power Cell
        startingItem: MisfitsTeslaElectronChargePack #Misfits Change — use tesla cell so cannon fires energy ball projectile
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - N14PowerCellAdvanced
  - type: Item
    size: Huge
    shape:
    - 0,0,3,1
    - 0,2,0,2
  - type: Wieldable
  - type: SpeedModifiedOnWield
    walkModifier: 0.7
