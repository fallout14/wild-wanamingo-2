- type: entity
  name: laser RCW
  parent: N14BaseWeaponPowerCell
  id: MisfitsWeaponLaserRCW
  description: A rapid-cycling Electron laser weapon with the silhouette of a submachine gun. Designed for close-quarters energy weapon deployment. Inaccurate and battery-hungry, but capable of sustained continuous fire.
  components:
  - type: BatteryAmmoProvider
    proto: N14RCWLaserGreen
    fireCost: 50
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Battery/laserrcw.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/Battery/laserrcw.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Power Cell
        startingItem: MisfitsElectronChargePack
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - MisfitsElectronChargePack
  - type: Item
    size: Large
    shape:
    - 0,0,2,1
    - 0,1,0,1
  - type: Wieldable
  - type: GunWieldBonus
    minAngle: -7 # #Misfits Tweak - wielded spread 1°/5°; rapid-fire weapons keep 1° minimum
    maxAngle: -20
  - type: Gun
    fireRate: 5 #Misfits Change — reduced from 8; RCW is rapid-cycling and accurate. But not as fast as a rotating barrel like the AER-9 auto
    minAngle: 8
    maxAngle: 25
    angleIncrease: 4
    angleDecay: 14
    selectedMode: Fullauto
    availableModes:
    - Fullauto
    soundGunshot:
      collection: N14LaserAutoRifleGunshot
  # Weapon profile controls damage and beam color; ECP supplies charge.

