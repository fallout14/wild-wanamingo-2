# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Battery/battery_guns.yml

- type: entity
  name: AER-12 laser rifle
  parent: N14BaseWeaponPowerCellMedium
  id: MisfitsWeaponLaserRifleAER12
  description: An advanced pre-war laser rifle featuring upgraded orange-spectrum focusing optics. Higher rate of fire and slightly increased damage over the standard AER-9.
  components:
  - type: BatteryAmmoProvider
    proto: N14MFLaserAmber
    fireCost: 50
  - type: Wieldable
  - type: GunWieldBonus
    minAngle: -25 # #Misfits Tweak - wielded spread 0°/10° post-wield
    maxAngle: -45
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Battery/laser_autorifle.rsi # Reuses AER-9 Auto sprite until dedicated AER-12 art is available
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/Battery/laser_autorifle.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MisfitsMicrofusionCellRed
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - MisfitsMicrofusionCell
  - type: Gun
    minAngle: 25
    maxAngle: 55
    fireRate: 4 # Higher ROF than AER-9 (2.5); reflects advanced pre-war engineering
    soundGunshot:
      collection: N14LaserAutoRifleGunshot
    selectedMode: FullAuto
    availableModes:
    - FullAuto
  # Weapon profile controls damage and beam color; MFC supplies charge.

- type: entity
  name: AER-15 laser rifle
  parent: N14BaseWeaponPowerCellMedium
  id: MisfitsWeaponLaserRifleAER15
  description: The pinnacle of pre-war laser rifle technology. Experimental violet-spectrum focusing crystals produce exceptional damage output with unmatched precision. Extremely rare — only a handful survived the war, and the manufacturing knowledge is lost.
  components:
  - type: BatteryAmmoProvider
    proto: N14MFLaserViolet
    fireCost: 50
  - type: Wieldable
  - type: GunWieldBonus
    minAngle: -25 # #Misfits Tweak - wielded spread 0°/2°; best accuracy, 0° min for rifles
    maxAngle: -58
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Battery/laser_rifle_proto.rsi # Reuses AER-14 prototype sprite until dedicated AER-15 art is available
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/Battery/laser_rifle_proto.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MisfitsMicrofusionCellRed
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - MisfitsMicrofusionCell
  - type: Gun
    fireRate: 2.5 # Low ROF compensates for highest damage output
    soundGunshot:
      collection: N14LaserAutoRifleGunshot
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  # Weapon profile controls damage and beam color; MFC supplies charge.

- type: entity
  name: multiplas
  parent: N14BaseWeaponPowerCellMedium
  id: MisfitsWeaponPlasmaMultiplas
  description: A modified urban plasma rifle, it sacrifices accuracy to instead spread the plasma into multiple projectiles.
  components:
  - type: BatteryAmmoProvider
    proto: MisfitsBulletPlasmaSpread
    fireCost: 200
  - type: Wieldable
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: -56
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Battery/multiplas.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/Battery/multiplas.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MisfitsMicrofusionCellGreen # #Misfits Change - plasma weapons run on standard cells
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - MisfitsMicrofusionCell
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Gun
    fireRate: 1 # #Misfits Tweak - reduced from 6; shotgun pacing (1 spread burst per 0.5s) THIS THING EATS PEOPLE ALIVE
    soundGunshot:
      collection: N14MultiplasGunshot
    selectedMode: SemiAuto # #Misfits Fix - was Burst; Multiplas fires multiple bolts simultaneously like a shotgun
    availableModes:
     - SemiAuto
  - type: EyeCursorOffset
    maxOffset: 2
    pvsIncrease: 0.2
  - type: StaticPrice
    price: 225
  # #Misfits Change - fires plasma spread from a microfusion cell; 1200 / 200 = 6 shots, same as a multiplas cartridge

