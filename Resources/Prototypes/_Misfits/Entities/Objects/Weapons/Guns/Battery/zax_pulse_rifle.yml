# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Weapons/Guns/Battery/zax_pulse_rifle.yml

- type: entity
  name: Z.A.X pulse rifle
  parent: F14BaseWeaponPowerCell
  id: F14WeaponZAXPulseRifle
  description: A C-27-only pulse rifle tuned for Z.A.X-linked chassis targeting arrays. Its blue emitter pulse punches through armor, fries circuits, and bites into structures.
  components:
  - type: BatteryAmmoProvider
    proto: F14ZAXPulseBlue
    fireCost: 40
  - type: Sprite
    sprite: Misfits/Objects/Weapons/Guns/Battery/zax_pulse_rifle.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: Misfits/Objects/Weapons/Guns/Battery/zax_pulse_rifle.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Electron Charge Pack
        startingItem: F14ElectronChargePack
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
          - F14ElectronChargePack
  - type: Item
    size: Large
    shape:
    - 0,0,2,1
    - 0,2,0,2
  - type: Wieldable
  - type: GunWieldBonus
    minAngle: -18
    maxAngle: -55
  - type: Gun
    fireRate: 2.5
    minAngle: 18
    maxAngle: 55
    angleIncrease: 2
    angleDecay: 14
    soundGunshot:
      collection: F14LaserAutoRifleGunshot
