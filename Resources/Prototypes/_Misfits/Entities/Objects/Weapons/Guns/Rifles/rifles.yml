# SVT-40 — Legion semi-auto battle rifle with ten internal rounds.

- type: entity
  name: SVT-40
  parent: BaseWeaponSniper
  id: MisfitsWeaponRifle308SVT40
  description: An old hunting rifle taken from discovered stockpiles and refurbished in Legion workshops. The standard heavy rifle of the Legion, still rare. An SVT-40 rebuilt for .308 ammunition, semi-auto only, with a fixed internal 10-round magazine and a mount for an optional scope.
  components:
  - type: ItemSlots  # spawn state
  - type: ContainerContainer  # spawn state
    containers:
      ballistic-ammo: !type:Container
        ents: []
        showEnts: False
        occludes: True
      weapon_muzzle: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      weapon_optic: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: Item
    size: Large
  - type: Wieldable
  - type: SpeedModifiedOnWield
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: EyeCursorOffset
    maxOffset: 3
    pvsIncrease: 0.3
  - type: FirearmAttachmentHost
    enableOpticSlot: true
    opticVisualState: svt_scope
    opticVisualOffset: 0.09375, 0.34375
    opticSlot:
      name: Optic
      priority: 4
      insertOnInteract: true
      ejectOnInteract: false
      ejectOnUse: false
      disableEject: true
      whitelist:
        tags:
        - N14RifleScope
    muzzleSlot:
      name: Muzzle attachment
      locked: false
      priority: 3
      insertOnInteract: true
      ejectOnInteract: false
      ejectOnUse: false
      disableEject: true
      whitelist:
        tags: []
        requireAll: false
        components:
        - BayonetAttachment
    bayonetVisualOffset: 0.8125, 0.78125
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/Snipers/hunting.rsi # #Misfits Tweak: hunting rifle RSI back-slot placeholder — sks.rsi equipped-BACKPACK state is not suitable
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Rifles/sks.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: -56
  - type: Gun
    minAngle: 24
    maxAngle: 60
    angleIncrease: 4
    angleDecay: 16
    fireRate: 2.5 # #Misfits Tweak - DMR pace, was 3
    soundGunshot:
      collection: MisfitsGarandGunshot
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
