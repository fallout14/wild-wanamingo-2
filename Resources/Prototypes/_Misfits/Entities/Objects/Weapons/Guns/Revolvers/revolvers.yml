# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Weapons/Guns/Revolvers/revolvers.yml, Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Revolvers/revolvers.yml

- type: entity
  name: snub .44
  parent: N14WeaponRevolverBase
  id: MisfitsWeaponRevolver44Snub
  description: A magnum revolver with its barrel cut down to a stub. Easy to hide and brutal up close, but it loses its punch quickly with distance. Uses .44 magnum ammo.
  components:
  - type: Tag
    tags:
    - Sidearm
  - type: Sprite
    sprite: Misfits/Objects/Weapons/Guns/Revolvers/snub44.rsi
  - type: Clothing
    sprite: Misfits/Objects/Weapons/Guns/Revolvers/snub44.rsi
  - type: Item
    size: Small
    shape:
    - 0,0,0,1
    - 0,0,0,1
  - type: RevolverAmmoProvider
    whitelist:
      tags:
        - N14Cartridge44Magnum
        - N14SpeedLoader44
    proto: N14Cartridge44Magnum
  - type: Gun
    minAngle: 2
    maxAngle: 9
    angleIncrease: 1.5
    angleDecay: 5
    fireRate: 2
    soundGunshot:
      collection: N14RevolverMagnunGunshot
  - type: GunDamageFalloffOverride # short barrel
    falloffStartTiles: 5
    maxFalloffTiles: 10
    minDamageMultiplier: 0.45
  - type: StaticPrice
    price: 60

