- type: entity
  name: magnum revolver
  parent: N14WeaponRevolverBase
  id: MisfitsWeaponRevolver44Magnum
  description: The Big Iron. Uses .44 magnum ammo.
  components:
  - type: ItemSlots  # spawn state
  - type: ContainerContainer  # spawn state
    containers:
      revolver-ammo: !type:Container
        ents: []
        showEnts: False
        occludes: True
      weapon_muzzle: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      weapon_optic: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: Wieldable
  - type: FirearmAttachmentHost
    enableOpticSlot: true
    opticSlot:
      name: Optic
      priority: 4
      insertOnInteract: true
      ejectOnInteract: false
      ejectOnUse: false
      disableEject: true
      whitelist:
        tags:
        - N14RifleScope
    muzzleSlot:
      locked: true
    opticVisualState: revolver_scope
    opticVisualOffset: 0.21875, 0.6875
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Revolvers/magnum.rsi
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/Revolvers/magnum.rsi
  - type: RevolverAmmoProvider
    whitelist:
      tags:
        - N14Cartridge44Magnum
        - N14SpeedLoader44
    proto: N14Cartridge44Magnum
  - type: Gun
    soundGunshot:
      collection: N14RevolverMagnunGunshot
  - type: StaticPrice
    price: 50

