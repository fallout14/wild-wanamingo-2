# #Misfits Add - Police Pistol, after the Fallout: New Vegas pocket .357.
# Reuses the DeltaV K-38 Masterpiece sprite (WeaponRevolverK38MasterNonlethalSecurity).

- type: entity
  name: police pistol
  parent: N14WeaponRevolverBase
  id: MisfitsWeaponRevolver357Police
  description: A pre-war police service revolver cut down into a potent pocket pistol. Hits harder than its size suggests. Uses .357 magnum ammo, and will also chamber .38 special.
  components:
  - type: Tag
    tags:
    - Sidearm
  - type: Sprite
    sprite: Misfits/Legacy/DeltaV/Objects/Weapons/Guns/Revolvers/k38master.rsi
  - type: Clothing
    sprite: Misfits/Legacy/DeltaV/Objects/Weapons/Guns/Revolvers/k38master.rsi
    slots: # k38master.rsi only has a belt equip sprite
    - Belt
    - suitStorage
  - type: RevolverAmmoProvider
    whitelist:
      tags:
        - MisfitsCartridgePistol357
        - MisfitsSpeedLoader357
    proto: MisfitsCartridgePistol357
    capacity: 6
  - type: Item
    size: Small
    shape:
    - 0,0,0,1
    - 0,0,0,1
  - type: GunDamageModifier
    damage:
      types:
        Piercing: 4
  - type: Gun
    minAngle: 1
    maxAngle: 6
    angleIncrease: 0.5
    angleDecay: 5
    fireRate: 3.5
    soundGunshot:
      collection: N14RevolverMagnunGunshot
  - type: StaticPrice
    price: 150
