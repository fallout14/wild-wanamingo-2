# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Weapons/scope_items.yml

- type: entity
  parent: BaseItem
  id: F14Binoculars
  name: binoculars
  description: A pair of pre-war binoculars. Wield them with two hands and look through to see far in one direction.
  components:
  - type: Item
    size: Small
    heldPrefix: binoculars
  - type: Sprite
    sprite: Misfits/Objects/Devices/binoculars.rsi
    state: binoculars_civ
  - type: Clothing
    quickEquip: false
    slots:
    - Belt
    - suitstorage
  - type: Wieldable # WW Change - Wizden binoculars
    wieldedInhandPrefix: binoculars # the RSI only has the binoculars in-hands: wield and the view follows your cursor (was the Misfits scope toggle)
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 10
    pvsIncrease: 0.4
  - type: StaticPrice
    price: 100
  # #Misfits Removed - Binoculars TagPrototype not defined in Nuclear-14
  # - type: Tag
  #   tags:
  #   - Binoculars

# Rifle scopes: put one in a gun's optic slot, wield the gun, and the view follows your cursor. Higher magnification
# reaches further (2 tiles per 1x). WW Change - was the Misfits toggle-and-zoom scope action.

- type: entity
  parent: BaseItem
  id: F14WeaponScopeAttachment
  name: 4x rifle scope
  description: A fixed-magnification rifle optic. Attach it to a compatible weapon and wield it to look further ahead.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/crafting_junk.rsi
    state: scope
  - type: WWScope # WW Change - Wizden-style wield-to-look-ahead (was the Misfits scope toggle)
    magnifications: [ 4 ]
  - type: Tag
    tags:
    - F14RifleScope
  - type: StaticPrice
    price: 100

- type: entity
  parent: F14WeaponScopeAttachment
  id: F14WeaponScopeVariable
  name: variable rifle scope
  description: A variable-power rifle optic. Alt-click (or right-click the gun) to switch between 2x, 4x and 6x.
  components:
  - type: WWScope # WW Change - Wizden-style wield-to-look-ahead (was the Misfits scope toggle)
    magnifications: [ 2, 4, 6 ]
  - type: StaticPrice
    price: 200

- type: entity
  parent: F14WeaponScopeAttachment
  id: F14WeaponScopeNightVision
  name: night vision rifle scope
  description: An amplified-light optic that automatically engages night vision while scoped.
  components:
  - type: StaticPrice
    price: 350

- type: entity
  parent: F14WeaponScopeAttachment
  id: F14WeaponScopeThermal
  name: thermal rifle scope
  description: An advanced heat-detecting optic that automatically engages thermal vision while scoped.
  components:
  - type: StaticPrice
    price: 600

