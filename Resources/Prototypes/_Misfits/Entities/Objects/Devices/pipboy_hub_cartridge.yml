# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Devices/pipboy_hub_cartridge.yml

- type: entity
  parent: BaseItem
  id: F14PipBoyContactsCartridge
  name: Pip-Boy contacts cartridge
  description: Manage Pip-Boy contacts, send messages, and broadcast SOS beacons.
  components:
  - type: Sprite
    sprite: Misfits/Legacy/DeltaV/Objects/Devices/cartridge.rsi
    state: cart-chat
  - type: Icon
    sprite: Misfits/Legacy/DeltaV/Objects/Devices/cartridge.rsi
    state: cart-chat
  - type: UIFragment
    ui: !type:PipBoyContactsUi
  - type: Cartridge
    programName: pipboy-contacts-program-name
    icon:
      sprite: MojaveSun/Objects/Devices/pipboy.rsi
      state: pda
  - type: PipBoyHubCartridge

