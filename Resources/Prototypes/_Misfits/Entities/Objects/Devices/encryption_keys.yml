# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Objects/Devices/encryption_keys.yml

- type: entity
  parent: EncryptionKey
  id: MisfitsEncryptionKeyBrotherhoodOfSteel
  name: Brotherhood encryption key
  description: An encryption key used by the Brotherhood of Steel.
  components:
  - type: EncryptionKey
    channels:
    - MisfitsBrotherhoodOfSteel
    defaultChannel: MisfitsBrotherhoodOfSteel
  - type: Sprite
    layers:
    - state: crypt_silver
    - state: common_label

- type: entity
  parent: EncryptionKey
  id: MisfitsEncryptionKeyOSI
  name: OSI encryption key
  description: An encryption key for NCR Office of Science and Industry personnel.
  components:
  - type: EncryptionKey
    channels:
    - MisfitsOSI
    defaultChannel: MisfitsOSI
  - type: Sprite
    sprite: Misfits/Legacy/Objects/Devices/encryption_keys.rsi
    layers:
    - state: crypt_gray
    - state: rd_label

- type: entity
  parent: EncryptionKey
  id: MisfitsEncryptionKeyNCRRangers
  name: NCR Ranger encryption key
  description: An encryption key for NCR Ranger field traffic.
  components:
  - type: EncryptionKey
    channels:
    - MisfitsNCRRangers
    defaultChannel: MisfitsNCRRangers
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: sec_label

- type: entity
  parent: EncryptionKey
  id: MisfitsEncryptionKeyLegion
  name: Legion encryption key
  description: An encryption key used by Caesar's Legion.
  components:
  - type: EncryptionKey
    channels:
    - MisfitsLegion
    defaultChannel: MisfitsLegion
  - type: Sprite
    layers:
    - state: crypt_red
    - state: synd_label

