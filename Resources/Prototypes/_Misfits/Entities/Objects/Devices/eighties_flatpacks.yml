# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Devices/eighties_flatpacks.yml

- type: entity
  parent: BaseFlatpack
  id: F14EightiesGreenMotorbikeFlatpack
  name: green motorbike flatpack
  description: A flatpack used by the Eighties to unpack a green motorbike.
  components:
  - type: FlatpackExtras
    entities:
    - F14VehicleKeyMotorbike
  - type: Flatpack
    entity: F14VehicleBikeGreen
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#8a5a2b"
      map: ["enum.FlatpackVisualLayers.Overlay"]
    - state: icon-default
  - type: StaticPrice
    price: 1500

