# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Consumable/Drinks/zoy.yml

- type: entity
  parent: [F14DrinkGlassVisualsOpenable, F14DrinkBottleBaseFull50]
  id: F14DrinkZoyMilk
  name: zoy milk
  description: A glass bottle of zoy milk.
  components:
  - type: MolotovConvertible
    wickOffset: "0,-0.0625" # Match the Nuclear 14 milk bottles.
  - type: Solution
    id: drink
    solution:
      maxVol: 50
      reagents:
      - ReagentId: F14MilkZoy
        Quantity: 50
  - type: Sprite
    sprite: Nuclear14/Objects/Consumable/Drinks/milk.rsi
    layers:
    - state: icon
      map: ["enum.OpenableVisuals.Layer"]
    - state: fill1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: fill
