# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Objects/Consumable/Food/meat.yml

- type: entity
  name: raw human meat
  parent: [N14FoodMeatBase, BaseSlicingRefinableFood]
  id: MisfitsFoodMeatHuman
  description: Whoever this came from had a really bad day.
  components:
  - type: Tag
    tags:
    - Raw
  - type: Sprite
    scale: 1, 1
    sprite: Objects/Consumable/Food/meat.rsi
    state: plain
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 3
      - ReagentId: UncookedAnimalProteins
        Quantity: 6
  - type: FlavorProfile # tastes meaty, and like people...
    flavors:
    - meaty
    - people
  - type: ToolRefinable
    refineResult:
    - id: MisfitsFoodMeatHumanCutlet
      amount: 3
  - type: Construction
    graph: MisfitsHumanMeatSteak # misfits add; human meat steaks :)
    node: start
    defaultTarget: human meat steak

- type: entity
  name: raw supermutant meat
  parent: [N14FoodMeatBase, BaseSlicingRefinableFood]
  id: MisfitsFoodMeatSupermutant
  description: You'd have to be brave or stupid to eat this.
  components:
  - type: Tag
    tags:
    - Raw
  - type: Sprite
    scale: 1, 1
    sprite: Misfits/Objects/Consumable/Food/Meat/supermutant.rsi
    state: supermutantmeat-raw
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 3
      - ReagentId: N14UncookedAnimalProteinsRad
        Quantity: 9
  - type: FlavorProfile # tastes meaty, and like people...
    flavors:
    - meaty
    - people
  - type: ToolRefinable
    refineResult:
    - id: MisfitsFoodMeatSupermutantCutlet
      amount: 3
  - type: Construction
    graph: MisfitsSupermutantMeatSteak # misfits add; supermutant steaks :)
    node: start
    defaultTarget: supermutant meat steak

- type: entity
  parent: FoodMeatFish
  id: MisfitsFoodMeatFish

- type: entity
  name: raw human cutlet
  parent: N14FoodMeatBase
  id: MisfitsFoodMeatHumanCutlet
  description: A raw meat cutlet from some unlucky bastard.
  components:
  - type: Tag
    tags:
    - Raw
    - Cutlet
  - type: Sprite
    scale: 1, 1
    sprite: Objects/Consumable/Food/meat.rsi
    state: cutlet
  - type: FlavorProfile # tastes meaty, and like people...
    flavors:
    - meaty
    - people
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 1
      - ReagentId: UncookedAnimalProteins
        Quantity: 2
  - type: Temperature
  - type: InternalTemperature
    conductance: 0.43
  - type: Perishable
    # raw meat rots in 15 minutes, get it into the freezer fast or preserve it.
    rotAfter: 900
    # don't want meat giving off ammonia only bodies
    molsPerSecondPerUnitMass: 0
  - type: Construction
    graph: MisfitsHumanMeatCutlet
    node: start
    defaultTarget: human meat cutlet

- type: entity
  name: raw supermutant cutlet
  parent: N14FoodMeatBase
  id: MisfitsFoodMeatSupermutantCutlet
  description: A tough cutlet from a Supermutant, feels leathery...
  components:
  - type: Tag
    tags:
    - Raw
    - Cutlet
  - type: Sprite
    scale: 1, 1
    sprite: Misfits/Objects/Consumable/Food/Meat/supermutant.rsi
    state: supermutantcutlet-raw
  - type: FlavorProfile # tastes meaty, and like people...
    flavors:
    - meaty
    - people
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 1
      - ReagentId: N14UncookedAnimalProteinsRad
        Quantity: 3
  - type: Temperature
  - type: InternalTemperature
    conductance: 0.43
  - type: Perishable
    # raw meat rots in 15 minutes, get it into the freezer fast or preserve it.
    rotAfter: 900
    # don't want meat giving off ammonia only bodies
    molsPerSecondPerUnitMass: 0
  - type: Construction
    graph: MisfitsSupermutantMeatCutlet
    node: start
    defaultTarget: supermutant meat cutlet

# Cooked

- type: entity
  name: cooked human cutlet
  parent: N14FoodMeatBase
  id: MisfitsFoodMeatHumanCutletCooked
  description: Bacon! Wait, not quite...
  components:
  - type: Tag
    tags:
    - Cooked
    - Cutlet
  - type: FlavorProfile # tastes meaty, oily, and like people
    flavors:
    - meaty
    - oily
    - people
  - type: Sprite
    scale: 1, 1
    sprite: Objects/Consumable/Food/meat.rsi
    state: cutlet-cooked
  - type: Solution
    solution:
      maxVol: 8
      reagents:
      - ReagentId: Nutriment
        Quantity: 1
      - ReagentId: Protein
        Quantity: 2
  - type: Construction
    graph: MisfitsHumanMeatCutlet
    node: human meat cutlet
    defaultTarget: null
  - type: StaticPrice
    price: 1

- type: entity
  name: cooked human meat
  parent: N14FoodMeatBase
  id: MisfitsFoodMeatHumanCooked
  description: Good with some wine, if you have no moral compass.
  components:
  - type: Tag
    tags:
    - Cooked
  - type: Sprite
    scale: 1, 1
    sprite: Objects/Consumable/Food/meat.rsi
    state: plain-cooked
  - type: Construction
    graph: MisfitsHumanMeatSteak
    node: human meat steak
    defaultTarget: null
  - type: FlavorProfile # tastes meaty, oily, and like people
    flavors:
    - meaty
    - oily
    - people
  - type: Solution
    solution:
      maxVol: 19
      reagents:
      - ReagentId: Nutriment
        Quantity: 3
      - ReagentId: Protein
        Quantity: 6
  - type: StaticPrice
    price: 1

- type: entity
  name: cooked supermutant cutlet
  parent: N14FoodMeatBase
  id: MisfitsFoodMeatSupermutantCutletCooked
  description: Arguably closer to leather than meat after being cooked.
  components:
  - type: Tag
    tags:
    - Cooked
    - Cutlet
  - type: FlavorProfile # tastes meaty, and like people. supermutants are a lean meat! no fat!
    flavors:
    - meaty
    - people
  - type: Sprite
    scale: 1, 1
    sprite: Misfits/Objects/Consumable/Food/Meat/supermutant.rsi
    state: supermutantcutlet-cooked
  - type: Solution
    solution:
      maxVol: 8
      reagents:
      - ReagentId: Nutriment
        Quantity: 1
      - ReagentId: Protein
        Quantity: 3
  - type: Construction
    graph: MisfitsSupermutantMeatCutlet
    node: supermutant meat cutlet
    defaultTarget: null
  - type: StaticPrice
    price: 1

- type: entity
  name: cooked supermutant meat
  parent: N14FoodMeatBase
  id: MisfitsFoodMeatSupermutantCooked
  description: It's super meat, boy!
  components:
  - type: Tag
    tags:
    - Cooked
  - type: Sprite
    scale: 1, 1
    sprite: Misfits/Objects/Consumable/Food/Meat/supermutant.rsi
    state: supermutantmeat-cooked
  - type: Construction
    graph: MisfitsSupermutantMeatSteak
    node: supermutant meat steak
    defaultTarget: null
  - type: FlavorProfile # tastes meaty, and like people. supermutants are a lean meat! no fat!
    flavors:
    - meaty
    - people
  - type: Solution
    solution:
      maxVol: 22
      reagents:
      - ReagentId: Nutriment
        Quantity: 3
      - ReagentId: Protein
        Quantity: 9
  - type: StaticPrice
