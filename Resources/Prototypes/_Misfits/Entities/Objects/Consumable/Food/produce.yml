    solution:
      maxVol: 4
      reagents:
      - ReagentId: Nutriment
        Quantity: 4
  - type: Produce
    plantId: zoybean
  - type: Seed
    plantId: zoybean
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: MisfitsMilkZoy
        Quantity: 10
  - type: Tag
    tags:
    - Vegetable
  - type: FlavorProfile
    flavors:
    - MisfitsZoy
  - type: Stack
    stackType: MisfitsZoyBeans
    count: 1
