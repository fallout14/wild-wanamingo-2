# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Objects/Consumable/Food/skewer.yml

- type: entity
  name: meat kebab
  parent: FoodKebabSkewer
  id: F14CookedFoodMeatKebab
  description: Three chunks of wasteland meat on a skewer.
  components:
  - type: Edible
    edible: Food
    trash:
    - FoodKebabSkewer
  - type: FlavorProfile
    flavors:
    - meaty
  - type: Sprite
    sprite: Misfits/Legacy/Objects/Consumable/Food/skewer.rsi
    layers:
    - state: skewer
    - state: skewer-meat
    # #Misfits Fix - removed greyscale alpha overlay and empty foodSequenceLayers map;
    # those are for dynamically assembled food sequences, not pre-made static kebabs
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 12
      - ReagentId: Protein
        Quantity: 6
      - ReagentId: Vitamin
        Quantity: 2
  - type: Tag
    tags:
    - Meat

# Merged 2026-11-28 from the Misfits Legacy copy of Wizden's snake kebab (was F14FoodMeatSnakeKebabLegacy).
- type: entity
  name: snake kebab
  parent: FoodKebabSkewer
  id: F14FoodMeatSnakeKebab
  description: Snake meat on a stick. It's a little tough.
  components:
  - type: Edible
    edible: Food
    trash:
    - FoodKebabSkewer # Misfits Change /Fix/: eating a cooked kebab should leave a reusable plain skewer behind.
  - type: Sprite
    sprite: Misfits/Legacy/Objects/Consumable/Food/skewer.rsi
    layers:
      - state: skewer
      - state: skewer-snake
      - map: ["foodSequenceLayers"] # Misfits Change: added layer map so dynamically added food elements display their sprites
  - type: Solution
    solution:
      canReact: false # Dont want cause reactions inside skewers after merging ingredients
      maxVol: 0
  - type: FoodSequenceStartPoint
    key: Skewer
    maxLayers: 4
    startPosition: -0.27, -0.19
    inverseLayers: true 
    offset: 0.2, 0.1
    nameGeneration: food-sequence-skewer-gen
    contentSeparator: ", "
    allowHorizontalFlip: false
