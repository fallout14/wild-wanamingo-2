  - type: FlavorProfile
    flavors:
    - bun
    - people
  - type: Sprite
    state: human
  - type: Solution
    solution:
      maxVol: 23
      reagents:
      - ReagentId: Nutriment
        Quantity: 2
      - ReagentId: Protein
        Quantity: 6
      - ReagentId: Vitamin
        Quantity: 5
  - type: Tag
    tags:
    - Meat

