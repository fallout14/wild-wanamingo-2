# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Consumable/Food/rations.yml

- type: entity
  parent: BaseStorageItem
  id: F14CigarettePackRation
  name: ration cigarettes
  description: A small waxed-cardboard pack of four cigarettes, packed as part of a military combat ration.
  components:
  - type: Sprite
    sprite: Misfits/Objects/Consumable/Food/Rations/ration_cigarettes.rsi
    layers:
    - state: closed
    - state: open-4
      map: ["openLayer"]
      visible: false
  # Opaque counter: swaps the open sprite to show how many cigarettes remain.
  # Storage hides it while closed, so the sealed pack shows unless someone is looking inside.
  - type: ItemCounter
    count:
      tags: [Cigarette]
    amount: 4
    composite: false
    baseLayer: openLayer
    layerStates:
    - open-0
    - open-1
    - open-2
    - open-3
    - open-4
  - type: Appearance
  - type: Item
    sprite: Nuclear14/Objects/Consumable/Smokeables/Packs/winston.rsi
    size: Tiny
    shape:
    - 0,0,0,1
  - type: Storage
    grid:
    - 0,0,1,1
    whitelist:
      tags:
      - Cigarette
  - type: StorageFill
    contents:
    - id: F14Cigarette
      amount: 4
  - type: Tag
    tags:
    - CigPack
    - Trash
  - type: PhysicalComposition
    materialComposition:
      Cardboard: 10
  - type: StaticPrice
    price: 3

# Ration condiment tubes
# Standard single-serving tube issued in ration packs.

- type: entity
  parent: BaseFoodCondimentPacket
  id: F14FoodCondimentRationTubeBase
  name: ration condiment tube
  abstract: true
  description: A small foil tube of condiment packed into a military combat ration.
  components:
  - type: Sprite
    sprite: Misfits/Objects/Consumable/Food/Rations/condiment_tube.rsi
    layers:
    - state: icon
      map: ["enum.OpenableVisuals.Layer"]
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "icon"}
          False: {state: "icon"}
  - type: Icon
    sprite: Misfits/Objects/Consumable/Food/Rations/condiment_tube.rsi
    state: icon

- type: entity
  parent: F14FoodCondimentRationTubeBase
  id: F14FoodCondimentRationTubeKetchup
  name: ration ketchup
  description: A small foil tube of ketchup packed into a military combat ration.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Ketchup
        Quantity: 10

