    sprite: Nuclear14/Objects/Misc/kits.rsi
    state: rifleman
  - type: Item
    size: Huge
  - type: SpawnItemsOnUse
    items:
      - id: N14WeaponShotgunBlowback
      - id: MisfitsMagazineBox12GaugeBeanbag
      - id: BoxHandcuff
