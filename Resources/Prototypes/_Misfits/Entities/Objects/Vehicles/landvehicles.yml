- type: entity
  id: MisfitsVehicleBuggy
  parent: GoobstationBaseVehicle
  name: buggy
  description: Riding in my car after a beer, hey is that bump shaped like a jetfiend?.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Vehicles/bikesbuggy.rsi
    layers:
    - state: buggy_dune
    noRot: true
  - type: VehicleDrawOver
    renderOver: None
    overlayPrototype: MisfitsVehicleBuggyOverlay
  - type: VehicleHandBlocker
    blockedHands: 2
  - type: MovementSpeedModifier
    acceleration: 6
    friction: 0.1
    baseWalkSpeed: 4
    baseSprintSpeed: 8
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      requireAll: true
      tags:
      - MisfitsVehicleKey
      - MisfitsMotorbikeKeys
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
        whitelist:
          requireAll: true
          tags:
          - MisfitsVehicleKey
          - MisfitsMotorbikeKeys
        insertSound:
          path: /Audio/Effects/Vehicle/vehiclestartup.ogg
          params:
            volume: -3
  - type: ContainerContainer
    containers:
      crate_storage: !type:Container
