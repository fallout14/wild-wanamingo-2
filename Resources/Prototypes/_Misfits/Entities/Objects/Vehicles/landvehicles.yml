    sound: "/Audio/Nuclear14/Effects/motorcycle2.ogg"
    range: 10
    volume: -10
    enabled: false
  - type: Sprite
    layers:
    - state: bike_flamy2
      map: ["enum.VehicleVisualLayers.AutoAnimate"]
  - type: VehicleDrawOver
    renderOver: None
    overlayPrototype: MisfitsVehicleBikeFlameyOverlay

