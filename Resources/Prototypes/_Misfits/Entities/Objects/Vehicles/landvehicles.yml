# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Objects/Vehicles/landvehicles.yml

- type: entity
  parent: GoobstationBaseVehicle
  id: MisfitsVehicleBikeGreen
  name: green motorbike
  description: A clean green motorbike.
  components:
  - type: Motorbike
  - type: Damageable
    # #Cythisiax Fixed - was Inorganic, which ignored Structural/Caustic/Radiation damage and made motorbikes take zero damage from plasma (BulletPlasma deals Caustic + Radiation + Structural). StructuralInorganic matches the windows.yml fix.
    damageModifierSet: Motorbike
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 15
    qualityNeeded: Welding
  - type: Destructible
    thresholds: []
  - type: ExplosionResistance
    worn: false
    damageCoefficient: 1.1
  - type: Solution
    id: motorbikeFuel
    solution:
      maxVol: 200
  - type: ExaminableSolution
    solution: motorbikeFuel
  - type: Strap
    # #Misfits Change - vehicle riding requires the shared riding perk instead of any humanoid.
    whitelist:
      requireAll: true
      components:
      - HumanoidProfile
    # #Misfits Fix - Super Mutants and Power Armor wearers are too heavy to ride motorbikes
    blacklist:
      tags:
      - MisfitsCannotRide
      components:
      - PowerArmorWorn
  - type: Sprite
    sprite: Nuclear14/Objects/Vehicles/bikesbuggy.rsi
    layers:
    - state: bike_green
      map: ["enum.VehicleVisualLayers.AutoAnimate"]
    netsync: false
    noRot: true
  - type: MovementSpeedModifier
    acceleration: 5 # #Cythisiax Edited - Nerfed from 6 for balance
    friction: 0.15 # #Cythisiax Edited - Nerfed from 0.1 for balance (less slippery)
    baseWalkSpeed: 7 # #Cythisiax Edited - Nerfed from 8 for balance
    baseSprintSpeed: 7 # #Cythisiax Edited - Nerfed from 8 for balance
  - type: Fixtures # So they cant fit through 1 door.
    fixtures:
      fix1:
        hard: true
        shape:
          !type:PhysShapeCircle
          radius: 0.75
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      requireAll: true
      tags:
      - MisfitsVehicleKey
      - MisfitsMotorbikeKeys
  - type: ItemSlots
    slots:
      key_slot:
        name: Keys
        whitelist:
          requireAll: true
          tags:
          - MisfitsVehicleKey
          - MisfitsMotorbikeKeys
        insertSound:
          path: /Audio/Effects/Vehicle/vehiclestartup.ogg
          params:
            volume: -3

- type: entity
