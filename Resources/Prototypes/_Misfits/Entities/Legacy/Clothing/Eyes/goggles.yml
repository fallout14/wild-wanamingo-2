# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/Entities/Clothing/Eyes/goggles.yml
# (Misfits' copy of a Space Station 14 or other-fork file.)

- type: entity
  parent: ClothingEyesBase
  id: F14ClothingEyesNightVisionGoggles
  name: night vision goggles
  description: An advanced heads-up display which provides id data and vision in complete darkness.
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Clothing/Eyes/Goggles/nightvision.rsi
  - type: Clothing
    sprite: Misfits/Legacy/Clothing/Eyes/Goggles/nightvision.rsi
  - type: NightVision # WW Change - reaches the wearer and toggles (it did neither before)
    relayOverlay: true
    enabled: false
    action: ActionToggleNightVision
    lightingColor: "#7CFF7C80"
    overlayColor: "#1F7F1F30"
    noiseAmount: 0.1
    noiseMultiplier: 1
  - type: IdentityBlocker
    coverage: EYES
