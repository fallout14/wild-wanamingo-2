# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Mobs/NPCs/pets.yml

- type: entity
  name: Dr. Thumper
  id: MisfitsMobRabbitFollowersPet
  parent: N14MobRabbit
  description: A highly trained professional.
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: Tag
    tags:
    - FootstepSound
    - DoorBumpOpener
    - CannotSuicide
  - type: Temperature
  - type: TemperatureDamage
    heatDamageThreshold: 800
    coldDamageThreshold: 0
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Weapons/punch3.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 2.5
  - type: MobPrice
    price: 3000 # it is a truly valuable creature
  - type: NpcFactionMember
    factions:
    - MisfitsFollowers
  - type: GhostRole
    name: ghost-role-information-misfitpet-rabbit-followers-name
    description: ghost-role-information-misfit-faction-description
    rules: ghost-role-component-default-rules
  - type: GhostTakeoverAvailable

