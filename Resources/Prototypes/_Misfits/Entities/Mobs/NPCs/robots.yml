- type: entity
  id: F14SentryBotOverloadLightEmitter
  name: sentry bot overload light emitter
  description: A hidden helper entity for the sentry bot's overload warning lights.
  save: false
  components:
  - type: PointLight
    enabled: false
    color: red
    radius: 5
    softness: 2
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    # Misfits Change /Fix: netsync must be enabled so clients can see the light toggle during overload flash.

# Misfits Change /Add: Sentry Bot - hostile NPC with twin gatling lasers, high HP, and armor

- type: entity
  parent: F14MobRobotHostile
  id: F14MobRobotSentryBot
  name: Sentry Bot
  description: A pre-war military robot armed with a gatling laser and covered in thick armor plating. A terrifying relic of humanity's last war.
  suffix: hostile, gatling laser
  components:
  - type: IdleSound #Misfits Change - use the dedicated Sentry Bot idle loop set
  - type: SpamEmitSound #Misfits Change - periodic Sentry Bot mechanical chatter
    minInterval: 12
    maxInterval: 40
    sound:
      collection: F14SentryIdle
      params:
        volume: -6
        maxDistance: 7
  - type: AggroSound #Misfits Change - separate aggro alert on combat entry
    sound:
      collection: F14SentryAttack
      params:
        volume: -3
        maxDistance: 12
  - type: MovementSpeedModifier
    # Misfits Tweak: reduced further — sentry bots are heavy siege walkers, not pursuit units.
    baseWalkSpeed: 0.75
    baseSprintSpeed: 1.0
  # Misfits Change /Add: Prevent players from dragging this robot around.
  # At 1000 HP and covered in combat plating it is far too heavy to be moved.
  - type: NoPull
  - type: MobThresholds
    thresholds:
      0: Alive
      750: Dead
    stateAlertDict:
      Alive: BorgHealth
      Dead: HumanDead
  - type: Damageable
    # Hardened military armor - resistant to physical and burn damage
    damageModifierSet: F14HeavyRobot
  - type: Injurable
    damageContainer: Biological
  - type: Sprite
    sprite: Nuclear14/Mobs/Robots/sentrybot.rsi
    # Misfits Change /Tweak: Scale up 2× so the sentry bot looks imposingly large on screen.
    scale: 2.0, 2.0
    layers:
    - state: icon
      map: ["movement"]
    # Misfits Change /Tweak: Use inhand-right (4-directional) so the gatling laser rotates with
    # the bot's facing direction and looks like it is actively being wielded.
    - sprite: Nuclear14/Objects/Weapons/Guns/Battery/laser_gatling.rsi
      state: inhand-right
      offset: 0.0, 0.1
      scale: 0.72, 0.72
    - state: icon
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: icon
      shader: unshaded
      map: ["light"]
      visible: false
  - type: SpriteMovement
    movementLayers:
      movement:
        state: walking
    noMovementLayers:
      movement:
        state: icon
  - type: DamageStateVisuals
    states:
      Alive:
        Base: icon
      Dead:
        Base: dead
  - type: PointLight
    enabled: false
    radius: 0
    softness: 0
  # Single gatling laser sprite, but still uses the same combat profile and hitscan path.
  - type: Gun
    minAngle: 2
    maxAngle: 12
    angleIncrease: 4
    angleDecay: 12
    # Misfits Tweak: reduced from 8 → 6 shots/sec to be slightly less overwhelming.
    fireRate: 6
    soundGunshot:
      collection: F14LaserGatlingGunshot
    useKey: false
    selectedMode: FullAuto
    availableModes:
      - FullAuto
  - type: BatteryAmmoProvider
    proto: RedLaser
    fireCost: 50
  - type: Battery
    # Misfits Change /Tweak: Extremely large charge pool — effectively infinite ammo.
    maxCharge: 9999999
    startingCharge: 9999999
  # Misfits Change /Add: Melee stomp/ram attack used by F14RangedHostileCompound as a fallback
  # when the gatling laser battery is depleted (HTN tries ranged first, then melee).
  # Misfits Change /Tweak: bumped to 40 brute, extended reach, added knockback like power armor.
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Effects/metal_thud1.ogg
    angle: 0
    animation: WeaponArcPunch
    range: 1.5
    attackRate: 0.75
    damage:
      types:
        Blunt: 13.3333
        Slash: 13.3333
        Piercing: 13.3333
  - type: MeleeThrowOnHit
    speed: 10
    distance: 0.25
  - type: HTN
    rootTask:
      task: F14RangedHostileCompound
    blackboard:
      NavSmash: !type:Bool
        true
      NavClimb: !type:Bool
        true
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: TriggerOnUse
    keyOut: prime
  - type: TimerTrigger
    keysIn: [ prime ]
    keyOut: trigger
    delay: 8
    initialBeepDelay: 0
    beepInterval: 1
    beepSound:
      path: /Audio/Machines/Nuke/general_beep.ogg
      params:
        volume: -2
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: F14DefaultStructural
    maxIntensity: 4
    intensitySlope: 4
    totalIntensity: 24
    canCreateVacuum: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 750
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          F14ScrapElectronic1:
            min: 2
            max: 5
          F14MaterialCircuitry1:
            min: 2
            max: 5
          F14Scrap1:
            min: 2
            max: 5
          F14CurrencyPrewar: #Misfits Change /Add: Drop prewar money on death (10-40)
            min: 10
            max: 40
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Misfits/Legacy/Machines/AI/borg_death.ogg
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 2
  # Misfits Add - robot/broadcast languages when player-controlled.

- type: entity
  parent: F14MobRobotHostile
  id: F14MobRobotSentryBotBallistic
  name: Sentry Bot
  description: A pre-war military robot armed with a 5mm minigun and covered in thick armor plating. A terrifying relic of humanity's last war.
  suffix: hostile, minigun
  components:
  - type: IdleSound #Misfits Change /Add - reuse Sentry Bot idle loop set on ballistic variant
  - type: SpamEmitSound
    minInterval: 12
    maxInterval: 40
    sound:
      collection: F14SentryIdle
      params:
        volume: -6
        maxDistance: 7
  - type: AggroSound #Misfits Change /Add - same aggro alert as laser variant
    sound:
      collection: F14SentryAttack
