  - type: TimerTrigger
    keysIn: [ prime ]
    keyOut: trigger
    delay: 8
    initialBeepDelay: 0
    beepInterval: 1
    beepSound:
      path: /Audio/Machines/Nuke/general_beep.ogg
      params:
        volume: -2
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: F14DefaultStructural
