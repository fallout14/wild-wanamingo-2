    minAngle: 3
    maxAngle: 15
    angleIncrease: 5
    angleDecay: 10
    # Misfits Change /Tweak: bumped to 8 shots/sec for faster suppression fire.
    fireRate: 8
    soundGunshot:
      collection: F14MinigunGunshot
    useKey: false
    selectedMode: FullAuto
    availableModes:
      - FullAuto
  - type: BasicEntityAmmoProvider
    proto: F14Bullet5mm
    # Misfits Change /Tweak: Extremely large drum — effectively infinite ammo.
    capacity: 99999
    count: 99999
  - type: RechargeBasicEntityAmmo
    # Misfits Change /Tweak: Near-instant recharge so the drum never truly empties.
    rechargeCooldown: 0.05
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
  # Fallback stomp/ram when reloading — same HTN compound tries melee automatically.
