    # weapon overlay convention used throughout raiders_ranged.yml / faction_humanoids.yml.
    - sprite: Nuclear14/Objects/Weapons/Guns/Heavy/minigun.rsi
      state: inhand-right
      offset: 0.0, 0.1
      scale: 0.55, 0.55
    - state: icon
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
