# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Nuclear14/Entities/Mobs/NPCs/robots.yml

- type: entity
  parent: F14MobRobotProtectronPoliceHostile
  id: F14MobRobotSecuritronHostile
  name: Securitron
  description: A securitron rolling patrol looking for a fight.
  components:
  - type: SpamEmitSound
    minInterval: 12
    maxInterval: 45
    sound:
      collection: F14SecuritronIdle
      params:
        volume: -7
        maxDistance: 6
  - type: Sprite
    sprite: Nuclear14/Mobs/Robots/securitron-gray.rsi
    layers:
    - state: icon
      map: ["movement"]
    - state: icon
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: icon
      shader: unshaded
      map: ["light"]
      visible: false
  - type: SpriteMovement
    movementLayers:
      movement:
        state: walking
    noMovementLayers:
      movement:
        state: icon
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3.5
  - type: AggroSound
    sound:
      collection: F14SecuritronAttack
      params:
        volume: -3
        maxDistance: 12

