# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Mobs/material_extractor_waves.yml

- type: entity
  abstract: true
  id: F14MobMaterialExtractorWaveBase
  parent: F14MobWaveAnimal
  components:
  # Wave mobs first close on the extractor itself. Once they arrive, their
  # normal hostile HTN can select and attack nearby players.
  - type: HTN
    rootTask:
      task: F14MaterialExtractorWaveCompound
  - type: NpcFactionMember
    factions:
    - F14WastelandAnimal

- type: htnCompound
  id: F14MaterialExtractorWaveCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:CoordinatesNotInRangePrecondition
        targetKey: FollowTarget
        rangeKey: MeleeRange
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        targetKey: FollowTarget
        rangeKey: MeleeRange
        removeKeyOnFinish: false
  - tasks:
    - !type:HTNCompoundTask
      task: F14MeleeCombatCompound

- type: entity
  id: F14MobMaterialExtractorMoleratWave
  parent: [F14MobMolerat, F14MobMaterialExtractorWaveBase]

