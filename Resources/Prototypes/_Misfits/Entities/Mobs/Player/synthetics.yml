# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Mobs/Player/synthetics.yml

- type: entity
  parent: F14BaseRobotChassis
  id: F14BasePlayerSynthetic
  abstract: true
  components:
  - type: RobotWeaponPickupBlacklist # #Misfits Add: player robot species keep hands for utility items but cannot grab loose weapons.
    blacklist:
      components:
      - Gun
  - type: SiliconInternalRadio
  - type: EncryptionKeyHolder
    keySlots: 4
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
  - type: ActiveRadio
  - type: SiliconSelfCellEjectOnly
  # [Changed by MisfitsCrew/Operator] Reject non-cell interaction probes before quick-swap checks so welders reach Repairable without granting external cell access.
  - type: ItemSlots
    slots:
      cell_slot:
        whitelist:
          components:
          - PowerCell
  - type: Appearance # #Misfits Change: allow robot sprites to swap to their built-in dead state
  - type: DamageStateVisuals # #Misfits Change: use robot dead sprites instead of animated hover frames when downed/dead
    states:
      Alive:
        Base: icon
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: Stripping # #Misfits Change: allow player robots to open strip UI with hover + E
  - type: RobotCriticalSparking # #Misfits Change: spark and crackle while near destruction, stop once repaired
  - type: Reflect # #Misfits Change: player robots can ricochet projectiles off their chassis
    reflectProb: 0.1
    spread: 150
    reflects: [ Energy, NonEnergy ]
  - type: CanEnterCryostorage # #Misfits Add: allow player robot species to enter F14CryoBunkerLadder and despawn like MobHuman
  - type: SkinTintedSprite # WW Add: the character's skin colour tints the chassis
    layers:
    - movement
  # #Misfits Fix: override base chassis Destructible to exclude borg_brain from EmptyContainersBehaviour.
  # Without this the PositronicBrain (containing the player mind) drops as loot when a player robot is
  # destroyed. The brain should be consumed with the chassis, not left on the floor.
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 5
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Misfits/Legacy/Machines/AI/borg_death.ogg
      # Commented out to remove player bot gibbing.
#    - trigger:
#        !type:DamageTrigger
#        damage: 1000
#      behaviors:
#      - !type:PlaySoundBehavior
#        sound:
#          collection: MetalBreak
#      - !type:SpawnEntitiesBehavior
#        spawn:
#          PowerCellHyper:
#            min: 1
#            max: 1
#          F14Scrap1:
#            min: 2
#            max: 4
#          F14ScrapElectronic1:
#            min: 1
#            max: 3
#      - !type:EmptyContainersBehaviour
#        containers:
#        - borg_module
#        - cell_slot
#        # borg_brain intentionally omitted — player mind is destroyed with the chassis
#      - !type:DoActsBehavior
#        acts: [ "Destruction" ]

- type: entity
  parent: F14BasePlayerSynthetic
  id: F14PlayerSyntheticMrHandy
  name: mr. handy
  suffix: player, synthetic
  description: A General Atomics Mr. Handy domestic servant robot, now guided by a living mind.
  components:
  - type: VisualBody
  - type: HumanoidProfile
    species: F14RobotMrHandy
  - type: Sprite
    sprite: Nuclear14/Mobs/Robots/mrhandyclaw.rsi
    layers:
    - state: icon
      map: ["enum.DamageStateVisualLayers.Base", "movement"]
    - state: on # #Misfits Fix: lit indicator; BorgSystem overrides at runtime
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: on # #Misfits Fix: 'on' RSI state is the lit variant used as the flashlight glow overlay
      shader: unshaded
      map: ["light"]
      visible: false
  - type: SyncSprite
  - type: SpriteMovement
    movementLayers:
      movement:
        state: walking
    noMovementLayers:
      movement:
        state: icon
  - type: Speech
    speechVerb: Robotic
    speechSounds: F14Robot # WW Change - Misfits robot voice
  - type: BorgHands # #Misfits Change: Mr. Handy gets a third usable item slot
    handCount: 3
  # #Misfits Change: Disabled idle/aggro auto-sounds for player-controlled robots — sounds fire uncontrollably while the player is present
  # - type: IdleSound
  # - type: SpamEmitSound
  #   minInterval: 15
  #   maxInterval: 50
  #   sound:
  #     collection: N14HandyIdle
  #     params:
  #       volume: -7
  #       maxDistance: 6
  - type: NpcFactionMember
    factions:
    - F14Wastelander
  - type: PassiveDamage # #Misfits Change: gradual self-repair, ~30 per type per minute
    allowedStates:
    - Alive
    - Critical
    damage:
      types:
        Blunt: -0.166667
        Slash: -0.166667
        Piercing: -0.166667
        Heat: -0.5
        Shock: -0.5
        Caustic: -0.5
  - type: RobotSelfRepairAnnouncer # #Misfits Change: hull integrity warnings + self-repair popups

  # WW Change - the flamer moved into Mr. Handy's tool module (F14BorgModuleToolMrHandy) with the circular saw.
  - type: ContainerFill
    containers:
      borg_brain:
        - PositronicBrain
      borg_module:
        - BorgModuleDiagnosis
        - BorgModuleTopicals
        - F14BorgModuleCleaning # #Misfits Add: Mr. Handy is a domestic servant — cleaning module is thematic
        - F14BorgModuleBotany
        - F14BorgModuleToolMrHandy # WW Change - tools, circular saw and flamer
      key_slots:
        - F14EncryptionKeyWastelandGlobal
        - F14EncryptionKeyVault
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellAntiqueProto

- type: entity
  parent: F14BasePlayerSynthetic
  id: F14PlayerSyntheticProtectron
  name: protectron
  suffix: player, synthetic
  description: A RobCo Industries Protectron civil service robot, now guided by a living mind. The baseline model — equipped with an integrated hand-laser for self-defense and a general utility toolkit. Functional but unremarkable; the jack-of-all-trades among Protectron chassis types.
  components:
  - type: VisualBody
  - type: HumanoidProfile
    species: F14RobotProtectron
  - type: Sprite
    sprite: Nuclear14/Mobs/Robots/protectron.rsi
    layers:
    - state: icon
      map: ["enum.DamageStateVisualLayers.Base", "movement"]
    - state: on # #Misfits Fix: lit indicator; BorgSystem overrides at runtime
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: on # #Misfits Fix: 'on' RSI state is the lit variant used as the flashlight glow overlay
      shader: unshaded
      map: ["light"]
      visible: false
  - type: SpriteMovement
    movementLayers:
      movement:
        state: walking
    noMovementLayers:
      movement:
        state: icon
  - type: Speech
    speechVerb: Robotic
    speechSounds: F14Robot # WW Change - Misfits robot voice
  # #Misfits Change: Disabled idle/aggro auto-sounds for player-controlled robots — sounds fire uncontrollably while the player is present
  # - type: IdleSound
  # - type: SpamEmitSound
  #   minInterval: 15
  #   maxInterval: 50
  #   sound:
  #     collection: N14ProtectronIdle
  #     params:
  #       volume: -7
  #       maxDistance: 6
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.0
    baseSprintSpeed: 3.5
  - type: Armor # #Misfits Change: innate Protectron plating matches BoS Combat Armor MK2 protection values
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.65
        Heat: 0.65
  - type: ExplosionResistance # #Misfits Change: keep Protectron chassis in line with BoS Combat Armor MK2 explosive protection
    damageCoefficient: 0.75
  - type: NpcFactionMember
    factions:
    - F14Wastelander
  - type: PassiveDamage # #Misfits Change: gradual self-repair, ~30 per type per minute
    allowedStates:
    - Alive
    - Critical
    damage:
      types:
        Blunt: -0.166667
        Slash: -0.166667
        Piercing: -0.166667
        Heat: -0.5
        Shock: -0.5
        Caustic: -0.5
  - type: RobotSelfRepairAnnouncer # #Misfits Change: hull integrity warnings + self-repair popups
  # WW Change - the built-in laser pistol is held in the Protectron tool module (F14BorgModuleToolProtectron), so it
  # can't be dropped.

  - type: Tag # #Misfits Change: Protectron walks, so it should have footstep sounds
    tags:
    - DoorBumpOpener
    - CanPilot
    - FootstepSound
  - type: FootstepModifier # #Misfits Add: metal footsteps instead of human barefoot sounds
    footstepSoundCollection:
      collection: F14FootstepMetalSolid
  - type: ContainerFill
    containers:
      borg_brain:
        - PositronicBrain
      borg_module: # #Misfits Add: civil-service general loadout — integrated laser for self-defense + basic utility toolkit
        - F14BorgModuleToolProtectron # WW Change - tools + built-in laser pistol
      key_slots:
        - F14EncryptionKeyWastelandGlobal
        - F14EncryptionKeyVault
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellAntiqueProto

