# ────────────────────────────────────────────────────────
# Sentry Bot — Minigun variant (base sentry bot species default)
# Heavy assault platform with built-in 5mm minigun, missile launcher, and heavy armor.
# Trades speed for firepower and durability. 50% reflect on all projectile types.
# ────────────────────────────────────────────────────────

- type: entity
  parent: F14BasePlayerSynthetic
  id: F14PlayerSyntheticSentryBotMinigun
  name: sentry bot
  suffix: player, synthetic, minigun
  description: A pre-war military Sentry Bot armed with a 5mm minigun and missile launcher. Massively armored, terrifyingly slow, and built to annihilate everything in its path.
  components:
  - type: VisualBody
  - type: HumanoidProfile
    species: F14RobotSentryBot
  - type: Sprite # WW Change - MS13 sentry bot (the ballistic one, with the minigun arm)
    sprite: MojaveSun/Mobs/Robots/sentrybot_ballistic.rsi
    scale: 1.25, 1.25
    layers:
    - state: icon
      map: ["enum.DamageStateVisualLayers.Base", "movement"]
    - state: on # #Misfits Fix: lit indicator; BorgSystem overrides at runtime
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: on # #Misfits Fix: 'on' RSI state is the lit variant used as the flashlight glow overlay
      shader: unshaded
      map: ["light"]
      visible: false
  - type: SpriteMovement
    movementLayers:
      movement:
        state: walking
    noMovementLayers:
      movement:
        state: icon
  - type: Speech
    speechVerb: Robotic
    speechSounds: F14Robot # WW Change - Misfits robot voice
  - type: MovementSpeedModifier # Sentry bots are extremely slow
    baseWalkSpeed: 1.0
    baseSprintSpeed: 1.5
  - type: MobThresholds # Heavy-class robot — much more durable than standard borgs
    thresholds:
      0: Alive
      350: Dead
    allowRevives: true
  - type: Damageable
    damageModifierSet: F14HeavyRobot
  - type: Injurable
    damageContainer: Biological
  - type: Armor # #Misfits Add: innate heavy plating on top of HeavyRobot modifier set
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.60
        Heat: 0.60
  - type: ExplosionResistance # #Misfits Add: sentry bots shrug off most explosions
    damageCoefficient: 0.50
  - type: Reflect # #Misfits Add: 50% reflect on all projectile types — sentry bot heavy plating
    reflectProb: 0.5
    spread: 150
    reflects: [ Energy, NonEnergy ]
  - type: NoPull # Too heavy to drag
  # Sentry bot 360-degree red glow — spawns 4 cone PointLight emitters at cardinal
  # rotations on init (matching the NPC sentry bot). Also drives overload flash.
  - type: PointLight
    enabled: false
    radius: 0
    softness: 0
  # WW Change - the minigun (overheats when dry) and the missile launcher are held in its combat module
  # (F14BorgModuleCombatSentryMinigun); the missile action and chassis gun are gone.
  - type: NpcFactionMember
    factions:
    - F14Wastelander
  - type: PassiveDamage # #Misfits Add: sentry bots self-repair slowly
    allowedStates:
    - Alive
    - Critical
    damage:
      types:
        Blunt: -0.166667
        Slash: -0.166667
        Piercing: -0.166667
        Heat: -0.5
        Shock: -0.5
        Caustic: -0.5
  - type: RobotSelfRepairAnnouncer
  - type: Tag
    tags:
    - DoorBumpOpener
    - CanPilot
    # No FootstepSound — sentry bots move on wheels/treads, not feet
  - type: ContainerFill
    containers:
      borg_brain:
        - PositronicBrain
      borg_module:
        - F14BorgModuleTool
        - F14BorgModuleCombatSentryMinigun # WW Change - minigun + missile launcher
      key_slots:
        - F14EncryptionKeyWastelandGlobal
  - type: ItemSlots # WW Change - a Sentry Bot only runs on a fusion core
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: F14FusionCore
        whitelist:
          tags:
          - F14FusionCore
  - type: FusionCoreDetonator # WW Add - action to blow its own fusion core (starts the self-destruct fuse below)
  # #Misfits Fix: override base chassis Destructible so the player SentryBot behaves like
  # the NPC variants — the chassis stays in Dead state after the damage threshold fires,
  # then the TriggerOnMobstateChange explosion below destroys it 8 seconds later.
  # DoActsBehavior: Destruction is intentionally absent (explosion handles cleanup).
  # borg_brain is excluded from EmptyContainersBehaviour so the brain is destroyed
  # with the chassis rather than dropped as a lootable item on the floor.
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 5
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Misfits/Legacy/Machines/AI/borg_death.ogg
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          F14FusionCoreEmpty: # WW Change - it runs on a fusion core now
            min: 1
            max: 1
          F14Scrap1:
            min: 2
            max: 4
          F14ScrapElectronic1:
            min: 1
            max: 3
      - !type:EmptyContainersBehaviour
        containers:
        - borg_module
        - cell_slot
        # borg_brain intentionally omitted — destroyed with chassis in the explosion below
  # #Misfits Add: death explosion matching the NPC SentryBot — 8-second beeping fuse
  # triggered when the chassis enters Dead mob state, then fires a structural explosion.
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: TriggerOnUse
    keyOut: prime
  - type: TimerTrigger
    keysIn: [ prime ]
    keyOut: trigger
    delay: 8
    initialBeepDelay: 0
    beepInterval: 1
    beepSound:
      path: /Audio/Machines/Nuke/general_beep.ogg
      params:
        volume: -2
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: F14DefaultStructural
    maxIntensity: 4
    intensitySlope: 4
    totalIntensity: 24
    canCreateVacuum: false

# ────────────────────────────────────────────────────────
