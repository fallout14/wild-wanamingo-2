    containers:
      borg_brain:
        - PositronicBrain
      borg_module:
        - F14BorgModuleToolProtectronPolice # WW Change - tools + built-in magneto-laser pistol
        - F14BorgModuleSecurity # stun baton, handcuffs, flashlight - lore-accurate detainment kit
      key_slots:
        - F14EncryptionKeyWastelandGlobal
        - F14EncryptionKeyVault

