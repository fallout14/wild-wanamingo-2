# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Mobs/Player/synthetics.yml

- type: entity
  parent: N14BaseRobotChassis
  id: MisfitsBasePlayerSynthetic
  abstract: true
  components:
  - type: RobotWeaponPickupBlacklist # #Misfits Add: player robot species keep hands for utility items but cannot grab loose weapons.
    blacklist:
      components:
      - Gun
  - type: SiliconInternalRadio
  - type: EncryptionKeyHolder
    keySlots: 4
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
  - type: ActiveRadio
  - type: SiliconSelfCellEjectOnly
  # [Changed by MisfitsCrew/Operator] Reject non-cell interaction probes before quick-swap checks so welders reach Repairable without granting external cell access.
  - type: ItemSlots
    slots:
      cell_slot:
        whitelist:
          components:
          - PowerCell
  - type: Appearance # #Misfits Change: allow robot sprites to swap to their built-in dead state
  - type: DamageStateVisuals # #Misfits Change: use robot dead sprites instead of animated hover frames when downed/dead
    states:
      Alive:
        Base: icon
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: Stripping # #Misfits Change: allow player robots to open strip UI with hover + E
  - type: RobotCriticalSparking # #Misfits Change: spark and crackle while near destruction, stop once repaired
  - type: Reflect # #Misfits Change: player robots can ricochet projectiles off their chassis
    reflectProb: 0.1
    spread: 150
    reflects: [ Energy, NonEnergy ]
  - type: CanEnterCryostorage # #Misfits Add: allow player robot species to enter N14CryoBunkerLadder and despawn like MobHuman
  # #Misfits Fix: override base chassis Destructible to exclude borg_brain from EmptyContainersBehaviour.
  # Without this the PositronicBrain (containing the player mind) drops as loot when a player robot is
  # destroyed. The brain should be consumed with the chassis, not left on the floor.
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 5
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Misfits/Legacy/Machines/AI/borg_death.ogg
      # Commented out to remove player bot gibbing.
#    - trigger:
#        !type:DamageTrigger
#        damage: 1000
#      behaviors:
#      - !type:PlaySoundBehavior
#        sound:
#          collection: MetalBreak
#      - !type:SpawnEntitiesBehavior
#        spawn:
#          PowerCellHyper:
#            min: 1
#            max: 1
#          N14Scrap1:
#            min: 2
#            max: 4
#          N14ScrapElectronic1:
#            min: 1
#            max: 3
#      - !type:EmptyContainersBehaviour
#        containers:
#        - borg_module
#        - cell_slot
#        # borg_brain intentionally omitted — player mind is destroyed with the chassis
#      - !type:DoActsBehavior
#        acts: [ "Destruction" ]

- type: entity
  parent: MisfitsBasePlayerSynthetic
  id: MisfitsPlayerSyntheticMrHandy
  name: mr. handy
  suffix: player, synthetic
  description: A General Atomics Mr. Handy domestic servant robot, now guided by a living mind.
  components:
  - type: BatteryAmmoProvider
    proto: N14MFLaserRed
    fireCost: 50
  - type: VisualBody
  - type: HumanoidProfile
    species: MisfitsRobotMrHandy
  - type: Sprite
    sprite: Nuclear14/Mobs/Robots/mrhandyclaw.rsi
    layers:
    - state: icon
      map: ["enum.DamageStateVisualLayers.Base", "movement"]
    - state: on # #Misfits Fix: lit indicator; BorgSystem overrides at runtime
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: on # #Misfits Fix: 'on' RSI state is the lit variant used as the flashlight glow overlay
      shader: unshaded
      map: ["light"]
      visible: false
  - type: SyncSprite
  - type: SpriteMovement
    movementLayers:
      movement:
        state: walking
    noMovementLayers:
      movement:
        state: icon
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: BorgHands # #Misfits Change: Mr. Handy gets a third usable item slot
    handCount: 3
  # #Misfits Change: Disabled idle/aggro auto-sounds for player-controlled robots — sounds fire uncontrollably while the player is present
  # - type: IdleSound
  # - type: SpamEmitSound
  #   minInterval: 15
  #   maxInterval: 50
  #   sound:
  #     collection: N14HandyIdle
  #     params:
  #       volume: -7
  #       maxDistance: 6
  - type: NpcFactionMember
    factions:
    - N14Wastelander
  - type: PassiveDamage # #Misfits Change: gradual self-repair, ~30 per type per minute
    allowedStates:
    - Alive
    - Critical
    damage:
      types:
        Blunt: -0.166667
        Slash: -0.166667
        Piercing: -0.166667
        Heat: -0.5
        Shock: -0.5
        Caustic: -0.5
  - type: RobotSelfRepairAnnouncer # #Misfits Change: hull integrity warnings + self-repair popups

  - type: Gun # #Misfits Add: built-in flamer — right-click in combat mode to fire
    cameraRecoilScalar: 0
    fireRate: 10
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Nuclear14/Weapons/Guns/Flames/flamer.ogg
    useKey: false
  - type: SolutionManager
    solutions:
    - N14PlayerSyntheticMrHandySolutionChamber
  - type: FlamerAmmoProvider
    solutionId: chamber
    fireCost: 5
    fireTilePrototype: MisfitsTileFire
    range: 5
  - type: NamedSolutionRegeneration # #Misfits Change: slow fuel regen preserves the old recharge cadence
    solution: chamber
    generated:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 5
    duration: 3
  # #Misfits Fix - Removed RobotGunPowerDrain: the flamer drained the same chassis cell_slot that
  # powers the built-in flashlight (HandheldLight). Spraying killed the light and it could not be
  # re-enabled until the cell recharged — the reported "flashlight breaks when using blaster" bug.
  # The flamer is already fuel/ammo-limited, so this doesn't make it free.
  - type: ContainerFill
    containers:
      borg_brain:
        - PositronicBrain
      borg_module:
        - BorgModuleDiagnosis
        - BorgModuleTopicals
        - BorgModuleCleaning # #Misfits Add: Mr. Handy is a domestic servant — cleaning module is thematic
        - BorgModuleBotany
      key_slots:
        - MisfitsEncryptionKeyWastelandGlobal
        - N14EncryptionKeyVault
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellAntiqueProto

- type: entity
  parent: Solution
  id: N14PlayerSyntheticMrHandySolutionChamber
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: chamber
    solution:
      maxVol: 150
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 150

- type: entity
  parent: MisfitsBasePlayerSynthetic
  id: MisfitsPlayerSyntheticProtectron
  name: protectron
  suffix: player, synthetic
  description: A RobCo Industries Protectron civil service robot, now guided by a living mind. The baseline model — equipped with an integrated hand-laser for self-defense and a general utility toolkit. Functional but unremarkable; the jack-of-all-trades among Protectron chassis types.
  components:
  - type: VisualBody
  - type: HumanoidProfile
    species: MisfitsRobotProtectron
  - type: Sprite
    sprite: Nuclear14/Mobs/Robots/protectron.rsi
    layers:
    - state: icon
      map: ["enum.DamageStateVisualLayers.Base", "movement"]
    - state: on # #Misfits Fix: lit indicator; BorgSystem overrides at runtime
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: on # #Misfits Fix: 'on' RSI state is the lit variant used as the flashlight glow overlay
      shader: unshaded
      map: ["light"]
      visible: false
  - type: SpriteMovement
    movementLayers:
      movement:
        state: walking
    noMovementLayers:
      movement:
        state: icon
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  # #Misfits Change: Disabled idle/aggro auto-sounds for player-controlled robots — sounds fire uncontrollably while the player is present
  # - type: IdleSound
  # - type: SpamEmitSound
  #   minInterval: 15
  #   maxInterval: 50
  #   sound:
  #     collection: N14ProtectronIdle
  #     params:
  #       volume: -7
  #       maxDistance: 6
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.0
    baseSprintSpeed: 3.5
  - type: Armor # #Misfits Change: innate Protectron plating matches BoS Combat Armor MK2 protection values
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.65
        Heat: 0.65
  - type: ExplosionResistance # #Misfits Change: keep Protectron chassis in line with BoS Combat Armor MK2 explosive protection
    damageCoefficient: 0.75
  - type: NpcFactionMember
    factions:
    - N14Wastelander
  - type: PassiveDamage # #Misfits Change: gradual self-repair, ~30 per type per minute
    allowedStates:
    - Alive
    - Critical
    damage:
      types:
        Blunt: -0.166667
        Slash: -0.166667
        Piercing: -0.166667
        Heat: -0.5
        Shock: -0.5
        Caustic: -0.5
  - type: RobotSelfRepairAnnouncer # #Misfits Change: hull integrity warnings + self-repair popups

  - type: Tag # #Misfits Change: Protectron walks, so it should have footstep sounds
    tags:
    - DoorBumpOpener
    - CanPilot
    - FootstepSound
  - type: FootstepModifier # #Misfits Add: metal footsteps instead of human barefoot sounds
    footstepSoundCollection:
      collection: N14FootstepMetalSolid
  - type: ContainerFill
    containers:
      borg_brain:
        - PositronicBrain
      borg_module: # #Misfits Add: civil-service general loadout — integrated laser for self-defense + basic utility toolkit
        - BorgModuleTool     # wrench/screwdriver/welder kit for general civil service tasks
      key_slots:
        - MisfitsEncryptionKeyWastelandGlobal
        - N14EncryptionKeyVault
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellAntiqueProto

- type: entity
  parent: MisfitsBasePlayerSynthetic
  id: MisfitsPlayerSyntheticMrGutsy
  name: mr. gutsy
  suffix: player, synthetic
  description: A General Atomics Mr. Gutsy military combat robot, now guided by a living mind. Equipped with a plasma pistol and military programming.
  components:
  - type: BatteryAmmoProvider
    proto: N14MFLaserRed
    fireCost: 50
  - type: VisualBody
  - type: HumanoidProfile
    species: MisfitsRobotMrGutsy
  - type: Sprite
    sprite: Nuclear14/Mobs/Robots/mrhandygutsy.rsi
    layers:
    - state: icon
      map: ["enum.DamageStateVisualLayers.Base", "movement"]
    - state: on # #Misfits Fix: lit indicator; BorgSystem overrides at runtime
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: on # #Misfits Fix: 'on' RSI state is the lit variant used as the flashlight glow overlay
      shader: unshaded
      map: ["light"]
      visible: false
  - type: SyncSprite
  - type: SpriteMovement
    movementLayers:
      movement:
        state: walking
    noMovementLayers:
      movement:
        state: icon
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  # #Misfits Change: Disabled idle/aggro auto-sounds for player-controlled robots — sounds fire uncontrollably while the player is present
  # - type: IdleSound
  # - type: SpamEmitSound
  #   minInterval: 15
  #   maxInterval: 50
  #   sound:
  #     collection: N14GutsyIdle
  #     params:
  #       volume: -7
  #       maxDistance: 6
  - type: NpcFactionMember
    factions:
    - N14Wastelander
  - type: PassiveDamage # #Misfits Change: gradual self-repair, ~30 per type per minute
    allowedStates:
    - Alive
    - Critical
    damage:
      types:
        Blunt: -0.166667
        Slash: -0.166667
        Piercing: -0.166667
        Heat: -0.5
        Shock: -0.5
        Caustic: -0.5
  - type: RobotSelfRepairAnnouncer # #Misfits Change: hull integrity warnings + self-repair popups

  - type: Gun # #Misfits Add: built-in plasma caster — right-click in combat mode to fire
    fireRate: 2
    soundGunshot:
      collection: N14PlasmaPistolGunshot
    useKey: false
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: BasicEntityAmmoProvider # #Misfits Add: limited plasma shots, auto-refills after cooldown
    proto: N14BulletPlasma
    capacity: 15
    count: 15
  - type: RechargeBasicEntityAmmo # #Misfits Add: recharge simulates internal capacitor cycling
    rechargeCooldown: 2
  # #Misfits Fix - Removed RobotGunPowerDrain: the plasma blaster shared the chassis cell_slot with
  # the built-in flashlight (HandheldLight). Each shot drained 50 charge, dropping the cell below the
  # light's 0.2 wattage threshold -> HandheldLightSystem force-turned the light off and blocked
  # re-enable ("cell-dead") until recharge. That's the reported "flashlight breaks when I use my
  # blaster" bug. The blaster is already ammo-limited, so this doesn't make it free.
  - type: ContainerFill
    containers:
      borg_brain:
        - PositronicBrain
      borg_module:
        - BorgModuleTool # #Misfits Add: military utility — field repair and maintenance tools
      key_slots:
        - MisfitsEncryptionKeyWastelandGlobal
        - N14EncryptionKeyVault
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellAntiqueProto

- type: entity
  parent: MisfitsPlayerSyntheticProtectron
  id: MisfitsPlayerSyntheticProtectronPolice
  name: protectron police
  suffix: player, synthetic, police
  description: A RobCo Industries Protectron police model specialising in close-quarters detainment. Equipped with a heavy electro-shock melee strike, a stun baton, and restraint tools. No ranged weapons — this unit subdues, not suppresses.
  components:
  - type: BatteryAmmoProvider
    proto: N14MFLaserRed
    fireCost: 50
  - type: VisualBody
  - type: HumanoidProfile
    species: MisfitsRobotProtectronPolice
  - type: Sprite
    sprite: Nuclear14/Mobs/Robots/protectron-police.rsi
    layers:
    - state: icon
      map: ["enum.DamageStateVisualLayers.Base", "movement"]
    - state: on # #Misfits Fix: lit indicator; BorgSystem overrides at runtime
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: on # #Misfits Fix: 'on' RSI state is the lit variant used as the flashlight glow overlay
      shader: unshaded
      map: ["light"]
      visible: false
  # #Misfits Removed - Police Protectrons are melee-only per Fallout lore; no ranged weapons
  # - type: Gun
  #   minAngle: 9
  #   maxAngle: 18
  #   angleIncrease: 3
  #   angleDecay: 4
  #   fireRate: 1
  #   soundGunshot:
  #     collection: N14RechargerRifleGunshot
  #   useKey: false
  #   selectedMode: SemiAuto
  #   availableModes:
  #     - SemiAuto
  # - type: BasicEntityAmmoProvider
  #   proto: BulletLaser
  #   capacity: 9
  #   count: 9
  # - type: RechargeBasicEntityAmmo
  #   rechargeCooldown: 2
  #   rechargeSound:
  #     path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: MeleeWeapon # #Misfits Add: electro-shock close combat — Fallout Police Protectron uses powerful melee strikes and painful electric shock
    hidden: true
    soundHit:
      path: /Audio/Effects/sparks4.ogg
    angle: 0
    animation: WeaponArcPunch
    range: 1.5
    damage:
      types:
        Blunt: 10  # moderate impact force
        Shock: 12  # painful electric discharge — the signature Police Protectron incapacitation tool
  - type: ContainerFill # #Misfits Change: security module provides stun baton, cuffs, and flashlight for patrol and detainment
    containers:
      borg_brain:
        - PositronicBrain
      borg_module:
        - MisfitsBorgModuleSecurity # stun baton, handcuffs, flashlight - lore-accurate detainment kit
      key_slots:
        - MisfitsEncryptionKeyWastelandGlobal
        - N14EncryptionKeyVault

