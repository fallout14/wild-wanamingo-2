- type: entity
  parent: F14PlayerSyntheticProtectron
  id: F14PlayerSyntheticProtectronPolice
  name: protectron police
  suffix: player, synthetic, police
  description: A RobCo Industries Protectron police model specialising in close-quarters detainment. Equipped with a heavy electro-shock melee strike, a stun baton, restraint tools and an integrated magneto-laser.
  components:
  - type: VisualBody
  - type: HumanoidProfile
    species: F14RobotProtectronPolice
  - type: Sprite
    sprite: Nuclear14/Mobs/Robots/protectron-police.rsi
    layers:
    - state: icon
      map: ["enum.DamageStateVisualLayers.Base", "movement"]
    - state: on # #Misfits Fix: lit indicator; BorgSystem overrides at runtime
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: on # #Misfits Fix: 'on' RSI state is the lit variant used as the flashlight glow overlay
