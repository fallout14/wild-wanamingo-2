# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Mobs/Player/robobrain_player.yml

- type: entity
  parent: F14BaseRobotChassis
  id: F14MobPlayerRobobrain
  name: Robobrain
  description: >
    A hollowed Pre-War military Robobrain chassis. The cranial cavity is vacant,
    waiting for a living brain to give it purpose.
  suffix: Player, Empty
  components:
  - type: BatteryAmmoProvider
    proto: F14MFLaserRed
    fireCost: 50

  # Slower than standard robots — the Robobrain trades speed for firepower
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 3

  - type: Sprite
    sprite: Nuclear14/Mobs/Robots/robobrain.rsi
    layers:
    - state: icon
      map: ["movement"]
    - state: on
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: on
      shader: unshaded
      map: ["light"]
      visible: false
  - type: SpriteMovement
    movementLayers:
      movement:
        state: walking
    noMovementLayers:
      movement:
        state: icon

  # Built-in laser weapon — hardwired into the chassis, not a swappable module
  - type: Gun
    minAngle: 6
    maxAngle: 12
    angleIncrease: 2
    angleDecay: 4
    fireRate: 1

  - type: BasicEntityAmmoProvider
    proto: BulletLaser
    capacity: 9
    count: 9

  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 2

  # Slightly higher draw rate than standard borg to account for laser recharge
  - type: PowerCellDraw
    drawRate: 1.0

  # Restricted module list — Robobrain focuses on combat, utility, and field medicine
  - type: BorgChassis
    brainWhitelist:
      components:
      - MMI
    maxModules: 4
    moduleWhitelist:
      tags:
      - BorgModuleGeneric     # GPS, Radiation Detection, Tool, Fire Extinguisher
      - BorgModuleEngineering # Advanced Tool, Construction, RCD
      - BorgModuleMedical     # Treatment, Defibrillator, Diagnosis
    hasMindState: on
    noMindState: off

  # English only — no robotic accent, no binary chatter
  # The Robobrain was designed to interact fluently with humans
  # #Misfits Fix: 'Spanish' is not a valid LanguagePrototype id; N14 uses 'Chinese' as the legacy id for Spanish.
  - type: ContainerFill
    containers:
      borg_brain: []
      borg_module: []

  # #Misfits Fix: The Machine construction graph requires the final entity to have
  # Construction (graph: Machine, node: machine) and explicit container declarations
  # for machine_board and machine_parts. Without these the BoardNodeEntity transition
  # silently deletes the MachineFrame without spawning the chassis.
  # We must also redeclare the parent's borg containers here because defining
  # ContainerContainer in a child fully overrides the parent's definition.
  - type: Machine
  - type: ContainerContainer
    containers:
      borg_brain: !type:ContainerSlot { }
      cell_slot: !type:ContainerSlot { }
      borg_module: !type:Container { }
      part-container: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_parts
    - machine_board

  # Marker component — RobobrainAcidifySystem subscribes to ComponentInit on this
  # and calls _actions.AddAction() to grant the Acidify Brain action at runtime.
  - type: RobobrainChassis

  # No faction — inherits Wastelander from parent but neutralised here so
  # the player's own faction relationships drive interaction
  - type: NpcFactionMember
    factions: []
