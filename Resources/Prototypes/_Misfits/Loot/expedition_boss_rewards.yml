# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/expedition_boss_rewards.yml

- type: entityTable
  id: MisfitsM14ExpeditionBossPrimaryReward
  table: !type:GroupSelector
    children:
    # Weapons remain possible, but high-end guns are a minority of final-boss drops.
    - !type:NestedSelector
      tableId: MisfitsM14WeaponLootTier3
      weight: 30
    - !type:NestedSelector
      tableId: MisfitsM14WeaponLootTier4
      weight: 10
    # Equipment outcomes are deliberately faction-neutral and portable.
    - !type:EntSelector
      id: N14ClothingOuterLeatherArmor
      weight: 18
    - !type:EntSelector
      id: N14ClothingOuterMetalArmor
      weight: 14
    - !type:EntSelector
      id: N14ClothingOuterCombatArmor
      weight: 8
    - !type:EntSelector
      id: N14ClothingOuterJacketBomber
      weight: 10
    - !type:EntSelector
      id: N14ClothingOuterPoliceVest
      weight: 10

- type: entityTable
  id: MisfitsM14ExpeditionBossRecoveryReward
  table: !type:GroupSelector
    children:
    - !type:EntSelector
      id: N14Stimpak
      weight: 35
    - !type:EntSelector
      id: N14RadAwayInhaler
      weight: 20
    - !type:EntSelector
      id: N14Hydra
      weight: 10
    - !type:EntSelector
      id: N14MedkitBruteFilled
      weight: 20
    - !type:EntSelector
      id: N14MedkitCombatFilled
      weight: 15

- type: entityTable
  id: MisfitsM14ExpeditionBossMaterialsReward
  table: !type:GroupSelector
    children:
    - !type:EntSelector
      id: MisfitsScrapElectronic10
      weight: 28
    - !type:EntSelector
      id: MisfitsScrapSteel10
      weight: 28
    - !type:EntSelector
      id: MisfitsScrapCopper10
      weight: 18
    - !type:EntSelector
      id: MisfitsScrapBrass10
      weight: 14
    - !type:EntSelector
      id: MisfitsScrapLead10
      weight: 12

- type: entityTable
  id: MisfitsM14ExpeditionBossReward
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsM14ExpeditionBossPrimaryReward
    - !type:NestedSelector
      tableId: MisfitsM14ExpeditionBossRecoveryReward
    - !type:NestedSelector
      tableId: MisfitsM14ExpeditionBossMaterialsReward

# Optional deep guardians pay a meaningful but deliberately smaller reward.
# The table favors recovery, materials, and Tier 2 over another high-end gun.

- type: entityTable
  id: MisfitsM14ExpeditionGuardianReward
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsM14WeaponLootTier2
      weight: 45
    - !type:NestedSelector
      tableId: MisfitsM14WeaponLootTier3
      weight: 12
    - !type:EntSelector
      id: N14ClothingOuterLeatherArmor
      weight: 14
    - !type:EntSelector
      id: N14Stimpak
      weight: 14
    - !type:EntSelector
      id: MisfitsScrapElectronic10
      weight: 15

# Retains the previous two guaranteed Tier 3 caches for dangerous focused
# Deathclaw and Super Mutant expeditions, but releases them only from the
# final guardian's corpse rather than placing loot before the fight.

- type: entityTable
  id: MisfitsM14ExpeditionHighRiskBossReward
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsM14ExpeditionBossReward
    - !type:NestedSelector
      tableId: MisfitsM14WeaponLootTier3
    - !type:NestedSelector
      tableId: MisfitsM14WeaponLootTier3
