# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/expedition_boss_rewards.yml

- type: entityTable
  id: F14ExpeditionBossPrimaryReward
  table: !type:GroupSelector
    children:
    # Weapons remain possible, but high-end guns are a minority of final-boss drops.
    - !type:NestedSelector
      tableId: F14WeaponLootTier3
      weight: 30
    - !type:NestedSelector
      tableId: F14WeaponLootTier4
      weight: 10
    # Equipment outcomes are deliberately faction-neutral and portable.
    - !type:EntSelector
      id: F14ClothingOuterLeatherArmor
      weight: 18
    - !type:EntSelector
      id: F14ClothingOuterMetalArmor
      weight: 14
    - !type:EntSelector
      id: F14ClothingOuterCombatArmor
      weight: 8
    - !type:EntSelector
      id: F14ClothingOuterJacketBomber
      weight: 10
    - !type:EntSelector
      id: F14ClothingOuterPoliceVest
      weight: 10

- type: entityTable
  id: F14ExpeditionBossRecoveryReward
  table: !type:GroupSelector
    children:
    - !type:EntSelector
      id: F14Stimpak
      weight: 35
    - !type:EntSelector
      id: F14RadAwayInhaler
      weight: 20
    - !type:EntSelector
      id: F14Hydra
      weight: 10
    - !type:EntSelector
      id: F14MedkitBruteFilled
      weight: 20
    - !type:EntSelector
      id: F14MedkitCombatFilled
      weight: 15

- type: entityTable
  id: F14ExpeditionBossMaterialsReward
  table: !type:GroupSelector
    children:
    - !type:EntSelector
      id: F14ScrapElectronic10
      weight: 28
    - !type:EntSelector
      id: F14ScrapSteel10
      weight: 28
    - !type:EntSelector
      id: F14ScrapCopper10
      weight: 18
    - !type:EntSelector
      id: F14ScrapBrass10
      weight: 14
    - !type:EntSelector
      id: F14ScrapLead10
      weight: 12

- type: entityTable
  id: F14ExpeditionBossReward
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: F14ExpeditionBossPrimaryReward
    - !type:NestedSelector
      tableId: F14ExpeditionBossRecoveryReward
    - !type:NestedSelector
      tableId: F14ExpeditionBossMaterialsReward

# Optional deep guardians pay a meaningful but deliberately smaller reward.
# The table favors recovery, materials, and Tier 2 over another high-end gun.

- type: entityTable
  id: F14ExpeditionGuardianReward
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: F14WeaponLootTier2
      weight: 45
    - !type:NestedSelector
      tableId: F14WeaponLootTier3
      weight: 12
    - !type:EntSelector
      id: F14ClothingOuterLeatherArmor
      weight: 14
    - !type:EntSelector
      id: F14Stimpak
      weight: 14
    - !type:EntSelector
      id: F14ScrapElectronic10
      weight: 15

# Retains the previous two guaranteed Tier 3 caches for dangerous focused
# Deathclaw and Super Mutant expeditions, but releases them only from the
# final guardian's corpse rather than placing loot before the fight.

- type: entityTable
  id: F14ExpeditionHighRiskBossReward
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: F14ExpeditionBossReward
    - !type:NestedSelector
      tableId: F14WeaponLootTier3
    - !type:NestedSelector
      tableId: F14WeaponLootTier3
