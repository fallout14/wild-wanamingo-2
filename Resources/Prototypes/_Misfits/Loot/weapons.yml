# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/weapons.yml

- type: entity
  name: Weapon Loot Spawner
  suffix: Tiered
  id: F14WeaponLootSpawner
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Nuclear14/Objects/Weapons/Guns/Pistols/9mm.rsi
      state: icon
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: F14WeaponLootAllTiers
      prob: 0.75
    # Keep the MarkerBase after its one map-init roll so mappers can reveal and
    # delete it with Show Spawns, like the existing N14 map spawners.
    deleteSpawnerAfterSpawn: false

# The broad world distribution deliberately falls off hard at higher tiers.
# Add map markers rather than fixed guns to keep a location's exact loot unknown.
# Every concrete N14 and Misfits weapon is represented in a tier. Only abstract base
# prototypes and stock SS14 weapons are excluded from these world-loot tables.

- type: entityTable
  id: F14WeaponLootAllTiers
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: F14WeaponLootTier1
      weight: 60
    - !type:NestedSelector
      tableId: F14WeaponLootTier2
      weight: 25
    - !type:NestedSelector
      tableId: F14WeaponLootTier3
      weight: 10
    - !type:NestedSelector
      tableId: F14WeaponLootTier4
      weight: 4
    - !type:NestedSelector
      tableId: F14WeaponLootTier5
      weight: 1
