# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier4Weapon/Tier4WeaponSpawns/Tier4WeaponSpawns_smallBullet.yml

- type: entity
  name: Tier4 Weapon Spawner
  abstract: true
  suffix: Tier4
  id: MisfitsM14Tier4Spawner_RefPistol
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#ff7b00'
    - sprite: Nuclear14/Objects/Weapons/Guns/Pistols/9mm.rsi
      state: icon

# PISTOL BALLISTICS!!!!!!!!

- type: entity
  name: Tier4 Pistol Spawner
  suffix: Tier4
  id: MisfitsM14Tier4WeaponSpawner_Single_GunsBulletPistol
  parent: MisfitsM14Tier4Spawner_RefPistol
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: MisfitsM14WeaponLootTier4_GunsBulletPistol

- type: entity
  name: Tier4 Pistol Spawner 0-3
  suffix: Tier4
  id: MisfitsM14Tier4WeaponSpawner_Mult0_3_GunsBulletPistol
  parent: MisfitsM14Tier4Spawner_RefPistol
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 0, 2
        tableId: MisfitsM14WeaponLootTier4_GunsBulletPistol

- type: entity
  name: Tier4 Pistol Spawner 1-2
  suffix: Tier4
  id: MisfitsM14Tier4WeaponSpawner_Mult1_2_GunsBulletPistol
  parent: MisfitsM14Tier4Spawner_RefPistol
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 1, 1
        tableId: MisfitsM14WeaponLootTier4_GunsBulletPistol

