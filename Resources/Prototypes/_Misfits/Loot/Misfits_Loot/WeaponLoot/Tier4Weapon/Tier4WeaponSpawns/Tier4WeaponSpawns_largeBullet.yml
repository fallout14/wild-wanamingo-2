# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier4Weapon/Tier4WeaponSpawns/Tier4WeaponSpawns_largeBullet.yml

- type: entity
  name: Tier4 Weapon Spawner
  abstract: true
  suffix: Tier4
  id: F14Tier4SpawnerRefShotgun
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#ff7b00'
    - sprite: Nuclear14/Objects/Weapons/Guns/Shotguns/double_shotgun.rsi
      state: icon

# SHOTGUN BALLISTICS!!!!!

- type: entity
  name: Tier4 Shotgun Spawner
  suffix: Tier4
  id: F14Tier4WeaponSpawnerSingleGunsBulletShotgun
  parent: F14Tier4SpawnerRefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier4GunsBulletShotgun

- type: entity
  name: Tier4 Shotgun Spawner 0-3
  suffix: Tier4
  id: F14Tier4WeaponSpawnerMult03GunsBulletShotgun
  parent: F14Tier4SpawnerRefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 0, 2
        tableId: F14WeaponLootTier4GunsBulletShotgun

- type: entity
  name: Tier4 Shotgun Spawner 1-2
  suffix: Tier4
  id: F14Tier4WeaponSpawnerMult12GunsBulletShotgun
  parent: F14Tier4SpawnerRefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 1, 1
        tableId: F14WeaponLootTier4GunsBulletShotgun


