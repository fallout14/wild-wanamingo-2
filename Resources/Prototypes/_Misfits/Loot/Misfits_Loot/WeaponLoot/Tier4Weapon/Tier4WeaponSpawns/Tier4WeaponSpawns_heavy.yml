# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier4Weapon/Tier4WeaponSpawns/Tier4WeaponSpawns_heavy.yml

- type: entity
  name: Tier4 Weapon Spawner
  abstract: true
  suffix: Tier4
  id: F14Tier4SpawnerRefBulletHeavy
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#ff7b00'
    - sprite: Nuclear14/Objects/Weapons/Guns/Heavy/minigun.rsi
      state: icon

# HEAVY BALLISTIC GUNS!!!!!

- type: entity
  name: Tier4 Heavy Spawner
  suffix: Tier4
  id: F14Tier4WeaponSpawnerSingleGunsBulletHeavy
  parent: F14Tier4SpawnerRefBulletHeavy
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier4GunsBulletHeavy

- type: entity
  name: Tier4 Heavy Spawner 0-3
  suffix: Tier4
  id: F14Tier4WeaponSpawnerMult03GunsBulletHeavy
  parent: F14Tier4SpawnerRefBulletHeavy
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 0, 2
        tableId: F14WeaponLootTier4GunsBulletHeavy

