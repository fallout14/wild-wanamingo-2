- type: entity
  name: Tier4 Weapon Spawner
  abstract: true
  suffix: Tier4
  id: F14Tier4SpawnerRef
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#ff7b00'
    - sprite: Effects/crayondecals.rsi
      state: questionmark
      scale: 1.2, 1.2

# Every weapon on this tiers table(melee,guns, energy ect...)

- type: entity
  name: Tier4 Weapon Spawner
  suffix: Tier4
  id: F14Tier4WeaponSpawnerSingleAll
  parent: F14Tier4SpawnerRef
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false

      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier4

