- type: entity
  name: Tier4 Weapon Spawner
  abstract: true
  suffix: Tier4
  id: MisfitsM14Tier4Spawner_RefMeleeAll
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#ff7b00'
    - sprite: Nuclear14/Objects/Weapons/Melee/baseball_bat.rsi
      state: icon
    - sprite: Objects/Weapons/Melee/fireaxe.rsi
      state: icon

# MELEE WEAPONS!!!!!!

- type: entity
  name: Tier4 Melee All Spawner
  suffix: Tier4
  id: MisfitsM14Tier4WeaponSpawner_Single_MeleeAll
  parent: MisfitsM14Tier4Spawner_RefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: MisfitsM14WeaponLootTier4_MeleeAll

- type: entity
  name: Tier4 Melee All Spawner 0-3
  suffix: Tier4
  id: MisfitsM14Tier4WeaponSpawner_Mult0_3_MeleeAll
  parent: MisfitsM14Tier4Spawner_RefMeleeAll
  components:
