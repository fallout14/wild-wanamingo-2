# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier4Weapon/Tier4WeaponSpawns/Tier4WeaponSpawns_Melee.yml

- type: entity
  name: Tier4 Weapon Spawner
  abstract: true
  suffix: Tier4
  id: F14Tier4SpawnerRefMeleeAll
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#ff7b00'
    - sprite: Nuclear14/Objects/Weapons/Melee/baseball_bat.rsi
      state: icon
    - sprite: Objects/Weapons/Melee/fireaxe.rsi
      state: icon

# MELEE WEAPONS!!!!!!

- type: entity
  name: Tier4 Melee All Spawner
  suffix: Tier4
  id: F14Tier4WeaponSpawnerSingleMeleeAll
  parent: F14Tier4SpawnerRefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier4MeleeAll

- type: entity
  name: Tier4 Melee All Spawner 0-3
  suffix: Tier4
  id: F14Tier4WeaponSpawnerMult03MeleeAll
  parent: F14Tier4SpawnerRefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 0, 2
        tableId: F14WeaponLootTier4MeleeAll

- type: entity
  name: Tier4 Melee All Spawner 1-2
  suffix: Tier4
  id: F14Tier4WeaponSpawnerMult12MeleeAll
  parent: F14Tier4SpawnerRefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 1, 1
        tableId: F14WeaponLootTier4MeleeAll


