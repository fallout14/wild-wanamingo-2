# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier4Weapon/Tier4WeaponSpawns/Tier4WeaponSpawns_throwables.yml

- type: entity
  name: Tier4 Weapon Spawner
  abstract: true
  suffix: Tier4
  id: F14Tier4SpawnerRefThrowablesAll
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#ff7b00'
    - sprite: Nuclear14/Objects/Weapons/Grenades/Dynamite.rsi
      state: icon
    - sprite: Objects/Weapons/Melee/throwing_knife.rsi
      state: icon

# THROWABLES!!!!!!!!!!

- type: entity
  name: Tier4 Throwables All
  suffix: Tier4
  id: F14Tier4WeaponSpawnerSingleThrowablesAll
  parent: F14Tier4SpawnerRefThrowablesAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier4ThrowablesAll

- type: entity
  name: Tier4 Throwables All 0-3
  suffix: Tier4
  id: F14Tier4WeaponSpawnerMult03ThrowablesAll
