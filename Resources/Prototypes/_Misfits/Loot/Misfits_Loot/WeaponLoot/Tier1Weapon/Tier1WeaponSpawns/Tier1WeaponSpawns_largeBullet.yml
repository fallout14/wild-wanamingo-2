# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier1Weapon/Tier1WeaponSpawns/Tier1WeaponSpawns_largeBullet.yml

- type: entity
  name: Tier1 Weapon Spawner
  abstract: true
  suffix: Tier1
  id: F14Tier1SpawnerRefShotgun
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: lightGray
    - sprite: Nuclear14/Objects/Weapons/Guns/Shotguns/double_shotgun.rsi
      state: icon

# SHOTGUN BALLISTICS!!!!!

- type: entity
  name: Tier1 Shotgun Spawner
  suffix: Tier1
  id: F14Tier1WeaponSpawnerSingleGunsBulletShotgun
  parent: F14Tier1SpawnerRefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier1GunsBulletShotgun

- type: entity
  name: Tier1 Shotgun Spawner 0-3
  suffix: Tier1
  id: F14Tier1WeaponSpawnerMult03GunsBulletShotgun
  parent: F14Tier1SpawnerRefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 0, 2
        tableId: F14WeaponLootTier1GunsBulletShotgun

- type: entity
  name: Tier1 Shotgun Spawner 1-2
  suffix: Tier1
  id: F14Tier1WeaponSpawnerMult12GunsBulletShotgun
  parent: F14Tier1SpawnerRefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 1, 1
        tableId: F14WeaponLootTier1GunsBulletShotgun


