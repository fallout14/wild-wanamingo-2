# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier1Weapon/Tier1WeaponSpawns/Tier1WeaponSpawns_smallBullet.yml

- type: entity
  name: Tier1 Weapon Spawner
  abstract: true
  suffix: Tier1
  id: F14Tier1SpawnerRefPistol
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: lightGray
    - sprite: Nuclear14/Objects/Weapons/Guns/Pistols/9mm.rsi
      state: icon

# PISTOL BALLISTICS!!!!!!!!

- type: entity
  name: Tier1 Pistol Spawner
  suffix: Tier1
  id: F14Tier1WeaponSpawnerSingleGunsBulletPistol
  parent: F14Tier1SpawnerRefPistol
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier1GunsBulletPistol

- type: entity
  name: Tier1 Pistol Spawner 0-3
  suffix: Tier1
  id: F14Tier1WeaponSpawnerMult03GunsBulletPistol
  parent: F14Tier1SpawnerRefPistol
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 0, 2
        tableId: F14WeaponLootTier1GunsBulletPistol

- type: entity
  name: Tier1 Pistol Spawner 1-2
  suffix: Tier1
  id: F14Tier1WeaponSpawnerMult12GunsBulletPistol
  parent: F14Tier1SpawnerRefPistol
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 1, 1
        tableId: F14WeaponLootTier1GunsBulletPistol

