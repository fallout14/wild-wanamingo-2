- type: entity
  name: Tier1 Weapon Spawner
  abstract: true
  suffix: Tier1
  id: MisfitsM14Tier1Spawner_RefMeleeAll
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: lightGray
    - sprite: Nuclear14/Objects/Weapons/Melee/baseball_bat.rsi
      state: icon
    - sprite: Objects/Weapons/Melee/fireaxe.rsi
      state: icon

# MELEE WEAPONS!!!!!!

- type: entity
  name: Tier1 Melee All Spawner
  suffix: Tier1
  id: MisfitsM14Tier1WeaponSpawner_Single_MeleeAll
  parent: MisfitsM14Tier1Spawner_RefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: MisfitsM14WeaponLootTier1_MeleeAll

- type: entity
  name: Tier1 Melee All Spawner 0-3
  suffix: Tier1
