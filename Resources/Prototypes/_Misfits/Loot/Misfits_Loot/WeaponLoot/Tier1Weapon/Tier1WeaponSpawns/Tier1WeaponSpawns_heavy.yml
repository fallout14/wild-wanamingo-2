# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier1Weapon/Tier1WeaponSpawns/Tier1WeaponSpawns_heavy.yml

- type: entity
  name: Tier1 Weapon Spawner
  abstract: true
  suffix: Tier1
  id: F14Tier1SpawnerRefBulletHeavy
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: lightGray
    - sprite: Nuclear14/Objects/Weapons/Guns/Heavy/minigun.rsi
      state: icon

# HEAVY BALLISTIC GUNS!!!!!

- type: entity
  name: Tier1 Heavy Spawner
  suffix: Tier1
  id: F14Tier1WeaponSpawnerSingleGunsBulletHeavy
  parent: F14Tier1SpawnerRefBulletHeavy
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier1GunsBulletHeavy

- type: entity
  name: Tier1 Heavy Spawner 0-3
  suffix: Tier1
  id: F14Tier1WeaponSpawnerMult03GunsBulletHeavy
  parent: F14Tier1SpawnerRefBulletHeavy
  components:
