# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier5Weapon/Tier5WeaponSpawns/Tier5WeaponSpawns_throwables.yml

- type: entity
  name: Tier5 Weapon Spawner
  abstract: true
  suffix: Tier5
  id: MisfitsM14Tier5Spawner_RefThrowablesAll
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#fce700'
    - sprite: Nuclear14/Objects/Weapons/Grenades/Dynamite.rsi
      state: icon
    - sprite: Objects/Weapons/Melee/throwing_knife.rsi
      state: icon

# THROWABLES!!!!!!!!!!

- type: entity
  name: Tier5 Throwables All
  suffix: Tier5
  id: MisfitsM14Tier5WeaponSpawner_Single_ThrowablesAll
  parent: MisfitsM14Tier5Spawner_RefThrowablesAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: MisfitsM14WeaponLootTier5_ThrowablesAll

