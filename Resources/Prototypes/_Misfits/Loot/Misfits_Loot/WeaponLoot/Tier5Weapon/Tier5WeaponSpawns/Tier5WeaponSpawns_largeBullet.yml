# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier5Weapon/Tier5WeaponSpawns/Tier5WeaponSpawns_largeBullet.yml

- type: entity
  name: Tier5 Weapon Spawner
  abstract: true
  suffix: Tier5
  id: F14Tier5SpawnerRefShotgun
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#fce700'
    - sprite: Nuclear14/Objects/Weapons/Guns/Shotguns/double_shotgun.rsi
      state: icon

# SHOTGUN BALLISTICS!!!!!

- type: entity
  name: Tier5 Shotgun Spawner
  suffix: Tier5
  id: F14Tier5WeaponSpawnerSingleGunsBulletShotgun
  parent: F14Tier5SpawnerRefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier5GunsBulletShotgun

- type: entity
  name: Tier5 Shotgun Spawner 0-3
  suffix: Tier5
  id: F14Tier5WeaponSpawnerMult03GunsBulletShotgun
  parent: F14Tier5SpawnerRefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 0, 2
        tableId: F14WeaponLootTier5GunsBulletShotgun

- type: entity
  name: Tier5 Shotgun Spawner 1-2
  suffix: Tier5
  id: F14Tier5WeaponSpawnerMult12GunsBulletShotgun
  parent: F14Tier5SpawnerRefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 1, 1
        tableId: F14WeaponLootTier5GunsBulletShotgun


