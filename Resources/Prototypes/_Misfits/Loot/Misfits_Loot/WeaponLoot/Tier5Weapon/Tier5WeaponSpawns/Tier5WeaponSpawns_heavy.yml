# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier5Weapon/Tier5WeaponSpawns/Tier5WeaponSpawns_heavy.yml

- type: entity
  name: Tier5 Weapon Spawner
  abstract: true
  suffix: Tier5
  id: F14Tier5SpawnerRefBulletHeavy
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#fce700'
    - sprite: Nuclear14/Objects/Weapons/Guns/Heavy/minigun.rsi
      state: icon

# HEAVY BALLISTIC GUNS!!!!!

- type: entity
  name: Tier5 Heavy Spawner
  suffix: Tier5
  id: F14Tier5WeaponSpawnerSingleGunsBulletHeavy
  parent: F14Tier5SpawnerRefBulletHeavy
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier5GunsBulletHeavy

- type: entity
  name: Tier5 Heavy Spawner 0-3
  suffix: Tier5
  id: F14Tier5WeaponSpawnerMult03GunsBulletHeavy
  parent: F14Tier5SpawnerRefBulletHeavy
  components:
