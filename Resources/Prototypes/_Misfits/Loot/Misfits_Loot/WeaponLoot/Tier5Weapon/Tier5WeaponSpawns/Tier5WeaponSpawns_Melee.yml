# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier5Weapon/Tier5WeaponSpawns/Tier5WeaponSpawns_Melee.yml

- type: entity
  name: Tier5 Weapon Spawner
  abstract: true
  suffix: Tier5
  id: F14Tier5SpawnerRefMeleeAll
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#fce700'
    - sprite: Nuclear14/Objects/Weapons/Melee/baseball_bat.rsi
      state: icon
    - sprite: Objects/Weapons/Melee/fireaxe.rsi
      state: icon

# MELEE WEAPONS!!!!!!

- type: entity
  name: Tier5 Melee All Spawner
  suffix: Tier5
  id: F14Tier5WeaponSpawnerSingleMeleeAll
  parent: F14Tier5SpawnerRefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier5MeleeAll

- type: entity
  name: Tier5 Melee All Spawner 0-3
  suffix: Tier5
  id: F14Tier5WeaponSpawnerMult03MeleeAll
  parent: F14Tier5SpawnerRefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 0, 2
        tableId: F14WeaponLootTier5MeleeAll

- type: entity
