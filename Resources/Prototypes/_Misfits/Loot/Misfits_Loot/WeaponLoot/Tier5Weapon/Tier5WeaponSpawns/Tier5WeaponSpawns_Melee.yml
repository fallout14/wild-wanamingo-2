- type: entity
  name: Tier5 Weapon Spawner
  abstract: true
  suffix: Tier5
  id: MisfitsM14Tier5Spawner_RefMeleeAll
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#fce700'
    - sprite: Nuclear14/Objects/Weapons/Melee/baseball_bat.rsi
      state: icon
    - sprite: Objects/Weapons/Melee/fireaxe.rsi
      state: icon

# MELEE WEAPONS!!!!!!

- type: entity
  name: Tier5 Melee All Spawner
  suffix: Tier5
  id: MisfitsM14Tier5WeaponSpawner_Single_MeleeAll
  parent: MisfitsM14Tier5Spawner_RefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: MisfitsM14WeaponLootTier5_MeleeAll

