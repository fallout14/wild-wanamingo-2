# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier3Weapon/Tier3WeaponSpawns/Tier3WeaponSpawns_heavy.yml

- type: entity
  name: Tier3 Weapon Spawner
  abstract: true
  suffix: Tier3
  id: F14Tier3SpawnerRefBulletHeavy
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#00b3ff'
    - sprite: Nuclear14/Objects/Weapons/Guns/Heavy/minigun.rsi
      state: icon

# HEAVY BALLISTIC GUNS!!!!!

- type: entity
  name: Tier3 Heavy Spawner
  suffix: Tier3
  id: F14Tier3WeaponSpawnerSingleGunsBulletHeavy
  parent: F14Tier3SpawnerRefBulletHeavy
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier3GunsBulletHeavy

- type: entity
  name: Tier3 Heavy Spawner 0-3
  suffix: Tier3
  id: F14Tier3WeaponSpawnerMult03GunsBulletHeavy
  parent: F14Tier3SpawnerRefBulletHeavy
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 0, 2
        tableId: F14WeaponLootTier3GunsBulletHeavy

