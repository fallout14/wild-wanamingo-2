# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier3Weapon/Tier3WeaponSpawns/Tier3WeaponSpawns_largeBullet.yml

- type: entity
  name: Tier3 Weapon Spawner
  abstract: true
  suffix: Tier3
  id: F14Tier3SpawnerRefShotgun
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#00b3ff'
    - sprite: Nuclear14/Objects/Weapons/Guns/Shotguns/double_shotgun.rsi
      state: icon

# SHOTGUN BALLISTICS!!!!!

- type: entity
  name: Tier3 Shotgun Spawner
  suffix: Tier3
  id: F14Tier3WeaponSpawnerSingleGunsBulletShotgun
  parent: F14Tier3SpawnerRefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier3GunsBulletShotgun

- type: entity
  name: Tier3 Shotgun Spawner 0-3
  suffix: Tier3
  id: F14Tier3WeaponSpawnerMult03GunsBulletShotgun
  parent: F14Tier3SpawnerRefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 0, 2
        tableId: F14WeaponLootTier3GunsBulletShotgun

- type: entity
  name: Tier3 Shotgun Spawner 1-2
  suffix: Tier3
  id: F14Tier3WeaponSpawnerMult12GunsBulletShotgun
  parent: F14Tier3SpawnerRefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 1, 1
        tableId: F14WeaponLootTier3GunsBulletShotgun


