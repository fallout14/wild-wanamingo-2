- type: entity
  name: Tier3 Weapon Spawner
  abstract: true
  suffix: Tier3
  id: F14Tier3SpawnerRef
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#00b3ff'
    - sprite: Effects/crayondecals.rsi
      state: questionmark
      scale: 1.2, 1.2

# Every weapon on this tiers table(melee,guns, energy ect...)

- type: entity
  name: Tier3 Weapon Spawner
  suffix: Tier3
  id: F14Tier3WeaponSpawnerSingleAll
  parent: F14Tier3SpawnerRef
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false

      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier3

- type: entity
  name: Tier3 Weapon Spawner 0-3
  suffix: Tier3
  id: F14Tier3WeaponSpawnerMult03All
  parent: F14Tier3SpawnerRef
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 0, 2
        tableId: F14WeaponLootTier3

- type: entity
  name: Tier3 Weapon Spawner 1-2
  suffix: Tier3
  id: F14Tier3WeaponSpawnerMult12All
