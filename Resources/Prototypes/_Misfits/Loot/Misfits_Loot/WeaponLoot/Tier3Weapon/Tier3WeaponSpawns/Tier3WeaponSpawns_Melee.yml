- type: entity
  name: Tier3 Weapon Spawner
  abstract: true
  suffix: Tier3
  id: MisfitsM14Tier3Spawner_RefMeleeAll
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#00b3ff'
    - sprite: Nuclear14/Objects/Weapons/Melee/baseball_bat.rsi
      state: icon
    - sprite: Objects/Weapons/Melee/fireaxe.rsi
      state: icon

# MELEE WEAPONS!!!!!!

- type: entity
  name: Tier3 Melee All Spawner
  suffix: Tier3
  id: MisfitsM14Tier3WeaponSpawner_Single_MeleeAll
  parent: MisfitsM14Tier3Spawner_RefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: MisfitsM14WeaponLootTier3_MeleeAll

- type: entity
  name: Tier3 Melee All Spawner 0-3
  suffix: Tier3
  id: MisfitsM14Tier3WeaponSpawner_Mult0_3_MeleeAll
  parent: MisfitsM14Tier3Spawner_RefMeleeAll
  components:
