# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier3Weapon/Tier3WeaponSpawns/Tier3WeaponSpawns_Melee.yml

- type: entity
  name: Tier3 Weapon Spawner
  abstract: true
  suffix: Tier3
  id: F14Tier3SpawnerRefMeleeAll
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#00b3ff'
    - sprite: Nuclear14/Objects/Weapons/Melee/baseball_bat.rsi
      state: icon
    - sprite: Objects/Weapons/Melee/fireaxe.rsi
      state: icon

# MELEE WEAPONS!!!!!!

- type: entity
  name: Tier3 Melee All Spawner
  suffix: Tier3
  id: F14Tier3WeaponSpawnerSingleMeleeAll
  parent: F14Tier3SpawnerRefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier3MeleeAll

- type: entity
  name: Tier3 Melee All Spawner 0-3
  suffix: Tier3
  id: F14Tier3WeaponSpawnerMult03MeleeAll
  parent: F14Tier3SpawnerRefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 0, 2
        tableId: F14WeaponLootTier3MeleeAll

- type: entity
  name: Tier3 Melee All Spawner 1-2
  suffix: Tier3
  id: F14Tier3WeaponSpawnerMult12MeleeAll
  parent: F14Tier3SpawnerRefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 1, 1
        tableId: F14WeaponLootTier3MeleeAll


