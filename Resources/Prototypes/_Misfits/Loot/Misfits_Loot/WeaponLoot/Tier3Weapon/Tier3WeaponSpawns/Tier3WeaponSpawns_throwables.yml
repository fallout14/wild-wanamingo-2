# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier3Weapon/Tier3WeaponSpawns/Tier3WeaponSpawns_throwables.yml

- type: entity
  name: Tier3 Weapon Spawner
  abstract: true
  suffix: Tier3
  id: F14Tier3SpawnerRefThrowablesAll
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#00b3ff'
    - sprite: Nuclear14/Objects/Weapons/Grenades/Dynamite.rsi
      state: icon
    - sprite: Objects/Weapons/Melee/throwing_knife.rsi
      state: icon

# THROWABLES!!!!!!!!!!

- type: entity
  name: Tier3 Throwables All
  suffix: Tier3
  id: F14Tier3WeaponSpawnerSingleThrowablesAll
  parent: F14Tier3SpawnerRefThrowablesAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier3ThrowablesAll

- type: entity
  name: Tier3 Throwables All 0-3
  suffix: Tier3
  id: F14Tier3WeaponSpawnerMult03ThrowablesAll
  parent: F14Tier3SpawnerRefThrowablesAll
  components:
