# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier3Weapon/Tier3WeaponSpawns/Tier3WeaponSpawns_energy.yml

- type: entity
  name: Tier3 Weapon Spawner
  abstract: true
  suffix: Tier3
  id: F14Tier3SpawnerRefGunsEnergyAll
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#00b3ff'
    - sprite: Nuclear14/Objects/Weapons/Guns/Battery/recharger_pistol.rsi
      state: icon
      scale: .8, .8
      offset: 0, 0.1
    - sprite: Nuclear14/Objects/Weapons/Guns/Heavy/gatlinglaser.rsi
      scale: .7, .7
      state: icon
      offset: 0, 0
    - sprite: Nuclear14/Objects/Weapons/Guns/Battery/plasma_autorifle_icon.rsi
      scale: .7, .7
      state: icon
      offset: 0, -0.2

# ENERGY WEAPONS!!!!!!

- type: entity
  name: Tier3 Gun Energy Spawner
  suffix: Tier3
  id: F14Tier3WeaponSpawnerSingleGunsEnergyAll
  parent: F14Tier3SpawnerRefGunsEnergyAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
