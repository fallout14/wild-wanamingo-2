# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier3Weapon/Tier3WeaponSpawns/Tier3WeaponSpawns_smallBullet.yml

- type: entity
  name: Tier3 Weapon Spawner
  abstract: true
  suffix: Tier3
  id: MisfitsM14Tier3Spawner_RefPistol
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: '#00b3ff'
    - sprite: Nuclear14/Objects/Weapons/Guns/Pistols/9mm.rsi
      state: icon

# PISTOL BALLISTICS!!!!!!!!

- type: entity
  name: Tier3 Pistol Spawner
  suffix: Tier3
  id: MisfitsM14Tier3WeaponSpawner_Single_GunsBulletPistol
  parent: MisfitsM14Tier3Spawner_RefPistol
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: MisfitsM14WeaponLootTier3_GunsBulletPistol

- type: entity
  name: Tier3 Pistol Spawner 0-3
  suffix: Tier3
  id: MisfitsM14Tier3WeaponSpawner_Mult0_3_GunsBulletPistol
  parent: MisfitsM14Tier3Spawner_RefPistol
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 0, 2
        tableId: MisfitsM14WeaponLootTier3_GunsBulletPistol

- type: entity
  name: Tier3 Pistol Spawner 1-2
  suffix: Tier3
  id: MisfitsM14Tier3WeaponSpawner_Mult1_2_GunsBulletPistol
  parent: MisfitsM14Tier3Spawner_RefPistol
