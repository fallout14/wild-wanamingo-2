- type: entity
  name: Tier2 Weapon Spawner
  abstract: true
  suffix: Tier2
  id: F14Tier2SpawnerRef
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: limeGreen
    - sprite: Effects/crayondecals.rsi
      state: questionmark
      scale: 1.2, 1.2

# Every weapon on this tiers table(melee,guns, energy ect...)

- type: entity
  name: Tier2 Weapon Spawner
  suffix: Tier2
  id: F14Tier2WeaponSpawnerSingleAll
  parent: F14Tier2SpawnerRef
  components:
