# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier2Weapon/Tier2WeaponSpawns/Tier2WeaponSpawns_largeBullet.yml

- type: entity
  name: Tier2 Weapon Spawner
  abstract: true
  suffix: Tier2
  id: MisfitsM14Tier2Spawner_RefShotgun
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: limeGreen
    - sprite: Nuclear14/Objects/Weapons/Guns/Shotguns/double_shotgun.rsi
      state: icon

# SHOTGUN BALLISTICS!!!!!

- type: entity
  name: Tier2 Shotgun Spawner
  suffix: Tier2
  id: MisfitsM14Tier2WeaponSpawner_Single_GunsBulletShotgun
  parent: MisfitsM14Tier2Spawner_RefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: MisfitsM14WeaponLootTier2_GunsBulletShotgun

- type: entity
  name: Tier2 Shotgun Spawner 0-3
  suffix: Tier2
  id: MisfitsM14Tier2WeaponSpawner_Mult0_3_GunsBulletShotgun
  parent: MisfitsM14Tier2Spawner_RefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 0, 2
        tableId: MisfitsM14WeaponLootTier2_GunsBulletShotgun

- type: entity
  name: Tier2 Shotgun Spawner 1-2
  suffix: Tier2
  id: MisfitsM14Tier2WeaponSpawner_Mult1_2_GunsBulletShotgun
  parent: MisfitsM14Tier2Spawner_RefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 1, 1
        tableId: MisfitsM14WeaponLootTier2_GunsBulletShotgun


