# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier2Weapon/Tier2WeaponSpawns/Tier2WeaponSpawns_Melee.yml

- type: entity
  name: Tier2 Weapon Spawner
  abstract: true
  suffix: Tier2
  id: F14Tier2SpawnerRefMeleeAll
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: limeGreen
    - sprite: Nuclear14/Objects/Weapons/Melee/baseball_bat.rsi
      state: icon
    - sprite: Objects/Weapons/Melee/fireaxe.rsi
      state: icon
# MELEE WEAPONS!!!!!!

- type: entity
  name: Tier2 Melee All Spawner
  suffix: Tier2
  id: F14Tier2WeaponSpawnerSingleMeleeAll
  parent: F14Tier2SpawnerRefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier2MeleeAll

- type: entity
  name: Tier2 Melee All Spawner 0-3
  suffix: Tier2
  id: F14Tier2WeaponSpawnerMult03MeleeAll
  parent: F14Tier2SpawnerRefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 0, 2
        tableId: F14WeaponLootTier2MeleeAll

- type: entity
  name: Tier2 Melee All Spawner 1-2
  suffix: Tier2
  id: F14Tier2WeaponSpawnerMult12MeleeAll
  parent: F14Tier2SpawnerRefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 1, 1
        tableId: F14WeaponLootTier2MeleeAll


