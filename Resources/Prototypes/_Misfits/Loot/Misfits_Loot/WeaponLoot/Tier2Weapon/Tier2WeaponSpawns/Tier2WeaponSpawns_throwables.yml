# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier2Weapon/Tier2WeaponSpawns/Tier2WeaponSpawns_throwables.yml

- type: entity
  name: Tier2 Weapon Spawner
  abstract: true
  suffix: Tier2
  id: F14Tier2SpawnerRefThrowablesAll
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: limeGreen
    - sprite: Nuclear14/Objects/Weapons/Grenades/Dynamite.rsi
      state: icon
    - sprite: Objects/Weapons/Melee/throwing_knife.rsi
      state: icon

# THROWABLES!!!!!!!!!!

- type: entity
  name: Tier2 Throwables All Spawner
  suffix: Tier2
  id: F14Tier2WeaponSpawnerSingleThrowablesAll
  parent: F14Tier2SpawnerRefThrowablesAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier2ThrowablesAll

- type: entity
  name: Tier2 Throwables All Spawner 0-3
  suffix: Tier2
  id: F14Tier2WeaponSpawnerMult03ThrowablesAll
  parent: F14Tier2SpawnerRefThrowablesAll
  components:
