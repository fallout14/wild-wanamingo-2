# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier2Weapon/Tier2WeaponSpawns/Tier2WeaponSpawns_heavy.yml

- type: entity
  name: Tier2 Weapon Spawner
  abstract: true
  suffix: Tier2
  id: MisfitsM14Tier2Spawner_RefBulletHeavy
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: limeGreen
    - sprite: Nuclear14/Objects/Weapons/Guns/Heavy/minigun.rsi
      state: icon

# HEAVY BALLISTIC GUNS!!!!!

- type: entity
  name: Tier2 Heavy Spawner
  suffix: Tier2
  id: MisfitsM14Tier2WeaponSpawner_Single_GunsBulletHeavy
  parent: MisfitsM14Tier2Spawner_RefBulletHeavy
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: MisfitsM14WeaponLootTier2_GunsBulletHeavy

