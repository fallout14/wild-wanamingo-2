# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier2Weapon/Tier2WeaponSpawns/Tier2WeaponSpawns_smallBullet.yml

- type: entity
  name: Tier2 Weapon Spawner
  abstract: true
  suffix: Tier2
  id: MisfitsM14Tier2Spawner_RefPistol
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: limeGreen
    - sprite: Nuclear14/Objects/Weapons/Guns/Pistols/9mm.rsi
      state: icon

# PISTOL BALLISTICS!!!!!!!!

- type: entity
  name: Tier2 Pistol Spawner
  suffix: Tier2
  id: MisfitsM14Tier2WeaponSpawner_Single_GunsBulletPistol
  parent: MisfitsM14Tier2Spawner_RefPistol
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: MisfitsM14WeaponLootTier2_GunsBulletPistol

- type: entity
  name: Tier2 Pistol Spawner 0-3
  suffix: Tier2
  id: MisfitsM14Tier2WeaponSpawner_Mult0_3_GunsBulletPistol
  parent: MisfitsM14Tier2Spawner_RefPistol
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 0, 2
        tableId: MisfitsM14WeaponLootTier2_GunsBulletPistol

- type: entity
  name: Tier2 Pistol Spawner 1-2
  suffix: Tier2
  id: MisfitsM14Tier2WeaponSpawner_Mult1_2_GunsBulletPistol
  parent: MisfitsM14Tier2Spawner_RefPistol
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 1, 1
        tableId: MisfitsM14WeaponLootTier2_GunsBulletPistol

