# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier2Weapon/Tier2WeaponSpawns/Tier2WeaponSpawns_smallBullet.yml

- type: entity
  name: Tier2 Weapon Spawner
  abstract: true
  suffix: Tier2
  id: F14Tier2SpawnerRefPistol
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: limeGreen
    - sprite: Nuclear14/Objects/Weapons/Guns/Pistols/9mm.rsi
      state: icon

# PISTOL BALLISTICS!!!!!!!!

- type: entity
  name: Tier2 Pistol Spawner
  suffix: Tier2
  id: F14Tier2WeaponSpawnerSingleGunsBulletPistol
  parent: F14Tier2SpawnerRefPistol
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: F14WeaponLootTier2GunsBulletPistol

- type: entity
  name: Tier2 Pistol Spawner 0-3
  suffix: Tier2
  id: F14Tier2WeaponSpawnerMult03GunsBulletPistol
  parent: F14Tier2SpawnerRefPistol
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 0, 2
        tableId: F14WeaponLootTier2GunsBulletPistol

- type: entity
  name: Tier2 Pistol Spawner 1-2
  suffix: Tier2
  id: F14Tier2WeaponSpawnerMult12GunsBulletPistol
  parent: F14Tier2SpawnerRefPistol
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 1, 1
        tableId: F14WeaponLootTier2GunsBulletPistol

