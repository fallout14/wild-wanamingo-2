# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Loot/Misfits_Loot/WeaponLoot/Tier2Weapon/Tier2WeaponSpawns/Tier2WeaponSpawns_energy.yml

- type: entity
  name: Tier2 Weapon Spawner
  abstract: true
  suffix: Tier2
  id: F14Tier2SpawnerRefGunsEnergyAll
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Markers/cross.rsi
    layers:
    - state: mono
      color: limeGreen
    - sprite: Nuclear14/Objects/Weapons/Guns/Battery/recharger_pistol.rsi
      state: icon
      scale: .8, .8
      offset: 0, 0.1
    - sprite: Nuclear14/Objects/Weapons/Guns/Heavy/gatlinglaser.rsi
      scale: .7, .7
      state: icon
      offset: 0, 0
    - sprite: Nuclear14/Objects/Weapons/Guns/Battery/plasma_autorifle_icon.rsi
      scale: .7, .7
      state: icon
      offset: 0, -0.2

# ENERGY WEAPONS!!!!!!

- type: entity
  name: Tier2 Gun Energy Spawner
  suffix: Tier2
  id: F14Tier2WeaponSpawnerSingleGunsEnergyAll
  parent: F14Tier2SpawnerRefGunsEnergyAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
