# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Actions/assaultron.yml
# Changed for Wild Wanamingo: icons and targeting moved to Wizden's Action, Sprite and TargetAction components.

# First use charges (the action's cooldown shows the charge), the next use fires.
- type: entity
  parent: BaseAction
  id: F14ActionAssaultronHeadLaser
  name: Charge Head Laser
  description: Charge and fire the integrated head laser.
  components:
  - type: Action
    checkCanInteract: false
    raiseOnUser: true
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Battery/recharger_rifle.rsi
    layers:
    - state: icon
  - type: TargetAction
    checkCanAccess: false
    repeat: true
    range: 20
  - type: WorldTargetAction
    event: !type:ActionGunShootEvent

- type: entity
  parent: F14ActionAssaultronHeadLaser
  id: F14ActionAssaultronTesla
  name: Charge Tesla Emitter
  description: Charge and fire the integrated Tesla emitter.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/tesla_gun.rsi
    layers:
    - state: base
