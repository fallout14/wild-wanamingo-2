# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Actions/sentrybot.yml
# Changed for Wild Wanamingo: icon and targeting moved to Wizden's Action, Sprite and TargetAction components.

# Marks a spot; everyone near it is warned, and the missile flies a few seconds later.
- type: entity
  parent: BaseAction
  id: F14ActionSentryBotMissileLaunch
  name: Launch Missile
  description: Launch a missile at the targeted location. Nearby entities receive a warning.
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    raiseOnUser: true
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Heavy/missilelauncher.rsi
    layers:
    - state: base
  - type: TargetAction
    checkCanAccess: false
    range: 20
  - type: WorldTargetAction
    event: !type:SentryBotMissileLaunchEvent
