# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/Actions/types.yml
# (Misfits' copy of a Space Station 14 or other-fork file.)

- type: entity
  id: ToggleThermalVision
  parent: BaseAction
  name: Switch Thermal vision
  description: Switches Thermal vision.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
  - type: Sprite
    layers:
    - sprite: Clothing/Eyes/Glasses/thermal.rsi
      state: icon
      map: [ "enum.ActionVisuals.Icon" ]
  - type: InstantAction
    event: !type:ToggleThermalVisionEvent

- type: entity
  id: PulseThermalVision
  parent: ToggleThermalVision
  name: Pulse Thermal Vision
  description: Activate thermal vision temporarily.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 4
  - type: InstantAction
