# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Catalog/Fills/Factions/idcards.yml

- type: entity
  name: ID card box
  parent: BoxCardboard
  id: MisfitsBoxIDVault
  description: A box of spare ID cards.
  components:
  - type: StorageFill
    contents:
    - id: N14IDCardVault
      amount: 2
    - id: N14IDCardVaultDoctor
      amount: 2
    - id: N14IDCardVaultEngineer
      amount: 2
    - id: N14IDCardVaultSecurity
      amount: 2
  - type: Sprite
    layers:
    - state: box
    - state: pda
  - type: Storage
    grid:
    - 0,0,3,3

