# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Catalog/Fills/Factions/headsets.yml

- type: entity
  name: legion headset box
  parent: BoxCardboard
  id: MisfitsBoxHeadsetLegion
  description: A box of spare headsets.
  components:
  - type: StorageFill
    contents:
    - id: MisfitsClothingHeadsetLegion
      amount: 6
  - type: Sprite
    layers:
    - state: box
    - state: headset
  - type: Storage
    grid:
    - 0,0,2,3

