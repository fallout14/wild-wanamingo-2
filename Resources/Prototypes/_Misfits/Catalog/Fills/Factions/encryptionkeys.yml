# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Catalog/Fills/Factions/encryptionkeys.yml

- type: entity
  name: legion encryption key box
  parent: BoxCardboard
  id: MisfitsBoxEncryptionKeyLegion
  description: A box of spare encryption keys.
  components:
  - type: StorageFill
    contents:
    - id: MisfitsEncryptionKeyLegion
      amount: 6
  - type: Sprite
    layers:
    - state: box
    - state: encryptokey
  - type: Storage
    whitelist:
      components:
      - EncryptionKey
    grid:
    - 0,0,2,3

