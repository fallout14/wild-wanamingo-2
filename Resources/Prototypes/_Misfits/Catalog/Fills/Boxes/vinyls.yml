# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Catalog/Fills/Boxes/vinyls.yml

- type: entity
  id: MisfitsCrateRadioStationVinyls
  parent: CrateGenericSteel
  name: vinyls crate
  description: A crate with 20 vinyls so you'll NEVER play the same song twice, they come in sleeves!
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: MisfitsRandomVinylSleeve
        rolls: !type:ConstantNumberSelector
          value: 20

- type: entityTable
  id: MisfitsRandomVinylDisk
  table: !type:GroupSelector
    children: []

- type: entityTable
  id: MisfitsRandomVinylSleeve
  table: !type:GroupSelector
    children: []
