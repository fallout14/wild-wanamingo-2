    drawdepth: Mobs
    sprite: Nuclear14/Mobs/Robots/mrhandyclaw.rsi
    state: icon
  - type: VisualBody
  - type: SkinTintedSprite # WW Add: preview shows the skin colour
  - type: HumanoidProfile
